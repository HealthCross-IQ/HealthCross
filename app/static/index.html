<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HealthCross Underwriting Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    /* ---- HealthCross design system -------------------------------
       Brand: Light Blue #5CD9FF (accent) and Dark Blue #1C2A48
       (authority). Every neutral below is tinted toward that navy, so
       the shell, the nav rail and every scoped screen share one ground
       rather than the three different temperatures they used to carry.
       Scoped systems (.hc-rail / .rb-scope / .lr-scope) alias these
       tokens - they must not redefine raw hex of their own. -------- */
    --bg: #f4f7fa;
    --surface: #ffffff;
    --surface-2: #eaf0f6;
    --surface-3: #dde6ef;
    --border: rgba(15,28,46,0.11);
    --border-strong: rgba(15,28,46,0.22);
    --ink: #0f1c2e;
    --ink-2: #46586e;
    --ink-muted: #8496a8;
    --grid: #dde6ef;
    --accent: #5cd9ff;
    --accent-ink: #06121c;
    --deep: #1c2a48;
    --deep-ink: #eaf6ff;
    --good: #16855c;
    --good-bg: rgba(22,133,92,0.12);
    --warning: #b07d12;
    --warning-bg: rgba(176,125,18,0.14);
    --serious: #d4783f;
    --serious-bg: rgba(212,120,63,0.14);
    --critical: #c0392b;
    --critical-bg: rgba(192,57,43,0.12);
    --series-1: #5cd9ff;
    --series-2: #eb6834;
    --series-3: #16855c;
    --series-4: #eda100;
    --series-1-wash: rgba(92,217,255,0.20);
    --shadow: 0 1px 2px rgba(15,28,46,0.05), 0 10px 30px -18px rgba(15,28,46,0.30);
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: 'Fraunces', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --surface: #121c2c;
      --surface-2: #1a2537;
      --surface-3: #223044;
      --border: rgba(234,241,248,0.11);
      --border-strong: rgba(234,241,248,0.22);
      --ink: #eaf1f8;
      --ink-2: #b3c2d3;
      --ink-muted: #7b8ca0;
      --grid: #223044;
      --accent: #5cd9ff;
      --accent-ink: #06121c;
      --deep: #5cd9ff;
      --deep-ink: #06121c;
      --good: #3fcf94;
      --good-bg: rgba(63,207,148,0.14);
      --warning: #e0b24f;
      --warning-bg: rgba(224,178,79,0.16);
      --serious: #e59a6a;
      --serious-bg: rgba(229,154,106,0.16);
      --critical: #ef6f60;
      --critical-bg: rgba(239,111,96,0.16);
      --series-1: #5cd9ff;
      --series-2: #e07a4a;
      --series-3: #3fcf94;
      --series-4: #e0b24f;
      --series-1-wash: rgba(92,217,255,0.22);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 30px -18px rgba(0,0,0,0.60);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 0 22px;
    height: 54px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 11px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 5;
  }
  header::before {
    content: "";
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--deep)));
  }
  header h1 { font-family: var(--font-display); font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.015em; }
  header span { color: var(--ink-muted); font-size: 12px; letter-spacing: 0.01em; }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: calc(100vh - 50px);
  }
  @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }

  aside {
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  /* ---------- Portal rail nav (3 pillars: New Business / Renewal /
     Claims Analysis) - its own scoped palette/type, matching the
     approved Renewal Bench mockup, layered above the existing case
     list/filters rather than replacing them. ---------- */
  .hc-rail {
    /* Aliases the root design tokens - no palette of its own, so the rail
       can never drift away from the shell it sits in (it used to carry
       green-tinted neutrals left over from an earlier theme). */
    --hcr-ink: var(--ink); --hcr-ink-2: var(--ink-2); --hcr-muted: var(--ink-muted);
    --hcr-border: var(--border);
    --hcr-accent: var(--accent); --hcr-accent-soft: var(--series-1-wash);
    --hcr-secondary: var(--serious); --hcr-secondary-soft: var(--serious-bg);
    --hcr-surface-3: var(--surface-2);
    font-family: var(--font-body);
  }
  .hc-rail-brand { display: flex; align-items: center; gap: 9px; padding-bottom: 12px; border-bottom: 1px solid var(--hcr-border); margin-bottom: 4px; }
  .hc-rail-brand .mark {
    width: 27px; height: 27px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(160deg, var(--hcr-accent), color-mix(in srgb, var(--hcr-accent) 60%, black));
    display: flex; align-items: center; justify-content: center;
    color: #f5faf8; font-family: 'Fraunces', serif; font-weight: 700; font-size: 13px;
  }
  .hc-rail-brand .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; color: var(--hcr-ink); line-height: 1.2; }
  .hc-rail-brand .sub { font-size: 10px; color: var(--hcr-muted); }
  .hc-rail-group { display: flex; flex-direction: column; gap: 1px; }
  .hc-rail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; color: var(--hcr-muted); margin: 6px 2px 3px; }
  .hc-rail-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    font-size: 12.5px; font-weight: 500; color: var(--hcr-ink-2);
    background: none; border: none; border-radius: 8px; padding: 7px 9px; cursor: pointer;
  }
  .hc-rail-item:hover { background: var(--hcr-surface-3); color: var(--hcr-ink); }
  .hc-rail-item.active { background: var(--hcr-accent-soft); color: var(--hcr-accent); font-weight: 600; }
  .hc-rail-tag {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    padding: 1px 6px; border-radius: 5px; margin-left: auto; flex-shrink: 0;
  }
  .hc-rail-tag.nb { background: var(--hcr-secondary-soft); color: var(--hcr-secondary); }
  .hc-rail-tag.rn { background: var(--hcr-accent-soft); color: var(--hcr-accent); }
  .hc-rail-tag.cl { background: var(--hcr-surface-3); color: var(--hcr-ink-2); }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin: 4px 0 0;
    font-weight: 600;
  }
  .case-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .case-group-heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    margin: 10px 0 2px;
  }
  .case-group-heading:first-child { margin-top: 2px; }
  .case-item {
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 2px;
    transition: background 0.1s ease;
  }
  .case-item:hover { background: var(--surface-2); }
  .case-item.active { background: var(--surface-2); border-color: var(--border); }
  .case-item-main {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    padding: 7px 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
  }
  .case-item-main .company { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-item-main .meta { color: var(--ink-muted); font-size: 11.5px; }
  .case-item-delete {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1;
    padding: 4px 7px;
    cursor: pointer;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .case-item:hover .case-item-delete { opacity: 1; }
  .case-item-delete:hover { color: var(--critical); background: var(--surface); }

  .case-filters { display: flex; flex-direction: column; gap: 5px; }
  .case-filters input, .case-filters select {
    font-size: 12px;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  .case-filters .case-filter-dates { display: flex; gap: 5px; }
  .case-filters .case-filter-dates input { min-width: 0; }
  .case-filters-clear {
    align-self: flex-start;
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }

  button, .btn {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    padding: 8px 14px;
    font-size: 13.5px;
    transition: background 0.1s ease, filter 0.1s ease;
  }
  button:hover { background: var(--surface-2); border-color: var(--border-strong); }
  button:focus-visible, .tab-btn:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  main { padding: 22px 26px 60px; max-width: 980px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h3 { font-family: var(--font-display); margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .card h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); font-weight: 700; }
  .card .hint { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 14px; }
  .hint-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  label { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-2); margin: 10px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  .dropzone {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px dashed var(--border);
    border-radius: 9px;
    margin-bottom: 8px;
    background: var(--surface);
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .dropzone.dragover { border-color: var(--accent); background: var(--series-1-wash); }
  .dropzone .kind-label { width: 100px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .dropzone .upload-req-pill { flex-shrink: 0; font-size: 10px !important; padding: 2px 7px !important; }
  .dropzone input[type=file] { flex: 1; font-size: 12px; min-width: 0; }
  .status-ok { color: var(--good); font-size: 12.5px; white-space: nowrap; }
  .status-err { color: var(--critical); font-size: 12.5px; white-space: nowrap; }
  .status-pending { color: var(--ink-muted); font-size: 12.5px; white-space: nowrap; }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .kpi {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .label { font-size: 11px; color: var(--ink-muted); display: block; margin-bottom: 2px; }
  .kpi .value { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .tier-pill {
    display: inline-flex;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .tier-Preferred { background: var(--good-bg); color: var(--good); }
  .tier-Standard { background: var(--surface-2); color: var(--ink-2); }
  .tier-Substandard { background: var(--serious-bg); color: var(--serious); }
  .tier-DeclineRefer { background: var(--critical-bg); color: var(--critical); }
  .dir-improved { background: var(--good-bg); color: var(--good); }
  .dir-reduced { background: var(--critical-bg); color: var(--critical); }
  .dir-same { background: var(--surface-2); color: var(--ink-2); }
  .dir-review { background: var(--warning-bg); color: var(--ink-2); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table th, table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table th { background: var(--surface-2); color: var(--ink-2); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.055em; font-variant-numeric: normal; border-bottom: 1.5px solid var(--border-strong); }
  table tbody tr:hover td { background: var(--surface-2); }
  td.cmp-cell-yes { background: rgba(46, 160, 67, 0.12); }
  td.cmp-cell-no { background: rgba(218, 54, 51, 0.10); color: var(--ink-muted); }
  td.cmp-cell-neutral { color: inherit; }

  /* Tabs */
  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; border-radius: 0;
    padding: 9px 14px; font-size: 13.5px; font-weight: 600;
    color: var(--ink-muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { background: none; color: var(--ink); }
  .tab-btn.active { color: var(--deep); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Charts */
  .chart-wrap { margin: 4px 0 18px; }
  .chart-svg { display: block; overflow: visible; }
  .chart-label { font-size: 11.5px; fill: var(--ink-2); text-anchor: end; dominant-baseline: middle; }
  .chart-value { font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; dominant-baseline: middle; }
  .chart-axis-label { font-size: 10.5px; fill: var(--ink-muted); }
  .chart-grid { stroke: var(--grid); stroke-width: 1; }
  .chart-row { cursor: default; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; }
  .chart-legend .swatch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  #chart-tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 50;
    background: var(--ink); color: var(--bg); font-size: 12px;
    padding: 5px 9px; border-radius: 6px; max-width: 260px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  .empty-state { color: var(--ink-muted); font-size: 13px; padding: 20px 0; text-align: center; }
  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    display: none;
  }

  /* Portfolio Analysis tab - scoped restyle only (KPI tiles, upload
     widgets, tables). Everything here is namespaced under .pa-panel so it
     doesn't touch any other tab's look. */
  .pa-panel .card {
    box-shadow: 0 1px 3px rgba(11,11,11,0.05);
    transition: box-shadow 0.15s ease;
  }
  .pa-panel .card h3 {
    padding-bottom: 11px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pa-panel .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .pa-panel .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 10px;
    padding: 13px 15px;
    box-shadow: 0 1px 2px rgba(11,11,11,0.03);
    min-width: 0;
  }
  .pa-panel .kpi .label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-muted); margin-bottom: 6px; display: block;
  }
  .pa-panel .kpi .value {
    font-size: 18px; font-weight: 700; line-height: 1.3;
    display: block; word-break: break-word; overflow-wrap: break-word;
  }

  .pa-upload-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }
  .pa-upload-slot {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .pa-upload-slot label { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .pa-upload-slot input[type=file] {
    font-size: 11.5px;
    color: var(--ink-2);
    max-width: 100%;
  }
  .pa-upload-slot input[type=date] {
    padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); font: inherit; font-size: 13px;
  }
  .pa-upload-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .pa-upload-actions button { padding: 6px 12px; font-size: 12.5px; }

  .pa-panel table { font-size: 12.5px; }
  .pa-panel table th {
    background: var(--surface-2);
    padding: 8px 10px;
  }
  .pa-panel table td { padding: 8px 10px; }
  .pa-panel table tbody tr:hover td { background: var(--surface-2); }

  /* ---------- Renewal Bench (scoped - its own palette/type, doesn't
     affect the rest of the app) ---------- */
  .rb-scope {
    /* Aliases the root design tokens - see .hc-rail above. */
    --rb-bg: var(--bg); --rb-surface: var(--surface); --rb-surface-2: var(--surface-2); --rb-surface-3: var(--surface-3);
    --rb-ink: var(--ink); --rb-ink-2: var(--ink-2); --rb-muted: var(--ink-muted);
    --rb-border: var(--border); --rb-border-strong: var(--border-strong);
    --rb-accent: var(--accent); --rb-accent-ink: var(--accent-ink);
    --rb-accent-soft: var(--series-1-wash); --rb-accent-soft-2: rgba(92,217,255,0.30);
    --rb-secondary: var(--serious); --rb-secondary-soft: var(--serious-bg);
    --rb-good: var(--good); --rb-good-soft: var(--good-bg);
    --rb-warning: var(--warning); --rb-warning-soft: var(--warning-bg);
    --rb-critical: var(--critical); --rb-critical-soft: var(--critical-bg);
    --rb-shadow: var(--shadow);
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    color: var(--rb-ink);
  }

  .rb-card {
    background: var(--rb-surface); border: 1px solid var(--rb-border); border-radius: 14px;
    padding: 18px 20px; box-shadow: var(--rb-shadow); margin-bottom: 16px;
  }
  .rb-quicknav {
    position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 4px;
    background: var(--rb-bg); padding: 8px 0 12px; margin-bottom: 4px; flex-wrap: wrap;
  }
  .rb-quicknav a {
    font-size: 12px; font-weight: 600; color: var(--rb-ink-2); text-decoration: none;
    padding: 6px 12px; border-radius: 7px; background: var(--rb-surface-2);
  }
  .rb-quicknav a:hover { background: var(--rb-accent-soft); color: var(--rb-accent); }
  .rb-card-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; color: var(--rb-ink); }
  .rb-card-sub { font-size: 11.5px; color: var(--rb-muted); margin: 0 0 14px; line-height: 1.5; }

  .rb-kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .rb-kpi-card { background: var(--rb-surface-2); border-radius: 10px; padding: 13px 15px; }

<script>
const API = '';
let currentCase = null;
let _benefitsSummaryPlans = [];
const ZONE_LABELS = {
  zone_1_asia: 'Asia',
  zone_2_middle_east: 'Middle East',
  zone_3_europe_americas: 'Europe & Americas',
};
const SERIES = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)'];

function toast(message, isError) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.borderColor = isError ? 'var(--critical)' : 'var(--border)';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

async function api(path, options) {
  const res = await fetch(API + path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || (`Request failed (${res.status})`));
  }
  if (res.status === 204) return null;
  return res.json();
}

function escapeHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Comma-grouped number entry for premium fields - plain <input type="number">
// can't display commas at all (browsers reject them outright), so these use
// type="text" instead: formatted on blur/load for readability, and parsed
// back to a plain numeric string (via _parseThousands) before being read.
function _formatThousands(value) {
  const digits = (value ?? '').toString().replace(/,/g, '').trim();
  if (!digits || isNaN(Number(digits))) return digits;
  const [whole, frac] = digits.split('.');
  const withCommas = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return frac !== undefined ? `${withCommas}.${frac}` : withCommas;
}

function _parseThousands(value) {
  return (value ?? '').toString().replace(/,/g, '').trim();
}

// Mirrors the backend's own category normalization (app/api/
// routes_new_business_rating.py's _normalize_category) - a Benefits tab
// category letter typed as "a" or "A " must still match a census-derived
// category of "A", or its Product/Network pick silently fails to pre-fill.
function _normalizeCategory(value) {
  return (value ?? '').toString().trim().toUpperCase() || null;
}

// Every category letter is picked from this fixed A-Z list rather than
// typed freehand - free text is exactly how "A", "A " and "a" ended up as
// three different categories on a real case. `current` is included as an
// extra option even if outside A-Z so an unusual pre-existing value is
// never silently discarded, just surfaced for the underwriter to fix.
const CATEGORY_LETTERS = Array.from({length: 26}, (_, i) => String.fromCharCode(65 + i));
function _categoryOptionsHtml(current, blankLabel) {
  const value = _normalizeCategory(current) || '';
  const letters = (value && !CATEGORY_LETTERS.includes(value)) ? [value, ...CATEGORY_LETTERS] : CATEGORY_LETTERS;
  const blank = `<option value="">${escapeHtml(blankLabel || '-')}</option>`;
  return blank + letters.map(l => `<option value="${escapeHtml(l)}" ${l === value ? 'selected' : ''}>${escapeHtml(l)}</option>`).join('');
}

/* ---------------- chart helpers (hand-rolled SVG, no external library) ---------------- */

function bindChartTooltips(container) {
  const tooltip = document.getElementById('chart-tooltip');
  container.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      tooltip.textContent = el.getAttribute('data-tooltip');
      tooltip.style.display = 'block';
    });
    el.addEventListener('mousemove', (e) => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

// Horizontal bar chart - a single-hue magnitude ranking (e.g. age bands, burning cost by category).
function svgBarChart(items, opts) {
  opts = opts || {};
  const color = opts.color || 'var(--series-1)';
  const formatValue = opts.formatValue || (v => v.toLocaleString());
  const barH = 20, gapY = 12, labelW = opts.labelWidth || 150, plotW = opts.plotWidth || 380, valueW = 90;
  const maxVal = Math.max(...items.map(i => i.value), 1);
  const totalW = labelW + plotW + valueW;
  const totalH = items.length * (barH + gapY);
  const rows = items.map((item, i) => {
    const w = Math.max(2, (item.value / maxVal) * plotW);
    const y = i * (barH + gapY);
    const valueText = formatValue(item.value);
    return `
      <g class="chart-row" data-tooltip="${escapeHtml(item.label)}: ${escapeHtml(valueText)}">
        <text x="${labelW - 10}" y="${y + barH / 2}" class="chart-label">${escapeHtml(item.label)}</text>
        <rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${color}"/>
        <text x="${labelW + w + 10}" y="${y + barH / 2}" class="chart-value">${escapeHtml(valueText)}</text>
      </g>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} ${totalH}" class="chart-svg" style="width:100%; height:${totalH}px;">${rows}</svg>`;
}

// Single stacked proportion bar - identity/part-of-whole (e.g. nationality zone mix).
function svgProportionBar(items, opts) {
  opts = opts || {};
  const totalW = 600, barH = 26, segGap = 2;
  let x = 0;
  const segments = items.map((item, i) => {
    const w = Math.max(0, item.pct * totalW - segGap);
    const seg = `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${barH}" rx="4" fill="${SERIES[i % SERIES.length]}" class="chart-row" data-tooltip="${escapeHtml(item.label)}: ${item.count} (${(item.pct * 100).toFixed(1)}%)"/>`;
    x += w + segGap;
    return seg;
  }).join('');
  const legend = items.map((item, i) => `
    <span class="swatch"><span class="dot" style="background:${SERIES[i % SERIES.length]};"></span>${escapeHtml(item.label)} &middot; ${(item.pct * 100).toFixed(1)}%</span>
  `).join('');
  return `
    <svg viewBox="0 0 ${totalW} ${barH}" class="chart-svg" style="width:100%; height:${barH}px;">${segments}</svg>
    <div class="chart-legend">${legend}</div>
  `;
}

// Line chart with hover dots - magnitude over time (e.g. monthly claims trend).
function svgLineChart(points, opts) {
  opts = opts || {};
  const formatValue = opts.formatValue || (v => v.toLocaleString());
  const w = 720, h = 200, padL = 64, padB = 26, padT = 14, padR = 16;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const maxVal = Math.max(...points.map(p => p.value), 1);
  const stepX = points.length > 1 ? plotW / (points.length - 1) : 0;
  const coords = points.map((p, i) => ({
    x: padL + i * stepX,
    y: padT + plotH - (p.value / maxVal) * plotH,
    label: p.label,
    value: p.value,
  }));
  const path = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
  const areaPath = `${path} L ${coords[coords.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`;
  const gridlines = [0, 0.5, 1].map(f => {
    const y = padT + plotH * (1 - f);
    return `
      <line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" class="chart-grid"/>
      <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" class="chart-axis-label" text-anchor="end">${Math.round(maxVal * f).toLocaleString()}</text>
    `;
  }).join('');
  const showEvery = Math.max(1, Math.ceil(coords.length / 7));
  const xLabels = coords.map((c, i) => (i % showEvery === 0 || i === coords.length - 1)
    ? `<text x="${c.x.toFixed(1)}" y="${h - 6}" class="chart-axis-label" text-anchor="middle">${escapeHtml(c.label)}</text>`
    : '').join('');
  const dots = coords.map(c => `
    <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" class="chart-row" data-tooltip="${escapeHtml(c.label)}: ${escapeHtml(formatValue(c.value))}"/>
  `).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg" style="width:100%; height:${h}px;">
      ${gridlines}
      <path d="${areaPath}" fill="var(--series-1)" opacity="0.1"/>
      <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

// Horizontal meter - a single score against fixed tier thresholds.
function svgScoreMeter(score, tier) {
  const w = 600, h = 26;
  const tierColor = { Preferred: 'var(--good)', Standard: 'var(--accent)', Substandard: 'var(--serious)', 'Decline/Refer': 'var(--critical)' }[tier] || 'var(--accent)';
  const pct = Math.max(0, Math.min(100, score)) / 100;
  const markers = [40, 60, 80].map(t => `<line x1="${(t / 100 * w).toFixed(1)}" y1="0" x2="${(t / 100 * w).toFixed(1)}" y2="${h}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg" style="width:100%; height:${h}px;">
      <rect x="0" y="0" width="${w}" height="${h}" rx="6" fill="var(--surface-2)"/>
      <rect x="0" y="0" width="${Math.max(4, pct * w).toFixed(1)}" height="${h}" rx="6" fill="${tierColor}"/>
      ${markers}
    </svg>
  `;
}

async function deleteCase(id, companyName) {
  if (!confirm(`Delete case "${companyName}"? This removes all its census, benefits, claims, and scorecard data - this cannot be undone.`)) return;
  try {
    await api(`/cases/${id}`, { method: 'DELETE' });
    if (currentCase && currentCase.id === id) {
      currentCase = null;
      document.getElementById('main').innerHTML = '';
    }
    await loadCases();
    toast('Case deleted');
  } catch (err) {
    toast(err.message, true);
  }
}

let allCases = [];

async function loadCases() {
  allCases = await api('/cases');
  renderCaseList();
}

function clearCaseFilters() {
  document.getElementById('caseFilterSearch').value = '';
  document.getElementById('caseFilterStatus').value = '';
  document.getElementById('caseFilterBusinessType').value = '';
  document.getElementById('caseFilterRenewalFrom').value = '';
  document.getElementById('caseFilterRenewalTo').value = '';
  renderCaseList();
}

function renderCaseList() {
  const list = document.getElementById('caseList');
  if (allCases.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:8px 0;">No cases yet</div>';
    return;
  }

  const search = (document.getElementById('caseFilterSearch').value || '').trim().toLowerCase();
  const status = document.getElementById('caseFilterStatus').value;
  const businessType = document.getElementById('caseFilterBusinessType').value;
  const renewalFrom = document.getElementById('caseFilterRenewalFrom').value;
  const renewalTo = document.getElementById('caseFilterRenewalTo').value;

  const cases = allCases.filter(c => {
    if (search && !`${c.company_name} ${c.broker_name}`.toLowerCase().includes(search)) return false;
    if (status && c.status !== status) return false;
    if (businessType && (c.business_type || 'new') !== businessType) return false;
    if (renewalFrom && (!c.renewal_date || c.renewal_date < renewalFrom)) return false;
    if (renewalTo && (!c.renewal_date || c.renewal_date > renewalTo)) return false;
    return true;
  });

  if (cases.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:8px 0;">No cases match these filters</div>';
    return;
  }

  const renewals = cases.filter(c => c.business_type === 'existing');
  const newBusiness = cases.filter(c => c.business_type !== 'existing');
  list.innerHTML = `
    ${newBusiness.length ? `<h3 class="case-group-heading">New Business</h3>${newBusiness.map(_caseItemHtml).join('')}` : ''}
    ${renewals.length ? `<h3 class="case-group-heading">Renewal</h3>${renewals.map(_caseItemHtml).join('')}` : ''}
  `;
}

let lastComparisonResult = null;

// A lower co-insurance/deductible/copay is the better benefit (less cost to
// the member) - the opposite of every other numeric category here, where a
// higher limit is the better benefit.
const _LOWER_IS_BETTER_LABELS = new Set([
  'Outpatient Co-insurance/Deductible', 'Dental Co-insurance', 'Optical Co-insurance',
]);

function _firstComparableNumber(value) {
  if (!value) return null;
  // "NIL" is this domain's own way of writing a zero co-insurance/deductible
  // (e.g. "NIL Copay") - it carries no digits of its own, so without this it
  // would fail to parse as a number at all and the row would fall back to
  // unranked "neutral" even though 0% is a perfectly real, comparable value.
  if (/^nil\b/i.test(value.trim())) return 0;
  // Prefer the AED figure unify_currency_to_aed appended in parentheses, so
  // an originally-USD limit and an originally-AED limit compare on the same
  // scale rather than by coincidence of which currency was written first.
  const aedMatch = value.match(/AED\s*([\d,]+(?:\.\d+)?)/i);
  if (aedMatch) return parseFloat(aedMatch[1].replace(/,/g, ''));
  const numMatch = value.match(/[\d,]+(?:\.\d+)?/);
  return numMatch ? parseFloat(numMatch[0].replace(/,/g, '')) : null;
}

// Returns {planId: 'better'|'worse'|'neutral'|'missing'} for one comparison
// row - so highlighting reflects which plan's benefit actually wins, not
// merely which plans happen to have a matching row at all (two plans both
// offering optical cover shouldn't both show green if one's limit is
// clearly higher than the other's).
function rankRowCells(label, planIds, values) {
  const result = {};
  const hasValue = (id) => values[id] !== null && values[id] !== undefined && values[id] !== '';

  if (planIds.length < 2) {
    // Nothing to compare against - fall back to plain presence.
    planIds.forEach(id => { result[id] = hasValue(id) ? 'better' : 'missing'; });
    return result;
  }

  planIds.forEach(id => { result[id] = 'missing'; });
  const present = planIds.filter(hasValue);
  if (present.length === 0) return result;
  if (present.length === 1) {
    // Every other plan in the row is already 'missing' (red) - the one
    // plan that does offer this benefit is better than not having it at
    // all, consistent with "red = worse or missing" everywhere else.
    result[present[0]] = 'better';
    return result;
  }

  const numbers = {};
  const allNumeric = present.every(id => {
    const n = _firstComparableNumber(values[id]);
    numbers[id] = n;
    return n !== null;
  });
  if (!allNumeric) {
    // Can't safely rank text like "Worldwide" vs "Private room" against
    // each other - leave present values unhighlighted, missing stays red.
    present.forEach(id => { result[id] = 'neutral'; });
    return result;
  }

  const lowerIsBetter = _LOWER_IS_BETTER_LABELS.has(label);
  const vals = present.map(id => numbers[id]);
  const best = lowerIsBetter ? Math.min(...vals) : Math.max(...vals);
  const worst = lowerIsBetter ? Math.max(...vals) : Math.min(...vals);
  present.forEach(id => {
    if (best === worst) { result[id] = 'neutral'; return; } // tie - equal benefit
    if (numbers[id] === best) result[id] = 'better';
    else if (numbers[id] === worst) result[id] = 'worse';
    else result[id] = 'neutral';
  });
  return result;
}

function comparisonCellHtml(value, rank) {
  const has = value !== null && value !== undefined && value !== '';
  const cls = (rank === 'better') ? 'cmp-cell-yes' : (rank === 'neutral') ? 'cmp-cell-neutral' : 'cmp-cell-no';
  return `<td class="${cls}">${escapeHtml(has ? value : '—')}</td>`;
}

// Prints whatever's currently rendered in a tab (tables, KPI grids, SVG
// charts) as-is, rather than rebuilding each card's content from scratch
// per tab - a broker gets a PDF of exactly what they're already looking
// at. The tab must already have data loaded (this doesn't fetch anything
// itself); interactive controls (buttons/inputs/selects) are hidden since
// they aren't meaningful in a printed report. The chart colors are
// hand-copied from the page's own light-theme :root variables, since a
// popup window doesn't inherit the parent document's CSS custom
// properties on its own.
function printTabAsPdf(tabId, title) {
  const panel = document.querySelector(`.tab-panel[data-tab="${tabId}"]`);
  if (!panel || !panel.textContent.trim()) { toast("Nothing to print yet - load this tab's data first", true); return; }

  // input/select carry their CURRENT value only as a live DOM property, not
  // as a serializable HTML attribute - a plain innerHTML clone would print
  // either blank (nothing ever set the value attribute) or a stale default
  // (the user edited it after the page rendered). Replace each one with a
  // plain text span showing what's actually on screen right now, so a
  // printed IBNR%/credibility%/underwriter-adjustment field always matches
  // what the underwriter had entered - not hidden, not stale.
  const clone = panel.cloneNode(true);
  const liveFields = panel.querySelectorAll('input, select');
  const cloneFields = clone.querySelectorAll('input, select');
  liveFields.forEach((live, i) => {
    const target = cloneFields[i];
    if (!target) return;
    const value = live.tagName === 'SELECT' ? (live.options[live.selectedIndex] ? live.options[live.selectedIndex].text : '') : live.value;
    const span = document.createElement('span');
    span.className = 'print-value';
    span.textContent = value || '-';
    target.replaceWith(span);
  });

  // Reuse the LIVE app's own stylesheet rather than a hand-maintained
  // separate copy - a second copy drifts out of sync every time a tab
  // gains new classes (exactly what happened to Renewal Bench's .rb-card/
  // .rb-kpi-strip/.rb-donut/.rb-driver-block, none of which this print
  // view ever had rules for, so it rendered as unstyled plain text).
  const liveStyles = Array.from(document.querySelectorAll('head > style')).map(s => s.innerHTML).join('\n');

  const html = `<!doctype html>
<html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${liveStyles}</style>
<style>
  /* Print-only overrides layered on top of the live app's own stylesheet
     above - undo the fixed app-shell layout (sidebar/header aren't part
     of this printout) and hide anything interactive-only. */
  body { margin: 24px auto !important; max-width: 900px !important; background: #fff !important; overflow: visible !important; height: auto !important; }
  h1 { font-size: 19px; margin: 0 0 16px; }
  .card, .rb-card { page-break-inside: avoid; }
  button, #chart-tooltip { display: none !important; }
  .print-value { font-weight: 600; }
  @media print { body { margin: 8px auto !important; } }
</style></head><body>
  <h1>${escapeHtml(title)}${currentCase ? ' - ' + escapeHtml(currentCase.company_name) : ''}</h1>
  ${clone.innerHTML}
  <script>window.onload = () => window.print();<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

// Renewal Client Summary - a 3-page printed export (Executive Summary,
// Census Analysis, Benefits & Premium Comparison) combining case info,
// the renewal rating, the book-wide benchmark, and the premium's
// component breakdown into one document - see
// GET /cases/{id}/renewal-client-summary. Two variants share this same
// builder: "internal" (sales team, includes the book-wide Renewal
// Benchmark) and "external" (broker/client-ready, benchmark omitted -
// see app/api/routes_analysis.py's docstring on why no external
// market-rate comparison exists to show instead).
async function printRenewalClientSummary(variant) {
  if (!currentCase) return;
  let data;
  try {
    data = await api(`/cases/${currentCase.id}/renewal-client-summary`);
  } catch (err) {
    toast(err.message, true);
    return;
  }
  if (!data.renewal) {
    toast('No renewal rating available yet - upload a claims ledger and set the current annual premium first', true);
    return;
  }

  // Best-effort - a case with only one year of claims reports on file (or
  // none at all, since the renewal rating itself can run off the claims
  // LEDGER instead) simply has nothing to trend, not an error.
  let reportComparison = null;
  try {
    reportComparison = await api(`/cases/${currentCase.id}/claims-report-comparison`);
  } catch (err) { /* no claims reports uploaded - trend section omitted */ }

  const c = data.case;
  const r = data.renewal;
  const bench = data.benchmark;
  const pb = data.premium_breakdown;
  const census = data.census_summary;
  const diagnoses = data.top_diagnoses || [];
  const isInternal = variant === 'internal';

  const lossRatioPct = r.actual_loss_ratio * 100;
  const gaugeMax = Math.max(250, Math.ceil(lossRatioPct / 50) * 50);
  const arcLen = Math.PI * 80;
  const gaugeDash = (arcLen * Math.min(lossRatioPct / gaugeMax, 1)).toFixed(1);

  const buildupMax = Math.max(r.annualized_incurred_claims, r.trended_claims, r.current_annual_premium, r.required_premium);
  const buildupPct = v => (v / buildupMax * 100).toFixed(1);

  const topDiagnosis = diagnoses[0];
  const topDiagnosisShare = topDiagnosis ? (topDiagnosis.value / r.annualized_incurred_claims * 100) : 0;
  const diagnosisNote = (topDiagnosis && topDiagnosisShare >= 8)
    ? `${escapeHtml(topDiagnosis.diagnosis_description || 'One diagnosis')} accounts for AED ${topDiagnosis.value.toLocaleString()} of claims on its own - about ${topDiagnosisShare.toFixed(0)}% of the annualized total.`
    : null;

  let benchmarkHtml = '';
  if (isInternal) {
    if (bench && bench.comparable_case_count > 0) {
      const allPct = [...bench.other_loss_ratios.map(v => v * 100), lossRatioPct];
      const minV = Math.min(...allPct), maxV = Math.max(...allPct);
      const pad = (maxV - minV) * 0.15 || 5;
      const domainMin = Math.max(0, minV - pad), domainMax = maxV + pad;
      const xScale = v => 20 + (v - domainMin) / (domainMax - domainMin || 1) * 800;
      const dots = bench.other_loss_ratios.map(v => `<circle cx="${xScale(v * 100)}" cy="40" r="5" fill="#837e6d" opacity="0.55"></circle>`).join('');
      benchmarkHtml = `
        <div class="rcs-section">
          <h3>Renewal Benchmark <span class="rcs-muted-label">(internal only)</span></h3>
          <p class="rcs-desc">This case's loss ratio against ${bench.comparable_case_count} other HealthCross renewal case${bench.comparable_case_count === 1 ? '' : 's'} with a computed rating - case-to-case, no external market rate available yet.</p>
          <svg viewBox="0 0 840 70" class="rcs-bench-svg">
            <line x1="20" y1="40" x2="820" y2="40" stroke="#e7e3d6" stroke-width="2" stroke-linecap="round"></line>
            ${dots}
            <circle cx="${xScale(lossRatioPct)}" cy="40" r="7" fill="#a83232" stroke="#fdfcf9" stroke-width="2"></circle>
            <text x="${xScale(lossRatioPct)}" y="24" text-anchor="middle" class="rcs-bench-label">this case &middot; ${lossRatioPct.toFixed(0)}%</text>
          </svg>
          ${bench.percentile != null ? `<p class="rcs-desc">${bench.percentile}th percentile${bench.low_credibility ? ' - small sample, treat as directional' : ''}.</p>` : ''}
        </div>`;
    } else {
      benchmarkHtml = `
        <div class="rcs-section">
          <h3>Renewal Benchmark <span class="rcs-muted-label">(internal only)</span></h3>
          <div class="rcs-redacted">No other case has a computed renewal rating yet to benchmark against.</div>
        </div>`;
    }
  }

  const ageBandRows = census ? Object.keys(census.age_band_counts).filter(b => census.age_band_counts[b] > 0).map(band => `
    <div class="rcs-bar-row"><span>${escapeHtml(band)}</span><div class="rcs-bar-track"><div class="rcs-bar-fill" style="width:${(census.age_band_pct[band] * 100).toFixed(1)}%"></div></div><span class="rcs-count">${census.age_band_counts[band]}</span></div>
  `).join('') : '';
  const genderRows = census ? ['M', 'F'].map(g => `
    <div class="rcs-bar-row"><span>${g === 'M' ? 'Male' : 'Female'}</span><div class="rcs-bar-track"><div class="rcs-bar-fill" style="width:${(census.gender_pct[g] * 100).toFixed(1)}%; ${g === 'F' ? 'background:#b3752c;' : ''}"></div></div><span class="rcs-count">${census.gender_counts[g]}</span></div>
  `).join('') : '';
  const relationRows = census ? Object.keys(census.relation_counts).filter(rel => census.relation_counts[rel] > 0).map(rel => `
    <div class="rcs-bar-row"><span>${escapeHtml(rel)}</span><div class="rcs-bar-track"><div class="rcs-bar-fill" style="width:${(census.relation_pct[rel] * 100).toFixed(1)}%"></div></div><span class="rcs-count">${census.relation_counts[rel]}</span></div>
  `).join('') : '';

  const diagnosisRows = diagnoses.slice(0, 4).map(d => `<tr><th>${escapeHtml(d.diagnosis_description || d.diagnosis_code || 'Unknown')}${d.high_exposure ? '<span class="rcs-flag-pill">high exposure</span>' : ''}</th><td class="rcs-num">AED ${d.value.toLocaleString()}</td></tr>`).join('');

  // Year-over-year burning cost, when a second policy year's claims report
  // is on file - same figures as the on-screen "Year-over-year claims
  // comparison" card (see /claims-report-comparison), just carried into
  // the printed export too.
  const trendReports = reportComparison && reportComparison.reports.length >= 2 ? reportComparison.reports : [];
  const trendMaxBurningCost = trendReports.length ? Math.max(...trendReports.map(tr => tr.burning_cost_per_member || 0)) : 0;
  const burningCostTrendBarsHtml = trendReports.map(tr => `
    <div class="rcs-bar-row">
      <span>${tr.year ?? '-'}</span>
      <div class="rcs-bar-track"><div class="rcs-bar-fill" style="width:${trendMaxBurningCost ? (tr.burning_cost_per_member / trendMaxBurningCost * 100).toFixed(1) : 0}%; ${tr.burning_cost_pct_change > 0 ? 'background:#a83232;' : tr.burning_cost_pct_change < 0 ? 'background:#2f6b4f;' : ''}"></div></div>
      <span class="rcs-count">${tr.burning_cost_per_member != null ? 'AED ' + tr.burning_cost_per_member.toLocaleString() : '-'}</span>
    </div>
  `).join('');
  const burningCostTrendHtml = trendReports.length ? `
    <section class="rcs-section">
      <h3>Burning Cost Trend</h3>

function _comparisonRowsFlat(result) {
  const rows = [];
  result.sections.forEach(section => {
    section.rows.forEach(row => rows.push({ section: section.section || 'General', label: row.label, values: row.values }));
  });
  return rows;
}

function exportComparisonPrintView() {
  const result = lastComparisonResult;
  if (!result) { toast('Run a comparison first', true); return; }
  const rows = _comparisonRowsFlat(result);
  const planNames = result.plans.map(p => `${escapeHtml(p.insurer_name)}<br>${escapeHtml(p.plan_label)}`);

  let bySection = {};
  let sectionOrder = [];
  rows.forEach(r => {
    if (!bySection[r.section]) { bySection[r.section] = []; sectionOrder.push(r.section); }
    bySection[r.section].push(r);
  });

  const html = `<!doctype html>
<html><head><meta charset="utf-8"><title>Benefits Comparison</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 20px; font-weight: 700; }
  h2 { font-size: 14px; color: #4B2E5A; text-transform: uppercase; margin-top: 24px; font-weight: 700; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 12px; text-align: left; }
  th { background: #4B2E5A; color: #fff; font-weight: 700; }
  .yes { background: #d9f2d9; }
  .no { background: #f8d7d7; color: #a33; }
  .neutral { background: transparent; }
  @media print { body { margin: 8px; } }
</style></head><body>
  <h1>Detailed Benefits Comparison</h1>
  ${sectionOrder.map(section => `
    <h2>${escapeHtml(section)}</h2>
    <table>
      <tr><th>Benefit</th>${planNames.map(n => `<th>${n}</th>`).join('')}</tr>
      ${bySection[section].map(r => {
        const planIds = result.plans.map(p => p.id);
        const ranks = rankRowCells(r.label, planIds, r.values);
        return `
        <tr>
          <td>${escapeHtml(r.label)}</td>
          ${result.plans.map(p => {
            const v = r.values[p.id];
            const has = v !== null && v !== undefined && v !== '';
            const rank = ranks[p.id];
            const cls = (rank === 'better') ? 'yes' : (rank === 'neutral') ? 'neutral' : 'no';
            return `<td class="${cls}">${escapeHtml(has ? v : '—')}</td>`;
          }).join('')}
        </tr>
      `;
      }).join('')}
    </table>
  `).join('')}
  <script>window.onload = () => window.print();<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

function exportComparisonCsv() {
  const result = lastComparisonResult;
  if (!result) { toast('Run a comparison first', true); return; }
  const rows = _comparisonRowsFlat(result);
  const header = ['Section', 'Benefit', ...result.plans.map(p => `${p.insurer_name} - ${p.plan_label}`)];
  const csvEscape = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r => {
    const line = [r.section, r.label, ...result.plans.map(p => r.values[p.id] ?? '—')];
    lines.push(line.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'benefits_comparison.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function _completenessPillHtml(label, done, required, extra, missingText) {
  const cls = done ? 'dir-improved' : (required ? 'dir-review' : 'dir-same');

}

function _statTileHtml(label, value, sub) {
  return `
    <div style="flex:1; min-width:150px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
      <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">${escapeHtml(label)}</div>
      <div style="font-size:20px; font-weight:700;">${value}</div>
      ${sub ? `<div style="font-size:11px; color:var(--ink-muted); margin-top:4px;">${sub}</div>` : ''}
    </div>
  `;
}

async function loadExecutiveSummary() {
  const card = document.getElementById('executive-summary-card');
  if (!card) return;
  try {
    const s = await api(`/cases/${currentCase.id}/executive-summary`);
    const tiles = [];
    const census = s.census_summary;
    tiles.push(_statTileHtml('Members', census ? census.total_members : '-', census ? `avg age ${census.avg_age ?? '-'}` : 'No census yet'));

    const premiumLabel = s.account_type === 'renewal' ? 'Current annual premium' : 'Quoted premium';
    const premiumValue = s.account_type === 'renewal' ? s.premium.current_annual_premium : s.premium.target_premium;
    tiles.push(_statTileHtml(
      premiumLabel,
      premiumValue != null ? `AED ${premiumValue.toLocaleString()}` : '-',
      s.premium.premium_per_member != null ? `AED ${s.premium.premium_per_member.toLocaleString()} / member` : ''
    ));

    if (s.account_type === 'renewal' && s.renewal) {
      tiles.push(_statTileHtml('Actual loss ratio', `${(s.renewal.actual_loss_ratio * 100).toFixed(1)}%`, `required premium AED ${s.renewal.required_premium.toLocaleString()}`));
      tiles.push(_statTileHtml(
        'Renewal increase',
        `${s.renewal.renewal_increase_pct > 0 ? '+' : ''}${s.renewal.renewal_increase_pct}%`,
        s.benchmark && s.benchmark.comparable_case_count ? `book median: ${s.benchmark.median_renewal_increase_pct}%` : 'no book comparison yet'
      ));
    }

    if (s.burning_cost) {
      const change = s.burning_cost.change_pct;
      const changeText = change != null ? `${change > 0 ? '+' : ''}${change}% vs. prior year` : 'no prior year on file';
      tiles.push(_statTileHtml('Burning cost / member', `AED ${s.burning_cost.latest_per_member.toLocaleString()}`, changeText));
    }

    if (s.account_type === 'new_business' && s.new_business_benchmark) {
      const nbb = s.new_business_benchmark;
      tiles.push(_statTileHtml(
        'Quote vs. book',
        `${nbb.percentile}th percentile`,
        `book median AED ${nbb.book_median_premium_per_member.toLocaleString()}/member (${nbb.comparable_case_count} case${nbb.comparable_case_count === 1 ? '' : 's'})`
      ));
    }

    const accountTypeLabel = s.account_type === 'renewal' ? 'Renewal' : 'New business';
    card.innerHTML = `
      <h3>Executive summary <span class="tier-pill ${s.account_type === 'renewal' ? 'dir-review' : 'dir-same'}">${accountTypeLabel}</span></h3>
      <div class="row" style="flex-wrap:wrap; gap:12px; margin-top:8px;">${tiles.join('')}</div>
    `;
  } catch (err) {
    card.innerHTML = '';
  }
}

// Cached so saveCategoryRates() can look up which members belong to a
// grid cell, and each member's own CURRENT new_annual_rate_override -
// PATCH /member-rates replaces both existing_annual_rate and
// new_annual_rate_override per member wholesale, so applying a cell's
// existing rate must still resend each member's own untouched override
// value rather than wiping it out.
let _lastMemberRatesData = null;

// Mirrors the insurer's own rate-card grid shape (Category x Age Band x
// Gender x Region - see app/ingestion/premium_summary_rate_card.py and
// app/reference/emirate_regions.py) rather than one flat rate per
// category, since that's genuinely how these are priced: the same
// Category A can cost a different amount in Dubai vs. the Northern
// Emirates, and a different amount again for a 55-year-old vs. a 25-year-old.
const RATE_AGE_BANDS = [[0, 17, '0-17'], [18, 40, '18-40'], [41, 59, '41-59'], [60, 999, '60-99']];
const RATE_GENDER_ORDER = ['Male', 'Female', 'Unspecified'];
const RATE_REGION_ORDER = ['Dubai', 'Northern Emirates', 'Abu Dhabi'];

function _ageBandLabel(age) {
  if (age == null) return 'Unspecified';
  const band = RATE_AGE_BANDS.find(([lo, hi]) => age >= lo && age <= hi);
  return band ? band[2] : 'Unspecified';
}

function _genderLabel(gender) {
  return gender === 'M' ? 'Male' : gender === 'F' ? 'Female' : 'Unspecified';
}

function _regionSort(a, b) {
  const ia = RATE_REGION_ORDER.indexOf(a), ib = RATE_REGION_ORDER.indexOf(b);
  return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b);
}

// region -> category -> gender -> age band -> [members] - a member's own
// region comes from the census's emirates field (see routes_analysis.py's
// _member_rate_row, which defaults an unmapped/missing emirate to Dubai -
// the common case by far - so this rarely needs its own "Unspecified"
// region section in practice).
function _groupMembersForRateGrid(members) {
  const tree = {};
  members.forEach(m => {
    const region = m.region || 'Unspecified';
    const category = m.category || 'Uncategorized';
    const gender = _genderLabel(m.gender);
    const ageBand = _ageBandLabel(m.age);
    tree[region] = tree[region] || {};
    tree[region][category] = tree[region][category] || {};
    tree[region][category][gender] = tree[region][category][gender] || {};
    (tree[region][category][gender][ageBand] = tree[region][category][gender][ageBand] || []).push(m);
  });
  return tree;
}

function _rateGridHtml(regionTree, caseRenewalIncreasePct) {
  return Object.keys(regionTree).sort(_regionSort).map(region => {
    const catTree = regionTree[region];
    const rows = [];
    Object.keys(catTree).sort((a, b) => (a === 'Uncategorized') - (b === 'Uncategorized') || a.localeCompare(b)).forEach(category => {
      RATE_GENDER_ORDER.forEach(gender => {
        const ageTree = catTree[category][gender];
        if (!ageTree) return;
        RATE_AGE_BANDS.map(b => b[2]).concat('Unspecified').forEach(ageBand => {
          const members = ageTree[ageBand];
          if (!members || !members.length) return;
          const existingValues = [...new Set(members.map(m => m.existing_annual_rate).filter(v => v != null))];
          const uniform = existingValues.length === 1 ? existingValues[0] : null;
          const mixed = existingValues.length > 1;
          const computedNewRate = (uniform != null && caseRenewalIncreasePct != null)
            ? Math.round(uniform * (1 + caseRenewalIncreasePct / 100) * 100) / 100
            : null;
          const gridKey = `${region}||${category}||${gender}||${ageBand}`;
          rows.push(`
            <tr>
              <td>${escapeHtml(category)}</td>
              <td>${escapeHtml(gender)}</td>
              <td>${escapeHtml(ageBand)}</td>
              <td>${members.length}</td>
              <td><input type="number" step="0.01" data-grid-key="${escapeHtml(gridKey)}" value="${uniform ?? ''}" placeholder="${mixed ? 'mixed' : 'e.g. 3,500'}" style="width:110px;"></td>
              <td>${computedNewRate != null ? 'AED ' + computedNewRate.toLocaleString() : (mixed ? 'mixed' : '-')}</td>
            </tr>
          `);
        });
      });
    });
    return `
      <h4>${escapeHtml(region)}</h4>
      <table>
        <tr><th>Category</th><th>Gender</th><th>Age Band</th><th>Members</th><th>Existing rate (AED)</th><th>Effective new rate</th></tr>
        ${rows.join('')}
      </table>
    `;
  }).join('');
}

async function saveCategoryRates() {
  if (!_lastMemberRatesData) return;
  const updates = [];
  document.querySelectorAll('[data-grid-key]').forEach(el => {
    if (el.value === '') return;
    const [region, category, gender, ageBand] = el.dataset.gridKey.split('||');
    const value = Number(el.value);
    const members = _lastMemberRatesData.members.filter(m =>
      (m.region || 'Unspecified') === region
      && (m.category || 'Uncategorized') === category
      && _genderLabel(m.gender) === gender
      && _ageBandLabel(m.age) === ageBand
    );
    members.forEach(m => {
      updates.push({
        census_record_id: m.census_record_id,
        existing_annual_rate: value,
        new_annual_rate_override: m.new_annual_rate_override,
      });
    });
  });
  if (!updates.length) { toast('Enter a rate for at least one row first', true); return; }
  try {
    await api(`/cases/${currentCase.id}/member-rates`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(updates),
    });
    toast(`Applied rates to ${updates.length} member(s)`);
    loadMemberRates();
  } catch (err) {
    toast(err.message, true);
  }
}

function renderMemberRatesTable(data) {
  _lastMemberRatesData = data;
  const area = document.getElementById('member-rates-area');
  if (!area) return;
  if (!data.members.length) {
    area.innerHTML = '<div class="hint">No census uploaded yet - upload one on the Census tab first.</div>';
    return;
  }
  const increaseNote = data.case_renewal_increase_pct != null
    ? `Case renewal increase: <strong>${data.case_renewal_increase_pct > 0 ? '+' : ''}${data.case_renewal_increase_pct}%</strong> - auto-fills every member's new rate once a cell's existing rate is applied below.`
    : `No case-level renewal increase computed yet (needs a claims ledger and current premium set on this case) - come back once the renewal rating is available, or set rates individually below in the meantime.`;

  const regionTree = _groupMembersForRateGrid(data.members);

  const memberRows = data.members.map(m => `
    <tr>
      <td>${escapeHtml(m.employee_ref || ('#' + m.census_record_id))}</td>
      <td>${escapeHtml(m.category || '-')}</td>
      <td>${m.age ?? '-'}</td>
      <td>${escapeHtml(m.gender || '-')}</td>
      <td>${escapeHtml(m.relation || '-')}</td>
      <td><input type="number" step="0.01" data-mr-existing="${m.census_record_id}" value="${m.existing_annual_rate ?? ''}" style="width:110px;"></td>
      <td><input type="number" step="0.01" data-mr-override="${m.census_record_id}" value="${m.new_annual_rate_override ?? ''}" placeholder="${m.computed_new_rate != null ? m.computed_new_rate.toLocaleString() : 'auto'}" style="width:110px;"></td>
      <td>${m.effective_new_rate != null ? 'AED ' + m.effective_new_rate.toLocaleString() : '-'}</td>
      <td>${m.rate_change_pct != null ? (m.rate_change_pct > 0 ? '+' : '') + m.rate_change_pct + '%' : '-'}</td>
    </tr>
  `).join('');

  area.innerHTML = `
    <div class="card">
      <h3>Existing vs. New Rates by Category, Age Band &amp; Gender</h3>
      <div class="hint">${increaseNote} One rate applies to every member in that region/category/gender/age-band cell at once - matching how the insurer's own rate card is priced. Only cells with at least one member are shown.</div>
      ${_rateGridHtml(regionTree, data.case_renewal_increase_pct)}
      <div style="margin-top:12px;"><button class="primary" onclick="saveCategoryRates()">Apply rates</button></div>
    </div>
    <div class="card">
      <details>
        <summary style="cursor:pointer; font-weight:700; font-size:14.5px;">Per-member rates (individual exceptions)</summary>
        <div class="hint" style="margin-top:10px;">Only needed when one member's rate genuinely differs from the rest of their region/category/gender/age-band cell - saving here overrides whatever the grid above set for that one member.</div>
        <table>
          <tr>
            <th>Member</th><th>Category</th><th>Age</th><th>Gender</th><th>Relation</th>
            <th>Existing rate (AED)</th><th>New rate override (AED, optional)</th><th>Effective new rate</th><th>Change</th>
          </tr>
          ${memberRows}
        </table>
        <div style="margin-top:12px;"><button onclick="saveMemberRates()">Save individual rates</button></div>
      </details>
    </div>
  `;
}

async function uploadFile(kind) {
  const input = document.getElementById(`file-${kind}`);
  const statusEl = document.getElementById(`status-${kind}`);
  if (!input.files.length) { toast('Choose a file first', true); return; }
  const isPdf = input.files[0].name.toLowerCase().endsWith('.pdf');

  const form = new FormData();
  form.append('file', input.files[0]);
  statusEl.textContent = 'Uploading...';
  statusEl.className = 'status-pending';
  try {
    const appendCheckbox = document.getElementById(`file-${kind}-append`);
    const mergeDatesCheckbox = document.getElementById(`file-${kind}-merge-dates`);
    const categoryInput = document.getElementById(`file-${kind}-category`);
    const params = new URLSearchParams();
    if (kind === 'benefits' && appendCheckbox && appendCheckbox.checked) params.set('mode', 'append');
    if (kind === 'census' && mergeDatesCheckbox && mergeDatesCheckbox.checked) params.set('mode', 'merge-dates');
    if (kind === 'benefits' && categoryInput && categoryInput.value.trim()) params.set('category', categoryInput.value.trim());
    const query = params.toString() ? `?${params.toString()}` : '';
    const result = await api(`/cases/${currentCase.id}/${kind}${query}`, { method: 'POST', body: form });
    if (Array.isArray(result)) {
      if (params.get('mode') === 'merge-dates') {
        const withDates = result.filter(r => r.member_end_date).length;
        statusEl.textContent = `${withDates} of ${result.length} census rows now have member dates`;
        toast(`Dates merged into census (${withDates} of ${result.length} rows matched)`);
      } else {
        const unit = kind === 'quote' ? 'categories' : 'rows';
        statusEl.textContent = `${result.length} ${unit} parsed`;
        toast(`${kind} uploaded (${result.length} ${unit})`);
      }
    } else {
      statusEl.textContent = 'Report parsed';
      toast(`${kind} report parsed`);
    }
    statusEl.className = 'status-ok';
    // Cleared rather than left as-is - the next file in a "one category per
    // file" batch is almost always a different category, and leaving the
    // last one filled in risks silently overwriting it if forgotten.
    if (kind === 'benefits' && categoryInput) categoryInput.value = '';
    if (kind === 'census') { await loadCensusSummary(); await loadNewBusinessRating(); await loadMemberRates(); await loadRenewalBenchCensusMovement(); await loadRenewalBenchSummary(); }
    if (kind === 'benefits') { await loadBenefitsSummary(); await loadBenefitsComparison(); }
    if (kind === 'quote') { await loadPremiumByCategory(); await loadBenefitsComparison(); }
    if (kind === 'claims' && isPdf) {
      selectedClaimsReportId = null; // show the just-uploaded (latest) report by default
      await loadClaimsReportYearSelector();
      await loadClaimsReportComparison();
      await loadClaimsProjection();
      await loadClaimsReportBreakdown();
      await loadDiagnosisExposure();
    }
    if (kind === 'claims-ledger') { await loadClaimsLedgerAnalysis(); await loadRenewalRating(); await loadRenewalBenchmark(); await loadMemberRates(); await loadRenewalBenchScorecard(); await loadRenewalBenchNbComparison(); await loadRenewalBenchLargeClaims(); await loadRenewalBenchCensusMovement(); await loadRenewalBenchSummary(); }
    // Auto-run the scorecard whenever a data source that feeds it changes,
    // so it's always current without a manual "Compute scorecard" click -
    // only re-runs on a new upload, never just from viewing the case.
    if (['census', 'benefits', 'claims', 'claims-ledger'].includes(kind)) await autoComputeScore();
    await loadCaseCompleteness();
  } catch (err) {
    statusEl.textContent = 'Failed';
    statusEl.className = 'status-err';
    toast(err.message, true);
  }
}

async function autoComputeScore() {
  if (!currentCase) return;
  const premiumInput = document.getElementById('estimated-premium');
  const payload = { estimated_annual_premium: premiumInput && premiumInput.value ? Number(premiumInput.value) : null };
  try {
    await api(`/cases/${currentCase.id}/score`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    await loadLatestScorecard();
    toast('Scorecard auto-updated');
  } catch (err) {
    // Expected until both a census and a table of benefits are uploaded -
    // stay quiet rather than nagging after every single-file upload. Any
    // other failure is unexpected and still worth surfacing.
    if (!/no census|no table of benefits/i.test(err.message || '')) {
      toast(`Scorecard auto-update failed: ${err.message}`, true);
    }
  }
}

document.addEventListener('dragover', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (zone) { e.preventDefault(); zone.classList.add('dragover'); }
});
document.addEventListener('dragleave', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (zone) zone.classList.remove('dragover');
});
document.addEventListener('drop', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove('dragover');
  const input = zone.querySelector('input[type=file]');
  if (input && e.dataTransfer.files.length) {
    input.files = e.dataTransfer.files;
    // Only the Quick upload zone's input has an onchange handler (the
    // single-file dropzones use a separate Upload button instead) - this
    // dispatch is what actually lets dropping files there kick off
    // detection, same as picking them via the file dialog would.
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }
});

/* ---------------- Quick upload (drag-drop all files, auto-detect kind) ---------------- */

let quickUploadFiles = []; // [{file, detectedKind, confidence, reason, selectedKind, status}]

const QUICK_UPLOAD_KIND_LABELS = {
  census: 'Census', benefits: 'Benefits', claims: 'Claims', 'claims-ledger': 'Claims ledger', quote: 'Quote',
};

async function quickUploadHandleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const newItems = files.map(f => ({
    file: f, detectedKind: null, confidence: null, reason: 'Detecting...', selectedKind: '', status: 'detecting',
  }));
  quickUploadFiles = quickUploadFiles.concat(newItems);
  document.getElementById('quick-upload-input').value = '';
  renderQuickUploadReview();

  await Promise.all(newItems.map(async (item) => {
    try {
      const form = new FormData();
      form.append('file', item.file);
      const result = await api('/cases/detect-upload-kind', { method: 'POST', body: form });
      item.detectedKind = result.detected_kind;
      item.confidence = result.confidence;
      item.reason = result.reason;
      item.selectedKind = result.detected_kind || '';
      item.status = 'pending';
    } catch (err) {
      item.status = 'error';
      item.reason = err.message;
    }
    renderQuickUploadReview();
  }));
}

function quickUploadSetKind(idx, value) {
  quickUploadFiles[idx].selectedKind = value;
  renderQuickUploadReview();
}

function quickUploadSetCategory(idx, value) {
  quickUploadFiles[idx].category = value;
}

function quickUploadRemove(idx) {
  quickUploadFiles.splice(idx, 1);
  renderQuickUploadReview();
}

function quickUploadClear() {
  quickUploadFiles = [];
  renderQuickUploadReview();
}

function renderQuickUploadReview() {
  const area = document.getElementById('quick-upload-review');
  if (!area) return;
  if (!quickUploadFiles.length) { area.innerHTML = ''; return; }

  const rows = quickUploadFiles.map((item, idx) => {
    const confPill = item.confidence === 'high'
      ? '<span class="tier-pill dir-improved">Confident</span>'
      : (item.confidence === 'low' ? '<span class="tier-pill dir-review">Please check</span>' : '');
    const statusCell = item.status === 'done' ? '<span class="tier-pill dir-improved">Uploaded</span>'
      : item.status === 'error' ? '<span class="tier-pill dir-review">Failed</span>'
      : item.status === 'uploading' ? '<span class="hint">Uploading...</span>'
      : `<button onclick="quickUploadRemove(${idx})">Remove</button>`;
    const categoryCell = item.selectedKind === 'benefits'
      ? `<select style="width:80px;" onchange="quickUploadSetCategory(${idx}, this.value)" ${item.status === 'done' || item.status === 'uploading' ? 'disabled' : ''}>${_categoryOptionsHtml(item.category, 'e.g. A')}</select>`
      : '';
    return `
      <tr>
        <td>${escapeHtml(item.file.name)}</td>
        <td>
          <select onchange="quickUploadSetKind(${idx}, this.value)" ${item.status === 'done' || item.status === 'uploading' ? 'disabled' : ''}>
            <option value="">Skip this file</option>
            ${Object.entries(QUICK_UPLOAD_KIND_LABELS).map(([k, label]) => `<option value="${k}" ${item.selectedKind === k ? 'selected' : ''}>${label}</option>`).join('')}
          </select>
        </td>
        <td>${categoryCell}</td>
        <td>${item.status === 'detecting' ? '<span class="hint">Detecting...</span>' : confPill}</td>
        <td class="hint" style="max-width:280px;">${escapeHtml(item.reason || '')}</td>
        <td>${statusCell}</td>
      </tr>
    `;
  }).join('');

  const readyCount = quickUploadFiles.filter(f => f.status === 'pending' && f.selectedKind).length;
  const stillDetecting = quickUploadFiles.some(f => f.status === 'detecting');
  const anyBenefits = quickUploadFiles.some(f => f.selectedKind === 'benefits');

  area.innerHTML = `
    <div style="overflow-x:auto; margin-top:14px;">
      <table>
        <tr><th>File</th><th>Upload as</th><th>Category</th><th>Confidence</th><th>Why</th><th></th></tr>
        ${rows}
      </table>
    </div>
    ${anyBenefits ? '<div class="hint">For Benefits files, type the category letter it\'s for (e.g. A) - lines it up with the HealthCross quote\'s own categories and makes sure a re-upload replaces the right one instead of duplicating it.</div>' : ''}
    <div class="row" style="margin-top:10px;">
      <button class="primary" onclick="quickUploadConfirm()" ${readyCount && !stillDetecting ? '' : 'disabled'}>Confirm &amp; upload ${readyCount ? `(${readyCount})` : ''}</button>
      <button onclick="quickUploadClear()">Clear all</button>
    </div>
  `;
}

async function quickUploadConfirm() {
  const toUpload = quickUploadFiles.filter(item => item.status === 'pending' && item.selectedKind);
  // More than one benefits file in the same batch means one file per
  // category (see the Manual upload tab's own append checkbox) - each
  // upload must append rather than the default replace, or every file
  // after the first would wipe out the one before it, leaving only the
  // last category standing.
  const benefitsFileCount = toUpload.filter(item => item.selectedKind === 'benefits').length;
  for (const item of toUpload) {
    item.status = 'uploading';
    renderQuickUploadReview();
    try {
      const form = new FormData();
      form.append('file', item.file);
      const params = new URLSearchParams();
      if (item.selectedKind === 'benefits' && benefitsFileCount > 1) params.set('mode', 'append');
      if (item.selectedKind === 'benefits' && item.category && item.category.trim()) params.set('category', item.category.trim());
      const query = params.toString() ? `?${params.toString()}` : '';
      const result = await api(`/cases/${currentCase.id}/${item.selectedKind}${query}`, { method: 'POST', body: form });
      item.status = 'done';
      item.reason = Array.isArray(result) ? `${result.length} row(s) uploaded` : 'Uploaded';
    } catch (err) {
      item.status = 'error';
      item.reason = err.message;
    }
    renderQuickUploadReview();
  }

  // Refresh whatever views depend on what just got uploaded - same views
  // uploadFile() itself refreshes after a single manual upload, just for
  // every kind touched in this one batch.
  const uploadedKinds = new Set(toUpload.filter(f => f.status === 'done').map(f => f.selectedKind));
  if (uploadedKinds.has('census')) { await loadCensusSummary(); await loadNewBusinessRating(); await loadMemberRates(); await loadRenewalBenchCensusMovement(); await loadRenewalBenchSummary(); }
  if (uploadedKinds.has('benefits')) { await loadBenefitsSummary(); await loadBenefitsComparison(); }
  if (uploadedKinds.has('quote')) { await loadPremiumByCategory(); await loadBenefitsComparison(); }
  if (uploadedKinds.has('claims')) {
    selectedClaimsReportId = null;
    await loadClaimsReportYearSelector();
    await loadClaimsReportComparison();
    await loadClaimsProjection();
    await loadClaimsReportBreakdown();
    await loadDiagnosisExposure();
  }
  if (uploadedKinds.has('claims-ledger')) { await loadClaimsLedgerAnalysis(); await loadRenewalRating(); await loadRenewalBenchmark(); await loadMemberRates(); await loadRenewalBenchScorecard(); await loadRenewalBenchNbComparison(); await loadRenewalBenchLargeClaims(); await loadRenewalBenchCensusMovement(); await loadRenewalBenchSummary(); }
  if (['census', 'benefits', 'claims', 'claims-ledger'].some(k => uploadedKinds.has(k))) await autoComputeScore();
  await loadCaseCompleteness();
  if (uploadedKinds.size) toast('Quick upload complete');
}

function _onBenefitNbProductChange(planId, product) {
  const plan = _benefitsSummaryPlans.find(p => p.id === planId);
  if (!plan) return;
  plan.nb_product = product;
  plan.nb_network = '';
  plan.nb_tpa = '';
  const card = document.querySelector(`#benefits-summary-area .card[data-plan-id="${planId}"]`);
  if (card) card.outerHTML = _benefitSummaryCardHtml(plan, true);
}

function _benefitSummaryCardHtml(p, editing) {
  // OCR (lower-confidence, best-effort) marks an unfound field "Not
  // Covered" rather than every other parser's "Not specified in source
  // document" - see app/api/routes_analysis.py's _benefit_summary.
  const unresolvedText = p.source_format === 'pdf-ocr' ? 'Not Covered' : NOT_SPECIFIED_TEXT;
  const rows = Object.entries(p.summary).map(([field, value]) => {
    if (!editing) {
      return `<tr><th style="width:220px;">${escapeHtml(field.replace(/_/g, ' '))}</th><td>${escapeHtml(value)}</td></tr>`;
    }
    const current = value === unresolvedText ? '' : value;
    return `
      <tr>
        <th style="width:220px;">${escapeHtml(field.replace(/_/g, ' '))}</th>
        <td><input type="text" data-field="${field}" value="${escapeHtml(current)}" style="width:100%;box-sizing:border-box;" /></td>
      </tr>
    `;
  }).join('');

  const actions = editing
    ? `
      <button class="primary" onclick="saveBenefitSummaryEdit(${p.id})">Save</button>
      <button onclick="cancelBenefitSummaryEdit(${p.id})">Cancel</button>
      <button onclick="deleteBenefitPlan(${p.id})" style="float:right;">Delete category</button>
    `
    : `<button onclick="editBenefitSummary(${p.id})">Edit</button> <button onclick="duplicateBenefitPlan(${p.id})">Duplicate</button>`;

  const title = editing
    ? `<input type="text" id="plan-name-input-${p.id}" value="${escapeHtml(p.plan_name || '')}" placeholder="e.g. Category A" style="font-size:1.1em;font-weight:600;width:100%;box-sizing:border-box;margin-bottom:8px;" />`
    : `<h3>${escapeHtml(p.plan_name || 'Plan')}${p.category ? ` <span style="color:var(--ink-muted); font-weight:400;">(Cat ${escapeHtml(p.category)})</span>` : ''}</h3>`;

  const nbSummaryLine = !editing && (p.nb_product || p.nb_network)
    ? `<div class="hint">New Business: ${escapeHtml(p.nb_product || '-')} / ${escapeHtml(p.nb_network || '-')}${p.nb_tpa ? ' (' + escapeHtml(p.nb_tpa) + ')' : ''}</div>`
    : '';

  return `
    <div class="card" data-plan-id="${p.id}">
      ${title}
      ${nbSummaryLine}
      ${editing ? _benefitNbPickerHtml(p) : ''}
      <table>${rows}</table>
      <div style="margin-top:10px;">${actions}</div>
    </div>
  `;
}

async function cancelBenefitSummaryEdit(planId) {
  // Reload fresh from the server rather than re-rendering the in-memory
  // plan object - _onBenefitNbProductChange mutates it in place (so the
  // Product/Network selects can re-render live as the Product changes),
  // so it may no longer reflect what was actually last saved.
  await loadBenefitsSummary();
}

async function saveBenefitSummaryEdit(planId) {
  const card = document.querySelector(`#benefits-summary-area .card[data-plan-id="${planId}"]`);
  if (!card) return;
  const fields = {};
  card.querySelectorAll('input[data-field]').forEach(input => {
    fields[input.dataset.field] = input.value;
  });
  const nameInput = document.getElementById(`plan-name-input-${planId}`);
  const categoryInput = document.getElementById(`nb-category-input-${planId}`);
  const productSelect = document.getElementById(`nb-product-select-${planId}`);
  const networkSelect = document.getElementById(`nb-network-select-${planId}`);
  let nbNetwork, nbTpa;
  if (networkSelect) {
    [nbNetwork, nbTpa] = networkSelect.value ? networkSelect.value.split('|') : ['', ''];
  }
  try {
    await api(`/cases/${currentCase.id}/benefits/${planId}/summary`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        fields,
        plan_name: nameInput ? nameInput.value : undefined,
        category: categoryInput ? categoryInput.value : undefined,
        nb_product: productSelect ? productSelect.value : undefined,
        nb_network: nbNetwork,
        nb_tpa: nbTpa,
      }),
    });
    toast('Benefit summary updated');
    await loadBenefitsSummary();
  } catch (err) {
    toast(err.message, true);
  }
}

async function addManualBenefitPlan() {
  const existingCount = _benefitsSummaryPlans.length;
  const nextLetter = String.fromCharCode(65 + existingCount); // A, B, C, D...
  try {
