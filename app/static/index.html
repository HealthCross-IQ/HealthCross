      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({plan_name: `Category ${nextLetter}`, category: nextLetter}),
    });
    toast('Category added - fill in its details below');
    await loadBenefitsSummary();
    editBenefitSummary(plan.id);
  } catch (err) {
    toast(err.message, true);
  }
}

async function duplicateBenefitPlan(planId) {

function _memberStatusChip(status) {

async function onChangeBenefitPlanMatch(existingPlanId, selectEl) {
  const quotedPlanId = selectEl.value ? Number(selectEl.value) : null;

    await api(`/cases/${currentCase.id}/benefits/${existingPlanId}/match`, {

function _categoryMappingHtml(plans, comparisons) {
  const existingPlans = plans.filter(p => p.role === 'existing');
  const quotedPlans = plans.filter(p => p.role === 'quoted');
  // Only ambiguous - and only actionable - when there's more than one
  // plan on each side; with a single existing plan it's always compared
  // against every quoted category already (see existing_plan_reused), and
  // with a single quoted plan there's nothing to choose between.
  if (existingPlans.length < 2 || quotedPlans.length < 2) return '';

  const currentQuotedIdByExisting = {};
  comparisons.forEach(c => {
    if (!c.existing_plan_reused) currentQuotedIdByExisting[c.existing_plan_id] = c.quoted_plan_id;
  });

  const rows = existingPlans.map(ep => {
    const selectedId = ep.matched_quote_plan_id ?? currentQuotedIdByExisting[ep.id] ?? '';
    const options = quotedPlans.map(qp => `
      <option value="${qp.id}" ${String(selectedId) === String(qp.id) ? 'selected' : ''}>
        ${escapeHtml(qp.plan_name || 'Quoted plan')}${qp.category ? ' (Cat ' + escapeHtml(qp.category) + ')' : ''}
      </option>
    `).join('');
    return `
      <tr>
        <td>${escapeHtml(ep.plan_name || 'Existing plan')}${ep.category ? ' (Cat ' + escapeHtml(ep.category) + ')' : ''}</td>
        <td>
          <select onchange="onChangeBenefitPlanMatch(${ep.id}, this)">
            <option value="">- not compared -</option>
            ${options}
          </select>
        </td>
      </tr>
    `;
  }).join('');

  return `
    <div class="card">
      <h3>Category mapping</h3>
      <div class="hint">This case has more than one existing category and more than one HealthCross quote category - pick which HealthCross category each existing plan should be compared against below if the automatic match (by category letter or plan name) picked the wrong one.</div>
      <table>
        <tr><th>Existing plan</th><th>Compared against (HealthCross quote)</th></tr>
        ${rows}
      </table>
    </div>
  `;
}

async function loadBenefitsComparison() {
  const area = document.getElementById('benefits-comparison-area');
  try {
    const [comparisons, plans] = await Promise.all([
      api(`/cases/${currentCase.id}/benefits-comparison`),
      api(`/cases/${currentCase.id}/benefit-plans`),
    ]);
    area.innerHTML = _categoryMappingHtml(plans, comparisons) + comparisons.map(c => `
      <div class="card">
        <h3>Summary</h3>
        <div class="hint">
          Existing: ${escapeHtml(c.existing_plan_name || '-')}${c.existing_category ? ' (Cat ' + escapeHtml(c.existing_category) + ')' : ''}
          &nbsp;vs&nbsp;
          HealthCross Quote: ${escapeHtml(c.quoted_plan_name || '-')}${c.quoted_category ? ' (Cat ' + escapeHtml(c.quoted_category) + ')' : ''}
          ${c.quoted_gross_premium != null ? ` (AED ${c.quoted_gross_premium.toLocaleString()}${c.quoted_member_count ? ' / ' + c.quoted_member_count + ' members' : ''})` : ''}
        </div>
        ${c.existing_plan_reused ? `<div class="hint"><span class="hint-dot" style="background:var(--warning);"></span>Note: this case's existing plan wasn't split by category (e.g. a scanned/OCR'd document) - the same existing figures shown above are being compared against this quoted category too, not a distinct Category 2/B entry.</div>` : ''}
        <table>

          ${Object.entries(c.fields).map(([field, cmp]) => `
            <tr>

// Which uploaded claims report (see /claims-reports - a case can have one

// currently scoped to - null means "the latest one" (the API's own
// default), matching the behavior before multi-year support existed.
let selectedClaimsReportId = null;

function _withClaimsReportId(params) {
  if (selectedClaimsReportId) params.set('report_id', selectedClaimsReportId);
  return params;
}

async function loadClaimsReportYearSelector() {
  const area = document.getElementById('claims-report-year-area');
  try {
    const reports = await api(`/cases/${currentCase.id}/claims-reports`);
    if (reports.length > 0) {
      _setUploadStatus('claims', `${reports.length} report${reports.length === 1 ? '' : 's'} uploaded`);
    }
    if (reports.length < 2) {
      // Only one (or no) report uploaded - the year picker would just be
      // noise, same as before multi-year support existed.
      area.innerHTML = '';
      return;
    }
    if (!reports.some(r => r.id === selectedClaimsReportId)) {
      selectedClaimsReportId = reports[reports.length - 1].id; // latest by period
    }
    area.innerHTML = `
      <div class="card">
        <h3>Claims report year</h3>
        <div class="hint">${reports.length} years of claims reports uploaded for this case - the views below reflect whichever one is selected here.</div>
        <select onchange="onChangeClaimsReportYear(this.value)">
          ${reports.map(r => `<option value="${r.id}" ${r.id === selectedClaimsReportId ? 'selected' : ''}>${escapeHtml(_claimsReportYearLabel(r))}</option>`).join('')}
        </select>
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

function _claimsReportYearLabel(r) {
  const year = r.report_period_start ? r.report_period_start.slice(0, 4) : (r.report_production_date ? r.report_production_date.slice(0, 4) : '?');
  const range = (r.report_period_start && r.report_period_end) ? ` (${r.report_period_start} to ${r.report_period_end})` : '';
  return `${year}${range}`;
}

async function onChangeClaimsReportYear(reportId) {
  selectedClaimsReportId = Number(reportId);
  await Promise.all([loadClaimsProjection(), loadClaimsReportBreakdown(), loadDiagnosisExposure()]);
}

          <tr><th>+ IBNR (${(p.assumptions_used.ibnr_pct*100).toFixed(0)}%)</th><td>${p.with_ibnr.toLocaleString()}</td></tr>
          <tr><th>Opening members</th><td>${p.opening_members}</td></tr>
          <tr><th>Closing members</th><td>${p.closing_members}</td></tr>
          <tr><th>Avg report members</th><td>${p.avg_report_members}</td></tr>
          <tr><th>Burning cost / member</th><td>${p.burning_cost_per_member.toLocaleString()}</td></tr>
          <tr><th>Projected (current group)</th><td>${p.projected_current_group.toLocaleString()}</td></tr>
          <tr><th>+ Inflation (${(p.assumptions_used.inflation_pct*100).toFixed(1)}%)</th><td>${p.trended.toLocaleString()}</td></tr>
          <tr><th>x Credibility (${(p.assumptions_used.credibility_pct*100).toFixed(0)}%)</th><td>${p.credible.toLocaleString()}</td></tr>
          <tr><th><b>Final projected claims</b> (÷ loading)</th><td><b>${p.final_projected_claims.toLocaleString()}</b></td></tr>
        </table>
        <div class="row" style="margin-top:12px; align-items:flex-end;">
          <div>
            <label>Credibility % (varies by insurer)</label>
            <input type="number" id="credibility-override" min="0" max="100" step="1" value="${(p.assumptions_used.credibility_pct*100).toFixed(0)}">
          </div>
          <div>
            <label>Loading %</label>
            <input type="number" id="claims-projection-loading-override" step="0.1" value="${(p.assumptions_used.loading_pct*100).toFixed(1)}">
          </div>
          <button onclick="recomputeClaimsProjection()">Recompute</button>
        </div>
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

async function recomputeClaimsProjection() {
  const input = document.getElementById('credibility-override');
  const pct = Number(input.value);
  if (Number.isNaN(pct) || pct < 0 || pct > 100) { toast('Enter a credibility % between 0 and 100', true); return; }
  const loading = Number(document.getElementById('claims-projection-loading-override').value) / 100;
  await loadClaimsProjection(pct / 100, loading);
}

async function loadClaimsReportBreakdown() {

        <tr><th>Type</th><th>Amount</th><th>% of total</th>${hasAnnualized ? '<th>Annualized</th>' : ''}</tr>

          <tr style="border-top:2px solid var(--border-color, #ccc);">
            <td>Maternity (${escapeHtml(b.maternity.label)})</td><td>${b.maternity.value.toLocaleString()}</td><td>${b.maternity.pct_of_total ?? '-'}%</td>

      { key: 'pharmacy', label: 'Pharmacy' }, { key: 'dental', label: 'Dental' },
      { key: 'optical', label: 'Optical' }, { key: 'not_yet_classified', label: 'Not yet classified' },
      { key: 'total', label: 'Total' },

    const memberTypeTable = (b.claims_by_member_type && b.claims_by_member_type.length) ? `
      <h4>Claims by member type (relation)</h4>
      <table>
        <tr><th>Relation</th>${memberTypeCols.map(c => `<th>${c.label}</th>`).join('')}<th>Members</th>${hasAnnualized ? '<th>Annualized</th><th>Burning cost / member</th>' : ''}</tr>
        ${b.claims_by_member_type.map(r => `
          <tr>
            <td>${escapeHtml(r.relation)}</td>
            ${memberTypeCols.map(c => `<td>${r[c.key].toLocaleString()}<br><span class="hint" style="margin:0;">${r.pct_of_column[c.key] ?? '-'}%</span></td>`).join('')}

          </tr>
        `).join('')}

      <div class="hint">Each cell's % is that relation's own share of the column's total (e.g. what share of all In-Patient claims Spouse accounts for). "Dependents" folds in every census member who isn't the Employee or Spouse (the report doesn't split children out separately). Burning cost / member = this relation's own share of the projected annual claims, divided by its own member count from the census.</div>

function renewalBenchmarkHtml(r) {
  const book = r.book;
  const thisPct = r.case.actual_loss_ratio * 100;

  if (!book.comparable_case_count) {
    return `
      <div class="card">
        <h3>Renewal benchmark</h3>
        <div class="hint">How this case's own loss ratio compares to HealthCross's other renewal cases - case-to-case, since there's no external market-rate data source. No other case has a computed renewal rating yet, so there's nothing to benchmark against.</div>
      </div>
    `;
  }

  const medianPct = book.median_loss_ratio * 100;
  const percentile = book.percentile;
  const dotColor = percentile >= 75 ? 'var(--critical)' : percentile <= 25 ? 'var(--good)' : 'var(--accent)';

  const allPct = [...book.other_loss_ratios.map(v => v * 100), thisPct];
  const minV = Math.min(...allPct);
  const maxV = Math.max(...allPct);
  const pad = (maxV - minV) * 0.15 || 5;
  const domainMin = Math.max(0, minV - pad);
  const domainMax = maxV + pad;
  const xScale = v => 40 + ((v - domainMin) / (domainMax - domainMin || 1)) * 780;

  const tickCount = 4;
  const ticks = Array.from({length: tickCount + 1}, (_, i) => domainMin + (i / tickCount) * (domainMax - domainMin));
  const ticksHtml = ticks.map(t => `
    <line x1="${xScale(t)}" y1="46" x2="${xScale(t)}" y2="58" stroke="var(--grid)" stroke-width="1"></line>
    <text x="${xScale(t)}" y="74" text-anchor="middle" class="renewal-benchmark-annot">${t.toFixed(0)}%</text>
  `).join('');

  const dotsHtml = book.other_loss_ratios.map(v => `<circle cx="${xScale(v * 100)}" cy="52" r="5" fill="var(--ink-muted)" opacity="0.55"></circle>`).join('');

  return `
    <div class="card">
      <h3>Renewal benchmark</h3>
      <div class="hint">How this case's own loss ratio compares to HealthCross's other renewal cases (${book.comparable_case_count} with a computed renewal rating) - case-to-case, since there's no external market-rate data source. A snapshot, not a trend - most cases have one year of claims history so far.</div>
      <div class="row" style="flex-wrap:wrap; gap:12px; margin-bottom:16px;">
        <div style="flex:1; min-width:160px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
          <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">This case's loss ratio</div>
          <div style="font-size:22px; font-weight:700;">${thisPct.toFixed(1)}%</div>
          <div style="font-size:11.5px; color:var(--ink-muted); margin-top:3px;">vs. book median ${medianPct.toFixed(1)}%</div>
        </div>
        <div style="flex:1; min-width:160px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
          <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">Percentile in book</div>
          <div style="font-size:22px; font-weight:700;">${percentile}th</div>
          <div style="font-size:11.5px; color:var(--ink-muted); margin-top:3px;">among ${book.comparable_case_count} comparable case${book.comparable_case_count === 1 ? '' : 's'}</div>
        </div>
        <div style="flex:1; min-width:160px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
          <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">Renewal increase (this case)</div>
          <div style="font-size:22px; font-weight:700;">${r.case.renewal_increase_pct > 0 ? '+' : ''}${r.case.renewal_increase_pct}%</div>
          <div style="font-size:11.5px; color:var(--ink-muted); margin-top:3px;">book median ${book.median_renewal_increase_pct > 0 ? '+' : ''}${book.median_renewal_increase_pct}%</div>
        </div>
      </div>
      <div style="font-size:12.5px; font-weight:700; margin:4px 0 10px;">Loss ratio vs. other renewal cases</div>
      <svg viewBox="0 0 860 92" preserveAspectRatio="xMidYMid meet" style="width:100%; display:block; overflow:visible;">
        <style>.renewal-benchmark-annot { font-size: 10.5px; fill: var(--ink-muted); }</style>
        <line x1="20" y1="52" x2="840" y2="52" stroke="var(--grid)" stroke-width="2" stroke-linecap="round"></line>
        ${ticksHtml}
        ${dotsHtml}
        <circle cx="${xScale(thisPct)}" cy="52" r="7.5" fill="${dotColor}" stroke="var(--surface)" stroke-width="2"></circle>
        <text x="${xScale(thisPct)}" y="32" text-anchor="middle" style="font-size:11px; font-weight:700;" fill="${dotColor}">this case &middot; ${thisPct.toFixed(0)}%</text>
      </svg>
      ${book.low_credibility ? `<span class="tier-pill dir-review" style="margin-top:10px;">Small sample - only ${book.comparable_case_count} comparable case${book.comparable_case_count === 1 ? '' : 's'} so far, treat as directional</span>` : ''}
    </div>
  `;
}

/* ---------------- renewal bench ---------------- */

function _rbKpi(label, value, sub) {
  return `
    <div class="rb-kpi-card">
      <div class="rb-kpi-label">${escapeHtml(label)}</div>
      <div class="rb-kpi-value">${value}</div>
      ${sub ? `<div class="rb-kpi-sub">${sub}</div>` : ''}
    </div>
  `;
}

// Steps: [{label, value, final}] - each step's own bar is scaled against
// the LARGEST value in the sequence (usually required_premium, the last
// step), so every intermediate build-up step is visually comparable on
// the same track, not just the final result.
function _rbBuildupHtml(steps) {
  const maxVal = Math.max(...steps.map(s => s.value));
  return steps.map(s => `
    <div class="rb-buildup-row ${s.final ? 'rb-buildup-final' : ''}">
      <div>${escapeHtml(s.label)}</div>
      <div class="rb-buildup-track"><div class="rb-buildup-fill" style="width:${maxVal ? (s.value / maxVal * 100).toFixed(1) : 0}%;"></div></div>
      <div class="rb-buildup-val">AED ${Math.round(s.value).toLocaleString()}</div>
    </div>
  `).join('');
}

function _renewalBenchScorecardHtml(r) {
  const b = r.method_b;
  const ibnr = r.ibnr_detail;
  const gapPositive = r.method_gap >= 0;
  return `
    <div class="rb-card">
      <div class="rb-card-title">Renewal scorecard</div>
      <div class="rb-card-sub">Both methods reach an Incurred Claims figure (Paid + Outstanding + IBNR) from this case's own trailing full months in the claims ledger, but compute IBNR differently. Months used: ${r.months_used.join(', ')}.</div>
      <div class="rb-scorecard-methods">
        <div class="rb-method-card">
          <div class="rb-method-head">
            <span class="rb-method-name">Method A &middot; Gross Loss Ratio</span>
            <span class="rb-badge rb-badge-a">A</span>
          </div>
          <div class="rb-card-sub" style="margin:0 0 10px;">IBNR here is dynamic: this case's own Paid claims run rate over the elapsed days so far, projected over a 30-day unreported tail - AED ${ibnr.total_paid.toLocaleString()} paid &divide; ${ibnr.elapsed_days} elapsed days &times; 30 = AED ${ibnr.ibnr.toLocaleString()}.</div>
          <div class="rb-kpi-strip" style="grid-template-columns:1fr;">
            ${_rbKpi('Actual loss ratio', `${(r.actual_loss_ratio * 100).toFixed(1)}%`, `AED ${r.annualized_incurred_claims.toLocaleString()} incurred claims &divide; AED ${r.current_annual_premium.toLocaleString()} current premium`)}
            ${_rbKpi('Renewal increase', `${r.renewal_increase_pct > 0 ? '+' : ''}${r.renewal_increase_pct}%`, `vs. AED ${r.current_annual_premium.toLocaleString()} current`)}
          </div>
          <div style="margin-top:12px;">
            ${_rbBuildupHtml([
              { label: 'Paid + Outstanding', value: r.annualized_paid_and_outstanding },
              { label: `+ IBNR (dynamic)`, value: r.annualized_incurred_claims },
              { label: `+ Inflation (${(r.assumptions_used.inflation_pct * 100).toFixed(1)}%)`, value: r.trended_claims },
              { label: `Required premium`, value: r.required_premium, final: true },
            ])}
          </div>
        </div>
        <div class="rb-method-card">
          <div class="rb-method-head">
            <span class="rb-method-name">Method B &middot; Burning Cost</span>
            <span class="rb-badge rb-badge-b">B</span>
          </div>
          <div class="rb-card-sub" style="margin:0 0 10px;">IBNR here is a flat load on the same Paid+Outstanding base: AED ${b.annualized_paid_and_outstanding.toLocaleString()} &times; ${(b.ibnr_pct * 100).toFixed(0)}% = AED ${(b.annualized_incurred_claims - b.annualized_paid_and_outstanding).toLocaleString()}.</div>
          <div class="rb-kpi-strip" style="grid-template-columns:1fr;">
            ${_rbKpi('Actual loss ratio', `${(b.actual_loss_ratio * 100).toFixed(1)}%`, `AED ${b.annualized_incurred_claims.toLocaleString()} incurred claims &divide; current premium`)}
            ${_rbKpi('Renewal increase', `${b.renewal_increase_pct > 0 ? '+' : ''}${b.renewal_increase_pct}%`, `vs. AED ${b.current_annual_premium.toLocaleString()} current`)}
          </div>
          <div style="margin-top:12px;">
            ${_rbBuildupHtml([
              { label: 'Paid + Outstanding', value: b.annualized_paid_and_outstanding },
              { label: `+ IBNR (${(b.ibnr_pct * 100).toFixed(0)}% flat)`, value: b.annualized_incurred_claims },
              { label: `+ Inflation (${(b.assumptions_used.inflation_pct * 100).toFixed(1)}%)`, value: b.trended_claims },
              { label: `× Credibility (${(b.assumptions_used.credibility_pct * 100).toFixed(0)}%)`, value: b.credible_claims },
              { label: `Required premium`, value: b.required_premium, final: true },
            ])}
          </div>
        </div>
      </div>
      <div class="rb-card-sub" style="margin-top:10px;">Both methods gross up their own final claims figure by the same loading (TPA Fee + Commission + HC Fee + QIC Fee, ${(r.assumptions_used.loading_pct * 100).toFixed(1)}% total) to reach Required Premium - see the Scorecard tab for that fee split.</div>
      <div class="rb-reconcile">
        <div class="txt">Method B (Burning Cost) requires <b>AED ${Math.abs(r.method_gap).toLocaleString()}</b> ${gapPositive ? 'more' : 'less'} than Method A - the different IBNR convention and credibility weighting's combined effect once grossed up through the same loading.</div>
        <div class="delta">${r.method_gap_pct > 0 ? '+' : ''}${r.method_gap_pct}%</div>
      </div>
      <div class="rb-row" style="margin-top:14px;">

  `;
}

function _rbHeaderHtml(identity) {
  const dueSoon = identity.days_to_renewal != null && identity.days_to_renewal <= 30;
  return `
    <div class="rb-header">
      <div>
        <div class="rb-header-title">${escapeHtml(identity.company_name)}</div>
        <div class="rb-header-meta">
          ${identity.broker_name ? `<span>Broker <b>${escapeHtml(identity.broker_name)}</b></span>` : ''}
          ${identity.product ? `<span>Product <b>${escapeHtml(identity.product)}</b></span>` : ''}
          ${identity.network ? `<span>Network <b>${escapeHtml(identity.network)}</b></span>` : ''}
          <span><b>${identity.member_count}</b> members</span>
        </div>
      </div>
      ${identity.days_to_renewal != null ? `
        <span class="rb-pill ${dueSoon ? 'rb-pill-warning' : 'rb-pill-good'}">
          ${identity.days_to_renewal >= 0 ? `Renewal due in ${identity.days_to_renewal} days` : `Renewal overdue by ${Math.abs(identity.days_to_renewal)} days`}
        </span>
      ` : ''}
    </div>
  `;
}

async function adoptComputedExistingPremium(computedTotal) {
  if (!currentCase) return;
  try {
    currentCase = await api(`/cases/${currentCase.id}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ current_annual_premium: computedTotal }),
    });
    toast(`Current annual premium set to AED ${Math.round(computedTotal).toLocaleString()}`);
    // The premium drives the scorecard, drivers and NB comparison too, so
    // the whole tab is reloaded rather than just this one card.
    await loadRenewalBenchSummary();
    await loadRenewalBenchScorecard();
    await loadRenewalBenchNbComparison();
    await loadExecutiveSummary();
  } catch (err) {
    toast(err.message, true);
  }
}

function _rbKpiStripHtml(kpis) {
  return `
    <div class="rb-card">
      <div class="rb-kpi-strip">
        ${_rbKpi('Loss ratio', `${(kpis.actual_loss_ratio * 100).toFixed(1)}%`, 'Method A, actual')}
        ${kpis.claim_frequency != null ? _rbKpi('Claim frequency', kpis.claim_frequency.toFixed(2), 'claims / member / year') : ''}
        ${kpis.avg_claim_severity != null ? _rbKpi('Avg. claim severity', `AED ${Math.round(kpis.avg_claim_severity).toLocaleString()}`, 'per claim line') : ''}
        ${kpis.claimant_ratio != null ? _rbKpi('Claimant ratio', `${(kpis.claimant_ratio * 100).toFixed(1)}%`, 'of census with a claim on file') : ''}
        ${kpis.avg_member_age != null ? _rbKpi('Avg. member age', kpis.avg_member_age.toFixed(1), '') : ''}
      </div>
    </div>
  `;
}

function _rbClaimsTrendHtml(trend) {
  if (!trend || trend.length < 2) {
    return `
      <div class="rb-card">
        <div class="rb-card-title">Claims trend</div>
        <div class="rb-card-sub">Not enough claims-report history yet to show a year-over-year trend - needs at least 2 uploaded claims reports (see the Claims tab) covering different policy years.</div>
      </div>
    `;
  }
  const maxVal = Math.max(...trend.map(t => t.total_paid));
  const bars = trend.map(t => `
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--rb-ink-2);">AED ${Math.round(t.total_paid).toLocaleString()}</div>
      <div style="width:100%; max-width:56px; background:var(--rb-accent); border-radius:4px 4px 0 0; height:${maxVal ? Math.max(6, t.total_paid / maxVal * 120) : 6}px;"></div>
      <div style="font-size:11px; color:var(--rb-muted); font-weight:600;">${t.year}</div>
    </div>
  `).join('');
  return `
    <div class="rb-card">
      <div class="rb-card-title">Claims trend</div>
      <div class="rb-card-sub">Total paid claims by policy year, from this case's own uploaded claims reports.</div>
      <div style="display:flex; align-items:flex-end; gap:10px; margin-top:8px;">${bars}</div>
    </div>
  `;
}

function _rbExistingPremiumHtml(existing) {
  if (!existing) return '';
  const rows = existing.categories.map(c => `
    <tr>
      <td>${escapeHtml(c.category)}</td>
      <td class="num">${c.rated_member_count} / ${c.member_count}</td>
      <td class="num">${c.avg_rate != null ? 'AED ' + Math.round(c.avg_rate).toLocaleString() : '-'}</td>
      <td class="num">AED ${Math.round(c.total_premium).toLocaleString()}</td>
    </tr>
  `).join('');
  const showDiscrepancy = existing.discrepancy_pct != null && Math.abs(existing.discrepancy_pct) >= 2;
  return `
    <div class="rb-card">
      <div class="rb-card-title">Existing premium (computed)</div>
      <div class="rb-card-sub">Bottom-up from the active list's own existing rate x current headcount, by category - not a manually-typed figure.</div>
      <div class="rb-kpi-strip" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">
        ${_rbKpi('Total existing premium', `AED ${Math.round(existing.total_existing_premium).toLocaleString()}`, `${existing.rated_members} of ${existing.total_members} members rated (${existing.coverage_pct != null ? existing.coverage_pct : 0}%)`)}
        ${_rbKpi('On case record', existing.current_annual_premium_on_case != null ? `AED ${Math.round(existing.current_annual_premium_on_case).toLocaleString()}` : 'Not set', 'current_annual_premium')}
      </div>
      ${existing.categories.length ? `<table class="rb-table"><tr><th>Category</th><th class="num">Rated / Members</th><th class="num">Avg rate</th><th class="num">Total</th></tr>${rows}</table>` : ''}
      ${showDiscrepancy ? `
        <div class="rb-insight sev-critical" style="margin-top:14px;">
          <div class="rb-insight-icon">⚠</div>
          <div>
            <span class="rb-insight-tag">Discrepancy</span>
            <div class="rb-insight-text">The computed total differs from the case's own current annual premium by <b>${existing.discrepancy_pct > 0 ? '+' : ''}${existing.discrepancy_pct}%</b> - worth checking whether member rates or the case's current_annual_premium is out of date. Every figure below (loss ratio, renewal increase, drivers) is built on the case's own figure, not this computed one.</div>
            <button class="rb-btn" style="margin-top:10px;" onclick="adoptComputedExistingPremium(${existing.total_existing_premium})">Use the computed figure</button>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

const RB_DONUT_COLORS = ['var(--rb-accent)', 'var(--rb-secondary)', 'var(--rb-good)', 'var(--rb-warning)', 'var(--rb-critical)'];

function _rbDonutHtml(breakdown) {
  if (!breakdown || !breakdown.length) return '<div class="rb-card"><div class="rb-card-title">Claims cost breakdown</div><div class="rb-card-sub">No claims ledger data to break down yet.</div></div>';
  const total = breakdown.reduce((sum, b) => sum + (b.total_value || 0), 0);
  let cursor = 0;
  const stops = breakdown.map((b, i) => {
    const start = cursor;
    const pct = total ? b.total_value / total * 100 : 0;
    cursor += pct;
    return `${RB_DONUT_COLORS[i % RB_DONUT_COLORS.length]} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
  }).join(', ');
  const legend = breakdown.map((b, i) => `
    <div class="rb-legend-row">
      <div class="rb-legend-dot" style="background:${RB_DONUT_COLORS[i % RB_DONUT_COLORS.length]};"></div>
      <div>${escapeHtml(b.encounter_type)} &middot; ${b.pct_of_total != null ? b.pct_of_total.toFixed(1) : '0'}%</div>
      <b>AED ${Math.round(b.total_value).toLocaleString()}</b>
    </div>
  `).join('');
  return `
    <div class="rb-card">
      <div class="rb-card-title">Claims cost breakdown</div>
      <div class="rb-card-sub">Incurred claims by encounter type, this case's own claims ledger.</div>
      <div class="rb-donut-wrap">
        <div style="width:120px; height:120px; border-radius:50%; background:conic-gradient(${stops}); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <div style="width:70px; height:70px; border-radius:50%; background:var(--rb-surface); display:flex; flex-direction:column; align-items:center; justify-content:center;" class="rb-donut-center">
            <div class="amt">AED ${total >= 1000000 ? (total/1000000).toFixed(2)+'M' : Math.round(total).toLocaleString()}</div>
            <div class="lbl">Incurred</div>
          </div>
        </div>
        <div class="rb-legend">${legend}</div>
      </div>
    </div>
  `;
}

let _rbLastSummary = null;

async function loadRenewalBenchSummary() {
  const headerArea = document.getElementById('renewal-bench-header-area');
  const kpiArea = document.getElementById('renewal-bench-kpi-area');
  const existingPremiumArea = document.getElementById('renewal-bench-existing-premium-area');
  const donutArea = document.getElementById('renewal-bench-donut-area');
  const trendArea = document.getElementById('renewal-bench-trend-area');
  if (!headerArea && !kpiArea && !existingPremiumArea && !donutArea && !trendArea) return;
  try {
    const r = await api(`/cases/${currentCase.id}/renewal-bench-summary`);
    _rbLastSummary = r;
    if (headerArea) headerArea.innerHTML = _rbHeaderHtml(r.case_identity);
    if (kpiArea) kpiArea.innerHTML = _rbKpiStripHtml(r.kpis);
    if (existingPremiumArea) existingPremiumArea.innerHTML = _rbExistingPremiumHtml(r.existing_premium);
    if (donutArea) donutArea.innerHTML = _rbDonutHtml(r.claims_cost_breakdown);
    if (trendArea) trendArea.innerHTML = _rbClaimsTrendHtml(r.claims_trend);
    renderRenewalBenchPremiumAndDrivers(r);
  } catch (err) {
    if (headerArea) headerArea.innerHTML = '';
    if (kpiArea) kpiArea.innerHTML = '';
    if (existingPremiumArea) existingPremiumArea.innerHTML = '';
    if (donutArea) donutArea.innerHTML = '';
    if (trendArea) trendArea.innerHTML = '';
  }
}

function _rbDriverBlockHtml(label, value, isTotal) {
  if (value == null) {
    return `<div class="rb-driver-block"><div class="val">n/a</div><div class="lbl">${escapeHtml(label)}</div></div>`;
  }
  const cls = isTotal ? 'total' : (value > 0 ? 'pos' : (value < 0 ? 'neg' : ''));
  return `
    <div class="rb-driver-block ${cls}">
      <div class="val">${value > 0 ? '+' : ''}${value.toFixed(1)}%</div>
      <div class="lbl">${escapeHtml(label)}</div>
    </div>
  `;
}

function _rbRecommendedPremiumHtml(r) {
  const d = r.drivers;
  return `
    <div class="rb-hero">
      <div class="lbl">Recommended renewal premium</div>
      <div class="amt">AED ${Math.round(d.recommended_premium).toLocaleString()}</div>
      <div class="sub">${d.total_pct > 0 ? '+' : ''}${d.total_pct}% vs. current annual premium &middot; ${d.within_authority ? 'within underwriter authority' : `outside authority (&plusmn;${d.authority_threshold_pct}pt)`}</div>
      <div class="rb-hero-row">
        <div class="rb-hero-input">
          <label>Underwriter adjustment %</label>
          <input type="number" id="rb-underwriter-adjustment" step="0.5" value="${d.underwriter_adjustment_pct}">
        </div>
        <div class="rb-hero-input">
          <label>Authority threshold %</label>
          <input type="number" id="rb-authority-threshold" step="1" value="${d.authority_threshold_pct}">

        <button class="rb-hero-btn" onclick="recomputeRenewalBenchDrivers()">Recompute</button>

    <div class="rb-card">

      <div class="rb-card-sub">How the ${d.total_pct}% total technical movement breaks down, each an additive percentage-point contribution against current premium.</div>
      <div class="rb-driver-row">
        ${_rbDriverBlockHtml('Claims experience', d.claims_experience_pct)}
        <div class="rb-driver-op">+</div>
        ${_rbDriverBlockHtml('Medical trend', d.medical_trend_pct)}
        <div class="rb-driver-op">+</div>
        ${_rbDriverBlockHtml('Census change', d.census_change_pct)}
        <div class="rb-driver-op">+</div>
        ${_rbDriverBlockHtml('Underwriter adj.', d.underwriter_adjustment_pct)}
        <div class="rb-driver-op">=</div>
        ${_rbDriverBlockHtml('Total movement', d.total_pct, true)}
      </div>

function renderRenewalBenchPremiumAndDrivers(r) {
  const area = document.getElementById('renewal-bench-premium-area');
  if (!area) return;
  area.innerHTML = _rbRecommendedPremiumHtml(r);
}

async function recomputeRenewalBenchDrivers() {
  const adj = Number(document.getElementById('rb-underwriter-adjustment').value) || 0;
  const threshold = Number(document.getElementById('rb-authority-threshold').value) || 15;
  try {
    const r = await api(`/cases/${currentCase.id}/renewal-bench-summary?underwriter_adjustment_pct=${adj}&authority_threshold_pct=${threshold}`);
    _rbLastSummary = r;
    renderRenewalBenchPremiumAndDrivers(r);
  } catch (err) { /* leave the card as-is on failure */ }
}

async function loadRenewalBenchScorecard() {
  const area = document.getElementById('renewal-bench-scorecard-area');
  if (!area) return;
  try {
    const r = await api(`/cases/${currentCase.id}/renewal-rating`);
    area.innerHTML = _renewalBenchScorecardHtml(r);
  } catch (err) {
    area.innerHTML = '';
  }

/* ---------------- Loss Ratio board (portfolio level) ---------------- */

let lrState = { rows: [], totals: null, sort: 'net_loss_ratio', dir: 'desc', asOf: null, basis: 'actual', yearBasis: 'underwriting' };

function _lrMoney(v, dp) {
  if (v == null) return '-';
  return Number(v).toLocaleString(undefined, { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
}

function _lrPct(v) {
  return v == null ? '-' : (v * 100).toFixed(1) + '%';
}

// Underwriting's own read on a loss ratio: at or under 70% the account is
// funding itself comfortably, 70-100% is thin, and over 100% the claims
// alone exceed the premium before any expense load is even applied.
function _lrBand(ratio) {
  if (ratio == null) return '';
  if (ratio > 1) return 'bad';
  if (ratio >= 0.7) return 'warn';
  return 'good';
}

function _lrRatioCell(ratio) {
  if (ratio == null) return '<td class="num">-</td>';
  const band = _lrBand(ratio);
  const colorVar = band === 'bad' ? 'var(--lr-bad)' : band === 'warn' ? 'var(--lr-warn)' : 'var(--lr-good)';
  // Bar is scaled so 100% sits at two-thirds width - the tick mark - so an
  // account running over 100% visibly overshoots it rather than saturating.
  const pct = Math.min(100, ratio / 1.5 * 100);
  return `
    <td class="num">
      <div style="display:flex; align-items:center; gap:8px; justify-content:flex-end;">
        <div class="lr-bar"><span style="width:${pct.toFixed(1)}%; background:${colorVar};"></span><i class="mark" style="left:66.6%"></i></div>
        <span class="lr-chip ${band}">${_lrPct(ratio)}</span>
      </div>
    </td>
  `;
}

function _lrSortRows(rows) {
  const key = lrState.sort, dir = lrState.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;   // nulls always last, regardless of direction
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
}

function lrSortBy(key) {
  if (lrState.sort === key) lrState.dir = lrState.dir === 'asc' ? 'desc' : 'asc';
  else { lrState.sort = key; lrState.dir = 'desc'; }
  document.getElementById('lr-table-area').innerHTML = _lrTableHtml();
}

function _lrTh(key, label, cls) {
  const active = lrState.sort === key;
  const arrow = active ? (lrState.dir === 'asc' ? ' ↑' : ' ↓') : '';
  return `<th class="${cls || ''}" style="cursor:pointer; ${active ? 'color:var(--lr-ink);' : ''}" onclick="lrSortBy('${key}')">${escapeHtml(label)}${arrow}</th>`;
}

function _lrTableHtml() {
  const rows = _lrSortRows(lrState.rows);
  const t = lrState.totals;
  if (!rows.length) {
    return '<div class="lr-card"><div class="lr-empty">No accounts to report yet - upload the Membership and Claims exports on the Claims Explorer screen first.</div></div>';
  }
  const body = rows.map(r => `
    <tr>
      <td class="lr-acct">${escapeHtml(r.master_client)}${r.expired ? `<span class="lr-exp">${lrState.yearBasis === 'calendar' ? 'closed' : 'expired'}</span>` : ''}<span class="yr">${r.calendar_year != null ? 'CY ' + r.calendar_year : r.policy_start_date} &middot; ${r.days} days &middot; ${r.member_count} lives</span></td>
      <td class="num">${_lrMoney(r.paid)}</td>

      <td class="num">${_lrMoney(r.ibnr)}</td>

  return `
    <div class="lr-card">
      <div class="lr-card-head">
        <div>
          <div class="lr-card-title">Loss ratio by account</div>
          <div class="lr-card-note">${lrState.yearBasis === 'calendar'

            : 'One row per account policy period, each policy year its own cohort. Click any column to sort.'}</div>
        </div>
        <div class="lr-card-note">Basis: <b>${lrState.yearBasis === 'calendar' ? 'Calendar year' : 'Underwriting year'}</b> &middot; <b>${lrState.basis === 'booked' ? 'Booked gross' : 'Actual gross'}</b> &middot; Incurred = Paid + Outstanding + IBNR &middot; IBNR = Paid &divide; days &times; 30 &middot; Net = Earned &times; (1 &minus; Loading)</div>
      </div>
      <div class="lr-table-wrap">
        <table class="lr-table">
          <thead><tr>

            ${_lrTh('incurred_claims', 'Incurred', 'num')}
            ${_lrTh('loading_pct', 'Loading', 'num')}
            ${_lrTh('gross_premium', 'Gross prem.', 'num')}

          </tr></thead>

          ${t ? `<tfoot><tr>
            <td class="lbl">Book total &middot; ${t.account_count} accounts &middot; ${t.member_count.toLocaleString()} lives</td>

            <td class="num">${_lrMoney(t.earned_premium)}</td>
            <td class="num">${_lrMoney(t.net_premium)}</td>
            <td class="num">${_lrPct(t.gross_loss_ratio)}</td>
            <td class="num">${_lrPct(t.net_loss_ratio)}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>
  `;
}

// Built from the rows the board itself just loaded (unfiltered on first
// load), so every option is a value the book actually has - and the
// selected one survives a refilter, since filtering by account naturally
// removes every other option from the response.
function _lrFillPickers() {
  const clientSel = document.getElementById('lr-client');
  const yearSel = document.getElementById('lr-year');
  if (!clientSel || !yearSel || clientSel.dataset.filled) return;
  const clients = Array.from(new Set(lrState.rows.map(r => r.master_client))).sort();
  const years = Array.from(new Set(lrState.rows.map(r => (r.policy_start_date || '').slice(0, 4)).filter(Boolean))).sort();
  clientSel.insertAdjacentHTML('beforeend', clients.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join(''));
  yearSel.insertAdjacentHTML('beforeend', years.map(y => `<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join(''));
  clientSel.dataset.filled = '1';
}

async function loadLossRatioBoard() {
  const bannerArea = document.getElementById('lr-banner-area');
  const tableArea = document.getElementById('lr-table-area');
  if (!tableArea) return;
  const asOfEl = document.getElementById('lr-as-of');
  const loadEl = document.getElementById('lr-loading');
  const clientEl = document.getElementById('lr-client');
  const yearEl = document.getElementById('lr-year');
  const params = new URLSearchParams();
  if (asOfEl && asOfEl.value) params.set('as_of', asOfEl.value);
  if (loadEl && loadEl.value) params.set('default_loading_pct', String(Number(loadEl.value) / 100));
  if (clientEl && clientEl.value) params.set('master_client', clientEl.value);
  if (yearEl && yearEl.value) params.set('policy_year', yearEl.value);
  const basisEl = document.getElementById('lr-basis');
  if (basisEl && basisEl.value) params.set('premium_basis', basisEl.value);
  lrState.basis = (basisEl && basisEl.value) || 'actual';
  const ybEl = document.getElementById('lr-year-basis');
  if (ybEl && ybEl.value) params.set('year_basis', ybEl.value);
  lrState.yearBasis = (ybEl && ybEl.value) || 'underwriting';
  // Same control, different question depending on the basis - say which.
  const ylab = document.getElementById('lr-year-label');
  if (ylab) ylab.textContent = lrState.yearBasis === 'calendar' ? 'Calendar year' : 'Policy year';
  lrState.client = (clientEl && clientEl.value) || '';
  lrState.year = (yearEl && yearEl.value) || '';
  tableArea.innerHTML = '<div class="lr-card"><div class="lr-empty">Loading&hellip;</div></div>';
  try {
    const r = await api(`/portfolio-analysis/account-loss-ratio?${params.toString()}`);
    lrState.rows = r.rows || [];
    lrState.totals = r.totals || null;
    if (asOfEl && !asOfEl.value && lrState.rows.length) {
      // Surface whichever report date the server actually used, so the
      // field never sits blank while the figures below already depend on one.
      asOfEl.value = r.as_of || '';
    }
    bannerArea.innerHTML = _lrBannerHtml(lrState.totals);
    tableArea.innerHTML = _lrTableHtml();
  } catch (err) {
    bannerArea.innerHTML = '';
    tableArea.innerHTML = `<div class="lr-card"><div class="lr-empty">${escapeHtml(err.message || 'Could not load the loss ratio board')}</div></div>`;
  }
}

function lrDownloadCsv() {
  const cols = ['master_client','policy_start_date','days','expired','member_count','claim_count','paid','outstanding','ibnr','incurred_claims','loading_pct','gross_premium','earned_premium','net_premium','gross_loss_ratio','net_loss_ratio'];
  const esc = v => {
    const str = v == null ? '' : String(v);
    return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
  };
  const lines = [cols.join(',')].concat(_lrSortRows(lrState.rows).map(r => cols.map(c => esc(r[c])).join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `portfolio-loss-ratio-${lrState.asOf || 'export'}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


function printLossRatioReport() {
  if (!lrState.rows.length) { toast('Nothing to print yet - load the loss ratio board first', true); return; }
  const t = lrState.totals;
  const rows = _lrSortRows(lrState.rows);
  const asOf = (document.getElementById('lr-as-of') || {}).value || lrState.asOf || '';
  const calendar = lrState.yearBasis === 'calendar';
  const yearSel = (document.getElementById('lr-year') || {}).value || '';
  const acctSel = (document.getElementById('lr-client') || {}).value || '';

  const basisLabel = calendar ? 'Calendar year' : 'Underwriting year';
  const premLabel = lrState.basis === 'booked' ? 'Booked gross premium' : 'Actual gross premium';
  const period = yearSel ? (calendar ? `Calendar year ${yearSel}` : `Policy year ${yearSel}`) : 'All periods';

  // Distribution of accounts by net loss ratio - the shape of the book a
  // reinsurer reads first, before any individual account.
  const bands = [
    { label: 'Under 70%', test: r => r.net_loss_ratio != null && r.net_loss_ratio < 0.7 },
    { label: '70% - 100%', test: r => r.net_loss_ratio != null && r.net_loss_ratio >= 0.7 && r.net_loss_ratio <= 1 },
    { label: '100% - 150%', test: r => r.net_loss_ratio != null && r.net_loss_ratio > 1 && r.net_loss_ratio <= 1.5 },
    { label: 'Over 150%', test: r => r.net_loss_ratio != null && r.net_loss_ratio > 1.5 },
    // An account with no earned premium has no ratio to band, but it can
    // still carry real claims. Left implicit those claims would vanish
    // from this table while remaining in the portfolio total below it -
    // an external reader would find the two irreconcilable.
    { label: 'Not rated (no earned premium)', test: r => r.net_loss_ratio == null },
  ].map(b => {
    const sel = rows.filter(b.test);
    return {
      label: b.label,
      count: sel.length,
      earned: sel.reduce((a, r) => a + (r.earned_premium || 0), 0),
      incurred: sel.reduce((a, r) => a + (r.incurred_claims || 0), 0),

    </tr>`).join('');

  const generated = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

/* ---------------- Nationality risk (credibility-weighted) ------------- */

let natState = { rows: [], meta: null };

function _natBar(credibility) {
  // Credibility is the whole point of this table - shown as a bar rather
  // than a bare percentage so a thin nationality is obvious at a glance.
  const pct = Math.round((credibility || 0) * 100);
  const color = pct >= 90 ? 'var(--lr-good)' : pct >= 50 ? 'var(--lr-warn)' : 'var(--lr-bad)';
  return `<div style="display:flex; align-items:center; gap:7px; justify-content:flex-end;">
      <div class="lr-bar" style="min-width:52px;"><span style="width:${pct}%; background:${color};"></span></div>
      <span style="font-family:var(--font-mono); font-size:11px; min-width:32px;">${pct}%</span>
    </div>`;
}

function _natFactorChip(f) {
  if (f == null) return '-';
  const band = f > 1.15 ? 'bad' : f < 0.9 ? 'good' : 'warn';
  return `<span class="lr-chip ${band}">${f.toFixed(2)}&times;</span>`;
}

function _natTableHtml() {
  const rows = natState.rows;
  if (!rows.length) {
    return '<div class="lr-card"><div class="lr-empty">No nationality data yet - upload the Membership and Claims exports on the Claims Explorer screen first.</div></div>';
  }
  const body = rows.map(r => `
    <tr style="${r.pricing_ready ? '' : 'opacity:0.62;'}">
      <td style="font-weight:600;">${escapeHtml(r.nationality)}${r.pricing_ready ? '' : '<span class="lr-exp" style="margin-left:6px;">building</span>'}<span class="yr" style="display:block; font-size:10.5px; color:var(--lr-muted); font-weight:500;">${escapeHtml((r.nationality_zone || '-').replace(/^zone_\d_/, '').replace(/_/g, ' '))} &middot; ${r.member_count.toLocaleString()} members</span></td>
      <td class="num">${r.earned_member_years.toLocaleString(undefined, {maximumFractionDigits: 1})}</td>
      <td class="num">${r.burning_cost != null ? Math.round(r.burning_cost).toLocaleString() : '-'}</td>
      <td class="num" style="color:var(--lr-muted);">${r.zone_burning_cost != null ? Math.round(r.zone_burning_cost).toLocaleString() : '-'}</td>
      <td class="num">${_natBar(r.credibility)}</td>
      <td class="num" style="font-weight:600;">${r.credible_burning_cost != null ? Math.round(r.credible_burning_cost).toLocaleString() : '-'}</td>
      <td class="num">${r.pricing_ready ? _natFactorChip(r.relativity) : `<span style="color:var(--lr-muted); font-family:var(--font-mono); font-size:11px;">${r.relativity != null ? r.relativity.toFixed(2) + '&times;' : '-'}</span>`}</td>
      <td class="num" style="color:var(--lr-muted);">${r.avg_age != null ? r.avg_age.toFixed(0) : '-'}</td>
      <td class="num" style="color:var(--lr-muted);">${r.female_pct != null ? r.female_pct.toFixed(0) + '%' : '-'}</td>
      <td class="num" style="color:var(--lr-muted);">${r.member_years_to_full_credibility > 0 ? '+' + r.member_years_to_full_credibility.toFixed(0) + ' yrs' : 'reached'}</td>
    </tr>
  `).join('');
  return `
    <div class="lr-card">
      <div class="lr-card-head">
        <div>
          <div class="lr-card-title">Burning cost by nationality</div>
          <div class="lr-card-note">Sorted by rating factor, most expensive first. Raw = the nationality's own experience; Credible = blended toward its zone by how much exposure stands behind it.</div>
        </div>
        <div class="lr-card-note">Full credibility at ${natState.meta ? natState.meta.full_credibility_member_years : 100} member-years</div>
      </div>
      <div class="lr-table-wrap">
        <table class="lr-table">
          <thead><tr>
            <th>Nationality</th>
            <th class="num">Exposure (yrs)</th>
            <th class="num">Raw BC</th>
            <th class="num">Zone BC</th>
            <th class="num">Credibility</th>
            <th class="num">Credible BC</th>
            <th class="num">Factor</th>
            <th class="num">Avg age</th>
            <th class="num">Female</th>
            <th class="num">To full cred.</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
  `;
}

function nationalityRiskHtml() {
  return `
    <div class="lr-scope">
      <div class="lr-head">
        <div>
          <h2 class="lr-title">Nationality Risk</h2>
          <p class="lr-sub">What each nationality actually costs per member-year on the booked book, blended toward its zone by the exposure behind it - so a thin population inherits the zone rate rather than pricing off a handful of claims. Age and gender mix are shown alongside, because a nationality that looks expensive may simply be an older or more female population.</p>

        <button class="lr-btn" onclick="printNationalityRisk()">Print / Save as PDF</button>

async function showNationalityRisk() {
  currentCase = null;
  await loadCases();
  document.getElementById('main').innerHTML = nationalityRiskHtml();
  await loadNationalityRisk();
}

async function loadNationalityRisk() {
  const tableArea = document.getElementById('nat-table-area');
  const summaryArea = document.getElementById('nat-summary-area');
  if (!tableArea) return;
  const params = new URLSearchParams();
  const full = document.getElementById('nat-full-cred');
  const lo = document.getElementById('nat-min-rel');
  const hi = document.getElementById('nat-max-rel');
  if (full && full.value) params.set('full_credibility_member_years', full.value);
  if (lo && lo.value) params.set('min_relativity', lo.value);
  if (hi && hi.value) params.set('max_relativity', hi.value);
  const pc = document.getElementById('nat-pricing-cred');
  if (pc && pc.value) params.set('pricing_credibility', pc.value);
  tableArea.innerHTML = '<div class="lr-card"><div class="lr-empty">Loading&hellip;</div></div>';
  try {
    const r = await api(`/portfolio-analysis/nationality-risk?${params.toString()}`);
    const readyOnly = document.getElementById('nat-ready-only');
    natState.rows = (readyOnly && readyOnly.checked)
      ? (r.rows || []).filter(x => x.pricing_ready)
      : (r.rows || []);
    natState.meta = r;
    summaryArea.innerHTML = `
      <div class="lr-banner">
        <div class="lr-banner-grid">
          <div class="lr-b-item hero"><div class="k">Ready to price on</div><div class="v">${r.pricing_ready_count}<small> / ${r.nationality_count}</small></div></div>
          <div class="lr-b-item hero"><div class="k">Fully credible</div><div class="v">${r.fully_credible_count}<small> / ${r.nationality_count}</small></div></div>
          <div class="lr-b-item"><div class="k">Still building</div><div class="v">${r.nationality_count - r.pricing_ready_count}</div></div>
        </div>
      </div>
    `;
    tableArea.innerHTML = _natTableHtml();
  } catch (err) {
    summaryArea.innerHTML = '';
    tableArea.innerHTML = `<div class="lr-card"><div class="lr-empty">${escapeHtml(err.message || 'Could not load nationality risk')}</div></div>`;
  }
}

function printNationalityRisk() {
  if (!natState.rows.length) { toast('Nothing to print yet', true); return; }
  const rows = natState.rows.map(r => `
    <tr>
      <td>${escapeHtml(r.nationality)}<br><span class="sub">${escapeHtml((r.nationality_zone || '-').replace(/^zone_\d_/, '').replace(/_/g, ' '))} &middot; ${r.member_count} members</span></td>
      <td class="num">${r.earned_member_years.toFixed(1)}</td>
      <td class="num">${r.burning_cost != null ? Math.round(r.burning_cost).toLocaleString() : '-'}</td>
      <td class="num">${r.zone_burning_cost != null ? Math.round(r.zone_burning_cost).toLocaleString() : '-'}</td>
      <td class="num">${(r.credibility * 100).toFixed(0)}%</td>
      <td class="num b">${r.credible_burning_cost != null ? Math.round(r.credible_burning_cost).toLocaleString() : '-'}</td>
      <td class="num b">${r.relativity != null ? r.relativity.toFixed(2) + '×' : '-'}</td>
      <td class="num">${r.avg_age != null ? r.avg_age.toFixed(0) : '-'}</td>
      <td class="num">${r.female_pct != null ? r.female_pct.toFixed(0) + '%' : '-'}</td>
    </tr>`).join('');
  const html = `<!doctype html>
<html><head><meta charset="utf-8"><title>Nationality Risk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'IBM Plex Sans', sans-serif; margin: 0; padding: 26px 20px; color: #0f1c2e; font-variant-numeric: tabular-nums; }
  .sheet { max-width: 980px; margin: 0 auto; }
  .brand { font-family: 'Fraunces', serif; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #1c2a48; }

  .meta { font-size: 11.5px; color: #64748b; border-bottom: 2.5px solid #1c2a48; padding-bottom: 13px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  th { text-align: left; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #475569; padding: 7px; background: #eef3f7; border-bottom: 1.5px solid rgba(15,28,46,0.24); }
  td { padding: 6px 7px; border-bottom: 1px solid rgba(15,28,46,0.09); vertical-align: top; }

  td.b { font-weight: 700; }
  .sub { font-size: 9px; color: #94a3b8; }

  <div class="brand">HealthCross &middot; Underwriting Intelligence</div>

  <div class="meta">${natState.meta.nationality_count} nationalities &middot; ${natState.meta.fully_credible_count} fully credible &middot; full credibility at ${natState.meta.full_credibility_member_years} member-years &middot; generated ${new Date().toLocaleDateString()}</div>
  <table>
    <thead><tr><th>Nationality</th><th class="num">Exposure (yrs)</th><th class="num">Raw BC</th><th class="num">Zone BC</th><th class="num">Credibility</th><th class="num">Credible BC</th><th class="num">Factor</th><th class="num">Avg age</th><th class="num">Female</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="method">
    <b>Method.</b> Burning cost is incurred claims (paid + outstanding + IBNR) divided by earned member-years.
    <b>Credibility</b> follows the square-root rule: a nationality earns full weight on its own experience only at the full-credibility standard above, and below it the rate blends toward its own zone's rate - so a nationality with little exposure inherits the zone rather than pricing off a handful of claims.
    <b>Factor</b> is the credible rate over the book rate, capped in both directions, since even after weighting a segment holding one catastrophic claim can produce a multiplier that is correct arithmetic and indefensible as a price.
    <b>Avg age and female share</b> are shown because nationality correlates with age, role and gender mix - a nationality that looks expensive may simply be an older or more female population, and that should be ruled out before the factor is trusted.
  </div>
</div><script>window.onload = () => window.print();<\/script></body></html>`;
  const win = window.open('', '_blank');
  win.document.write(html);

}

async function computeScore() {
  const premiumInput = document.getElementById('estimated-premium').value;
  try {
    const payload = { estimated_annual_premium: premiumInput ? Number(premiumInput) : null };
    await api(`/cases/${currentCase.id}/score`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    toast('Scorecard computed');
    await loadLatestScorecard();
  } catch (err) {
    toast(err.message, true);
  }
}

        <table>

          <tr><th>Male ratio (employees)</th><td>${(sc.details.demographic.male_ratio_employees*100).toFixed(1)}%</td></tr>

          <tr><th>Infant count</th><td>${sc.details.demographic.infant_count}</td></tr>
          <tr><th>Group size (employees)</th><td>${sc.details.demographic.group_size}</td></tr>

function scorecardWeightsUsedHtml(sc) {
  const used = sc.details.weights_used;
  if (!used) return '';
  const noClaims = used.claims_experience === 0;
  return `
    <div class="hint" style="margin-top:10px;">
      Weights used: Demographic ${(used.demographic * 100).toFixed(1)}% &middot;
      Claims exp. ${(used.claims_experience * 100).toFixed(1)}% &middot;
      Benefit richness ${(used.benefit_richness * 100).toFixed(1)}% &middot;
      Industry ${(used.industry * 100).toFixed(1)}%
      ${noClaims ? '<span class="tier-pill dir-review" style="margin-left:6px;">No claims - reweighted</span>' : ''}
    </div>
  `;
}

function scorecardPortfolioReferenceHtml(sc) {
  const ref = sc.details.portfolio_reference;
  if (!ref) return '';

  const bc = ref.burning_cost;
  let burningCostHtml = '<div class="hint">No burning cost data available yet.</div>';
  if (bc && bc.basis === 'network') {
    burningCostHtml = bc.rows.map(r => `
      <div class="hint" style="margin:2px 0;">
        <strong>${escapeHtml(r.network)}</strong>: AED ${r.burning_cost.toLocaleString()} per member per year
        (${r.member_count.toLocaleString()} members, ${r.earned_member_years.toLocaleString()} earned member-years)
      </div>
    `).join('');
  } else if (bc && bc.basis === 'whole_book' && bc.burning_cost != null) {
    burningCostHtml = `
      <div class="hint">
        Whole-book average (no matching HealthCross quote network found): AED ${bc.burning_cost.toLocaleString()} per member per year
        (${bc.member_count.toLocaleString()} members, ${bc.earned_member_years.toLocaleString()} earned member-years)
      </div>
    `;
  }

  const mix = ref.population_mix;
  const mixHtml = mix ? `
    <div class="hint" style="margin-top:6px;">
      Book population: avg age ${mix.avg_age ?? '-'} &middot;
      ${Object.entries(mix.nationality_zone_mix).map(([z, pct]) => `${escapeHtml(z)} ${(pct * 100).toFixed(0)}%`).join(', ')} &middot;
      ${Object.entries(mix.gender_mix).map(([g, pct]) => `${escapeHtml(g)} ${(pct * 100).toFixed(0)}%`).join(', ')}
    </div>
  ` : '';

  return `
    <div class="card">
      <h3>Portfolio Analysis reference</h3>
      <div class="hint">HealthCross's own already-booked book, shown for context only - not used in the score above.</div>
      ${burningCostHtml}
      ${mixHtml}
    </div>
  `;
}

async function recordOutcome(event) {
  event.preventDefault();
  const form = new FormData(event.target);
  const payload = {
    bound: form.get('bound') === 'true',
    final_premium: form.get('final_premium') ? Number(form.get('final_premium')) : null,
    actual_loss_ratio: form.get('actual_loss_ratio') ? Number(form.get('actual_loss_ratio')) : null,

  try {
    await api(`/cases/${currentCase.id}/outcome`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    toast('Outcome recorded');
  } catch (err) {
    toast(err.message, true);
  }
}

/* ---------------- New Business rate-card quoting ---------------- */

let nbRateCardOptions = null;
let nbCategories = [];
let nbLastQuote = null;

const NB_OPPORTUNITY_CLASS = { Good: 'tier-Preferred', Marginal: 'tier-Substandard', Poor: 'tier-DeclineRefer', Unknown: 'tier-Standard' };

async function loadNewBusinessRating() {
  const area = document.getElementById('new-business-rating-area');
  try {
    nbRateCardOptions = await api('/new-business/rate-card-options');
  } catch (err) {
    nbRateCardOptions = null;
  }

  // Book's own real claims experience by Product/Network, if HealthCross's
  // Portfolio Analysis book (Members + Claims + rate card) has been
  // uploaded - a reference figure shown alongside the rate card's own
  // price, not something that changes the quote itself. Silently empty
  // (rather than an error) when that book hasn't been uploaded, since
  // it's optional context for this page, not a requirement of it.
  nbBurningCostByProductNetwork = {};
  try {
    const rows = await api('/portfolio-analysis/burning-cost-by-product-network');
    rows.forEach(r => { nbBurningCostByProductNetwork[`${r.product}|${r.network}`] = r; });
  } catch (err) { /* Portfolio Analysis book not uploaded - no reference figures */ }

  let censusCategories = { categories: [], uncategorized_member_count: 0 };
  try {
    censusCategories = await api(`/cases/${currentCase.id}/census-categories`);
  } catch (err) { /* no census yet */ }

  try {
    nbLastQuote = await api(`/cases/${currentCase.id}/new-business-quote`);
  } catch (err) {
    nbLastQuote = null;
  }
  try {
    nbQuoteByTier = nbLastQuote ? await api(`/cases/${currentCase.id}/new-business-quote/by-tier`) : null;
  } catch (err) {
    nbQuoteByTier = null;
  }
  try {
    nbBurningCostComparison = nbLastQuote ? await api(`/cases/${currentCase.id}/new-business-quote/burning-cost-comparison`) : null;
  } catch (err) {
    nbBurningCostComparison = null;
  }
  nbSelectedTierProduct = null;

  const priorByCategory = {};
  if (nbLastQuote) {
    (nbLastQuote.categories || []).forEach(c => { priorByCategory[_normalizeCategory(c.category)] = c; });
  }

  // Each category's own Product/Network/TPA pick lives on its Benefits tab
  // card (BenefitPlan.nb_product/nb_network/nb_tpa) - the source of truth
  // this pre-fills from, since a case's categories commonly price against
  // different networks rather than sharing one value.
  const benefitsByCategory = {};
  try {
    const plans = await api(`/cases/${currentCase.id}/benefit-plans`);
    plans.filter(p => p.role === 'existing' && p.category).forEach(p => { benefitsByCategory[_normalizeCategory(p.category)] = p; });
  } catch (err) { /* no benefits uploaded yet */ }

  nbSuggestedProduct = censusCategories.suggested_product || null;

  nbCategories = censusCategories.categories.map(c => {
    const prior = priorByCategory[_normalizeCategory(c.category)];
    const benefitPlan = benefitsByCategory[_normalizeCategory(c.category)];
    return {
      category: c.category,
      member_count: c.member_count,
      product: (benefitPlan && benefitPlan.nb_product) || (prior ? prior.product : ''),
      network: (benefitPlan && benefitPlan.nb_network) || (prior ? prior.network : ''),
      tpa: (benefitPlan && benefitPlan.nb_tpa) || (prior ? prior.tpa : ''),
      commission_pct: prior && prior.commission_pct != null ? prior.commission_pct * 100 : '',
      variant_selections: prior ? { ...(prior.variant_selections || {}) } : {},
      previewRegion: (nbRateCardOptions && nbRateCardOptions.regions[0]) || 'Dubai',
      variantOptions: null,
    };
  });

  nbCensusUncategorized = censusCategories.uncategorized_member_count;
  await Promise.all(nbCategories.map((cat, idx) => cat.network ? nbFetchVariantOptions(idx) : Promise.resolve()));
  await nbRenderArea();

  // Every category already has a Product/Network (prefilled above from the
  // Benefits tab's own nb_product/nb_network, or from the prior quote) -
  // generate the quote straight away rather than making the underwriter
  // click "Compute quote" on data that's already complete. Only on first
  // load without an existing quote - nbComputeQuote() itself is what keeps
  // it fresh after that (see nbSetNetwork/nbSetVariantSelection/
  // nbSetCommission below), so this isn't needed on every tab switch.
  if (!nbLastQuote && _nbReadyToAutoCompute()) {
    await nbComputeQuote();
  }
}

// True once every priced category (i.e. every category the census actually
// has members in) has both a Product and a Network picked - the only two
// fields nbComputeQuote() strictly requires - so a quote can be generated
// with zero clicks the moment there's nothing left unset.
function _nbReadyToAutoCompute() {
  return nbCategories.length > 0 && nbCategories.every(c => c.product && c.network);
}

let nbCensusUncategorized = 0;
let nbSuggestedProduct = null;
let nbBurningCostByProductNetwork = {};

async function nbRenderArea() {
  const area = document.getElementById('new-business-rating-area');
  if (!area) return;

  const uploadCard = `
    <div class="card">
      <h3>Rate card data</h3>
      <div class="hint">Upload HealthCross's own New Business rate card once - every case reuses it. A fresh upload wholesale-replaces the previous one.</div>
      <div class="row" style="align-items:flex-end;">
        <div>
          <label>Product pricing list (Product &times; Region &times; Network &times; age band)</label>
          <input type="file" id="nb-file-pricing" accept=".xlsx">
          <button onclick="nbUploadFile('pricing')">Upload</button>
          <span id="nb-status-pricing" class="status-pending"></span>
        </div>
        <div>
          <label>Benefit variant option list (Annual Limit, Deductible, co-pays, ...)</label>
          <input type="file" id="nb-file-variants" accept=".xlsx">
          <button onclick="nbUploadFile('variants')">Upload</button>
          <span id="nb-status-variants" class="status-pending"></span>
        </div>
      </div>
      ${nbRateCardOptions ? `<div class="hint">Loaded: ${nbRateCardOptions.products.length} products, ${Object.values(nbRateCardOptions.product_networks).reduce((n, arr) => n + arr.length, 0)} product/network combinations, regions: ${nbRateCardOptions.regions.join(', ')}.</div>` : `<div class="hint">No rate card uploaded yet.</div>`}
    </div>
  `;

  if (!nbRateCardOptions || !nbCategories.length) {
    area.innerHTML = uploadCard + (nbCategories.length ? '' : `<div class="card"><div class="hint">${nbCensusUncategorized ? 'Census has no category values set on any member yet - upload a census with a Category column to quote by category.' : 'Upload a census for this case first.'}</div></div>`);
    return;
  }

  const categoryCards = nbCategories.map((cat, idx) => nbCategoryCardHtml(cat, idx)).join('');

  area.innerHTML = `
    ${uploadCard}
    <div class="card">
      <h3>Quote by category</h3>
      <div class="hint">Each category's own Product/Network/TPA is set on its Benefits tab category card - pre-filled here from there. Each category's benefit-variant choices apply to every member in it; HealthCross's own rate card resolves each member's own Region/age/gender automatically.</div>
      ${nbCensusUncategorized ? `<div class="hint">${nbCensusUncategorized} census member(s) have no Category set and won't be priced.</div>` : ''}
    </div>
    ${categoryCards}
    <div class="card">
      <button class="primary" onclick="nbComputeQuote()">Compute quote</button>
    </div>
    <div id="nb-result-area">${nbLastQuote ? nbResultHtml(nbLastQuote) : ''}</div>
  `;
}

function nbCategoryCardHtml(cat, idx) {
  const products = nbRateCardOptions.products;
  const networksForProduct = cat.product ? (nbRateCardOptions.product_networks[cat.product] || []) : [];
  const variantSelects = cat.variantOptions ? Object.keys(cat.variantOptions).sort().map(variantName => {
    const options = cat.variantOptions[variantName];
    const selected = cat.variant_selections[variantName] || '';
    return `
      <div>
        <label>${escapeHtml(variantName)}</label>
        <select onchange="nbSetVariantSelection(${idx}, '${escapeHtml(variantName).replace(/'/g, "\\'")}', this.value)">
          <option value="">Base (included)</option>
          ${options.map(o => `<option value="${escapeHtml(o.option_value)}" ${selected === o.option_value ? 'selected' : ''}>${escapeHtml(o.option_value)}${o.direction !== 'Base' ? ` (${o.direction} ${o.impact_type === 'Percent' ? (o.direction === 'Upgrade' ? '+' : '-') + o.impact_value + '%' : 'AED ' + o.impact_value})` : ''}</option>`).join('')}
        </select>
      </div>
    `;
  }).join('') : '';

  return `
    <div class="card">
      <h3>Category ${escapeHtml(cat.category)} <span style="color:var(--ink-muted); font-weight:400;">(${cat.member_count} members)</span></h3>
      ${nbSuggestedProduct ? `<div class="hint">Suggested starting Product based on the case's existing insurer: <strong>${escapeHtml(nbSuggestedProduct)}</strong> - the tier ladder below also shows one tier above and below whatever's picked.</div>` : ''}
      <div class="row" style="align-items:flex-end;">
        <div>
          <label>Product</label>
          <select onchange="nbSetProduct(${idx}, this.value)">
            <option value="">Select product</option>
            ${products.map(p => `<option value="${escapeHtml(p)}" ${cat.product === p ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Network</label>
          <select onchange="nbSetNetwork(${idx}, this.value)" ${!cat.product ? 'disabled' : ''}>
            <option value="">Select network</option>
            ${networksForProduct.map(n => `<option value="${escapeHtml(n.network)}|${escapeHtml(n.tpa)}" ${cat.network === n.network ? 'selected' : ''}>${escapeHtml(n.network)} (${escapeHtml(n.tpa)})</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Commission % (optional, default 10%)</label>
          <input type="number" step="0.1" value="${cat.commission_pct}" onchange="nbSetCommission(${idx}, this.value)">
        </div>
        <div>
          <label>Preview variant options for region</label>
          <select onchange="nbSetPreviewRegion(${idx}, this.value)">
            ${(nbRateCardOptions.regions || []).map(r => `<option value="${escapeHtml(r)}" ${cat.previewRegion === r ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${variantSelects ? `<div class="row" style="flex-wrap:wrap; margin-top:8px;">${variantSelects}</div>` : (cat.network ? '<div class="hint">No priced variants found for this Region/TPA/Network combination.</div>' : '')}
      ${nbBurningCostReferenceHtml(cat)}
    </div>
  `;
}

function nbBurningCostReferenceHtml(cat) {
  if (!cat.product || !cat.network) return '';
  const ref = nbBurningCostByProductNetwork[`${cat.product}|${cat.network}`];
  if (!ref || ref.burning_cost == null) return '';
  return `
    <div class="hint" style="margin-top:8px;">
      <span class="tier-pill dir-review" style="margin-right:6px;">Book reference</span>
      HealthCross's own already-booked members on ${escapeHtml(cat.product)} / ${escapeHtml(cat.network)}
      run an actual burning cost of <strong>AED ${ref.burning_cost.toLocaleString()}</strong> per member per year
      (${ref.member_count.toLocaleString()} members, ${ref.earned_member_years.toLocaleString()} earned member-years) -
      from Portfolio Analysis, for comparison against this quote's rated price, not a substitute for it.
    </div>
  `;
}

function nbSetProduct(idx, product) {
  nbCategories[idx].product = product;
  nbCategories[idx].network = '';
  nbCategories[idx].tpa = '';
  nbCategories[idx].variantOptions = null;
  // variant_selections deliberately kept, not reset - a selection that no
  // longer has a matching priced option under the new Product/Network
  // simply isn't applied (see price_member's own fallback-to-base
  // behavior, which already warns rather than erroring), so there's no
  // correctness risk in preserving picks that do still carry over.
  nbRenderArea();
}

async function nbSetNetwork(idx, value) {
  if (!value) { nbCategories[idx].network = ''; nbCategories[idx].tpa = ''; nbCategories[idx].variantOptions = null; nbRenderArea(); return; }
  const [network, tpa] = value.split('|');
  nbCategories[idx].network = network;
  nbCategories[idx].tpa = tpa;
  await nbFetchVariantOptions(idx);
  await nbRenderArea();
  // The Network picker is normally the last thing an underwriter sets per
  // category (Product comes first) - so this is usually the exact moment
  // every category becomes ready, and the quote should appear without a
  // separate "Compute quote" click.
  if (_nbReadyToAutoCompute()) await nbComputeQuote();
}

async function nbSetPreviewRegion(idx, region) {
  nbCategories[idx].previewRegion = region;
  await nbFetchVariantOptions(idx);
  nbRenderArea();
}

async function nbFetchVariantOptions(idx) {
  const cat = nbCategories[idx];
  if (!cat.network) return;
  try {
    cat.variantOptions = await api(`/new-business/variant-options?region=${encodeURIComponent(cat.previewRegion)}&tpa=${encodeURIComponent(cat.tpa)}&network=${encodeURIComponent(cat.network)}`);
  } catch (err) {
    cat.variantOptions = {};
  }
}

async function nbSetVariantSelection(idx, variantName, value) {
  if (value) {
    nbCategories[idx].variant_selections[variantName] = value;
  } else {
    delete nbCategories[idx].variant_selections[variantName];
  }
  if (_nbReadyToAutoCompute()) await nbComputeQuote();
}

async function nbSetCommission(idx, value) {
  nbCategories[idx].commission_pct = value;
  if (_nbReadyToAutoCompute()) await nbComputeQuote();
}

async function nbUploadFile(kind) {
  const input = document.getElementById(kind === 'pricing' ? 'nb-file-pricing' : 'nb-file-variants');
  const statusEl = document.getElementById(kind === 'pricing' ? 'nb-status-pricing' : 'nb-status-variants');
  if (!input.files.length) { toast('Choose a file first', true); return; }
  const form = new FormData();
  form.append('file', input.files[0]);
  const path = kind === 'pricing' ? '/admin/rate-cards/upload' : '/admin/benefit-variant-rates/upload';
  try {
    const result = await api(path, { method: 'POST', body: form });
    statusEl.textContent = `${result.rows_ingested} rows`;
    toast('Rate card uploaded');
    await loadNewBusinessRating();
  } catch (err) {
    toast(err.message, true);
  }
}

async function nbComputeQuote() {
  const categories = nbCategories.filter(c => c.product && c.network).map(c => ({
    category: c.category,
    product: c.product,
    network: c.network,
    tpa: c.tpa,
    commission_pct: c.commission_pct !== '' && c.commission_pct != null ? Number(c.commission_pct) / 100 : null,
    variant_selections: c.variant_selections,
  }));
  if (!categories.length) { toast('Pick a Product and Network for at least one category', true); return; }

  try {
    const quote = await api(`/cases/${currentCase.id}/new-business-quote`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ categories }),
    });
    nbLastQuote = quote;
    nbSelectedTierProduct = null; // reset to this fresh quote's own picks, not a stale what-if selection
    try {
      nbQuoteByTier = await api(`/cases/${currentCase.id}/new-business-quote/by-tier`);
    } catch (err) {
      nbQuoteByTier = null;
    }
    try {
      nbBurningCostComparison = await api(`/cases/${currentCase.id}/new-business-quote/burning-cost-comparison`);
    } catch (err) {
      nbBurningCostComparison = null;
    }
    document.getElementById('nb-result-area').innerHTML = nbResultHtml(quote);
    toast('Quote computed');
  } catch (err) {
    toast(err.message, true);
  }
}

function _nbCategoryTableHtml(categories) {
  const warnings = [];
  categories.forEach(c => (c.warnings || []).forEach(w => warnings.push(`Category ${c.category}: ${w}`)));
  const totalMembers = categories.reduce((sum, c) => sum + c.member_count, 0);
  const totalNet = categories.reduce((sum, c) => sum + c.net_annual_premium, 0);
  const totalGross = categories.reduce((sum, c) => sum + c.gross_annual_premium, 0);
  const avgGrossPerMember = totalMembers ? totalGross / totalMembers : null;
  return `
    <table>
      <tr><th>Category</th><th>Product</th><th>Network</th><th>Members</th><th>Net premium</th><th>Loading %</th><th>Gross premium</th><th>Gross / member</th></tr>
      ${categories.map(c => `
        <tr>
          <td>${escapeHtml(c.category)}</td>
          <td>${escapeHtml(c.product)}</td>
          <td>${escapeHtml(c.network)}</td>
          <td>${c.member_count}</td>
          <td>${c.net_annual_premium.toLocaleString()}</td>
          <td>${(c.loading_pct * 100).toFixed(1)}%</td>
          <td>${c.gross_annual_premium.toLocaleString()}</td>
          <td>${c.member_count ? (c.gross_annual_premium / c.member_count).toLocaleString(undefined, {maximumFractionDigits: 2}) : '-'}</td>
        </tr>
      `).join('')}
      <tr style="font-weight:600; border-top:2px solid var(--border);">
        <th>Total / Average</th><th></th><th></th>
        <th>${totalMembers}</th>
        <th>${totalNet.toLocaleString(undefined, {maximumFractionDigits: 2})}</th>
        <th></th>
        <th>${totalGross.toLocaleString(undefined, {maximumFractionDigits: 2})}</th>
        <th>${avgGrossPerMember != null ? avgGrossPerMember.toLocaleString(undefined, {maximumFractionDigits: 2}) : '-'}</th>
      </tr>
    </table>
    ${warnings.length ? `<div class="hint" style="margin-top:10px;">${warnings.map(escapeHtml).join('<br>')}</div>` : ''}
  `;
}

function nbSelectTier(product) {
  nbSelectedTierProduct = product;
  nbRenderArea();
}

function _nbTierIconRowHtml(quote) {
  if (!nbQuoteByTier || !nbQuoteByTier.length) return '';
  const currentProducts = new Set(quote.result.categories.map(c => c.product));
  const defaultSelected = currentProducts.size === 1 ? [...currentProducts][0] : null;
  const selected = nbSelectedTierProduct || defaultSelected;

          ${t.case_gross_annual_premium != null ? `onclick="nbSelectTier('${t.product}')"` : 'disabled'}
        >

          ${t.product === selected ? '<div style="display:inline-block; margin-top:6px; font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--good-bg); color:var(--good); font-weight:700;">Current</div>' : ''}
        </button>
      `).join('')}
