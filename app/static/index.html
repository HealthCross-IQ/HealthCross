// Fills each census member's existing annual rate from the book,
// matching on beneficiary ID. Only fills what is missing, so a rate an
// underwriter typed is never overwritten and running it twice is a
// no-op - re-seeding the census would fill the rates too, and throw
// away every other edit made since.
async function fillMemberRatesFromBook() {
  if (!currentCase) return;
  try {
    const r = await api(`/cases/${currentCase.id}/member-rates/from-book`, { method: 'POST' });
    const parts = [`${r.filled_from_book} member(s) rated from the book`];
    if (r.already_rated) parts.push(`${r.already_rated} already had a rate`);
    if (r.unmatched_count) parts.push(`${r.unmatched_count} not found on the book`);
    toast(parts.join('; '), r.filled_from_book === 0);
    await loadRenewalBenchSummary();
    await loadRenewalScenarios();
    await loadRenewalOptions();
    await loadClaimsDevelopment();
  } catch (err) {
    toast(err.message || 'Could not fill rates from the book', true);
  }
}

function _rbExistingPremiumHtml(existing) {

          // Nought rated members means the total is UNKNOWN, not nil, and

          existing.rated_members
            ? `AED ${Math.round(existing.total_existing_premium).toLocaleString()}`
            : 'Not known',
          existing.rated_members

            : `none of ${existing.total_members} members carries a rate`)}
        ${_rbKpi('On case record', existing.current_annual_premium_on_case != null ? `AED ${Math.round(existing.current_annual_premium_on_case).toLocaleString()}` : 'Not set', 'current_annual_premium')}
      </div>

const RB_DONUT_COLORS = ['var(--rb-accent)', 'var(--rb-secondary)', 'var(--rb-good)', 'var(--rb-warning)', 'var(--rb-critical)'];

function _rbDonutHtml(breakdown) {
  if (!breakdown || !breakdown.length) return '<div class="rb-card"><div class="rb-card-title">Claims cost breakdown</div><div class="rb-card-sub">No claims ledger data to break down yet.</div></div>';
  const total = breakdown.reduce((sum, b) => sum + (b.total_value || 0), 0);
  let cursor = 0;
  const stops = breakdown.map((b, i) => {
    const start = cursor;
    const pct = total ? b.total_value / total * 100 : 0;
    cursor += pct;
    return `${RB_DONUT_COLORS[i % RB_DONUT_COLORS.length]} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
  }).join(', ');
  const legend = breakdown.map((b, i) => `
    <div class="rb-legend-row">
      <div class="rb-legend-dot" style="background:${RB_DONUT_COLORS[i % RB_DONUT_COLORS.length]};"></div>
      <div>${escapeHtml(b.encounter_type)} &middot; ${b.pct_of_total != null ? b.pct_of_total.toFixed(1) : '0'}%</div>
      <b>AED ${Math.round(b.total_value).toLocaleString()}</b>
    </div>
  `).join('');
  return `
    <div class="rb-card">
      <div class="rb-card-title">Claims cost breakdown</div>
      <div class="rb-card-sub">Incurred claims by encounter type, this case's own claims ledger.</div>
      <div class="rb-donut-wrap">
        <div style="width:120px; height:120px; border-radius:50%; background:conic-gradient(${stops}); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <div style="width:70px; height:70px; border-radius:50%; background:var(--rb-surface); display:flex; flex-direction:column; align-items:center; justify-content:center;" class="rb-donut-center">
            <div class="amt">AED ${total >= 1000000 ? (total/1000000).toFixed(2)+'M' : Math.round(total).toLocaleString()}</div>
            <div class="lbl">Incurred</div>
          </div>
        </div>
        <div class="rb-legend">${legend}</div>
      </div>
    </div>
  `;
}

/* ---------------- the five steps ----------------

   The bench is thirteen panels in one scroll, and nothing on it said
   what was still missing - so the way to discover an account could not
   be priced was to scroll to the pricing card and read that the price
   had been withheld.

   Every state here is computed server-side from facts the rest of the
   page already established (renewal_workflow), never from a checkbox.
   The bar cannot report a renewal as ready that the pricing endpoint
   would refuse. */
const _RB_STEP_ICON = { done: '&check;', blocked: '!', todo: null };

function _rbWorkflowHtml(steps, state) {
  if (!steps || !steps.length) return '';
  const cells = steps.map((s, i) => {
    const icon = _RB_STEP_ICON[s.state] || String(i + 1);
    const current = state && state.current_step === s.key ? ' current' : '';
    const title = s.blocker ? ` title="${escapeHtml(s.blocker)}"` : '';
    return `
      <button type="button" class="rb-step ${escapeHtml(s.state)}${current}" data-rb-step-key="${escapeHtml(s.key)}"${title}
              onclick="rbSelectStep('${escapeHtml(s.key)}', '${escapeHtml(s.anchor)}')">
        <div class="n">${icon}</div>
        <div class="x">
          <div class="k">Step ${i + 1}</div>
          <div class="v">${escapeHtml(s.label)}</div>
          <div class="d">${s.detail || ''}</div>
        </div>
      </button>`;
  }).join('');

  // The blocker is repeated in full above the fold. A step cell can only
  // hold one line of it, and the whole point of the bar is that nobody
  // should have to go looking for what is stopping the renewal.
  const blocker = state && state.blocked
    ? `<div class="rb-blocker"><div><b>Blocked at ${escapeHtml(
        (steps.find(s => s.state === 'blocked') || {}).label || 'this step')}.</b>
        ${escapeHtml(state.blocker || '')}</div></div>`
    : '';

  return `<div class="rb-steps">${cells}</div>
    <div class="rb-filter-bar" id="rb-step-filter-bar" hidden></div>${blocker}`;
}

/* Clicking a step REDUCES the page to that step's panels. A wizard that
   never hides anything is a labelled scrollbar - the thirteen panels
   stayed thirteen panels and the bar just scrolled you between them.

   Clicking the step you are already on clears the filter, and the count
   of what is hidden is always on screen with a way back, so nobody can
   lose a panel and not know where it went. Unfiltered is the default:
   the long page is what people know, and this has to be something they
   reach for rather than something that happens to them. */
let _rbStepFilter = null;

function rbSelectStep(step, anchor) {
  _rbStepFilter = (_rbStepFilter === step) ? null : step;
  _rbApplyStepFilter();
  const target = _rbStepFilter
    ? document.getElementById('renewal-bench-workflow-area')
    : document.getElementById(anchor);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function rbShowEveryPanel() {
  _rbStepFilter = null;
  _rbApplyStepFilter();
}

function _rbApplyStepFilter() {
  const panels = document.querySelectorAll('.rb-scope [data-rb-step]');
  let hidden = 0;
  panels.forEach(el => {
    const show = !_rbStepFilter || el.dataset.rbStep === _rbStepFilter;
    el.hidden = !show;
    if (!show) hidden += 1;
  });
  document.querySelectorAll('.rb-step').forEach(el => {
    el.classList.toggle('filtered', el.dataset.rbStepKey === _rbStepFilter);
  });
  const bar = document.getElementById('rb-step-filter-bar');
  if (bar) {
    bar.hidden = !_rbStepFilter;
    if (_rbStepFilter) {
      const shown = panels.length - hidden;
      bar.innerHTML = `Showing the <b>${escapeHtml(_rbStepFilter)}</b> step &mdash;
        ${shown} panel${shown === 1 ? '' : 's'}, ${hidden} hidden.
        <a onclick="rbShowEveryPanel()">Show every panel</a>`;
    }
  }
}

let _rbLastSummary = null;

async function loadRenewalBenchSummary() {
  const headerArea = document.getElementById('renewal-bench-header-area');
  const kpiArea = document.getElementById('renewal-bench-kpi-area');
  const existingPremiumArea = document.getElementById('renewal-bench-existing-premium-area');
  const donutArea = document.getElementById('renewal-bench-donut-area');
  const trendArea = document.getElementById('renewal-bench-trend-area');
  if (!headerArea && !kpiArea && !existingPremiumArea && !donutArea && !trendArea) return;
  try {
    const r = await api(`/cases/${currentCase.id}/renewal-bench-summary`);
    _rbLastSummary = r;
    const workflowArea = document.getElementById('renewal-bench-workflow-area');
    if (workflowArea) {
      workflowArea.innerHTML = _rbWorkflowHtml(r.workflow, r.workflow_state);
      // The bar is rebuilt from scratch here, so a filter that was on
      // before the reload has to be put back on it - otherwise a panel
      // reload silently un-filters the page under the reader.
      _rbApplyStepFilter();
    }
    if (headerArea) headerArea.innerHTML = _rbHeaderHtml(r.case_identity);
    if (kpiArea) kpiArea.innerHTML = _rbKpiStripHtml(r.kpis);
    if (existingPremiumArea) existingPremiumArea.innerHTML = _rbExistingPremiumHtml(r.existing_premium);
    if (donutArea) donutArea.innerHTML = _rbDonutHtml(r.claims_cost_breakdown);
    if (trendArea) trendArea.innerHTML = _rbClaimsTrendHtml(r.claims_trend);
    renderRenewalBenchPremiumAndDrivers(r);
  } catch (err) {
    const workflowArea = document.getElementById('renewal-bench-workflow-area');
    if (workflowArea) workflowArea.innerHTML = '';
    if (headerArea) headerArea.innerHTML = '';
    if (kpiArea) kpiArea.innerHTML = '';
    if (existingPremiumArea) existingPremiumArea.innerHTML = '';
    if (donutArea) donutArea.innerHTML = '';
    if (trendArea) trendArea.innerHTML = '';
  }
  // Independent of whether /renewal-bench-summary itself succeeded - a
  // case with no claims ledger 404s there but /renewal-bench-dashboard
  // has its own eligibility check and its own message, so the Executive
  // Summary should say why it can't render rather than going blank
  // because an unrelated panel's call failed first.
  loadRenewalBenchDashboard();
}

/* ---------------- Executive Summary dashboard ----------------

   One consolidated view of the account's own already-vetted numbers -
   loss ratio, the premium waterfall, the Accept/Review/Reject pricing
   table, claims performance, and the membership profile - read from
   GET /{case_id}/renewal-bench-dashboard, which itself calls the same
   functions (_renewal_pricing, renewal_drivers, census_demographic_summary)
   every other Renewal Bench panel already uses. Deliberately has no 0-100
   risk-score gauge and no "indicative renewal range" - nothing in this
   codebase derives either from real numbers, so this view shows the two
   real bracketing figures (technical premium, minimum acceptable premium)
   instead of a number with no ladder behind it. */

async function loadRenewalBenchDashboard() {
  const area = document.getElementById('renewal-bench-dashboard-area');
  if (!area || !currentCase) return;
  try {
    const d = await api(`/cases/${currentCase.id}/renewal-bench-dashboard`);
    area.innerHTML = _rbDashboardHtml(d);
  } catch (err) {
    area.innerHTML = `<div class="rb-card"><div class="rb-card-title">Executive Summary</div>
      <div class="rb-card-sub">${escapeHtml(err.message)}</div></div>`;
  }
}

function _rbDashboardHtml(d) {
  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct1 = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';

  return `
    <div class="rb-card">
      <div class="rb-card-title">Executive Summary</div>
      <div class="rb-card-sub">${d.loss_ratio_basis ? escapeHtml(d.loss_ratio_basis) : ''}</div>
      <div class="rb-kpi-strip">
        <div class="rb-kpi-card">
          <div class="rb-kpi-label">Gross Earned LR</div>
          <div class="rb-kpi-value">${pct1(d.gross_earned_loss_ratio)}</div>
          <div class="rb-kpi-sub">Target &le; 80%</div>
        </div>
        <div class="rb-kpi-card">
          <div class="rb-kpi-label">Net Earned LR</div>
          <div class="rb-kpi-value">${d.net_earned_loss_ratio != null ? pct1(d.net_earned_loss_ratio) : '&mdash;'}</div>
          <div class="rb-kpi-sub">${d.net_earned_loss_ratio != null ? 'Target &le; 100%' : 'No book match for this account'}</div>
        </div>
        <div class="rb-kpi-card">
          <div class="rb-kpi-label">Expiring Premium</div>
          <div class="rb-kpi-value">AED ${aed(d.expiring_premium)}</div>
          <div class="rb-kpi-sub">${d.expiring_premium_per_member != null ? 'Per member ' + aed(d.expiring_premium_per_member) : ''}</div>
        </div>
        <div class="rb-kpi-card">
          <div class="rb-kpi-label">Required Premium</div>
          <div class="rb-kpi-value">AED ${aed(d.required_premium)}</div>
          <div class="rb-kpi-sub">${d.required_premium_per_member != null ? 'Per member ' + aed(d.required_premium_per_member) : ''}</div>
        </div>
      </div>
      ${d.renewal_increase_pct != null ? `
        <div class="rb-insight sev-critical" style="margin-top:14px;">
          <div>
            <b>Required increase ${d.renewal_increase_pct > 0 ? '+' : ''}${d.renewal_increase_pct.toFixed(1)}%.</b>
            ${d.renewal_increase_reason ? ' ' + escapeHtml(d.renewal_increase_reason) : ''}

        </div>

    </div>
    <div class="rb-card">
      <div class="rb-card-title">Pricing Adequacy Analysis</div>
      <div class="rb-card-sub">Every option projected against the same trended claims, so the table can be read down the column.</div>
      ${_rbPricingTableHtml(d.pricing_options)}

}

function _rbLossRatioGaugeHtml(d) {
  const lr = d.net_earned_loss_ratio != null ? d.net_earned_loss_ratio : d.gross_earned_loss_ratio;
  const label = d.net_earned_loss_ratio != null ? 'Net Earned LR' : 'Gross Earned LR &middot; no net figure without a book match';
  if (lr == null) {
    return `<div class="rb-card"><div class="rb-card-title">Loss Ratio</div><div class="rb-card-sub">No loss ratio available yet.</div></div>`;
  }
  const pctVal = lr * 100;
  const scaleMax = 300;
  const clamped = Math.max(0, Math.min(scaleMax, pctVal));
  const band = pctVal <= 80 ? 'good' : pctVal <= 120 ? 'warning' : 'critical';
  const bandColor = { good: 'var(--rb-good)', warning: 'var(--rb-warning)', critical: 'var(--rb-critical)' }[band];
  const stop1 = (80 / scaleMax * 100).toFixed(2);
  const stop2 = (120 / scaleMax * 100).toFixed(2);
  return `
    <div class="rb-card">
      <div class="rb-card-title">Loss Ratio</div>
      <div class="rb-card-sub">${label}</div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:700; color:${bandColor}; margin:6px 0 2px;">${pctVal.toFixed(1)}%</div>
      <div style="position:relative; height:10px; border-radius:6px; margin:10px 0 6px;
                  background:linear-gradient(to right,
                    var(--rb-good) 0%, var(--rb-good) ${stop1}%,
                    var(--rb-warning) ${stop1}%, var(--rb-warning) ${stop2}%,
                    var(--rb-critical) ${stop2}%, var(--rb-critical) 100%);">
        <div style="position:absolute; top:-3px; left:${(clamped/scaleMax*100).toFixed(2)}%; width:2px; height:16px; background:var(--rb-ink); transform:translateX(-1px);"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--rb-muted);">
        <span>0%</span><span>Good &le;80%</span><span>Poor &le;120%</span><span>${scaleMax}%</span>
      </div>
    </div>
  `;
}

function _rbWaterfallHtml(steps) {
  if (!steps || !steps.length) {
    return `<div class="rb-card"><div class="rb-card-title">Premium Build (Waterfall)</div><div class="rb-card-sub">No build-up available yet.</div></div>`;
  }
  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const maxRunning = Math.max(1, ...steps.map(s => s.running || 0));
  const rows = steps.map(s => {
    const widthPct = Math.max(2, (s.running / maxRunning) * 100);
    const isTotal = s.label === 'Expiring premium' || s.label === 'Required premium';
    const barColor = isTotal ? 'var(--rb-accent)' : (s.amount != null && s.amount < 0 ? 'var(--rb-good)' : 'var(--rb-secondary)');
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--rb-ink-2); margin-bottom:3px;">
          <span>${escapeHtml(s.label)}</span>
          <span style="font-family:'IBM Plex Mono',monospace; white-space:nowrap;">${s.amount != null ? (s.amount >= 0 ? '+' : '') + aed(s.amount) + ' &rarr; ' : ''}AED ${aed(s.running)}</span>
        </div>
        <div style="height:8px; border-radius:4px; background:var(--rb-surface-2);">
          <div style="height:100%; width:${widthPct}%; border-radius:4px; background:${barColor};"></div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="rb-card">
      <div class="rb-card-title">Premium Build (Waterfall)</div>
      <div class="rb-card-sub">Expiring premium, then each step that moves it, ending on the required premium.</div>
      ${rows}
    </div>
  `;
}

function _rbPricingTableHtml(options) {
  if (!options || !options.length) {
    return `<div class="rb-card-sub">No pricing options available yet.</div>`;
  }
  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pctSigned = v => v == null ? '&mdash;' : (v > 0 ? '+' : '') + v.toFixed(1) + '%';
  const lrFmt = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';
  const decisionPill = decision => {
    if (!decision) return '&mdash;';
    const cls = decision === 'accept' ? 'rb-pill-good' : decision === 'review' ? 'rb-pill-warning' : 'rb-pill-critical';
    return `<span class="rb-pill ${cls}">${escapeHtml(decision)}</span>`;
  };
  const rows = options.map(o => `
    <tr>
      <td>${escapeHtml(o.label)}${o.note ? `<div class="rb-card-sub" style="margin:2px 0 0;">${escapeHtml(o.note)}</div>` : ''}</td>
      <td class="num">${o.premium != null ? 'AED ' + aed(o.premium) : '&mdash; (not entered)'}</td>
      <td class="num">${pctSigned(o.change_pct)}</td>
      <td class="num">${lrFmt(o.projected_loss_ratio)}</td>
      <td class="num">${decisionPill(o.decision)}</td>
    </tr>
  `).join('');
  return `
    <div style="overflow-x:auto;">
      <table class="rb-table">
        <thead><tr><th>Scenario</th><th class="num">Premium</th><th class="num">Change</th><th class="num">Projected LR</th><th class="num">Decision</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function _rbClaimsPerformanceCardHtml(d) {
  const perf = d.claims_performance;
  if (!perf) {
    return `<div class="rb-card"><div class="rb-card-title">Claims Performance</div><div class="rb-card-sub">No claims data yet.</div></div>`;
  }
  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const stats = [
    ['Total Incurred Claims', 'AED ' + aed(perf.total_incurred)],
    ['No. of Claims', perf.claim_count],
    ['Claim Frequency', perf.claim_frequency != null ? perf.claim_frequency.toFixed(2) : '&mdash;'],
    ['Average Claim Cost', 'AED ' + aed(perf.average_claim_cost)],
    ['Largest Claim', 'AED ' + aed(perf.largest_claim)],
    ['Top 10 Claims', perf.top_ten_share != null ? (perf.top_ten_share * 100).toFixed(1) + '% of total' : '&mdash;'],
    ['Chronic Claims (Est.)', perf.chronic_claims != null ? 'AED ' + aed(perf.chronic_claims) : 'Not classifiable from this ledger'],
  ];
  const statRows = stats.map(([k, v]) => `
    <div style="display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px solid var(--rb-border);">
      <span style="color:var(--rb-muted);">${escapeHtml(k)}</span><b>${v}</b>
    </div>
  `).join('');

  const trend = d.monthly_claims_trend || [];
  const maxTrend = Math.max(1, ...trend.map(t => t.final_amount || 0));
  const trendBars = trend.map(t => `
    <div style="display:flex; flex-direction:column; align-items:center; flex:1;">
      <div style="width:100%; height:60px; display:flex; align-items:flex-end;">
        <div style="width:100%; background:var(--rb-accent); border-radius:3px 3px 0 0; height:${Math.max(2, (t.final_amount / maxTrend) * 100)}%;" title="AED ${aed(t.final_amount)}"></div>
      </div>
      <div style="font-size:9px; color:var(--rb-muted); margin-top:3px;">${t.month}/${String(t.year).slice(2)}</div>
    </div>
  `).join('');

  const drivers = (d.top_claim_drivers || []).slice(0, 5);
  const driverTotal = drivers.reduce((s, x) => s + (x.value || 0), 0) || 1;
  const maxDriver = Math.max(1, ...drivers.map(x => x.value || 0));
  const driverBars = drivers.map(x => `
    <div style="margin-bottom:7px;">
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--rb-ink-2); margin-bottom:2px;">
        <span>${escapeHtml(x.diagnosis_description || x.diagnosis_code || 'Unclassified')}</span>
        <span>${((x.value / driverTotal) * 100).toFixed(0)}%</span>
      </div>
      <div style="height:6px; border-radius:3px; background:var(--rb-surface-2);">
        <div style="height:100%; width:${(x.value / maxDriver) * 100}%; border-radius:3px; background:var(--rb-secondary);"></div>
      </div>
    </div>
  `).join('');

  return `
    <div class="rb-card">
      <div class="rb-card-title">Claims Performance</div>
      <div class="rb-card-sub">This case's own claims ledger.</div>
      ${statRows}
      ${trend.length ? `
        <div style="font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--rb-muted); font-weight:600; margin:14px 0 6px;">Monthly Incurred Claims Trend</div>
        <div style="display:flex; gap:4px; align-items:flex-end;">${trendBars}</div>
      ` : ''}
      ${drivers.length ? `
        <div style="font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--rb-muted); font-weight:600; margin:14px 0 6px;">Top Claim Drivers (by Value)</div>
        ${driverBars}
      ` : ''}

  `;
}

/* ---------------- scenarios ----------------

   The same account read several ways. Every row is Method 1's own
   ladder with a different incurred figure fed into it - never a second
   route to a premium, because two renewal prices on one screen leaves
   the reader with no way to know which one the house would quote. */
async function loadRenewalScenarios() {
  const area = document.getElementById('renewal-bench-scenarios-area');
  if (!area || !currentCase) return;
  try {
    const r = await api(`/cases/${currentCase.id}/renewal-scenarios`);
    area.innerHTML = _rbScenariosHtml(r);
  } catch (err) {
    area.innerHTML = '';
  }
}

/* ---------------- pricing options ----------------

   An underwriter chooses between premiums, not percentages, and the
   question that separates them was never on the page: at THIS premium,
   where does the loss ratio land? Every row - including the ones typed
   into this panel - is projected against the same trended claims, so the
   table can be read straight down the column. A commercial price
   measured against a different denominator to the technical one would
   leave you unable to say which option was better, which is the only
   thing the table is for. */
let renewalOptionInputs = { commercial: null, retention: null, broker: null, combined: null };

function setRenewalOption(key, value) {
  const n = parseFloat(value);
  renewalOptionInputs[key] = (isFinite(n) && n > 0) ? n : null;
  loadRenewalOptions();
}

/* The acceptance line, as a combined ratio. Typed in whole percent
   because that is how it is argued about - "we'll write it to 102" -
   and held as a fraction everywhere else. Only ever TIGHTER than the
   house line: the server refuses anything looser with the reason, and
   the input's max says so before the request is made. */
function setRenewalCombinedRatio(value, houseMax) {
  const n = parseFloat(value);
  if (!isFinite(n) || n <= 0) { renewalOptionInputs.combined = null; }
  else if (n / 100 > houseMax + 1e-9) {
    toast(`The house maximum is a ${(houseMax * 100).toFixed(0)}% combined ratio. Writing an ` +
          `account looser than that needs an authority sign-off.`);
    renewalOptionInputs.combined = null;
  } else {
    renewalOptionInputs.combined = n / 100;
  }
  loadRenewalOptions();
}

async function loadRenewalOptions() {
  const area = document.getElementById('renewal-bench-options-area');
  if (!area || !currentCase) return;
  try {
    const p = new URLSearchParams();
    if (renewalOptionInputs.commercial != null) p.set('commercial_premium', renewalOptionInputs.commercial);
    if (renewalOptionInputs.retention != null) p.set('retention_premium', renewalOptionInputs.retention);
    if (renewalOptionInputs.broker != null) p.set('broker_premium', renewalOptionInputs.broker);
    if (renewalOptionInputs.combined != null) p.set('combined_ratio', renewalOptionInputs.combined);
    const r = await api(`/cases/${currentCase.id}/renewal-options?${p}`);
    area.innerHTML = _rbOptionsHtml(r);
  } catch (err) {
    area.innerHTML = '';
  }
}

const RB_DECISION_PILL = { accept: 'good', review: 'warning', reject: 'critical' };
const RB_TYPED_OPTIONS = { commercial: 'commercial', retention: 'retention', broker: 'broker' };

function _rbOptionsHtml(r) {
  const money = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const ratio = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';
  const move = v => v == null ? '&mdash;' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';

  if (r.pricing_blocked) {
    return `
      <div class="rb-card">
        <div class="rb-card-title">Pricing options</div>
        <div class="rb-card-sub">No price to project against yet.
          ${escapeHtml((r.pricing_problems && r.pricing_problems[0] && r.pricing_problems[0].message) || '')}</div>
      </div>`;
  }

  const rows = (r.options || []).map(o => {
    const typed = RB_TYPED_OPTIONS[o.key];
    const pill = o.decision
      ? `<span class="rb-pill rb-pill-${RB_DECISION_PILL[o.decision]}">${escapeHtml(o.decision)}</span>`
      : '&mdash;';
    // A typed option is an input where the others are a figure - the
    // underwriter's own price points belong on the same table as the
    // derived ones, priced by the same line, or they get compared in
    // somebody's head against a different denominator.
    const premium = typed
      ? `<input type="number" step="1000" class="rb-opt-input" value="${o.premium == null ? '' : o.premium}"
           placeholder="type a price"
           onchange="setRenewalOption('${typed}', this.value)">`
      : money(o.premium);
    return `
      <tr class="${o.key === 'technical' ? 'base' : (o.premium == null ? 'inert' : '')}">
        <td>${escapeHtml(o.label)}${o.note ? `<span class="sub">${escapeHtml(o.note)}</span>` : ''}</td>
        <td class="num">${premium}</td>
        <td class="num">${move(o.change_pct)}</td>
        <td class="num">${ratio(o.projected_loss_ratio)}</td>
        <td class="num">${pill}</td>
      </tr>`;
  }).join('');

  const floorNote = r.minimum_is_house_floor
    ? `the house minimum increase of ${ratio(r.minimum_increase_pct)} on the expiring premium &mdash;
       this account&rsquo;s own claims would allow as little as ${money(r.minimum_by_loss_ratio)},
       which the house does not write`
    : `this account&rsquo;s trended claims over ${ratio(r.target_loss_ratio)}, derived rather than typed`;

  const houseMax = r.house_maximum_combined_ratio;
  const atHouseLine = Math.abs((r.combined_ratio || 0) - houseMax) < 1e-9;

  return `
    <div class="rb-card">
      <div class="rb-card-title">Pricing options</div>
      <div class="rb-card-sub">At each of these premiums, where does the loss ratio land? Every row is
        projected against the same trended claims &mdash; ${money(r.trended_claims)}, what next year is
        expected to cost &mdash; so the table reads straight down the column. Not last year&rsquo;s
        claims: those would flatter every option by the whole of the inflation assumption.</div>
      <div class="row" style="align-items:flex-end; margin-top:14px; gap:10px;">
        <div>
          <label>Accept up to &mdash; combined ratio %</label>
          <input type="number" step="0.5" min="1" max="${(houseMax * 100).toFixed(0)}"
            class="rb-opt-input" value="${((r.combined_ratio || 0) * 100).toFixed(1)}"
            onchange="setRenewalCombinedRatio(this.value, ${houseMax})">
        </div>
        <div class="rb-card-sub" style="flex:1; margin:0 0 4px; font-size:11.5px; line-height:1.5;">
          Claims plus expenses over premium. On this account&rsquo;s ${ratio(r.loading_pct)} expense
          load that leaves <b>${ratio(r.target_loss_ratio)}</b> for claims.
          ${atHouseLine
            ? `The house maximum &mdash; it can be tightened for one account but not loosened,
               which needs an authority sign-off.`
            : `Tighter than the ${ratio(houseMax)} house maximum.`}
        </div>
      </div>
      <table class="rb-scenario-table" style="margin-top:14px;">
        <thead><tr>
          <th>Option</th><th class="num">Premium</th><th class="num">vs expiring</th>
          <th class="num">Projected loss ratio</th><th class="num">Decision</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="rb-card-sub" style="margin:14px 0 0;">The technical premium lands on
        ${ratio(r.technical_projected_loss_ratio)} because that is (1 &minus; the
        ${ratio(r.loading_pct)} loading) by construction &mdash; it breaks even, and it is the line
        every other option is measured against. A price is accepted at or above the minimum
        acceptable premium of ${money(r.minimum_acceptable_premium)}, which is ${floorNote}, and
        reviewed within ${ratio(r.review_band_pct)} below it. The gap between the technical premium
        and that minimum is the negotiating room, and it exists only because the house tolerates a
        combined ratio above 100% &mdash; at break-even there is none. The two reference rows carry
        no verdict: the expiring premium is what the others are measured against, and the minimum
        acceptable IS the line.</div>
    </div>`;
}

/* ---------------- claims development ----------------

   A second reading of this account's own claims, built from how long
   this book's claims actually take to be received - not the house's
   flat 30-day IBNR tail. Deliberately interactive rather than a single
   number: large claims are FLAGGED, never auto-stripped (whether one
   recurs is a clinical or membership question, not something a
   threshold can answer), and which months feed the projection is
   something the underwriter chooses here, not something this panel
   decides on its own. Sits beside Method 1 and the pricing options
   table as a comparison, never as a silent replacement for either. */
let claimsDevInputs = { excludeClaimIds: new Set(), includeMonths: null };

function _cdToggleClaim(claimId) {
  if (claimsDevInputs.excludeClaimIds.has(claimId)) claimsDevInputs.excludeClaimIds.delete(claimId);
  else claimsDevInputs.excludeClaimIds.add(claimId);
  loadClaimsDevelopment();
}

function _cdToggleMonth(month, allMonthsCsv) {
  // Comma-joined, not JSON - a JSON array's own double quotes collide
  // with the double-quoted JS string this is passed as inside an inline
  // onchange attribute. Month strings are always "YYYY-MM", so a comma
  // can never appear inside one and needs no escaping either way.
  const allMonths = allMonthsCsv.split(',');
  // null means "everything is included" implicitly - unticking one month
  // switches to an explicit list rather than requiring every month to
  // already be named.
  let months = claimsDevInputs.includeMonths === null ? allMonths.slice() : claimsDevInputs.includeMonths.slice();
  months = months.includes(month) ? months.filter(m => m !== month) : months.concat([month]);
  claimsDevInputs.includeMonths = (months.length === allMonths.length) ? null : months;
  loadClaimsDevelopment();
}

async function loadClaimsDevelopment() {
  const area = document.getElementById('claims-development-area');
  if (!area || !currentCase) return;
  try {
    const p = new URLSearchParams();
    claimsDevInputs.excludeClaimIds.forEach(id => p.append('exclude_claim_ids', id));
    if (claimsDevInputs.includeMonths !== null) {
      claimsDevInputs.includeMonths.forEach(m => p.append('include_months', m));
    }
    const r = await api(`/cases/${currentCase.id}/claims-development?${p}`);
    area.innerHTML = _claimsDevelopmentHtml(r);
  } catch (err) {
    area.innerHTML = '';
  }
}

function _claimsDevelopmentHtml(r) {
  const money = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';

  if (r.insufficient_data) {
    return `
      <div class="rb-card">
        <div class="rb-card-title">Claims development</div>
        <div class="rb-card-sub">${escapeHtml(r.reason || 'Not enough data yet to build a completion curve.')}</div>
      </div>`;
  }

  const allMonths = r.monthly.map(m => m.month);
  const allMonthsCsv = allMonths.join(',');
  const included = new Set(r.projection.included_months);

  const rows = r.monthly.map(m => {
    const large = r.large_claims_flagged[m.month] || [];
    const isIncluded = included.has(m.month);
    const largeHtml = large.map(c => {
      const excluded = r.excluded_claim_ids.includes(c.claim_id);
      return `<label style="display:block;cursor:pointer;font-weight:400;">
          <input type="checkbox" ${excluded ? '' : 'checked'}
            onchange="_cdToggleClaim('${escapeHtml(c.claim_id)}')">
          ${escapeHtml(c.patient_id || '')} &middot; ${money(c.amount)} &middot; ${escapeHtml(c.diagnosis || 'no diagnosis on file')}
        </label>`;
    }).join('');
    return `<tr${isIncluded ? '' : ' class="inert"'}>
        <td><label style="cursor:pointer;"><input type="checkbox" ${isIncluded ? 'checked' : ''}
            onchange='_cdToggleMonth("${m.month}", "${allMonthsCsv}")'> ${escapeHtml(m.month)}</label></td>
        <td class="num">${money(m.received)}</td>
        <td class="num">${pct(m.completion)}</td>
        <td class="num">${money(m.completed)}</td>
        <td>${largeHtml || '&mdash;'}</td>
      </tr>`;
  }).join('');

  const leaversHtml = (r.leavers || []).length
    ? r.leavers.map(l => `${escapeHtml(l.patient_id)} (${money(l.incurred)})`).join(', ')
    : 'none on this term';

  return `
    <div class="rb-card">
      <div class="rb-card-title">Claims development</div>
      <div class="rb-card-sub">This account's own months, true&rsquo;d up by how long this
        book&rsquo;s claims actually take to be received &mdash; not the flat 30-day IBNR tail.
        Tick which months should count toward the year; a month left unticked is filled at the
        average of the ones that are, rather than silently vanishing from the total. Large
        claims are flagged, never stripped automatically &mdash; untick one only once you have
        decided it will not recur.</div>
      <table class="rb-scenario-table" style="margin-top:14px;">
        <thead><tr>
          <th>Month</th><th class="num">Received</th><th class="num">Completion</th>
          <th class="num">Completed</th><th>Large claims &mdash; untick to exclude</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="rb-card-sub" style="margin-top:12px;">Leavers, excluded automatically and never
        counted above: ${leaversHtml}.</div>
      <div class="rb-kpi-strip" style="margin-top:14px;">
        ${_rbKpi('Annual claims', money(r.projection.annual_claims),
            `${r.projection.included_months.length} month(s) counted, ${r.projection.months_filled} filled at the average`)}
        ${_rbKpi('Trended claims', money(r.pricing.trended_claims), '')}
        ${_rbKpi('Required premium', money(r.pricing.required_premium),
            r.pricing.floor_applied ? 'house floor applied' : 'this method’s own ask')}
        ${_rbKpi('Projected loss ratio', pct(r.pricing.projected_loss_ratio), '')}
      </div>
    </div>`;
}

function _rbAdjustmentsHtml(adjustments) {
  return (adjustments || []).map(a => `
    <div class="rb-adj-card${a.available ? '' : ' off'}">
      <div class="t">${escapeHtml(a.label)}
        <b>${a.available && a.amount ? '&minus;' + Math.round(a.amount).toLocaleString() : '&mdash;'}</b></div>
      <div class="n">${escapeHtml(a.note || '')}</div>
    </div>`).join('');
}

function _rbScenariosHtml(r) {
  const money = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct = v => v == null ? '&mdash;' : (v > 0 ? '+' : '') + v.toFixed(1) + '%';

  if (r.pricing_blocked) {
    // The levers still show. What is withheld is the price, not the
    // account - and an underwriter needs to see what is available to
    // strip while they go and fix the thing that is blocking it.
    return `
      <div class="rb-card">
        <div class="rb-card-title">Adjustments &amp; scenarios</div>
        <div class="rb-card-sub">No price to compare against yet.
          ${escapeHtml((r.pricing_problems && r.pricing_problems[0] && r.pricing_problems[0].message) || '')}</div>
        <div class="rb-adj">${_rbAdjustmentsHtml(r.adjustments)}</div>
      </div>`;
  }

  const rows = (r.scenarios || []).map(s => {
    // A row that stripped nothing repeats the "as reported" figures
    // exactly, which is the honest answer and reads as a broken table
    // unless it is visibly doing nothing.
    const inert = s.key !== 'as_reported' && s.key !== 'override' && !s.removed;
    const cls = s.key === 'as_reported' ? 'base' : s.key === 'override' ? 'override' : (inert ? 'inert' : '');
    return `
    <tr class="${cls}">
      <td>${escapeHtml(s.label)}${s.floor_applied ? '<span class="rb-floor-tag">at floor</span>' : ''}
        ${s.note ? `<span class="sub">${escapeHtml(s.note)}</span>` : ''}</td>
      <td class="num">${s.removed == null ? '&mdash;' : (s.removed ? '&minus;' + money(s.removed) : '&mdash;')}</td>
      <td class="num">${s.loss_ratio == null ? '&mdash;' : (s.loss_ratio * 100).toFixed(1) + '%'}</td>
      <td class="num">${money(s.required_premium)}</td>
      <td class="num">${inert ? 'no change' : pct(s.renewal_increase_pct)}</td>
    </tr>`;
  }).join('');

  return `
    <div class="rb-card">
      <div class="rb-card-title">Adjustments &amp; scenarios</div>
      <div class="rb-card-sub">What the renewal costs on different readings of the same experience.
        Each row is Method 1&rsquo;s own ladder &mdash; loss ratio plus
        ${r.inflation_pts == null ? '&ndash;' : (r.inflation_pts * 100).toFixed(1)} points of inflation, over
        (1 &minus; ${r.loading_pct == null ? '&ndash;' : (r.loading_pct * 100).toFixed(1) + '%'} loading) &mdash;
        with a different incurred figure fed into it, not a second way of arriving at a premium.</div>
      <div class="rb-adj">${_rbAdjustmentsHtml(r.adjustments)}</div>
      <table class="rb-scenario-table">
        <thead><tr>
          <th>Scenario</th><th class="num">Stripped</th><th class="num">Loss ratio</th>
          <th class="num">Required premium</th><th class="num">Change</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="rb-card-sub" style="margin:14px 0 0;">A claim amount is stripped from the annualised
        incurred without being annualised itself &mdash; a catastrophic admission is an event that happened
        once, not a rate that continues. IBNR is left untouched, because the tail projects the account&rsquo;s
        ongoing run rate rather than the one-off being removed.</div>
    </div>`;
}

function _rbDriverBlockHtml(label, value, isTotal) {
  if (value == null) {
    return `<div class="rb-driver-block"><div class="val">n/a</div><div class="lbl">${escapeHtml(label)}</div></div>`;
  }
  const cls = isTotal ? 'total' : (value > 0 ? 'pos' : (value < 0 ? 'neg' : ''));
  return `
    <div class="rb-driver-block ${cls}">
      <div class="val">${value > 0 ? '+' : ''}${value.toFixed(1)}%</div>
      <div class="lbl">${escapeHtml(label)}</div>
    </div>
  `;
}

function _rbRecommendedPremiumHtml(r) {
  const d = r.drivers;
  return `
    <div class="rb-hero">
      <div class="lbl">Recommended renewal premium &middot; Method 1</div>
      <div class="amt">AED ${Math.round(d.recommended_premium).toLocaleString()}</div>
      <div class="sub">${d.total_pct > 0 ? '+' : ''}${d.total_pct}% vs. current annual premium &middot; ${d.within_authority ? 'within underwriter authority' : `outside authority (&plusmn;${d.authority_threshold_pct}pt)`}</div>
      ${d.method_1_required_premium != null && Math.round(d.method_1_required_premium) !== Math.round(d.recommended_premium)
        ? `<div class="sub">Method 1 asks AED ${Math.round(d.method_1_required_premium).toLocaleString()} (${d.method_1_increase_pct > 0 ? '+' : ''}${d.method_1_increase_pct}%) before the census and underwriter adjustments below.</div>`
        : ''}
      <div class="rb-hero-row">

      </div>
    </div>
    <div class="rb-card">
      <div class="rb-card-title">Renewal drivers</div>
      <div class="rb-card-sub">How the ${d.total_pct}% breaks down. Each bar is a slice of Method 1's own ladder
        &mdash; loss ratio ${d.loss_ratio == null ? '&ndash;' : (d.loss_ratio * 100).toFixed(1) + '%'}
        plus ${d.inflation_pts == null ? '&ndash;' : (d.inflation_pts * 100).toFixed(1)} points of inflation,
        over (1 &minus; ${d.loading_pct == null ? '&ndash;' : (d.loading_pct * 100).toFixed(1) + '%'} loading)
        &mdash; not a second price built beside it, so they add up to the figure above.</div>
      <div class="rb-driver-row">
        ${_rbDriverBlockHtml('Claims experience', d.claims_experience_pct)}
        <div class="rb-driver-op">+</div>
        ${_rbDriverBlockHtml('Medical trend', d.medical_trend_pct)}
        ${d.floor_applied ? `
        <div class="rb-driver-op">+</div>

        <div class="rb-driver-op">+</div>
        ${_rbDriverBlockHtml('Census change', d.census_change_pct)}
        <div class="rb-driver-op">+</div>
        ${_rbDriverBlockHtml('Underwriter adj.', d.underwriter_adjustment_pct)}
        <div class="rb-driver-op">=</div>
        ${_rbDriverBlockHtml('Total movement', d.total_pct, true)}
      </div>
      ${d.floor_applied ? `<div class="rb-card-sub" style="margin:12px 0 0;">This account&rsquo;s own experience asks for
        ${(d.claims_experience_pct + d.medical_trend_pct).toFixed(2)}%. The house minimum of
        ${(d.minimum_increase_pct * 100).toFixed(0)}% is what is being quoted &mdash; shown as its own bar rather than
        folded into the experience, because they are different conversations.</div>` : ''}
    </div>
  `;
}

function renderRenewalBenchPremiumAndDrivers(r) {
  const area = document.getElementById('renewal-bench-premium-area');
  if (!area) return;
  // A withheld price returns no drivers, and reading them anyway threw -
  // which took down the whole loader, so the account with the most to
  // say showed the least: no header, no KPI strip, no step bar, nothing
  // naming the fee split that was stopping it.
  if (!r.drivers) {
    area.innerHTML = `
      <div class="rb-card">
        <div class="rb-card-title">Recommended renewal premium</div>
        <div class="rb-card-sub">Withheld. A renewal is not priced on an assumed loading &mdash;
          enter this account&rsquo;s fee split on the case record and the price, the drivers and the
          scenarios all follow. Enter 0 for a fee the account genuinely does not pay.</div>
      </div>`;
    return;
  }
  area.innerHTML = _rbRecommendedPremiumHtml(r);
}

async function recomputeRenewalBenchDrivers() {
  const adj = Number(document.getElementById('rb-underwriter-adjustment').value) || 0;
  const threshold = Number(document.getElementById('rb-authority-threshold').value) || 15;
  try {
    const r = await api(`/cases/${currentCase.id}/renewal-bench-summary?underwriter_adjustment_pct=${adj}&authority_threshold_pct=${threshold}`);
    _rbLastSummary = r;
    renderRenewalBenchPremiumAndDrivers(r);
  } catch (err) { /* leave the card as-is on failure */ }
}

        <div class="rb-card-sub">Members with multiple large claims above the threshold - a driver of loss ratio distinct from a single one-off event.</div>
        <table class="rb-table"><tr><th>Patient</th><th class="num">Large claim count</th><th class="num">Total claimed</th></tr>${recurringRows || '<tr><td colspan="3">None</td></tr>'}</table>
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}
// Which members are being held out of the renewal price. Holding one
// out is a QUESTION - what would this have cost without them - and only
// becomes a price if they are genuinely not renewing or their condition
// is excluded on the renewal terms. The panel says so on every result.
//
// These two were deleted with the panels above them and left referenced
// here, which threw a ReferenceError partway through the bench's own
// loader: every panel after the repricing one stopped rendering.
let _rbExcluded = [];

function _rbToggleExclude(id) {
  _rbExcluded = _rbExcluded.includes(id)
    ? _rbExcluded.filter(x => x !== id)
    : _rbExcluded.concat([id]);
  loadRenewalBenchRepricing();
}

async function loadRenewalBenchRepricing() {
  const area = document.getElementById('renewal-bench-repricing-area');
  if (!area || !currentCase || !currentCase.company_name) return;
  const p = new URLSearchParams();
  if (_rbCutDate) p.set('as_at', _rbCutDate);
  _rbExcluded.forEach(id => p.append('exclude', id));
  let r;
  try {
    r = await api(`/portfolio-analysis/renewal-repricing/${encodeURIComponent(currentCase.company_name)}?${p}`);
  } catch (err) { area.innerHTML = ''; return; }

  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';
  const sgn = v => v == null ? '&mdash;' : (v >= 0 ? '+' : '') + (v * 100).toFixed(0) + '%';
  const a = r.as_priced, e = r.excluding;
  if (!a || !a.member_count) { area.innerHTML = ''; return; }

  // The panel used to show its OWN annualised claims here, and that was
  // the figure that disagreed with the rating. What is priced is the
  // account's loss ratio, reduced by the held-out members' share of the
  // claims - so those are the two columns shown.
  const col = (d, label) => !d ? '' : `
    <td class="num">${aed(d.incurred_to_date)}</td>
    <td class="num">${d.share_of_claims == null ? '&mdash;' : (d.share_of_claims * 100).toFixed(1) + '%'}</td>
    <td class="num">${d.loss_ratio == null ? '&mdash;' : (d.loss_ratio * 100).toFixed(1) + '%'}${d.floor_applied ? ' <span class="rb-floor-tag">at floor</span>' : ''}</td>
    <td class="num"><strong>${aed(d.required_premium)}</strong></td>
    <td class="num">${sgn(d.increase_vs_current_pct)}</td>`;

  // A member claiming in most of the months they were exposed for is
  // being treated, not unlucky - and treatment renews with them.
  const rows = r.top_claimants.map(m => {
    const on = _rbExcluded.includes(m.beneficiary_id);
    const run = m.months_with_claims >= (a.full_months || 12) * 0.7
      ? '<span class="pill warn">still running</span>' : '';
    return `<tr${on ? ' style="opacity:.5;"' : ''}>
      <td><label style="cursor:pointer;"><input type="checkbox" ${on ? 'checked' : ''}
          onchange="_rbToggleExclude('${escapeHtml(m.beneficiary_id)}')"> ${escapeHtml(m.beneficiary_id)}</label></td>
      <td>${escapeHtml(m.relation || '')}</td>
      <td class="num">${m.age == null ? '' : m.age}</td>
      <td class="num">${aed(m.incurred)}</td>
      <td class="num">${pct(m.share_of_claims)}</td>
      <td class="num">${m.months_with_claims} / ${a.full_months || '?'}</td>
      <td>${run}</td>
      <td>${escapeHtml(String(m.top_diagnosis || ''))}</td></tr>`;
  }).join('');

  area.innerHTML = `
    <div class="card">
      <h3>Renewal price &mdash; and what one member is worth to it</h3>
      <div class="hint">Claims to ${escapeHtml(String(r.data_to || ''))}${a.full_months
          ? `, ${a.full_months} complete month${a.full_months === 1 ? '' : 's'} of experience` : ''}${(a.months_dropped || []).length
          ? ` (${a.months_dropped.join(', ')} still a part month)` : ''}${r.pricing_blocked
          ? '. <strong>No premium below:</strong> ' + (r.loading_pct == null ? 'nobody has supplied this account&rsquo;s loading, and a renewal is not priced on the house average. Enter the fee split on the case record, or upload the Client Master sheet.' : 'this account has no loss ratio on the book yet.')
          : '. Priced off the account&rsquo;s own loss ratio of ' + pct(r.account_loss_ratio) + ' &mdash; the same row the Loss Ratio screen renders &mdash; plus ' + pct(r.trend_pct) + ' of inflation in points, over (1 &minus; ' + pct(r.loading_pct) + ' loading). Holding a member out reduces that ratio by their share of the claims. Loading from ' + escapeHtml(r.loading_source || 'the request') + '.'}</div>
      <div class="scroll"><table style="margin-top:12px;">
        <tr><th></th><th class="num">Members</th><th class="num">Incurred</th>
            <th class="num">Share of claims</th><th class="num">Loss ratio</th>
            <th class="num">Required premium</th><th class="num">vs current</th></tr>
        <tr><th>Everyone in</th><td class="num">${a.member_count}</td>${col(a)}</tr>
        ${e ? `<tr class="total"><th>Holding ${r.excluded_members.length} out</th>
            <td class="num">${e.member_count}</td>${col(e)}</tr>` : ''}
      </table></div>
      <div class="hint" style="margin-top:8px;">Current premium ${aed(r.current_premium)}.
        ${r.worth_of_exclusion != null
          ? `Holding those members out is worth <strong>${aed(r.worth_of_exclusion)}</strong> of premium.` : ''}</div>
      ${r.caveat ? `<div class="hint" style="background:#fbf3e6;border-left:3px solid #c98a2b;
         padding:9px 12px;margin-top:10px;color:#8a5f1e;">${escapeHtml(r.caveat)}</div>` : ''}
      <h4 style="margin:18px 0 6px;">Largest claimants &mdash; tick to hold out of the price</h4>
      <div class="scroll"><table>
        <tr><th>Member</th><th>Relation</th><th class="num">Age</th><th class="num">Incurred</th>
            <th class="num">Share</th><th class="num">Months claiming</th><th></th><th>Main diagnosis</th></tr>
        ${rows}
      </table></div>
    </div>`;
}

// How the population actually moved over the term, read off the
// roster's own dates. The older Census Movement panel compares two
// census UPLOADS, which answers a different question and reports zero
// on an account whose census was never re-uploaded - Serviceplan lost
// thirteen members and read 178 to 178, change 0.
async function loadRenewalBenchPopulationMovement() {
  const area = document.getElementById('renewal-bench-population-movement-area');
  if (!area || !currentCase || !currentCase.company_name) return;
  let r;
  try {
    r = await api(`/portfolio-analysis/population-movement/${encodeURIComponent(currentCase.company_name)}`);
  } catch (err) { area.innerHTML = ''; return; }
  if (!r.rows || !r.rows.length) { area.innerHTML = ''; return; }

  const t = r.totals;
  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const sgn = v => v == null ? '&mdash;' : (v > 0 ? '+' : '') + v;
  const pct = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';
  const row = d => `<tr>
      <td>${escapeHtml(d.relation)}</td>
      <td class="num">${d.opening}</td>
      <td class="num">${d.joiners ? '+' + d.joiners : 0}</td>
      <td class="num">${d.leavers ? '&minus;' + d.leavers : 0}</td>
      <td class="num"><strong>${d.closing}</strong></td>
      <td class="num">${sgn(d.net_change)}</td>
      <td class="num">${d.member_years.toFixed(1)}</td></tr>`;

  area.innerHTML = `
    <div class="card">
      <h3>Population movement &mdash; ${escapeHtml(String(r.term_start))} to ${escapeHtml(String(r.term_end))}</h3>
      <div class="hint">Opening, joiners, leavers and closing, taken from each member's own cover
        dates rather than by comparing two census uploads. Member-years is what the population was
        actually on risk for: twelve members who each stayed a month are twelve lives and one
        member-year, and a renewal priced on headcount treats them as twelve.</div>
      <div class="scroll"><table style="margin-top:12px;">
        <tr><th>Relation</th><th class="num">Opening</th><th class="num">Joined</th>
            <th class="num">Left</th><th class="num">Closing</th><th class="num">Net</th>
            <th class="num">Member-years</th></tr>
        ${r.rows.map(row).join('')}
        <tr class="total"><th>Total</th><td class="num"><strong>${t.opening}</strong></td>
          <td class="num">+${t.joiners}</td><td class="num">&minus;${t.leavers}</td>
          <td class="num"><strong>${t.closing}</strong></td><td class="num">${sgn(t.net_change)}</td>
          <td class="num"><strong>${t.member_years.toFixed(1)}</strong></td></tr>
      </table></div>
      <div class="hint" style="margin-top:8px;">
        Turnover ${pct(t.turnover_pct)} of the opening population
        (${t.joiners} joined, ${t.leavers} left).
        Joiners brought AED ${aed(t.joiner_premium)}, leavers took AED ${aed(t.leaver_premium)} &mdash;
        net <strong>${t.net_premium_impact >= 0 ? '+' : '&minus;'}AED ${aed(Math.abs(t.net_premium_impact))}</strong>.
      </div>
      ${t.closing !== Math.round(t.member_years) ? `<div class="hint" style="margin-top:6px;">
        Closing headcount ${t.closing} against ${t.member_years.toFixed(1)} member-years &mdash;
        the gap is the churn, and it is what a per-member figure divides by.</div>` : ''}
    </div>`;
}

// The cut date the underwriter is pricing to. Blank means "read it off
// the roster" - see roster_term_end, which exists because the claims and
// membership exports disagree about the same day by one.
let _rbCutDate = '';

function _rbSetCutDate(value) {
  _rbCutDate = value || '';
  loadRenewalBenchClaimsSplit();
  // The census comparison splits active from leaving on the same date,
  // so a cut date changed in one panel and not the other would put two
  // different rosters on the same page.
  if (_rbCensusResult) uploadRenewalCensus(_rbCensusInclude.length ? _rbCensusInclude : undefined);
}

// Last year's claims split between the members who are renewing and
// the members who are not. A renewal quoted off the account's headline
// loss ratio prices the incoming year against a population that
// includes people who will not be in it - and whether that matters is
// an empirical question, not an assumption.
async function loadRenewalBenchClaimsSplit() {
  const area = document.getElementById('renewal-bench-claims-split-area');
  if (!area || !currentCase) return;
  const client = currentCase.company_name;
  if (!client) { area.innerHTML = ''; return; }
  let r;
  try {
    const q = _rbCutDate ? `?as_at=${encodeURIComponent(_rbCutDate)}` : '';
    r = await api(`/portfolio-analysis/renewal-claims-split/${encodeURIComponent(client)}${q}`);
  } catch (err) { area.innerHTML = ''; return; }

  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';
  const c = r.continuing, l = r.leaving;
  if (!c.member_count && !l.member_count) { area.innerHTML = ''; return; }

  // The headline only overstates the renewing population's cost if the
  // leavers cost more per head. Say which it is rather than leaving the
  // reader to compare two ratios.
  const moved = (r.total.loss_ratio != null && r.loss_ratio_excluding_leavers != null)
    ? r.total.loss_ratio - r.loss_ratio_excluding_leavers : null;
  const verdict = moved == null ? ''
    : Math.abs(moved) < 0.02
      ? `<div class="hint" style="margin-top:10px;">Taking the deleted members out barely moves the ratio
         (${pct(r.total.loss_ratio)} &rarr; ${pct(r.loss_ratio_excluding_leavers)}). The base rate is
         what it is &mdash; renewing on headcount carries it into the new year.</div>`
      : `<div class="hint" style="margin-top:10px;">Taking the leavers out moves the ratio
         ${pct(r.total.loss_ratio)} &rarr; <strong>${pct(r.loss_ratio_excluding_leavers)}</strong>.
         Last year's headline overstates what the active ${c.member_count} actually cost.</div>`;

  area.innerHTML = `
    <div class="card">
      <h3>Active vs deleted members &mdash; last year's claims</h3>
      <div class="hint">A member whose cover runs to the cut date is active; one whose cover ended
        earlier is deleted. A deleted member's premium is earned for part of a year while their
        claims are not, so their own ratio runs high even when their claims are ordinary.</div>
      <div style="margin:10px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <label style="font-size:12px; color:var(--muted);">Cut date</label>
        <input type="date" id="rb-cut-date" value="${escapeHtml(String(r.as_at || ''))}"
               onchange="_rbSetCutDate(this.value)">
        <span class="hint" style="margin:0;">${r.cut_date_source === 'supplied'
          ? 'set for this renewal'
          : "taken from the roster - the date most members' cover runs to"}</span>
        ${_rbCutDate ? `<button onclick="_rbSetCutDate('')">Reset</button>` : ''}
      </div>
      ${r.warning ? `<div class="hint" style="background:#fbf3e6;border-left:3px solid #c98a2b;
         padding:9px 12px;margin-bottom:10px;color:#8a5f1e;">${escapeHtml(r.warning)}</div>` : ''}
      <table style="margin-top:12px;">
        <tr><th></th><th class="num">Active</th><th class="num">Deleted</th><th class="num">Total</th></tr>
        <tr><td>Members</td><td class="num">${c.member_count}</td><td class="num">${l.member_count}</td>
            <td class="num">${r.total.member_count}</td></tr>
        <tr><td>Paid</td><td class="num">${aed(c.paid)}</td><td class="num">${aed(l.paid)}</td>
            <td class="num">${aed((c.paid || 0) + (l.paid || 0))}</td></tr>
        <tr><td>Outstanding</td><td class="num">${aed(c.outstanding)}</td><td class="num">${aed(l.outstanding)}</td>
            <td class="num">${aed((c.outstanding || 0) + (l.outstanding || 0))}</td></tr>
        <tr class="total"><th>Incurred</th><td class="num"><strong>${aed(c.incurred)}</strong></td>
            <td class="num"><strong>${aed(l.incurred)}</strong></td>
            <td class="num"><strong>${aed(r.total.incurred)}</strong></td></tr>
        <tr><td>Earned premium</td><td class="num">${aed(c.earned_premium)}</td>
            <td class="num">${aed(l.earned_premium)}</td>
            <td class="num">${aed(r.total.earned_premium)}</td></tr>
        <tr><td>Annual premium (what the renewal is quoted against)</td>
            <td class="num">${aed(c.premium)}</td><td class="num">${aed(l.premium)}</td>
            <td class="num">${aed(r.total.premium)}</td></tr>
        <tr><td>Claims per member</td><td class="num">${aed(c.claims_per_member)}</td>
            <td class="num">${aed(l.claims_per_member)}</td><td class="num">&mdash;</td></tr>
        <tr><td>Members who claimed</td><td class="num">${c.members_who_claimed}</td>
            <td class="num">${l.members_who_claimed}</td><td class="num">&mdash;</td></tr>
        <tr class="total"><th>Loss ratio</th><td class="num"><strong>${pct(c.loss_ratio)}</strong></td>
            <td class="num">${pct(l.loss_ratio)}</td>
            <td class="num">${pct(r.total.loss_ratio)}</td></tr>
      </table>
      <div class="hint" style="margin-top:8px;">Measured to
        ${escapeHtml(String(r.as_of || ''))}${r.as_of_source === 'supplied' ? ''
          : ', the last day the claims export covers'} &mdash; claims to that day over premium
        earned to the same day. Against the full annual premium the same figures read
        ${pct(r.total.loss_ratio_on_annual_premium)}, which is a part year's claims over a whole
        year's premium and is not a loss ratio.</div>
      <div class="hint" style="margin-top:8px;">Deleted members are ${pct(r.leaver_share_of_members)}
        of the roster and ${pct(r.leaver_share_of_claims)} of the claims.</div>
      ${verdict}
    </div>`;
}
// The census the broker has sent for the renewal, against the roster
// the book holds. The two rarely match, and the difference is the
// account's shape at renewal - who is walking out and what they cost.
//
// The comparison is always shown twice: on the book's roster the
// account is what it has been, on the broker's list it is what it will
// be. The second is usually the better-looking figure, and showing it
// alone would be a discount with no argument attached to it.
let _rbCensusResult = null;
let _rbCensusInclude = [];
let _rbCensusFile = null;

// The other contracts the census reached into, read back off the last
// result rather than baked into an onclick - a contract name carrying a
// quote would break the attribute it was written into.
function _rbCensusSiblings() {
  const accounts = (_rbCensusResult && _rbCensusResult.on_other_contracts
    && _rbCensusResult.on_other_contracts.accounts) || [];
  return accounts.map(a => a.master_client).filter(Boolean);
}

function _rbCensusRender() {
  const area = document.getElementById('renewal-bench-census-comparison-area');
  if (!area) return;
  const r = _rbCensusResult;
  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';

  const uploader = `
    <div style="margin:10px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <input type="file" id="rb-census-file" accept=".xlsx,.xls,.csv" style="max-width:320px;">
      <button class="primary" onclick="uploadRenewalCensus()">${r ? 'Compare a different file' : 'Compare against the book'}</button>
      <span id="rb-census-status" class="hint" style="margin:0;">${r && _rbCensusFile
        ? 'Loaded: ' + escapeHtml(_rbCensusFile.name) : ''}</span>
    </div>`;

  if (!r) {
    area.innerHTML = `
      <div class="card">
        <h3>Broker's renewal census vs the book</h3>
        <div class="hint">Upload the census the broker has sent for the renewal. Members are matched
          on their own reference, and the year is measured twice &mdash; once on the roster the book
          holds, once on the roster the broker has sent &mdash; so what the difference is worth is
          visible rather than assumed. Nothing is saved to the case.</div>
        ${uploader}
      </div>`;
    return;
  }

  // Everything the census carries that this account's roster does not.
  // Most of it is usually a sibling contract rather than a new life, and
  // the two price completely differently: a joiner has no history at all.
  const other = r.on_other_contracts || {member_count: 0, accounts: []};
  const siblings = other.accounts.map(a => `
      <tr><td>${escapeHtml(a.master_client || '')}</td>
          <td class="num">${a.member_count}</td></tr>`).join('');
  const siblingBlock = other.member_count ? `
    <div class="hint" style="background:#fbf3e6;border-left:3px solid #c98a2b;
         padding:9px 12px;margin:10px 0;color:#8a5f1e;">
      ${escapeHtml(other.note || '')}
      <table style="margin-top:8px;background:transparent;">
        <tr><th>Contract</th><th class="num">On the census</th></tr>${siblings}
      </table>
      <div style="margin-top:8px;">
        <button onclick="uploadRenewalCensus(_rbCensusSiblings())">Price the group as one contract</button>
      </div>
    </div>` : '';

  const scenario = (d, label, note) => `
      <tr><th style="text-align:left;">${label}<div class="hint" style="margin:2px 0 0;font-weight:400;">${note}</div></th>
          <td class="num">${d.active_member_count}</td>
          <td class="num">${aed(d.paid)}</td>
          <td class="num">${aed(d.outstanding)}</td>
          <td class="num">${aed(d.ibnr)}</td>
          <td class="num"><strong>${aed(d.incurred)}</strong></td>
          <td class="num">${aed(d.earned_premium)}</td>
          <td class="num"><strong>${pct(d.loss_ratio)}</strong></td></tr>`;

  const book = r.on_book_roster, census = r.on_supplied_census;
  const moved = (book.loss_ratio != null && census.loss_ratio != null)
    ? book.loss_ratio - census.loss_ratio : null;

  const leavers = (r.leaving.members || []).map(m => `
      <tr><td>${escapeHtml(String(m.beneficiary_id || ''))}</td>
          <td>${escapeHtml(String(m.relation || ''))}</td>
          <td class="num">${m.age == null ? '&mdash;' : m.age}</td>
          <td class="num">${aed(m.claims)}</td>
          <td class="num">${aed(m.annual_rate)}</td></tr>`).join('');

  area.innerHTML = `
    <div class="card">
      <h3>Broker's renewal census vs the book</h3>
      <div class="hint">${escapeHtml(String(r.filename || 'census'))} &mdash; ${r.rows_read} rows,
        ${r.rows_with_a_reference} carrying a member reference. Matched on reference alone; where the
        two files share no identifiers this says so rather than pairing on age and relation.</div>
      ${uploader}
      ${r.warning ? `<div class="hint" style="background:#fdecea;border-left:3px solid #c0392b;
         padding:9px 12px;margin:10px 0;color:#922b21;">${escapeHtml(r.warning)}</div>` : ''}
      ${(r.also_included || []).length ? `<div class="hint" style="margin:10px 0;">Priced as one
         contract with ${escapeHtml((r.also_included || []).join(', '))}.</div>` : ''}

      <table style="margin-top:12px;">
        <tr><th></th><th class="num">Members</th><th class="num">Claims</th><th class="num">Annual premium</th></tr>
        <tr><td>On both &mdash; staying</td><td class="num">${r.staying.member_count}</td>
            <td class="num">${aed(r.staying.claims)}</td><td class="num">${aed(r.staying.premium)}</td></tr>
        <tr><td>On the book, not on the census &mdash; leaving</td><td class="num">${r.leaving.member_count}</td>
            <td class="num">${aed(r.leaving.claims)}</td><td class="num">${aed(r.leaving.premium)}</td></tr>
        ${(r.returning && r.returning.member_count) ? `
        <tr><td>Off risk before the cut date, back on the census &mdash; returning</td>
            <td class="num">${r.returning.member_count}</td>
            <td class="num">${aed(r.returning.claims)}</td>
            <td class="num">${aed(r.returning.premium)}</td></tr>` : ''}
        <tr><td>On the census, nowhere on the book &mdash; joining</td>
            <td class="num">${r.joining.member_count}</td>
            <td class="num">&mdash;</td><td class="num">&mdash;</td></tr>
        <tr class="total"><th>Book active / census rows</th>
            <td class="num"><strong>${r.book_active_count} / ${r.supplied_count}</strong></td>
            <td class="num">&mdash;</td><td class="num">&mdash;</td></tr>
      </table>
      <div class="hint" style="margin-top:8px;">Joiners have no claims history on this book, so they
        price off the rate card rather than off experience.${(r.joining.references || []).length
          ? ' ' + escapeHtml(r.joining.references.slice(0, 20).join(', '))
            + (r.joining.references.length > 20 ? ` and ${r.joining.references.length - 20} more.` : '.')
          : ''}</div>
      ${siblingBlock}

      <h4 style="margin-top:18px;">The year measured both ways</h4>

async function uploadRenewalCensus(include) {
  const input = document.getElementById('rb-census-file');
  const statusEl = document.getElementById('rb-census-status');
  // Widening to the sibling contracts, and changing the cut date, both
  // re-run the file already chosen. Rendering the result replaces the
  // file input with an empty one and a file input cannot be repopulated
  // from script, so the File itself is what is kept - reading it back
  // off the input made both of those silently do nothing.
  if (input && input.files.length) _rbCensusFile = input.files[0];
  if (!_rbCensusFile) { toast('Choose the broker\'s census file first', true); return; }
  _rbCensusInclude = include || [];

  const form = new FormData();
  form.append('file', _rbCensusFile);
  const params = new URLSearchParams();
  if (_rbCutDate) params.set('as_at', _rbCutDate);
  _rbCensusInclude.forEach(name => params.append('include', name));
  const q = params.toString() ? `?${params}` : '';

  if (statusEl) { statusEl.textContent = 'Comparing...'; statusEl.className = 'hint'; }
  try {
    _rbCensusResult = await api(
      `/portfolio-analysis/renewal-census-comparison/${encodeURIComponent(currentCase.company_name)}${q}`,
      { method: 'POST', body: form });
    _rbCensusRender();
  } catch (err) {
    if (statusEl) { statusEl.textContent = 'Comparison failed'; statusEl.className = 'status-err'; }
    toast(err.message, true);
  }
}

function loadRenewalBenchCensusComparison() {
  // Only the empty uploader until a file is given - this reads a file
  // the portal does not hold, so there is nothing to load.
  _rbCensusResult = null;
  _rbCensusInclude = [];
  _rbCensusFile = null;
  _rbCensusRender();
}

   than from a scaling of last year's premium. The two judgement inputs
   (what won't repeat, what to provide for) are editable here because
   they ARE judgements - a completed maternity is over, but the group
   still contains members who may deliver, and only an underwriter can
   say which.

   this one, which threw on every load of the bench. */
let renewalPricingInputs = { trend: 10, loading: null, nonRecurring: 0, provision: 0 };

async function loadRenewalPremiumBuildUp() {
  const area = document.getElementById('renewal-premium-buildup-area');

    if (renewalPricingInputs.loading != null) p.set('loading_pct', (renewalPricingInputs.loading / 100).toString());
    const r = await api(`/cases/${currentCase.id}/renewal-premium?${p}`);

    const rows = r.build_up.map((s, i) => `

        <div class="rb-card-sub">A third reading alongside Methods A and B above, and it will not agree with them - deliberately. Methods A and B price the whole expiring ledger; this one prices only the members who are actually renewing, with the leavers' claims taken out and the underwriter's own non-recurring judgement applied. Where it comes in lower, the difference IS the claims that walked out the door. Use A or B when no renewal census has been uploaded yet and there is no way to tell who stayed.</div>
        <div class="rb-kpi-strip" style="margin-top:14px;">
          ${_rbKpi('Required premium', money(r.gross_premium), `${r.member_count} members`)}
          ${_rbKpi('Per member', money(r.premium_per_member), 'annual')}
          ${_rbKpi('Expiring premium', money(r.expiring_premium), r.expiring_premium ? '' : 'not set on the case')}
          ${_rbKpi('Change', inc == null ? '-' : `${inc > 0 ? '+' : ''}${inc}%`, inc == null ? 'set the expiring premium to compare' : (inc > 0 ? 'increase required' : 'reduction possible'))}
        </div>
        <div class="row" style="align-items:flex-end; margin-top:14px; gap:10px;">
          <div><label>Trend %</label><input type="number" step="0.5" value="${renewalPricingInputs.trend}" style="width:80px;"
            onchange="renewalPricingInputs.trend = parseFloat(this.value) || 0; loadRenewalPremiumBuildUp();"></div>
          <div><label>Loading %</label><input type="number" step="0.5" value="${(r.loading_pct * 100).toFixed(1)}" style="width:80px;"
            onchange="renewalPricingInputs.loading = parseFloat(this.value); loadRenewalPremiumBuildUp();"></div>
          <div><label>Non-recurring (AED)</label><input type="number" step="1000" value="${renewalPricingInputs.nonRecurring}" style="width:130px;"
            onchange="renewalPricingInputs.nonRecurring = parseFloat(this.value) || 0; loadRenewalPremiumBuildUp();"></div>
          <div><label>Forward provision (AED)</label><input type="number" step="1000" value="${renewalPricingInputs.provision}" style="width:140px;"
            onchange="renewalPricingInputs.provision = parseFloat(this.value) || 0; loadRenewalPremiumBuildUp();"></div>
        </div>
        <div class="hint">Non-recurring takes out cost that is genuinely over - a completed maternity, a one-off event. Forward provision puts back cost the group is still exposed to but has not yet incurred. They stay separate lines so each can be defended on its own.</div>

  } catch (err) {

  }

/* ---------------- Loss Ratio board (portfolio level) ---------------- */

let lrState = { rows: [], totals: null, shed: null, shedCumulative: [], sort: 'net_loss_ratio', dir: 'desc', asOf: null, basis: 'actual', yearBasis: 'underwriting', status: '', groupBy: 'master_client', products: ['Platinum', 'Gold', 'Silver', 'Bronze'] };

function _lrMoney(v, dp) {
  if (v == null) return '-';
  return Number(v).toLocaleString(undefined, { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
}

function _lrPct(v) {
  return v == null ? '-' : (v * 100).toFixed(1) + '%';
}

// Underwriting's own read on a loss ratio: at or under 70% the account is
// funding itself comfortably, 70-100% is thin, and over 100% the claims
// alone exceed the premium before any expense load is even applied.
function _lrBand(ratio) {
  if (ratio == null) return '';
  if (ratio > 1) return 'bad';
  if (ratio >= 0.7) return 'warn';
  return 'good';
}

function _lrRatioCell(ratio) {
  if (ratio == null) return '<td class="num">-</td>';
  const band = _lrBand(ratio);
  const colorVar = band === 'bad' ? 'var(--lr-bad)' : band === 'warn' ? 'var(--lr-warn)' : 'var(--lr-good)';
  // Bar is scaled so 100% sits at two-thirds width - the tick mark - so an
  // account running over 100% visibly overshoots it rather than saturating.
  const pct = Math.min(100, ratio / 1.5 * 100);
  return `
    <td class="num">
      <div style="display:flex; align-items:center; gap:8px; justify-content:flex-end;">
        <div class="lr-bar"><span style="width:${pct.toFixed(1)}%; background:${colorVar};"></span><i class="mark" style="left:66.6%"></i></div>
        <span class="lr-chip ${band}">${_lrPct(ratio)}</span>
      </div>
    </td>
  `;
}

function _lrSortRows(rows) {
  const key = lrState.sort, dir = lrState.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;   // nulls always last, regardless of direction
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
}

function lrSortBy(key) {
  if (lrState.sort === key) lrState.dir = lrState.dir === 'asc' ? 'desc' : 'asc';
  else { lrState.sort = key; lrState.dir = 'desc'; }
  document.getElementById('lr-table-area').innerHTML = _lrTableHtml();
}

function _lrTh(key, label, cls) {
  const active = lrState.sort === key;
  const arrow = active ? (lrState.dir === 'asc' ? ' ↑' : ' ↓') : '';
  return `<th class="${cls || ''}" style="cursor:pointer; ${active ? 'color:var(--lr-ink);' : ''}" onclick="lrSortBy('${key}')">${escapeHtml(label)}${arrow}</th>`;
}

function _lrTableHtml() {
  const rows = _lrSortRows(lrState.rows);
  const t = lrState.totals;
  if (!rows.length) {
    return '<div class="lr-card"><div class="lr-empty">No accounts to report yet - upload the Membership and Claims exports on the Claims Explorer screen first.</div></div>';
  }
  // Account Dashboard is keyed by resolved master client, not by raw
  // subgroup - "by subgroup" rows carry a subgroup's own name in this
  // same field, and linking that through would open the wrong account
  // (or nothing at all). Plain text there instead of a broken link.
  const grouped = lrState.groupBy !== 'client';
  const body = rows.map(r => `
    <tr>
      <td class="lr-acct">${grouped
          ? `<a class="rdl-name" onclick="openAccountDashboard(${escapeHtml(JSON.stringify(r.master_client))})">${escapeHtml(r.master_client)}</a>`

        }${r.expired ? `<span class="lr-exp">${lrState.yearBasis === 'calendar' ? 'closed' : 'expired'}</span>` : ''}<span class="yr">${r.calendar_year != null ? 'CY ' + r.calendar_year : r.policy_start_date} &middot; ${r.days} days &middot; ${r.member_count} lives</span></td>
      <td class="num">${_lrMoney(r.paid)}</td>

      <td class="num">${_lrMoney(r.ibnr)}</td>
      <td class="num" style="font-weight:600;">${_lrMoney(r.incurred_claims)}</td>
      <td class="num">${_lrPct(r.loading_pct)}</td>
      <td class="num">${_lrMoney(r.gross_premium)}</td>
      <td class="num">${_lrMoney(r.earned_premium)}</td>
      <td class="num">${_lrMoney(r.net_premium)}</td>
      ${_lrRatioCell(r.gross_loss_ratio)}
      ${_lrRatioCell(r.net_loss_ratio)}
    </tr>
  `).join('');
  return `
    <div class="lr-card">
      <div class="lr-card-head">
        <div>
          <div class="lr-card-title">Loss ratio by ${grouped ? 'account' : 'subgroup'}</div>
          <div class="lr-card-note">${lrState.yearBasis === 'calendar'
            ? 'One row per account per calendar year - a policy spanning a year end is split across both by the days in each. Click any column to sort.'

            ${grouped ? '' : ' Grouping is off - a master client with several subgroups shows one row per subgroup rather than combined.'}</div>
        </div>
        <div class="lr-card-note">Basis: <b>${lrState.yearBasis === 'calendar' ? 'Calendar year' : 'Underwriting year'}</b> &middot; <b>${lrState.basis === 'booked' ? 'Booked gross' : 'Actual gross'}</b>
          ${lrState.status ? ` &middot; <b>${lrState.status === 'active' ? 'Active only' : 'Expired only'}</b>` : ''}
          &middot; Product: <b>${(lrState.products || []).length ? escapeHtml(lrState.products.join(', ')) : 'none selected'}</b>
          &middot; Incurred = Paid + Outstanding + IBNR &middot; IBNR = Paid &divide; days &times; 30 &middot; Net = Earned &times; (1 &minus; Loading)</div>
      </div>
      <div class="lr-table-wrap">
        <table class="lr-table">
          <thead><tr>
            ${_lrTh('master_client', 'Account')}
            ${_lrTh('paid', 'Paid', 'num')}
            ${_lrTh('outstanding', 'OS', 'num')}
            ${_lrTh('ibnr', 'IBNR', 'num')}
            ${_lrTh('incurred_claims', 'Incurred', 'num')}
            ${_lrTh('loading_pct', 'Loading', 'num')}
            ${_lrTh('gross_premium', 'Gross prem.', 'num')}
            ${_lrTh('earned_premium', 'Earned prem.', 'num')}
            ${_lrTh('net_premium', 'Net prem.', 'num')}
            ${_lrTh('gross_loss_ratio', 'Gross LR', 'num')}
            ${_lrTh('net_loss_ratio', 'Net LR', 'num')}
          </tr></thead>
          <tbody>${body}</tbody>
          ${t ? `<tfoot><tr>
            <td class="lbl">Book total &middot; ${t.account_count} accounts &middot; ${t.member_count.toLocaleString()} lives</td>
            <td class="num">${_lrMoney(t.paid)}</td>
            <td class="num">${_lrMoney(t.outstanding)}</td>
            <td class="num">${_lrMoney(t.ibnr)}</td>
            <td class="num">${_lrMoney(t.incurred_claims)}</td>
            <td class="num">-</td>
            <td class="num">${_lrMoney(t.gross_premium)}</td>
            <td class="num">${_lrMoney(t.earned_premium)}</td>
            <td class="num">${_lrMoney(t.net_premium)}</td>
            <td class="num">${_lrPct(t.gross_loss_ratio)}</td>
            <td class="num">${_lrPct(t.net_loss_ratio)}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    </div>
  `;
}
