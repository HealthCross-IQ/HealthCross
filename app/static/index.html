}

function nbBurningCostReferenceHtml(cat) {
  if (!cat.product || !cat.network) return '';
  const ref = nbBurningCostByProductNetwork[`${cat.product}|${cat.network}`];
  if (!ref || ref.burning_cost == null) return '';
  return `
    <div class="hint" style="margin-top:8px;">
      <span class="tier-pill dir-review" style="margin-right:6px;">Book reference</span>
      HealthCross's own already-booked members on ${escapeHtml(cat.product)} / ${escapeHtml(cat.network)}
      run an actual burning cost of <strong>AED ${ref.burning_cost.toLocaleString()}</strong> per member per year
      (${ref.member_count.toLocaleString()} members, ${ref.earned_member_years.toLocaleString()} earned member-years) -
      from Portfolio Analysis, for comparison against this quote's rated price, not a substitute for it.
    </div>
  `;
}

function nbSetProduct(idx, product) {
  nbCategories[idx].product = product;
  nbCategories[idx].network = '';
  nbCategories[idx].tpa = '';
  nbCategories[idx].variantOptions = null;
  // variant_selections deliberately kept, not reset - a selection that no
  // longer has a matching priced option under the new Product/Network
  // simply isn't applied (see price_member's own fallback-to-base
  // behavior, which already warns rather than erroring), so there's no
  // correctness risk in preserving picks that do still carry over.
  nbRenderArea();
}

async function nbSetNetwork(idx, value) {
  if (!value) { nbCategories[idx].network = ''; nbCategories[idx].tpa = ''; nbCategories[idx].variantOptions = null; nbRenderArea(); return; }
  const [network, tpa] = value.split('|');
  nbCategories[idx].network = network;
  nbCategories[idx].tpa = tpa;
  await nbFetchVariantOptions(idx);
  nbRenderArea();
}

async function nbSetPreviewRegion(idx, region) {
  nbCategories[idx].previewRegion = region;
  await nbFetchVariantOptions(idx);
  nbRenderArea();
}

async function nbFetchVariantOptions(idx) {
  const cat = nbCategories[idx];
  if (!cat.network) return;
  try {
    cat.variantOptions = await api(`/new-business/variant-options?region=${encodeURIComponent(cat.previewRegion)}&tpa=${encodeURIComponent(cat.tpa)}&network=${encodeURIComponent(cat.network)}`);
  } catch (err) {
    cat.variantOptions = {};
  }
}

function nbSetVariantSelection(idx, variantName, value) {
  if (value) {
    nbCategories[idx].variant_selections[variantName] = value;
  } else {
    delete nbCategories[idx].variant_selections[variantName];
  }
}

function nbSetCommission(idx, value) {
  nbCategories[idx].commission_pct = value;
}

async function nbUploadFile(kind) {
  const input = document.getElementById(kind === 'pricing' ? 'nb-file-pricing' : 'nb-file-variants');
  const statusEl = document.getElementById(kind === 'pricing' ? 'nb-status-pricing' : 'nb-status-variants');
  if (!input.files.length) { toast('Choose a file first', true); return; }
  const form = new FormData();
  form.append('file', input.files[0]);
  const path = kind === 'pricing' ? '/admin/rate-cards/upload' : '/admin/benefit-variant-rates/upload';
  try {
    const result = await api(path, { method: 'POST', body: form });
    statusEl.textContent = `${result.rows_ingested} rows`;
    toast('Rate card uploaded');
    await loadNewBusinessRating();
  } catch (err) {
    toast(err.message, true);
  }
}

async function nbComputeQuote() {
  const categories = nbCategories.filter(c => c.product && c.network).map(c => ({
    category: c.category,
    product: c.product,
    network: c.network,
    tpa: c.tpa,
    commission_pct: c.commission_pct !== '' && c.commission_pct != null ? Number(c.commission_pct) / 100 : null,
    variant_selections: c.variant_selections,
  }));
  if (!categories.length) { toast('Pick a Product and Network for at least one category', true); return; }

  try {
    const quote = await api(`/cases/${currentCase.id}/new-business-quote`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ categories }),
    });
    nbLastQuote = quote;
    nbSelectedTierProduct = null; // reset to this fresh quote's own picks, not a stale what-if selection
    try {
      nbQuoteByTier = await api(`/cases/${currentCase.id}/new-business-quote/by-tier`);
    } catch (err) {
      nbQuoteByTier = null;
    }
    try {
      nbBurningCostComparison = await api(`/cases/${currentCase.id}/new-business-quote/burning-cost-comparison`);
    } catch (err) {
      nbBurningCostComparison = null;
    }
    document.getElementById('nb-result-area').innerHTML = nbResultHtml(quote);
    toast('Quote computed');
  } catch (err) {
    toast(err.message, true);
  }
}

let nbQuoteByTier = null;
let nbSelectedTierProduct = null;
let nbBurningCostComparison = null;

function _nbCategoryTableHtml(categories) {
  const warnings = [];
  categories.forEach(c => (c.warnings || []).forEach(w => warnings.push(`Category ${c.category}: ${w}`)));
  const totalMembers = categories.reduce((sum, c) => sum + c.member_count, 0);
  const totalNet = categories.reduce((sum, c) => sum + c.net_annual_premium, 0);
  const totalGross = categories.reduce((sum, c) => sum + c.gross_annual_premium, 0);
  const avgGrossPerMember = totalMembers ? totalGross / totalMembers : null;
  return `
    <table>
      <tr><th>Category</th><th>Product</th><th>Network</th><th>Members</th><th>Net premium</th><th>Loading %</th><th>Gross premium</th><th>Gross / member</th></tr>
      ${categories.map(c => `
        <tr>
          <td>${escapeHtml(c.category)}</td>
          <td>${escapeHtml(c.product)}</td>
          <td>${escapeHtml(c.network)}</td>
          <td>${c.member_count}</td>
          <td>${c.net_annual_premium.toLocaleString()}</td>
          <td>${(c.loading_pct * 100).toFixed(1)}%</td>
          <td>${c.gross_annual_premium.toLocaleString()}</td>
          <td>${c.member_count ? (c.gross_annual_premium / c.member_count).toLocaleString(undefined, {maximumFractionDigits: 2}) : '-'}</td>
        </tr>
      `).join('')}
      <tr style="font-weight:600; border-top:2px solid var(--border);">
        <th>Total / Average</th><th></th><th></th>
        <th>${totalMembers}</th>
        <th>${totalNet.toLocaleString(undefined, {maximumFractionDigits: 2})}</th>
        <th></th>
        <th>${totalGross.toLocaleString(undefined, {maximumFractionDigits: 2})}</th>
        <th>${avgGrossPerMember != null ? avgGrossPerMember.toLocaleString(undefined, {maximumFractionDigits: 2}) : '-'}</th>
      </tr>
    </table>
    ${warnings.length ? `<div class="hint" style="margin-top:10px;">${warnings.map(escapeHtml).join('<br>')}</div>` : ''}
  `;
}

function nbSelectTier(product) {
  nbSelectedTierProduct = product;
  nbRenderArea();
}

function _nbTierIconRowHtml(quote) {
  if (!nbQuoteByTier || !nbQuoteByTier.length) return '';
  const currentProducts = new Set(quote.result.categories.map(c => c.product));
  const defaultSelected = currentProducts.size === 1 ? [...currentProducts][0] : null;
  const selected = nbSelectedTierProduct || defaultSelected;
  return `
    <div class="tier-icon-row" style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      ${nbQuoteByTier.map(t => `
        <button
          class="tier-icon"
          style="flex:1; min-width:140px; text-align:left; background:var(--surface-2); border:2px solid ${t.product === selected ? 'var(--accent)' : 'var(--border)'}; border-radius:10px; padding:12px 14px; cursor:${t.case_gross_annual_premium != null ? 'pointer' : 'default'}; opacity:${t.case_gross_annual_premium != null ? '1' : '0.5'};"
          ${t.case_gross_annual_premium != null ? `onclick="nbSelectTier('${t.product}')"` : 'disabled'}
        >
          <div style="font-size:12px; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em;">${escapeHtml(t.product)}</div>
          <div style="font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:4px;">${t.case_gross_annual_premium != null ? 'AED ' + t.case_gross_annual_premium.toLocaleString() : 'Not available'}</div>
          ${t.product === selected ? '<div style="display:inline-block; margin-top:6px; font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--good-bg); color:var(--good); font-weight:700;">Current</div>' : ''}
        </button>
      `).join('')}
    </div>
  `;
}

function _nbBurningCostComparisonHtml(quote, comparison) {
  if (!comparison || !comparison.categories || !comparison.categories.length) return '';
  const warnings = [];
  comparison.categories.forEach(c => (c.warnings || []).forEach(w => warnings.push(`Category ${c.category}: ${w}`)));
  const rows = comparison.categories.map(c => {
    const variance = c.rate_card_gross_annual_premium
      ? (c.gross_annual_premium - c.rate_card_gross_annual_premium) / c.rate_card_gross_annual_premium * 100
      : null;
    return `
      <tr>
        <td>${escapeHtml(c.category)}</td>
        <td>${escapeHtml(c.product)}</td>
        <td>${escapeHtml(c.network)}</td>
        <td>${c.priced_member_count} / ${c.member_count}</td>
        <td>${c.rate_card_gross_annual_premium != null ? c.rate_card_gross_annual_premium.toLocaleString() : '-'}</td>
        <td>${c.gross_annual_premium.toLocaleString()}</td>
        <td>${variance != null ? (variance > 0 ? '+' : '') + variance.toFixed(1) + '%' : '-'}</td>
      </tr>
    `;
  }).join('');
  const caseVariance = quote.case_gross_annual_premium
    ? (comparison.case_gross_annual_premium - quote.case_gross_annual_premium) / quote.case_gross_annual_premium * 100
    : null;
  return `
    <div class="card">
      <h3>Rate card vs. booked-book burning cost</h3>
      <div class="hint">What HealthCross's own already-booked members on the same Product/Network/age band/gender actually cost in real claims, loaded with the same New Business loading - a reference for whether the rate card is running rich or thin against real experience, not something that overrides the quote itself. "Members priced" only counts members whose exact (Product, Network, age band, gender) slice has booked-book data - a low count means the book is thin for that slice.</div>
      <table>
        <tr><th>Category</th><th>Product</th><th>Network</th><th>Members priced</th><th>Rate-card gross</th><th>Burning-cost gross</th><th>Variance</th></tr>
        ${rows}
        <tr style="font-weight:600; border-top:2px solid var(--border);">
          <th>Case total</th><th></th><th></th><th></th>
          <th>${quote.case_gross_annual_premium.toLocaleString()}</th>
          <th>${comparison.case_gross_annual_premium.toLocaleString()}</th>
          <th>${caseVariance != null ? (caseVariance > 0 ? '+' : '') + caseVariance.toFixed(1) + '%' : '-'}</th>
        </tr>
      </table>
      ${warnings.length ? `<div class="hint" style="margin-top:10px;">${warnings.map(escapeHtml).join('<br>')}</div>` : ''}
    </div>
  `;
}

function nbResultHtml(quote) {
  const opp = quote.opportunity_assessment;
  const oppClass = opp ? (NB_OPPORTUNITY_CLASS[opp.verdict] || 'tier-Standard') : 'tier-Standard';
  const currentProducts = new Set(quote.result.categories.map(c => c.product));
  const defaultSelected = currentProducts.size === 1 ? [...currentProducts][0] : null;
  const selected = nbSelectedTierProduct || defaultSelected;
  const selectedTier = nbQuoteByTier && selected ? nbQuoteByTier.find(t => t.product === selected) : null;
  const shownCategories = selectedTier && selectedTier.case_gross_annual_premium != null ? selectedTier.categories : quote.result.categories;

  return `
    <div class="card">
      <h3>Quote result ${opp ? `<span class="tier-pill ${oppClass}">${escapeHtml(opp.verdict)} opportunity</span>` : ''}</h3>
      <div class="kpi-grid">
        <div class="kpi"><span class="label">Case gross annual premium</span><span class="value">AED ${quote.case_gross_annual_premium.toLocaleString()}</span></div>
        ${opp && opp.target_premium != null ? `<div class="kpi"><span class="label">Target premium</span><span class="value">AED ${opp.target_premium.toLocaleString()}</span></div>` : ''}
        ${opp && opp.target_vs_rated_variance_pct != null ? `<div class="kpi"><span class="label">Target vs. rated variance</span><span class="value">${opp.target_vs_rated_variance_pct > 0 ? '+' : ''}${opp.target_vs_rated_variance_pct}%</span></div>` : ''}
        ${opp && opp.risk_tier ? `<div class="kpi"><span class="label">Risk tier</span><span class="value">${escapeHtml(opp.risk_tier)}</span></div>` : ''}
      </div>
      ${_nbTierIconRowHtml(quote)}
      ${_nbCategoryTableHtml(shownCategories)}
    </div>
    ${_nbBurningCostComparisonHtml(quote, nbBurningCostComparison)}
  `;
}

function paComputeTotals(rows) {
  const totals = rows.reduce((acc, r) => {
    acc.member_count += r.member_count;
    acc.priced_member_count += r.priced_member_count;
    acc.standard_premium += r.standard_premium;
    acc.actual_premium += r.actual_premium;
    acc.actual_claims += r.actual_claims;
    acc.actual_claims_paid += r.actual_claims_paid || 0;
    acc.actual_claims_outstanding += r.actual_claims_outstanding || 0;
    acc.earned_member_years += r.earned_member_years;
    return acc;
  }, { member_count: 0, priced_member_count: 0, standard_premium: 0, actual_premium: 0, actual_claims: 0, actual_claims_paid: 0, actual_claims_outstanding: 0, earned_member_years: 0 });
  totals.loss_ratio_vs_standard = totals.standard_premium ? totals.actual_claims / totals.standard_premium : null;
  totals.loss_ratio_vs_actual = totals.actual_premium ? totals.actual_claims / totals.actual_premium : null;
  totals.actual_vs_standard_pct = totals.standard_premium ? (totals.actual_premium - totals.standard_premium) / totals.standard_premium * 100 : null;
  totals.burning_cost = totals.earned_member_years ? totals.actual_claims / totals.earned_member_years : null;
  return totals;
}

async function piLoadAndRender() {
  const content = document.getElementById('pi-content');
  content.innerHTML = `<div class="card"><div class="hint">Computing...</div></div>`;
  try {
    // A single combined endpoint - computing every breakdown from ONE
    // pass over the book instead of 7 separate requests each redoing the
    // full member/claims analysis from scratch, which is what made this
    // dashboard slow on a real ~3,700-member book.
    const params = new URLSearchParams();
    if (piSelectedMasterClient) params.set('master_client', piSelectedMasterClient);
    const insights = await api(`/portfolio-analysis/insights?${params.toString()}`);
    const { by_product: byProduct, by_network: byNetwork, by_nationality_zone: byNationality,
      by_relation: byRelation, by_gender: byGender, by_policy_year: byPolicyYear,
      by_category: byCategory, by_subgroup: bySubgroup, by_age_gender: ageGender } = insights;
    content.innerHTML = piContentHtml({ byProduct, byNetwork, byNationality, byRelation, byGender, byPolicyYear, byCategory, bySubgroup, ageGender });
    content.querySelectorAll('.chart-svg').forEach(svg => bindChartTooltips(svg.parentElement));
  } catch (err) {
    content.innerHTML = `<div class="card"><div class="hint">${escapeHtml(err.message)}</div></div>`;
  }
}

function piProportionItems(rows, groupByField) {
  const total = rows.reduce((sum, r) => sum + r.member_count, 0) || 1;

  return `

        <div class="kpi-grid">
          <div class="kpi"><span class="label">Policy start date</span><span class="value">${distinctStartDates.length ? escapeHtml(distinctStartDates.join(', ')) : '-'}</span></div>
          <div class="kpi"><span class="label">Product</span><span class="value">${distinctProducts.length ? escapeHtml(distinctProducts.join(', ')) : '-'}</span></div>
          <div class="kpi"><span class="label">Network</span><span class="value">${distinctNetworks.length ? escapeHtml(distinctNetworks.join(', ')) : '-'}</span></div>
          <div class="kpi"><span class="label">Subgroups</span><span class="value">${subgroupRows.length.toLocaleString()}</span></div>
        </div>
      </div>
    ` : ''}

    ${piSelectedMasterClient && subgroupRows.length > 1 ? `
      <div class="card">
        <h3>Loss ratio (actual) by subgroup</h3>
        <div class="hint">This master policy combines ${subgroupRows.length} subgroups - broken out here so a subgroup running hot doesn't get hidden inside the combined master-level figure above.</div>
        <table>
          <tr><th>Subgroup</th><th>Product</th><th>Network</th><th>Policy start date</th><th>Members</th><th>Actual premium</th><th>Claims (Paid)</th><th>Claims (Outstanding)</th><th>Actual claims</th><th>Loss ratio (actual)</th><th>Burning cost</th></tr>
          ${subgroupRows.map(r => `
            <tr>
              <td>${escapeHtml(String(r.client))}</td>
              <td>${escapeHtml(r.product || '-')}</td>
              <td>${escapeHtml(r.network || '-')}</td>
              <td>${escapeHtml(r.policy_start_date || '-')}</td>
              <td>${r.member_count.toLocaleString()}</td>
              <td>${r.actual_premium.toLocaleString()}</td>
              <td>${(r.actual_claims_paid || 0).toLocaleString()}</td>
              <td>${(r.actual_claims_outstanding || 0).toLocaleString()}</td>
              <td>${r.actual_claims.toLocaleString()}</td>
              <td>${r.loss_ratio_vs_actual != null ? (r.loss_ratio_vs_actual * 100).toFixed(1) + '%' : '-'}</td>
              <td>${r.burning_cost != null ? r.burning_cost.toLocaleString() : '-'}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    ` : ''}

    <div class="card">
      <h3>Production report by policy year</h3>
      <div class="hint">Compares cohorts by the calendar year each member's own policy started - the same client can have last year's and this year's members both present in one upload if it's already renewed.</div>
      <table>
        <tr><th>Policy year</th><th>Members</th><th>Actual premium</th><th>Claims (Paid)</th><th>Claims (Outstanding)</th><th>Actual claims</th><th>Loss ratio (actual)</th><th>Burning cost</th></tr>
        ${policyYearRows.map(r => `
          <tr>
            <td>${escapeHtml(String(r.policy_year))}</td>
            <td>${r.member_count.toLocaleString()}</td>
            <td>${r.actual_premium.toLocaleString()}</td>
            <td>${(r.actual_claims_paid || 0).toLocaleString()}</td>
            <td>${(r.actual_claims_outstanding || 0).toLocaleString()}</td>
            <td>${r.actual_claims.toLocaleString()}</td>
            <td>${r.loss_ratio_vs_actual != null ? (r.loss_ratio_vs_actual * 100).toFixed(1) + '%' : '-'}</td>
            <td>${r.burning_cost != null ? r.burning_cost.toLocaleString() : '-'}</td>
          </tr>
        `).join('')}
      </table>
    </div>

    <div class="card">
      <h3>Loss ratio (actual) by Product</h3>
      ${lossRatioItems.length ? svgBarChart(lossRatioItems, { formatValue: v => v.toFixed(1) + '%' }) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Loss ratio (actual) by Category</h3>
      <div class="hint">The member's own benefit category (e.g. Category A/B/C) - a separate dimension from Product/Network, useful when one scheme prices several tiers differently.</div>
      ${categoryLossRatioItems.length ? svgBarChart(categoryLossRatioItems, { formatValue: v => v.toFixed(1) + '%', color: 'var(--series-4)' }) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Burning cost by Network</h3>
      ${burningCostItems.length ? svgBarChart(burningCostItems, { color: 'var(--series-2)' }) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Nationality zone mix</h3>
      ${byNationality.rows.length ? svgProportionBar(piProportionItems(byNationality.rows, 'nationality_zone')) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Relation mix (employee / spouse / child)</h3>
      ${byRelation.rows.length ? svgProportionBar(piProportionItems(byRelation.rows, 'relation')) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Gender mix</h3>
      ${byGender.rows.length ? svgProportionBar(piProportionItems(byGender.rows, 'gender')) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Membership by age band</h3>
      <div class="hint">Bucketed into the same age bands the standard pricing rate card itself uses.</div>
      <div class="row" style="align-items:flex-start; flex-wrap:wrap;">
        <div style="flex:1; min-width:280px;">
          <div class="hint">Male</div>
          ${maleAgeItems.length ? svgBarChart(maleAgeItems) : '<div class="hint">No data.</div>'}
        </div>
        <div style="flex:1; min-width:280px;">
          <div class="hint">Female</div>
          ${femaleAgeItems.length ? svgBarChart(femaleAgeItems) : '<div class="hint">No data.</div>'}
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Burning cost by age band</h3>
      <div class="row" style="align-items:flex-start; flex-wrap:wrap;">
        <div style="flex:1; min-width:280px;">
          <div class="hint">Male</div>
          ${maleBurningItems.length ? svgBarChart(maleBurningItems, { color: 'var(--series-3)' }) : '<div class="hint">No data.</div>'}
        </div>
        <div style="flex:1; min-width:280px;">
          <div class="hint">Female</div>
          ${femaleBurningItems.length ? svgBarChart(femaleBurningItems, { color: 'var(--series-3)' }) : '<div class="hint">No data.</div>'}
        </div>
      </div>
    </div>
  `;
}

/* ---------------- Chat assistant (free-text Q&A over portfolio + case data) ---------------- */

let chatHistory = []; // [{role: 'user'|'assistant', text}]

function showChatAssistant() {
  currentCase = null;
  loadCases();
  document.getElementById('main').innerHTML = chatPanelHtml();
  chatRenderMessages();
  document.getElementById('chat-input').focus();
}

function chatPanelHtml() {
  return `
    <div class="card">
      <h3>Ask a question</h3>
      <div class="hint">Ask anything about the booked portfolio or the case pipeline - e.g. "which product has the worst loss ratio", "how many renewals are due this quarter", "why does zone 2 look expensive". Answered from a snapshot of the current data, not a live database query - for a fine-grained drill-down (one specific member, one specific case's full history), use Portfolio Insights or the case itself instead.</div>
      <div id="chat-messages" style="display:flex; flex-direction:column; gap:12px; max-height:55vh; overflow-y:auto; padding:4px 2px;"></div>
      <div class="row" style="margin-top:14px; align-items:flex-end;">
        <div style="flex:1;">
          <textarea id="chat-input" rows="2" placeholder="Ask a question... (Enter to send, Shift+Enter for a new line)" style="width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px; resize:vertical;" onkeydown="chatHandleKeydown(event)"></textarea>
        </div>
        <button class="primary" id="chat-send-btn" onclick="chatSend()">Ask</button>
      </div>
    </div>
  `;
}

function chatHandleKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    chatSend();
  }
}

// A markdown table row: "| a | b |" (an optional leading/trailing pipe,
// at least one interior pipe). A separator row is the same shape but every
// cell is just dashes (with optional leading/trailing colons for alignment,
// e.g. "|---|:---:|---|") - never real content, so it's recognized
// separately and consumed rather than rendered as a header/data row itself.
const _CHAT_TABLE_ROW_RE = /^\s*\|?(.+\|.+)\|?\s*$/;
const _CHAT_TABLE_SEPARATOR_RE = /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/;

function _chatTableCells(line) {
  let trimmed = line.trim();
  if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
  if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
  return trimmed.split('|').map(c => c.trim());
}

// Renders the markdown Claude's own answers actually use - bold, bullet
// lines, and (most importantly for data-heavy answers) tables - as real
// HTML rather than showing the raw "| a | b |" / "**bold**" syntax
// verbatim. Each cell/line is escaped individually before being placed in
// the output, so nothing from the model's own text is ever raw HTML.
function chatFormatText(text) {
  const lines = text.split('\n');
  const blocks = [];
  let i = 0;
  while (i < lines.length) {
    if (_CHAT_TABLE_ROW_RE.test(lines[i]) && lines[i + 1] && _CHAT_TABLE_SEPARATOR_RE.test(lines[i + 1])) {
      const header = _chatTableCells(lines[i]);
      let j = i + 2;
      const rows = [];
      while (j < lines.length && _CHAT_TABLE_ROW_RE.test(lines[j]) && !_CHAT_TABLE_SEPARATOR_RE.test(lines[j])) {
        rows.push(_chatTableCells(lines[j]));
        j++;
      }
      const headerRow = `<tr>${header.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>`;
      const dataRows = rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('');
      blocks.push(`<div style="overflow-x:auto; margin:6px 0;"><table>${headerRow}${dataRows}</table></div>`);
      i = j;
    } else {
      let line = escapeHtml(lines[i]);
      line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      line = line.replace(/^- (.+)$/, '&bull; $1');
      blocks.push(line);
      i++;
    }
  }
  return blocks.join('\n');
}

function chatMessageHtml(msg) {
  const isUser = msg.role === 'user';
  return `
    <div style="align-self:${isUser ? 'flex-end' : 'flex-start'}; max-width:${isUser ? '80%' : '95%'};">
      <div class="hint" style="margin-bottom:2px; ${isUser ? 'text-align:right;' : ''}">${isUser ? 'You' : 'Assistant'}</div>
      <div style="padding:10px 14px; border-radius:10px; background:${isUser ? 'var(--accent)' : 'var(--surface-2)'}; color:${isUser ? 'var(--accent-ink)' : 'var(--ink)'}; white-space:pre-wrap; font-size:13.5px; line-height:1.5;">${chatFormatText(msg.text)}</div>
    </div>
  `;
}

function chatRenderMessages() {
  const area = document.getElementById('chat-messages');
  if (!area) return;
  area.innerHTML = chatHistory.length
    ? chatHistory.map(chatMessageHtml).join('')
    : '<div class="empty-state">No questions asked yet.</div>';
  area.scrollTop = area.scrollHeight;
}

async function chatSend() {
  const input = document.getElementById('chat-input');
  const question = input.value.trim();
  if (!question) return;

  chatHistory.push({ role: 'user', text: question });
  chatHistory.push({ role: 'assistant', text: 'Thinking...' });
  input.value = '';
  chatRenderMessages();

  const sendBtn = document.getElementById('chat-send-btn');
  sendBtn.disabled = true;
  try {
    const result = await api('/chat/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    chatHistory[chatHistory.length - 1] = { role: 'assistant', text: result.answer };
  } catch (err) {
    chatHistory[chatHistory.length - 1] = { role: 'assistant', text: `Couldn't get an answer: ${err.message}` };
  } finally {
    sendBtn.disabled = false;
    chatRenderMessages();
    document.getElementById('chat-input').focus();
  }
}

showNewCaseForm();
</script>
</body>
</html>
