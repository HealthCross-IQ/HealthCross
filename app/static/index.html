function _completenessPillHtml(label, done, required, extra, missingText) {
  const cls = done ? 'dir-improved' : (required ? 'dir-review' : 'dir-same');
  const text = done ? `${label}: ${extra}` : `${label}: ${missingText || (required ? 'Missing' : 'Not uploaded')}`;
  return `<span class="tier-pill ${cls}" style="margin-right:6px; margin-bottom:6px;">${escapeHtml(text)}</span>`;
}

function _statTileHtml(label, value, sub) {
  return `
    <div style="flex:1; min-width:150px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
      <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">${escapeHtml(label)}</div>
      <div style="font-size:20px; font-weight:700;">${value}</div>
      ${sub ? `<div style="font-size:11px; color:var(--ink-muted); margin-top:4px;">${sub}</div>` : ''}
    </div>
  `;
}

/* Exports that only mean something on a renewal. A new-business case has
   no expiring premium to renew from, so a "Renewal Summary" printed on
   one is an empty document with a confident name on it.

   Nothing carries data-renewal-only at the moment: the renewal documents
   now live on the Renewal Bench, which is itself only shown on a
   renewal, so the tab does the gating. Kept because the mechanism is the
   right one for anything renewal-only that lands on a SHARED tab. */
function applyBusinessTypeVisibility() {
  const isRenewal = currentCase && currentCase.business_type === 'existing';
  document.querySelectorAll('[data-renewal-only]').forEach(el => {
    el.style.display = isRenewal ? '' : 'none';
  });
}

async function loadExecutiveSummary() {
  const card = document.getElementById('executive-summary-card');
  if (!card) return;
  try {
    const s = await api(`/cases/${currentCase.id}/executive-summary`);
    const tiles = [];
    const census = s.census_summary;
    tiles.push(_statTileHtml('Members', census ? census.total_members : '-', census ? `avg age ${census.avg_age ?? '-'}` : 'No census yet'));

    const premiumLabel = s.account_type === 'renewal' ? 'Current annual premium' : 'Quoted premium';
    const premiumValue = s.account_type === 'renewal' ? s.premium.current_annual_premium : s.premium.target_premium;
    tiles.push(_statTileHtml(
      premiumLabel,
      premiumValue != null ? `AED ${premiumValue.toLocaleString()}` : '-',
      s.premium.premium_per_member != null ? `AED ${s.premium.premium_per_member.toLocaleString()} / member` : ''
    ));

    if (s.account_type === 'renewal' && s.renewal) {
      tiles.push(_statTileHtml('Actual loss ratio', `${(s.renewal.actual_loss_ratio * 100).toFixed(1)}%`, `required premium AED ${s.renewal.required_premium.toLocaleString()}`));
      tiles.push(_statTileHtml(
        'Renewal increase',
        `${s.renewal.renewal_increase_pct > 0 ? '+' : ''}${s.renewal.renewal_increase_pct}%`,
        s.benchmark && s.benchmark.comparable_case_count ? `book median: ${s.benchmark.median_renewal_increase_pct}%` : 'no book comparison yet'
      ));
    }

    if (s.burning_cost) {
      const change = s.burning_cost.change_pct;
      const changeText = change != null ? `${change > 0 ? '+' : ''}${change}% vs. prior year` : 'no prior year on file';
      tiles.push(_statTileHtml('Burning cost / member', `AED ${s.burning_cost.latest_per_member.toLocaleString()}`, changeText));
    }

    if (s.account_type === 'new_business' && s.new_business_benchmark) {
      const nbb = s.new_business_benchmark;
      tiles.push(_statTileHtml(
        'Quote vs. book',
        `${nbb.percentile}th percentile`,
        `book median AED ${nbb.book_median_premium_per_member.toLocaleString()}/member (${nbb.comparable_case_count} case${nbb.comparable_case_count === 1 ? '' : 's'})`
      ));
    }

    const accountTypeLabel = s.account_type === 'renewal' ? 'Renewal' : 'New business';
    card.innerHTML = `
      <h3>Executive summary <span class="tier-pill ${s.account_type === 'renewal' ? 'dir-review' : 'dir-same'}">${accountTypeLabel}</span></h3>
      <div class="row" style="flex-wrap:wrap; gap:12px; margin-top:8px;">${tiles.join('')}</div>
    `;
  } catch (err) {
    card.innerHTML = '';
  }
}

async function loadCaseCompleteness() {
  const card = document.getElementById('case-completeness-card');
  if (!card) return;
  try {
    const s = await api(`/cases/${currentCase.id}/completeness`);
    const isRenewal = currentCase.business_type === 'existing';
    const pills = [
      _completenessPillHtml('Census', s.has_census, true, `${s.census_count} member${s.census_count === 1 ? '' : 's'}`),
      _completenessPillHtml('Benefits', s.has_benefits, true, `${s.existing_benefit_plan_count} plan${s.existing_benefit_plan_count === 1 ? '' : 's'}`),
      _completenessPillHtml('Claims', s.has_claims, false, `${s.claims_record_count + s.claims_report_count} record(s)`),
      isRenewal ? _completenessPillHtml('Claims ledger', s.has_claims_ledger, true, `${s.claims_ledger_entry_count} entries`) : '',
      _completenessPillHtml('Quote', s.has_quote, false, `${s.quoted_benefit_plan_count} categor${s.quoted_benefit_plan_count === 1 ? 'y' : 'ies'}`),
      _completenessPillHtml('Scorecard', s.has_scorecard, false, s.latest_risk_tier || 'computed', 'Not computed yet'),
    ].join('');
    card.innerHTML = `
      <h3>Case status</h3>
      <div class="hint">${s.ready_to_score ? 'Census and benefits are both in - ready to score.' : 'Upload Census and Benefits to compute a scorecard.'}</div>
      <div style="margin-top:8px;">${pills}</div>
    `;
    _renderUploadsSummary(s, isRenewal);
  } catch (err) {
    card.innerHTML = '';
  }
}

/* The upload block collapses once nothing REQUIRED is missing, and opens
   by itself when something is. The drop zone earns its space on exactly
   the day it is needed and gets out of the way on all the others.

   Required means required to price: census and benefits always, and the
   claims ledger on a renewal. Claims, quote and scorecard are useful and
   their absence is not a reason to keep 400px of upload UI open. */
function _renderUploadsSummary(s, isRenewal) {
  const block = document.getElementById('case-uploads');
  const summary = document.getElementById('case-uploads-summary');
  if (!block || !summary) return;

  const required = [
    { label: 'Census', has: s.has_census, count: `${s.census_count} members` },
    { label: 'Benefits', has: s.has_benefits, count: `${s.existing_benefit_plan_count} plans` },
  ];
  if (isRenewal) {
    required.push({ label: 'Claims ledger', has: s.has_claims_ledger,
                    count: `${s.claims_ledger_entry_count} entries` });
  }
  const missing = required.filter(r => !r.has);
  const chips = required.filter(r => r.has)
    .map(r => `<span class="u-chip">${escapeHtml(r.label.toLowerCase())} ${escapeHtml(r.count)}</span>`)
    .join('');

  summary.innerHTML = missing.length
    ? `<span class="u-missing">&#9888; ${missing.map(m => escapeHtml(m.label)).join(', ')} still needed</span>${chips}`
    : `<span class="u-ok">&check; Everything required is on file</span>${chips}`;

  // Only steered while the user has not touched it themselves - toggling
  // a block open under someone who just closed it is worse than leaving
  // it shut.
  if (!block.dataset.userToggled) {
    block.open = missing.length > 0;
  }
}

// The four loading components a renewal cannot be priced without, and
// which of them this case has never been asked. Mirrors
// renewal_loading_problems on the server - null is unanswered, 0 is an
// answer, because direct business really does pay no commission.
function _missingFeeFields(c) {
  return [
    ['tpa_fee_pct', 'TPA Fee'],
    ['commission_pct', 'Commission'],
    ['hc_fee_pct', 'HC Fee'],
    ['qic_fee_pct', 'QIC Fee'],
  ].filter(([field]) => c[field] == null).map(([, label]) => label);
}

async function saveCaseDetails() {
  const premiumValue = _parseThousands(document.getElementById('current-annual-premium').value);
  const targetPremiumValue = _parseThousands(document.getElementById('case-target-premium').value);
  const businessType = document.getElementById('case-business-type').value;
  const existingInsurer = document.getElementById('case-existing-insurer').value;
  const policyStartDate = document.getElementById('case-policy-start-date').value;
  // Changing the policy start date re-derives every member's age from
  // their date of birth, which can move them between rate bands and
  // therefore change the premium. It is not a field to edit in passing -
  // on a live case it normally only moves when the term genuinely does.
  const priorStart = currentCase.policy_start_date || '';
  if (priorStart && policyStartDate && policyStartDate !== priorStart) {
    const censusCount = (currentCase.census_record_count != null)
      ? currentCase.census_record_count : null;
    const who = censusCount ? `all ${censusCount} census members` : 'every census member';
    if (!confirm(
        `Change the policy start date from ${priorStart} to ${policyStartDate}?\n\n` +
        `This re-works ${who}'s age from their date of birth as of the new date. ` +
        `Members can move between age bands, which changes their rate and this ` +
        `account's premium.\n\n` +
        `Only change this when the policy term itself has changed.`)) {
      return;
    }
  }
  const tpaFeeEl = document.getElementById('case-tpa-fee-pct');
  const commissionEl = document.getElementById('case-commission-pct');
  const hcFeeEl = document.getElementById('case-hc-fee-pct');
  const qicFeeEl = document.getElementById('case-qic-fee-pct');
  const overrideEl = document.getElementById('case-renewal-increase-override');
  // The case this save is for. If the user opens another case while the
  // PATCH is in flight, assigning the reply to currentCase would put the
  // OLD case back on screen under the new case's name - so the reply is
  // only adopted while it is still the case being looked at.
  const savingCaseId = currentCase.id;
  try {
    const saved = await api(`/cases/${savingCaseId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        business_type: businessType,
        existing_insurer: existingInsurer || null,
        current_annual_premium: premiumValue ? Number(premiumValue) : null,
        target_premium: targetPremiumValue ? Number(targetPremiumValue) : null,
        policy_start_date: policyStartDate || null,
        tpa_fee_pct: tpaFeeEl && tpaFeeEl.value !== '' ? Number(tpaFeeEl.value) / 100 : null,
        commission_pct: commissionEl && commissionEl.value !== '' ? Number(commissionEl.value) / 100 : null,
        hc_fee_pct: hcFeeEl && hcFeeEl.value !== '' ? Number(hcFeeEl.value) / 100 : null,
        qic_fee_pct: qicFeeEl && qicFeeEl.value !== '' ? Number(qicFeeEl.value) / 100 : null,
        // In PERCENT, unlike the fee fields - it is the same unit the
        // renewal increase is quoted in everywhere else (+18.3%, not 0.183).
        renewal_increase_override_pct: overrideEl && overrideEl.value !== ''
          ? Number(overrideEl.value) : null,
      }),
    });
    if (!currentCase || currentCase.id !== savingCaseId) return;
    currentCase = saved;
    toast('Case details saved');
    renderCaseWorkspace();
  } catch (err) {
    toast(err.message, true);
  }
}

// Cached so saveCategoryRates() can look up which members belong to a
// grid cell, and each member's own CURRENT new_annual_rate_override -
// PATCH /member-rates replaces both existing_annual_rate and
// new_annual_rate_override per member wholesale, so applying a cell's
// existing rate must still resend each member's own untouched override
// value rather than wiping it out.
let _lastMemberRatesData = null;

// Mirrors the insurer's own rate-card grid shape (Category x Age Band x
// Gender x Region - see app/ingestion/premium_summary_rate_card.py and
// app/reference/emirate_regions.py) rather than one flat rate per
// category, since that's genuinely how these are priced: the same
// Category A can cost a different amount in Dubai vs. the Northern
// Emirates, and a different amount again for a 55-year-old vs. a 25-year-old.
const RATE_AGE_BANDS = [[0, 17, '0-17'], [18, 40, '18-40'], [41, 59, '41-59'], [60, 999, '60-99']];
const RATE_GENDER_ORDER = ['Male', 'Female', 'Unspecified'];
const RATE_REGION_ORDER = ['Dubai', 'Northern Emirates', 'Abu Dhabi'];

function _ageBandLabel(age) {
  if (age == null) return 'Unspecified';
  const band = RATE_AGE_BANDS.find(([lo, hi]) => age >= lo && age <= hi);
  return band ? band[2] : 'Unspecified';
}

function _genderLabel(gender) {
  return gender === 'M' ? 'Male' : gender === 'F' ? 'Female' : 'Unspecified';
}

function _regionSort(a, b) {
  const ia = RATE_REGION_ORDER.indexOf(a), ib = RATE_REGION_ORDER.indexOf(b);
  return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b);
}

// region -> category -> gender -> age band -> [members] - a member's own
// region comes from the census's emirates field (see routes_analysis.py's
// _member_rate_row, which defaults an unmapped/missing emirate to Dubai -
// the common case by far - so this rarely needs its own "Unspecified"
// region section in practice).
function _groupMembersForRateGrid(members) {
  const tree = {};
  members.forEach(m => {
    const region = m.region || 'Unspecified';
    const category = m.category || 'Uncategorized';
    const gender = _genderLabel(m.gender);
    const ageBand = _ageBandLabel(m.age);
    tree[region] = tree[region] || {};
    tree[region][category] = tree[region][category] || {};
    tree[region][category][gender] = tree[region][category][gender] || {};
    (tree[region][category][gender][ageBand] = tree[region][category][gender][ageBand] || []).push(m);
  });
  return tree;
}

// A rate is a per-member figure; what an account is quoted is a total.
// Reading a grid of rates and multiplying by headcount in your head is
// where a renewal gets mis-stated, so each cell carries its own premium
// and each region and the account carry their own totals.
function _cellTotals(members) {
  let existing = 0, hasExisting = false;
  let next = 0, hasNext = false;
  members.forEach(m => {
    if (m.existing_annual_rate != null) { existing += m.existing_annual_rate; hasExisting = true; }
    if (m.effective_new_rate != null) { next += m.effective_new_rate; hasNext = true; }
  });
  return {
    count: members.length,
    existing: hasExisting ? existing : null,
    next: hasNext ? next : null,
    // Only meaningful when every member in the cell is rated on both
    // sides; a part-rated cell would report a change against a total
    // that is missing members.
    complete: hasExisting && hasNext
      && members.every(m => m.existing_annual_rate != null && m.effective_new_rate != null),
  };
}

function _aedCell(value) {
  return value == null ? '<td class="num">&mdash;</td>'
    : `<td class="num">${Math.round(value).toLocaleString()}</td>`;
}

function _rateGridHtml(regionTree, caseRenewalIncreasePct) {
  const book = { count: 0, existing: 0, next: 0, anyExisting: false, anyNext: false };
  const html = Object.keys(regionTree).sort(_regionSort).map(region => {
    const catTree = regionTree[region];
    const rows = [];
    const regionTotal = { count: 0, existing: 0, next: 0, anyExisting: false, anyNext: false };
    Object.keys(catTree).sort((a, b) => (a === 'Uncategorized') - (b === 'Uncategorized') || a.localeCompare(b)).forEach(category => {
      RATE_GENDER_ORDER.forEach(gender => {
        const ageTree = catTree[category][gender];
        if (!ageTree) return;
        RATE_AGE_BANDS.map(b => b[2]).concat('Unspecified').forEach(ageBand => {
          const members = ageTree[ageBand];
          if (!members || !members.length) return;
          const existingValues = [...new Set(members.map(m => m.existing_annual_rate).filter(v => v != null))];
          const uniform = existingValues.length === 1 ? existingValues[0] : null;
          const mixed = existingValues.length > 1;
          const computedNewRate = (uniform != null && caseRenewalIncreasePct != null)
            ? Math.round(uniform * (1 + caseRenewalIncreasePct / 100) * 100) / 100
            : null;
          const gridKey = `${region}||${category}||${gender}||${ageBand}`;
          const t = _cellTotals(members);
          regionTotal.count += t.count;
          if (t.existing != null) { regionTotal.existing += t.existing; regionTotal.anyExisting = true; }
          if (t.next != null) { regionTotal.next += t.next; regionTotal.anyNext = true; }
          const cellChange = (t.complete && t.existing)
            ? ((t.next / t.existing - 1) * 100) : null;
          rows.push(`
            <tr>
              <td>${escapeHtml(category)}</td>
              <td>${escapeHtml(gender)}</td>
              <td>${escapeHtml(ageBand)}</td>
              <td class="num">${members.length}</td>
              <td><input type="number" step="0.01" data-grid-key="${escapeHtml(gridKey)}" value="${uniform ?? ''}" placeholder="${mixed ? 'mixed' : 'e.g. 3,500'}" style="width:110px;"></td>
              <td class="num">${computedNewRate != null ? computedNewRate.toLocaleString() : (mixed ? 'mixed' : '&mdash;')}</td>
              ${_aedCell(t.existing)}
              ${_aedCell(t.next)}
              <td class="num">${cellChange != null ? (cellChange > 0 ? '+' : '') + cellChange.toFixed(1) + '%' : '&mdash;'}</td>
            </tr>
          `);
        });
      });
    });
    book.count += regionTotal.count;
    if (regionTotal.anyExisting) { book.existing += regionTotal.existing; book.anyExisting = true; }
    if (regionTotal.anyNext) { book.next += regionTotal.next; book.anyNext = true; }
    const regionChange = (regionTotal.anyExisting && regionTotal.anyNext && regionTotal.existing)
      ? ((regionTotal.next / regionTotal.existing - 1) * 100) : null;
    return `
      <h4>${escapeHtml(region)}</h4>
      <div class="scroll"><table>
        <tr><th>Category</th><th>Gender</th><th>Age Band</th><th class="num">Members</th>
            <th>Existing rate (AED)</th><th class="num">New rate</th>
            <th class="num">Existing premium</th><th class="num">New premium</th><th class="num">Change</th></tr>
        ${rows.join('')}
        <tr class="total"><th colspan="3">${escapeHtml(region)} total</th>
          <td class="num"><strong>${regionTotal.count}</strong></td>
          <td></td><td></td>
          <td class="num"><strong>${regionTotal.anyExisting ? Math.round(regionTotal.existing).toLocaleString() : '&mdash;'}</strong></td>
          <td class="num"><strong>${regionTotal.anyNext ? Math.round(regionTotal.next).toLocaleString() : '&mdash;'}</strong></td>
          <td class="num"><strong>${regionChange != null ? (regionChange > 0 ? '+' : '') + regionChange.toFixed(1) + '%' : '&mdash;'}</strong></td></tr>
      </table></div>
    `;
  }).join('');

  const bookChange = (book.anyExisting && book.anyNext && book.existing)
    ? ((book.next / book.existing - 1) * 100) : null;
  const grand = `
    <table style="margin-top:14px;">
      <tr class="total"><th>Account total</th>
        <td class="num"><strong>${book.count}</strong> members</td>
        <td class="num">Existing <strong>AED ${book.anyExisting ? Math.round(book.existing).toLocaleString() : '&mdash;'}</strong></td>
        <td class="num">New <strong>AED ${book.anyNext ? Math.round(book.next).toLocaleString() : '&mdash;'}</strong></td>
        <td class="num"><strong>${bookChange != null ? (bookChange > 0 ? '+' : '') + bookChange.toFixed(1) + '%' : '&mdash;'}</strong></td></tr>
    </table>
    <div class="hint" style="margin-top:6px;">Totals count only members whose rate is set on that side,
      so a part-rated grid shows a total for what is rated rather than a change against a missing
      denominator. This is the annualised premium at these rates &mdash; the figure a renewal is
      quoted against.</div>`;
  return html + grand;
}

async function saveCategoryRates() {
  if (!_lastMemberRatesData) return;
  const updates = [];
  document.querySelectorAll('[data-grid-key]').forEach(el => {
    if (el.value === '') return;
    const [region, category, gender, ageBand] = el.dataset.gridKey.split('||');
    const value = Number(el.value);
    const members = _lastMemberRatesData.members.filter(m =>
      (m.region || 'Unspecified') === region
      && (m.category || 'Uncategorized') === category
      && _genderLabel(m.gender) === gender
      && _ageBandLabel(m.age) === ageBand
    );
    members.forEach(m => {
      updates.push({
        census_record_id: m.census_record_id,
        existing_annual_rate: value,
        new_annual_rate_override: m.new_annual_rate_override,
      });
    });
  });
  if (!updates.length) { toast('Enter a rate for at least one row first', true); return; }
  try {
    await api(`/cases/${currentCase.id}/member-rates`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(updates),
    });
    toast(`Applied rates to ${updates.length} member(s)`);
    loadMemberRates();
  } catch (err) {
    toast(err.message, true);
  }
}

function renderMemberRatesTable(data) {
  _lastMemberRatesData = data;
  const area = document.getElementById('member-rates-area');
  if (!area) return;
  if (!data.members.length) {
    area.innerHTML = '<div class="hint">No census uploaded yet - upload one on the Census tab first.</div>';
    return;
  }
  // A blank New rate column now says why it is blank. A grid of dashes
  // reads the same whether the case needs a claims ledger, has a fee
  // field that cannot be right, or is simply broken - and those are
  // three different actions.
  const increaseNote = data.case_renewal_increase_pct != null
    ? (data.increase_source === 'override'
        ? `Quoted renewal increase: <strong>${data.case_renewal_increase_pct > 0 ? '+' : ''}${data.case_renewal_increase_pct}%</strong> &mdash; an override you have set${data.computed_increase_pct != null ? `, against <strong>${data.computed_increase_pct > 0 ? '+' : ''}${data.computed_increase_pct}%</strong> from this account's own experience` : ''}. Clear it on the case record to quote the experience instead.`
        : `Case renewal increase: <strong>${data.case_renewal_increase_pct > 0 ? '+' : ''}${data.case_renewal_increase_pct}%</strong> - auto-fills every member's new rate once a cell's existing rate is applied below.`)
    : escapeHtml(data.no_increase_reason
        || 'No case-level renewal increase computed yet - set rates individually below in the meantime.');
  // The ages behind these bands were struck at a different date to the
  // one the case now carries, so members can be sitting in the wrong
  // band - which understates the premium silently. Shown above the grid
  // because the grid is where the wrong band actually costs money.
  const w = data.age_basis_warning;
  const ageBanner = w ? `<div class="hint" style="background:#fff4e5;border-left:3px solid #b26a00;
       padding:10px 13px;margin:10px 0;color:#7a4b00;">
       <strong>Member ages are out of step with the policy start date.</strong>
       ${escapeHtml(w.message)}</div>` : '';

  const blockedBanner = (data.case_renewal_increase_pct == null && data.no_increase_reason)
    ? `<div class="hint" style="background:#fdecea;border-left:3px solid #c0392b;padding:10px 13px;
         margin:10px 0;color:#922b21;">${escapeHtml(data.no_increase_reason)}</div>`
    : '';

  const regionTree = _groupMembersForRateGrid(data.members);

  const memberRows = data.members.map(m => `
    <tr>
      <td>${escapeHtml(m.employee_ref || ('#' + m.census_record_id))}</td>
      <td>${escapeHtml(m.category || '-')}</td>
      <td>${m.age ?? '-'}</td>
      <td>${escapeHtml(m.gender || '-')}</td>
      <td>${escapeHtml(m.relation || '-')}</td>
      <td><input type="number" step="0.01" data-mr-existing="${m.census_record_id}" value="${m.existing_annual_rate ?? ''}" style="width:110px;"></td>
      <td><input type="number" step="0.01" data-mr-override="${m.census_record_id}" value="${m.new_annual_rate_override ?? ''}" placeholder="${m.computed_new_rate != null ? m.computed_new_rate.toLocaleString() : 'auto'}" style="width:110px;"></td>
      <td>${m.effective_new_rate != null ? 'AED ' + m.effective_new_rate.toLocaleString() : '-'}</td>
      <td>${m.rate_change_pct != null ? (m.rate_change_pct > 0 ? '+' : '') + m.rate_change_pct + '%' : '-'}</td>
    </tr>
  `).join('');

  area.innerHTML = `
    <div class="card">
      <h3>Existing vs. New Rates by Category, Age Band &amp; Gender</h3>
      <div class="hint">One rate applies to every member in that region/category/gender/age-band cell at once - matching how the insurer's own rate card is priced. Only cells with at least one member are shown.</div>
      ${ageBanner}
      ${blockedBanner || `<div class="hint">${increaseNote}</div>`}
      ${_rateGridHtml(regionTree, data.case_renewal_increase_pct)}
      <div style="margin-top:12px;"><button class="primary" onclick="saveCategoryRates()">Apply rates</button></div>
    </div>
    <div class="card">
      <details>
        <summary style="cursor:pointer; font-weight:700; font-size:14.5px;">Per-member rates (individual exceptions)</summary>
        <div class="hint" style="margin-top:10px;">Only needed when one member's rate genuinely differs from the rest of their region/category/gender/age-band cell - saving here overrides whatever the grid above set for that one member.</div>
        <table>
          <tr>
            <th>Member</th><th>Category</th><th>Age</th><th>Gender</th><th>Relation</th>
            <th>Existing rate (AED)</th><th>New rate override (AED, optional)</th><th>Effective new rate</th><th>Change</th>
          </tr>
          ${memberRows}
        </table>
        <div style="margin-top:12px;"><button onclick="saveMemberRates()">Save individual rates</button></div>
      </details>
    </div>
  `;
}

async function loadMemberRates() {
  const area = document.getElementById('member-rates-area');
  if (!area || !currentCase) return;
  try {
    const data = await api(`/cases/${currentCase.id}/member-rates`);
    renderMemberRatesTable(data);
  } catch (err) {
    area.innerHTML = '';
  }
}

async function importMemberRateCard() {
  const input = document.getElementById('file-member-rate-card');
  const statusEl = document.getElementById('status-member-rate-card');
  // Absent on a renewal, where importing a third party's price grid over
  // the account's own expiring rates is not a thing to offer.
  if (!input) return;
  if (!input.files.length) { toast('Choose a rate card file first', true); return; }

  const form = new FormData();
  form.append('file', input.files[0]);
  statusEl.textContent = 'Importing...';
  statusEl.className = 'status-pending';
  const errArea = document.getElementById('member-rate-card-error');
  if (errArea) errArea.innerHTML = '';
  try {
    const data = await api(`/cases/${currentCase.id}/member-rates/import-rate-card`, { method: 'POST', body: form });
    statusEl.textContent = `${data.matched_count} matched, ${data.unmatched.length} unmatched`;
    statusEl.className = 'status-ok';
    toast(`Imported existing rates for ${data.matched_count} member(s)${data.unmatched.length ? `, ${data.unmatched.length} unmatched` : ''}`);

    const feeParts = [];
    if (data.detected_fees.commission_pct != null) feeParts.push(`Commission ${(data.detected_fees.commission_pct * 100).toFixed(1)}%`);
    if (data.detected_fees.tpa_fee_pct != null) feeParts.push(`TPA Fee ${(data.detected_fees.tpa_fee_pct * 100).toFixed(1)}%`);
    if (data.detected_fees.hc_fee_pct != null) feeParts.push(`HC Fee ${(data.detected_fees.hc_fee_pct * 100).toFixed(1)}%`);
    if (feeParts.length) {
      toast(`Rate card also shows: ${feeParts.join(', ')} - update the case's fee fields above (Case overview) if these differ from what's saved`);
    }

    renderMemberRatesTable(data);
  } catch (err) {
    // The reason, in the page and staying there. "Import failed" in a
    // status pill with the cause in a toast that fades is a dead end -
    // the message names which layout was expected and what the sheet
    // actually contained.
    statusEl.textContent = 'Import failed';
    statusEl.className = 'status-err';
    const area = document.getElementById('member-rate-card-error');
    if (area) {
      area.innerHTML = `<div class="hint" style="background:#fdecea;border-left:3px solid #c0392b;
        padding:9px 12px;margin-top:10px;color:#922b21;">${escapeHtml(err.message)}</div>`;
    }
    toast(err.message, true);
  }
}

async function saveMemberRates() {
  const rates = Array.from(document.querySelectorAll('[data-mr-existing]')).map(el => {
    const id = Number(el.dataset.mrExisting);
    const overrideEl = document.querySelector(`[data-mr-override="${id}"]`);
    return {
      census_record_id: id,
      existing_annual_rate: el.value !== '' ? Number(el.value) : null,
      new_annual_rate_override: overrideEl && overrideEl.value !== '' ? Number(overrideEl.value) : null,
    };
  });
  try {
    await api(`/cases/${currentCase.id}/member-rates`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(rates),
    });
    toast('Member rates saved');
    loadMemberRates();
  } catch (err) {
    toast(err.message, true);
  }
}

async function uploadFile(kind) {
  const input = document.getElementById(`file-${kind}`);
  const statusEl = document.getElementById(`status-${kind}`);
  if (!input.files.length) { toast('Choose a file first', true); return; }
  const isPdf = input.files[0].name.toLowerCase().endsWith('.pdf');

  const form = new FormData();
  form.append('file', input.files[0]);
  statusEl.textContent = 'Uploading...';
  statusEl.className = 'status-pending';
  try {
    const appendCheckbox = document.getElementById(`file-${kind}-append`);
    const mergeDatesCheckbox = document.getElementById(`file-${kind}-merge-dates`);
    const categoryInput = document.getElementById(`file-${kind}-category`);
    const params = new URLSearchParams();
    if (kind === 'benefits' && appendCheckbox && appendCheckbox.checked) params.set('mode', 'append');
    if (kind === 'census' && mergeDatesCheckbox && mergeDatesCheckbox.checked) params.set('mode', 'merge-dates');
    if (kind === 'benefits' && categoryInput && categoryInput.value.trim()) params.set('category', categoryInput.value.trim());
    const query = params.toString() ? `?${params.toString()}` : '';
    const result = await api(`/cases/${currentCase.id}/${kind}${query}`, { method: 'POST', body: form });
    if (Array.isArray(result)) {
      if (params.get('mode') === 'merge-dates') {
        const withDates = result.filter(r => r.member_end_date).length;
        statusEl.textContent = `${withDates} of ${result.length} census rows now have member dates`;
        toast(`Dates merged into census (${withDates} of ${result.length} rows matched)`);
      } else {
        const unit = kind === 'quote' ? 'categories' : 'rows';
        statusEl.textContent = `${result.length} ${unit} parsed`;
        toast(`${kind} uploaded (${result.length} ${unit})`);
      }
    } else {
      statusEl.textContent = 'Report parsed';
      toast(`${kind} report parsed`);
    }
    statusEl.className = 'status-ok';
    // Cleared rather than left as-is - the next file in a "one category per
    // file" batch is almost always a different category, and leaving the
    // last one filled in risks silently overwriting it if forgotten.
    if (kind === 'benefits' && categoryInput) categoryInput.value = '';
    if (kind === 'census') { await loadCensusSummary(); await loadNewBusinessRating(); await loadMemberRates(); await loadRenewalBenchSummary(); await loadRenewalBenchPopulationMovement(); await loadRenewalBenchClaimsSplit(); await loadRenewalBenchRepricing(); await loadRenewalScenarios(); await loadRenewalOptions(); await loadClaimsDevelopment(); }
    if (kind === 'benefits') { await loadBenefitsSummary(); await loadBenefitsComparison(); }
    if (kind === 'quote') { await loadPremiumByCategory(); await loadBenefitsComparison(); }
    if (kind === 'claims' && isPdf) {
      selectedClaimsReportId = null; // show the just-uploaded (latest) report by default
      await loadClaimsReportYearSelector();
      await loadClaimsReportComparison();
      await loadClaimsProjection();
      await loadClaimsReportBreakdown();
      await loadDiagnosisExposure();
    }
    if (kind === 'claims-ledger') { await loadClaimsLedgerAnalysis(); await loadRenewalRating(); await loadRenewalBenchmark(); await loadMemberRates(); await loadRenewalBenchScorecard(); await loadRenewalBenchNbComparison(); await loadRenewalBenchLargeClaims(); await loadRenewalBenchSummary(); await loadRenewalScenarios(); await loadRenewalOptions(); await loadClaimsDevelopment(); }
    // Auto-run the scorecard whenever a data source that feeds it changes,
    // so it's always current without a manual "Compute scorecard" click -
    // only re-runs on a new upload, never just from viewing the case.
    if (['census', 'benefits', 'claims', 'claims-ledger'].includes(kind)) await autoComputeScore();
    await loadCaseCompleteness();
  } catch (err) {
    statusEl.textContent = 'Failed';
    statusEl.className = 'status-err';
    toast(err.message, true);
  }
}

async function autoComputeScore() {
  if (!currentCase) return;
  const premiumInput = document.getElementById('estimated-premium');
  const payload = { estimated_annual_premium: premiumInput && premiumInput.value ? Number(premiumInput.value) : null };
  try {
    await api(`/cases/${currentCase.id}/score`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    await loadLatestScorecard();
    toast('Scorecard auto-updated');
  } catch (err) {
    // Expected until both a census and a table of benefits are uploaded -
    // stay quiet rather than nagging after every single-file upload. Any
    // other failure is unexpected and still worth surfacing.
    if (!/no census|no table of benefits/i.test(err.message || '')) {
      toast(`Scorecard auto-update failed: ${err.message}`, true);
    }
  }
}

document.addEventListener('dragover', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (zone) { e.preventDefault(); zone.classList.add('dragover'); }
});
document.addEventListener('dragleave', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (zone) zone.classList.remove('dragover');
});
document.addEventListener('drop', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove('dragover');
  const input = zone.querySelector('input[type=file]');
  if (input && e.dataTransfer.files.length) {
    input.files = e.dataTransfer.files;
    // Only the Quick upload zone's input has an onchange handler (the
    // single-file dropzones use a separate Upload button instead) - this
    // dispatch is what actually lets dropping files there kick off
    // detection, same as picking them via the file dialog would.
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }
});

/* ---------------- Quick upload (drag-drop all files, auto-detect kind) ---------------- */

let quickUploadFiles = []; // [{file, detectedKind, confidence, reason, selectedKind, status}]

const QUICK_UPLOAD_KIND_LABELS = {
  census: 'Census', benefits: 'Benefits', claims: 'Claims', 'claims-ledger': 'Claims ledger', quote: 'Quote',
};

async function quickUploadHandleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const newItems = files.map(f => ({
    file: f, detectedKind: null, confidence: null, reason: 'Detecting...', selectedKind: '', status: 'detecting',
  }));
  quickUploadFiles = quickUploadFiles.concat(newItems);
  document.getElementById('quick-upload-input').value = '';
  renderQuickUploadReview();

  await Promise.all(newItems.map(async (item) => {
    try {
      const form = new FormData();
      form.append('file', item.file);
      const result = await api('/cases/detect-upload-kind', { method: 'POST', body: form });
      item.detectedKind = result.detected_kind;
      item.confidence = result.confidence;
      item.reason = result.reason;
      item.selectedKind = result.detected_kind || '';
      item.status = 'pending';
    } catch (err) {
      item.status = 'error';
      item.reason = err.message;
    }
    renderQuickUploadReview();
  }));
}

function quickUploadSetKind(idx, value) {
  quickUploadFiles[idx].selectedKind = value;
  renderQuickUploadReview();
}

function quickUploadSetCategory(idx, value) {
  quickUploadFiles[idx].category = value;
}

function quickUploadRemove(idx) {
  quickUploadFiles.splice(idx, 1);
  renderQuickUploadReview();
}

function quickUploadClear() {
  quickUploadFiles = [];
  renderQuickUploadReview();
}

function renderQuickUploadReview() {
  const area = document.getElementById('quick-upload-review');
  if (!area) return;
  if (!quickUploadFiles.length) { area.innerHTML = ''; return; }

  const rows = quickUploadFiles.map((item, idx) => {
    const confPill = item.confidence === 'high'
      ? '<span class="tier-pill dir-improved">Confident</span>'
      : (item.confidence === 'low' ? '<span class="tier-pill dir-review">Please check</span>' : '');
    const statusCell = item.status === 'done' ? '<span class="tier-pill dir-improved">Uploaded</span>'
      : item.status === 'error' ? '<span class="tier-pill dir-review">Failed</span>'
      : item.status === 'uploading' ? '<span class="hint">Uploading...</span>'
      : `<button onclick="quickUploadRemove(${idx})">Remove</button>`;
    const categoryCell = item.selectedKind === 'benefits'
      ? `<select style="width:80px;" onchange="quickUploadSetCategory(${idx}, this.value)" ${item.status === 'done' || item.status === 'uploading' ? 'disabled' : ''}>${_categoryOptionsHtml(item.category, 'e.g. A')}</select>`
      : '';
    return `
      <tr>
        <td>${escapeHtml(item.file.name)}</td>
        <td>
          <select onchange="quickUploadSetKind(${idx}, this.value)" ${item.status === 'done' || item.status === 'uploading' ? 'disabled' : ''}>
            <option value="">Skip this file</option>
            ${Object.entries(QUICK_UPLOAD_KIND_LABELS).map(([k, label]) => `<option value="${k}" ${item.selectedKind === k ? 'selected' : ''}>${label}</option>`).join('')}
          </select>
        </td>
        <td>${categoryCell}</td>
        <td>${item.status === 'detecting' ? '<span class="hint">Detecting...</span>' : confPill}</td>
        <td class="hint" style="max-width:280px;">${escapeHtml(item.reason || '')}</td>
        <td>${statusCell}</td>
      </tr>
    `;
  }).join('');

  const readyCount = quickUploadFiles.filter(f => f.status === 'pending' && f.selectedKind).length;
  const stillDetecting = quickUploadFiles.some(f => f.status === 'detecting');
  const anyBenefits = quickUploadFiles.some(f => f.selectedKind === 'benefits');

  area.innerHTML = `
    <div style="overflow-x:auto; margin-top:14px;">
      <table>
        <tr><th>File</th><th>Upload as</th><th>Category</th><th>Confidence</th><th>Why</th><th></th></tr>
        ${rows}
      </table>
    </div>
    ${anyBenefits ? '<div class="hint">For Benefits files, type the category letter it\'s for (e.g. A) - lines it up with the HealthCross quote\'s own categories and makes sure a re-upload replaces the right one instead of duplicating it.</div>' : ''}
    <div class="row" style="margin-top:10px;">
      <button class="primary" onclick="quickUploadConfirm()" ${readyCount && !stillDetecting ? '' : 'disabled'}>Confirm &amp; upload ${readyCount ? `(${readyCount})` : ''}</button>
      <button onclick="quickUploadClear()">Clear all</button>
    </div>
  `;
}

async function quickUploadConfirm() {
  const toUpload = quickUploadFiles.filter(item => item.status === 'pending' && item.selectedKind);
  // More than one benefits file in the same batch means one file per
  // category (see the Manual upload tab's own append checkbox) - each
  // upload must append rather than the default replace, or every file
  // after the first would wipe out the one before it, leaving only the
  // last category standing.
  const benefitsFileCount = toUpload.filter(item => item.selectedKind === 'benefits').length;
  for (const item of toUpload) {
    item.status = 'uploading';
    renderQuickUploadReview();
    try {
      const form = new FormData();
      form.append('file', item.file);
      const params = new URLSearchParams();
      if (item.selectedKind === 'benefits' && benefitsFileCount > 1) params.set('mode', 'append');
      if (item.selectedKind === 'benefits' && item.category && item.category.trim()) params.set('category', item.category.trim());
      const query = params.toString() ? `?${params.toString()}` : '';
      const result = await api(`/cases/${currentCase.id}/${item.selectedKind}${query}`, { method: 'POST', body: form });
      item.status = 'done';
      item.reason = Array.isArray(result) ? `${result.length} row(s) uploaded` : 'Uploaded';
    } catch (err) {
      item.status = 'error';
      item.reason = err.message;
    }
    renderQuickUploadReview();
  }

  // Refresh whatever views depend on what just got uploaded - same views
  // uploadFile() itself refreshes after a single manual upload, just for
  // every kind touched in this one batch.
  const uploadedKinds = new Set(toUpload.filter(f => f.status === 'done').map(f => f.selectedKind));
  if (uploadedKinds.has('census')) { await loadCensusSummary(); await loadNewBusinessRating(); await loadMemberRates(); await loadRenewalBenchSummary(); await loadRenewalBenchPopulationMovement(); await loadRenewalBenchClaimsSplit(); await loadRenewalBenchRepricing(); await loadRenewalScenarios(); await loadRenewalOptions(); await loadClaimsDevelopment(); }
  if (uploadedKinds.has('benefits')) { await loadBenefitsSummary(); await loadBenefitsComparison(); }
  if (uploadedKinds.has('quote')) { await loadPremiumByCategory(); await loadBenefitsComparison(); }
  if (uploadedKinds.has('claims')) {
    selectedClaimsReportId = null;
    await loadClaimsReportYearSelector();
    await loadClaimsReportComparison();
    await loadClaimsProjection();
    await loadClaimsReportBreakdown();
    await loadDiagnosisExposure();
  }
  if (uploadedKinds.has('claims-ledger')) { await loadClaimsLedgerAnalysis(); await loadRenewalRating(); await loadRenewalBenchmark(); await loadMemberRates(); await loadRenewalBenchScorecard(); await loadRenewalBenchNbComparison(); await loadRenewalBenchLargeClaims(); await loadRenewalBenchSummary(); await loadRenewalScenarios(); await loadRenewalOptions(); await loadClaimsDevelopment(); }
  if (['census', 'benefits', 'claims', 'claims-ledger'].some(k => uploadedKinds.has(k))) await autoComputeScore();
  await loadCaseCompleteness();
  // The executive summary sits ABOVE the upload panel and reads the case
  // as a whole, so it went stale on every quick upload - a census could
  // land 108 rows and the card at the top of the same page still read
  // "No census yet", which reads as a failed upload rather than an
  // unrefreshed card.
  await loadExecutiveSummary();
  if (uploadedKinds.size) toast('Quick upload complete');
}

const NOT_SPECIFIED_TEXT = 'Not specified in source document';
let _benefitsRateCardOptions = null;

function _benefitNbPickerHtml(p) {

  const networkValue = p.nb_network ? `${p.nb_network}|${p.nb_tpa || ''}` : '';
  return `

          <option value="">None</option>
          ${networksForProduct.map(n => `<option value="${escapeHtml(n.network)}|${escapeHtml(n.tpa)}" ${networkValue === `${n.network}|${n.tpa}` ? 'selected' : ''}>${escapeHtml(n.network)} (${escapeHtml(n.tpa)})</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="hint" style="margin-bottom:8px;">This category's own New Business Product/Network - prices the New Business Quote for this category once set (see the New Business Quote tab).</div>
  `;
}

function _onBenefitNbProductChange(planId, product) {
  const plan = _benefitsSummaryPlans.find(p => p.id === planId);
  if (!plan) return;
  plan.nb_product = product;
  plan.nb_network = '';
  plan.nb_tpa = '';
  const card = document.querySelector(`#benefits-summary-area .card[data-plan-id="${planId}"]`);
  if (card) card.outerHTML = _benefitSummaryCardHtml(plan, true);
}

function _benefitSummaryCardHtml(p, editing) {
  // A field OCR found no value for is not a field the document excluded
  // - see app/api/routes_analysis.py's OCR_NOT_FOUND.
  const unresolvedText = p.source_format === 'pdf-ocr'
    ? 'Not found by OCR - check the raw OCR text below'
    : NOT_SPECIFIED_TEXT;
  const rows = Object.entries(p.summary).map(([field, value]) => {
    if (!editing) {
      return `<tr><th style="width:220px;">${escapeHtml(field.replace(/_/g, ' '))}</th><td>${escapeHtml(value)}</td></tr>`;
    }
    const current = value === unresolvedText ? '' : value;
    return `
      <tr>
        <th style="width:220px;">${escapeHtml(field.replace(/_/g, ' '))}</th>
        <td><input type="text" data-field="${field}" value="${escapeHtml(current)}" style="width:100%;box-sizing:border-box;" /></td>
      </tr>
    `;
  }).join('');

  // Delete sits on every card, not only inside Edit. A category created
  // by an extraction that split one table into four is a category
  // nobody wants to edit first - they want it gone, and hiding the only
  // way to remove it behind "Edit" made a wrong extraction look
  // permanent.
  const actions = editing
    ? `
      <button class="primary" onclick="saveBenefitSummaryEdit(${p.id})">Save</button>
      <button onclick="cancelBenefitSummaryEdit(${p.id})">Cancel</button>
      <button onclick="deleteBenefitPlan(${p.id})" style="float:right;">Delete category</button>
    `
    : `<button onclick="editBenefitSummary(${p.id})">Edit</button>
       <button onclick="duplicateBenefitPlan(${p.id})">Duplicate</button>
       <button onclick="deleteBenefitPlan(${p.id})" style="float:right;">Delete category</button>`;

  // A category where the extractor resolved nothing is not a category -
  // it is a header it found and could not read under. Saying so is the
  // difference between an underwriter deleting it and an underwriter
  // believing the plan genuinely has no limits.
  const resolved = Object.values(p.summary || {})
    .filter(v => v && v !== unresolvedText && v !== NOT_SPECIFIED_TEXT).length;
  const total = Object.keys(p.summary || {}).length;
  const emptyFlag = (!editing && total && resolved === 0)
    ? `<div class="hint" style="background:#fbf3e6;border-left:3px solid #c98a2b;padding:9px 12px;
         margin:8px 0;color:#8a5f1e;">Nothing was extracted for this category &mdash; all ${total}
         fields are unresolved. The document may use a layout the parser does not read, or this may
         be a header the extractor split out in error. Delete it, or Edit to enter the terms by
         hand.</div>`
    : '';

  const title = editing
    ? `<input type="text" id="plan-name-input-${p.id}" value="${escapeHtml(p.plan_name || '')}" placeholder="e.g. Category A" style="font-size:1.1em;font-weight:600;width:100%;box-sizing:border-box;margin-bottom:8px;" />`
    : `<h3>${escapeHtml(p.plan_name || 'Plan')}${p.category ? ` <span style="color:var(--ink-muted); font-weight:400;">(Cat ${escapeHtml(p.category)})</span>` : ''}${
        (!editing && total) ? `<span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:8px;">${resolved} of ${total} fields extracted</span>` : ''}</h3>`;

  const nbSummaryLine = !editing && (p.nb_product || p.nb_network)
    ? `<div class="hint">New Business: ${escapeHtml(p.nb_product || '-')} / ${escapeHtml(p.nb_network || '-')}${p.nb_tpa ? ' (' + escapeHtml(p.nb_tpa) + ')' : ''}</div>`
    : '';

  return `
    <div class="card" data-plan-id="${p.id}">
      ${title}
      ${emptyFlag}
      ${nbSummaryLine}
      ${editing ? _benefitNbPickerHtml(p) : ''}
      <table>${rows}</table>
      <div style="margin-top:10px;">${actions}</div>
    </div>
  `;
}

async function saveBenefitSummaryEdit(planId) {
  const card = document.querySelector(`#benefits-summary-area .card[data-plan-id="${planId}"]`);
  if (!card) return;
  const fields = {};
  card.querySelectorAll('input[data-field]').forEach(input => {
    fields[input.dataset.field] = input.value;
  });
  const nameInput = document.getElementById(`plan-name-input-${planId}`);
  const categoryInput = document.getElementById(`nb-category-input-${planId}`);
  const productSelect = document.getElementById(`nb-product-select-${planId}`);
  const networkSelect = document.getElementById(`nb-network-select-${planId}`);
  let nbNetwork, nbTpa;
  if (networkSelect) {
    [nbNetwork, nbTpa] = networkSelect.value ? networkSelect.value.split('|') : ['', ''];
  }
  try {
    await api(`/cases/${currentCase.id}/benefits/${planId}/summary`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        fields,
        plan_name: nameInput ? nameInput.value : undefined,
        category: categoryInput ? categoryInput.value : undefined,
        nb_product: productSelect ? productSelect.value : undefined,
        nb_network: nbNetwork,
        nb_tpa: nbTpa,
      }),
    });
    toast('Benefit summary updated');
    await loadBenefitsSummary();
  } catch (err) {
    toast(err.message, true);
  }
}

function _directionChip(direction, pctChange) {

  const pct = pctChange != null ? ` ${pctChange > 0 ? '+' : ''}${pctChange}%` : '';

function _categoryMappingHtml(plans, comparisons) {
  const existingPlans = plans.filter(p => p.role === 'existing');
  const quotedPlans = plans.filter(p => p.role === 'quoted');
  // Only ambiguous - and only actionable - when there's more than one
  // plan on each side; with a single existing plan it's always compared
  // against every quoted category already (see existing_plan_reused), and
  // with a single quoted plan there's nothing to choose between.
  if (existingPlans.length < 2 || quotedPlans.length < 2) return '';

  const currentQuotedIdByExisting = {};
  comparisons.forEach(c => {
    if (!c.existing_plan_reused) currentQuotedIdByExisting[c.existing_plan_id] = c.quoted_plan_id;
  });

  const rows = existingPlans.map(ep => {
    const selectedId = ep.matched_quote_plan_id ?? currentQuotedIdByExisting[ep.id] ?? '';
    const options = quotedPlans.map(qp => `
      <option value="${qp.id}" ${String(selectedId) === String(qp.id) ? 'selected' : ''}>
        ${escapeHtml(qp.plan_name || 'Quoted plan')}${qp.category ? ' (Cat ' + escapeHtml(qp.category) + ')' : ''}
      </option>
    `).join('');
    return `
      <tr>
        <td>${escapeHtml(ep.plan_name || 'Existing plan')}${ep.category ? ' (Cat ' + escapeHtml(ep.category) + ')' : ''}</td>
        <td>
          <select onchange="onChangeBenefitPlanMatch(${ep.id}, this)">
            <option value="">- not compared -</option>
            ${options}
          </select>
        </td>
      </tr>
    `;
  }).join('');

  return `
    <div class="card">
      <h3>Category mapping</h3>
      <div class="hint">This case has more than one existing category and more than one HealthCross quote category - pick which HealthCross category each existing plan should be compared against below if the automatic match (by category letter or plan name) picked the wrong one.</div>
      <table>
        <tr><th>Existing plan</th><th>Compared against (HealthCross quote)</th></tr>
        ${rows}
      </table>
    </div>
  `;
}

          &nbsp;vs&nbsp;
          HealthCross Quote: ${escapeHtml(c.quoted_plan_name || '-')}${c.quoted_category ? ' (Cat ' + escapeHtml(c.quoted_category) + ')' : ''}
          ${c.quoted_gross_premium != null ? ` (AED ${c.quoted_gross_premium.toLocaleString()}${c.quoted_member_count ? ' / ' + c.quoted_member_count + ' members' : ''})` : ''}

        <table>

          ${Object.entries(c.fields).map(([field, cmp]) => `

// Which uploaded claims report (see /claims-reports - a case can have one
// per policy year) the projection/breakdown/diagnosis views below are
// currently scoped to - null means "the latest one" (the API's own
// default), matching the behavior before multi-year support existed.
let selectedClaimsReportId = null;

function _withClaimsReportId(params) {
  if (selectedClaimsReportId) params.set('report_id', selectedClaimsReportId);
  return params;
}

async function loadClaimsReportYearSelector() {
  const area = document.getElementById('claims-report-year-area');
  try {
    const reports = await api(`/cases/${currentCase.id}/claims-reports`);
    if (reports.length > 0) {
      _setUploadStatus('claims', `${reports.length} report${reports.length === 1 ? '' : 's'} uploaded`);
    }
    if (reports.length < 2) {
      // Only one (or no) report uploaded - the year picker would just be
      // noise, same as before multi-year support existed.
      area.innerHTML = '';
      return;
    }
    if (!reports.some(r => r.id === selectedClaimsReportId)) {
      selectedClaimsReportId = reports[reports.length - 1].id; // latest by period
    }
    area.innerHTML = `
      <div class="card">
        <h3>Claims report year</h3>
        <div class="hint">${reports.length} years of claims reports uploaded for this case - the views below reflect whichever one is selected here.</div>
        <select onchange="onChangeClaimsReportYear(this.value)">
          ${reports.map(r => `<option value="${r.id}" ${r.id === selectedClaimsReportId ? 'selected' : ''}>${escapeHtml(_claimsReportYearLabel(r))}</option>`).join('')}
        </select>
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

function _claimsReportYearLabel(r) {
  const year = r.report_period_start ? r.report_period_start.slice(0, 4) : (r.report_production_date ? r.report_production_date.slice(0, 4) : '?');
  const range = (r.report_period_start && r.report_period_end) ? ` (${r.report_period_start} to ${r.report_period_end})` : '';
  return `${year}${range}`;
}

async function recomputeClaimsProjection() {
  const input = document.getElementById('credibility-override');
  const pct = Number(input.value);
  if (Number.isNaN(pct) || pct < 0 || pct > 100) { toast('Enter a credibility % between 0 and 100', true); return; }
  const loading = Number(document.getElementById('claims-projection-loading-override').value) / 100;
  await loadClaimsProjection(pct / 100, loading);
}

        <tr><th>Type</th><th>Amount</th><th>% of total</th>${hasAnnualized ? '<th>Annualized</th>' : ''}</tr>

            <td>Maternity (${escapeHtml(b.maternity.label)})</td><td>${b.maternity.value.toLocaleString()}</td><td>${b.maternity.pct_of_total ?? '-'}%</td>

          </tr>

      </table>
      <div class="hint">${b.maternity ? 'Maternity is a diagnosis-based cross-cut shown for reference - its amount is already included within In-Patient/Out-Patient above, not additional to them. ' : 'No Maternity diagnosis grouping found on this report. '}${b.treatment_type_breakdown.length ? '' : 'Treatment-type split isn\'t available for this report format. '}${hasAnnualized ? '' : 'Annualized figures need 6 full months of claims plus a census to run the projection.'}</div>
    ` : '<div class="hint">Treatment-type split isn\'t available for this report format.</div>';

    const memberTypeCols = [

      { key: 'pharmacy', label: 'Pharmacy' }, { key: 'dental', label: 'Dental' },
      { key: 'optical', label: 'Optical' }, { key: 'not_yet_classified', label: 'Not yet classified' },
      { key: 'total', label: 'Total' },
    ];
    const memberTypeTable = (b.claims_by_member_type && b.claims_by_member_type.length) ? `
      <h4>Claims by member type (relation)</h4>
      <table>
        <tr><th>Relation</th>${memberTypeCols.map(c => `<th>${c.label}</th>`).join('')}<th>Members</th>${hasAnnualized ? '<th>Annualized</th><th>Burning cost / member</th>' : ''}</tr>
        ${b.claims_by_member_type.map(r => `
          <tr>
            <td>${escapeHtml(r.relation)}</td>
            ${memberTypeCols.map(c => `<td>${r[c.key].toLocaleString()}<br><span class="hint" style="margin:0;">${r.pct_of_column[c.key] ?? '-'}%</span></td>`).join('')}

    if (!providersTable && !b.treatment_type_breakdown.length && !b.maternity && !memberTypeTable) {
      area.innerHTML = '';
      return;
    }
    area.innerHTML = `
      <div class="card">
        <h3>Claims breakdown</h3>
        ${providersTable}

        ${memberTypeTable}
      </div>

  } catch (err) {
    area.innerHTML = '';

    const r = await api(`/cases/${currentCase.id}/renewal-rating${qs}`);

function renewalBenchmarkHtml(r) {
  const book = r.book;
  const thisPct = r.case.actual_loss_ratio * 100;

  if (!book.comparable_case_count) {
    return `
      <div class="card">
        <h3>Renewal benchmark</h3>
        <div class="hint">How this case's own loss ratio compares to HealthCross's other renewal cases - case-to-case, since there's no external market-rate data source. No other case has a computed renewal rating yet, so there's nothing to benchmark against.</div>
      </div>
    `;
  }

  const medianPct = book.median_loss_ratio * 100;
  const percentile = book.percentile;
  const dotColor = percentile >= 75 ? 'var(--critical)' : percentile <= 25 ? 'var(--good)' : 'var(--accent)';

  const allPct = [...book.other_loss_ratios.map(v => v * 100), thisPct];
  const minV = Math.min(...allPct);
  const maxV = Math.max(...allPct);
  const pad = (maxV - minV) * 0.15 || 5;
  const domainMin = Math.max(0, minV - pad);
  const domainMax = maxV + pad;
  const xScale = v => 40 + ((v - domainMin) / (domainMax - domainMin || 1)) * 780;

  const tickCount = 4;
  const ticks = Array.from({length: tickCount + 1}, (_, i) => domainMin + (i / tickCount) * (domainMax - domainMin));
  const ticksHtml = ticks.map(t => `
    <line x1="${xScale(t)}" y1="46" x2="${xScale(t)}" y2="58" stroke="var(--grid)" stroke-width="1"></line>
    <text x="${xScale(t)}" y="74" text-anchor="middle" class="renewal-benchmark-annot">${t.toFixed(0)}%</text>
  `).join('');

  const dotsHtml = book.other_loss_ratios.map(v => `<circle cx="${xScale(v * 100)}" cy="52" r="5" fill="var(--ink-muted)" opacity="0.55"></circle>`).join('');

  return `
    <div class="card">
      <h3>Renewal benchmark</h3>
      <div class="hint">How this case's own loss ratio compares to HealthCross's other renewal cases (${book.comparable_case_count} with a computed renewal rating) - case-to-case, since there's no external market-rate data source. A snapshot, not a trend - most cases have one year of claims history so far.</div>
      <div class="row" style="flex-wrap:wrap; gap:12px; margin-bottom:16px;">
        <div style="flex:1; min-width:160px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
          <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">This case's loss ratio</div>
          <div style="font-size:22px; font-weight:700;">${thisPct.toFixed(1)}%</div>
          <div style="font-size:11.5px; color:var(--ink-muted); margin-top:3px;">vs. book median ${medianPct.toFixed(1)}%</div>
        </div>
        <div style="flex:1; min-width:160px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
          <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">Percentile in book</div>
          <div style="font-size:22px; font-weight:700;">${percentile}th</div>
          <div style="font-size:11.5px; color:var(--ink-muted); margin-top:3px;">among ${book.comparable_case_count} comparable case${book.comparable_case_count === 1 ? '' : 's'}</div>
        </div>
        <div style="flex:1; min-width:160px; background:var(--surface-2); border-radius:8px; padding:14px 16px;">
          <div style="font-size:11px; color:var(--ink-muted); margin-bottom:6px;">Renewal increase (this case)</div>
          <div style="font-size:22px; font-weight:700;">${r.case.renewal_increase_pct > 0 ? '+' : ''}${r.case.renewal_increase_pct}%</div>
          <div style="font-size:11.5px; color:var(--ink-muted); margin-top:3px;">book median ${book.median_renewal_increase_pct > 0 ? '+' : ''}${book.median_renewal_increase_pct}%</div>
        </div>
      </div>
      <div style="font-size:12.5px; font-weight:700; margin:4px 0 10px;">Loss ratio vs. other renewal cases</div>
      <svg viewBox="0 0 860 92" preserveAspectRatio="xMidYMid meet" style="width:100%; display:block; overflow:visible;">
        <style>.renewal-benchmark-annot { font-size: 10.5px; fill: var(--ink-muted); }</style>
        <line x1="20" y1="52" x2="840" y2="52" stroke="var(--grid)" stroke-width="2" stroke-linecap="round"></line>
        ${ticksHtml}
        ${dotsHtml}
        <circle cx="${xScale(thisPct)}" cy="52" r="7.5" fill="${dotColor}" stroke="var(--surface)" stroke-width="2"></circle>
        <text x="${xScale(thisPct)}" y="32" text-anchor="middle" style="font-size:11px; font-weight:700;" fill="${dotColor}">this case &middot; ${thisPct.toFixed(0)}%</text>
      </svg>
      ${book.low_credibility ? `<span class="tier-pill dir-review" style="margin-top:10px;">Small sample - only ${book.comparable_case_count} comparable case${book.comparable_case_count === 1 ? '' : 's'} so far, treat as directional</span>` : ''}
    </div>
  `;
}

function _rbKpi(label, value, sub) {
  return `
    <div class="rb-kpi-card">
      <div class="rb-kpi-label">${escapeHtml(label)}</div>
      <div class="rb-kpi-value">${value}</div>
      ${sub ? `<div class="rb-kpi-sub">${sub}</div>` : ''}
    </div>
  `;
}

// Steps: [{label, value, final}] - each step's own bar is scaled against
// the LARGEST value in the sequence (usually required_premium, the last
// step), so every intermediate build-up step is visually comparable on
// the same track, not just the final result.
function _rbBuildupHtml(steps) {
  const maxVal = Math.max(...steps.map(s => s.value));
  return steps.map(s => `
    <div class="rb-buildup-row ${s.final ? 'rb-buildup-final' : ''}">
      <div>${escapeHtml(s.label)}</div>
      <div class="rb-buildup-track"><div class="rb-buildup-fill" style="width:${maxVal ? (s.value / maxVal * 100).toFixed(1) : 0}%;"></div></div>
      <div class="rb-buildup-val">AED ${Math.round(s.value).toLocaleString()}</div>
    </div>
  `).join('');
}

// The account as the Portfolio Loss Ratio screen reports it - the same
// function, not a second computation. This leads the scorecard because
// it reads the latest uploaded book, where the two methods below read a
// claims ledger attached to the case that goes stale the moment the book
// is refreshed. NOMADA showed 75.6% here against 83.6% there.
// Server-rendered at a URL, so the button is a plain window.open with
// nothing awaited - the popup cannot be blocked and the browser simply
// loads a page. Assembling a document in the browser after an await is
// what broke this twice before.
// A document card: read it, or take it away. Deliberately not "print" -
// a browser print stamps its own date, URL and page counter onto the
// page, which is what made these look like screenshots of an internal
// tool rather than something a firm sends out. Download opens the same
// document with the print dialog already up, so the PDF comes from the
// document's own @page rules.
function _docCardHtml(title, lede, desc, url, primary) {
  return `
    <div class="doc-card">
      <div class="doc-card-body">
        <div class="doc-card-title">${escapeHtml(title)}</div>
        <div class="doc-card-lede">${escapeHtml(lede)}</div>
        <div class="doc-card-desc">${escapeHtml(desc)}</div>
      </div>
      <div class="doc-card-actions">
        <button class="${primary ? 'primary' : ''}" onclick="openDoc('${url}')">View</button>
        <button onclick="downloadDoc('${url}')">Download</button>
      </div>
    </div>`;
}

function openDoc(url) {
  // Opened inside the click, before anything is awaited - a pop-up
  // blocker kills a window opened later and the button looks broken.
  const win = window.open(url, '_blank');
  if (!win) toast('Your browser blocked the document - allow pop-ups for this site', true);
}

function downloadDoc(url) {
  const win = window.open(url, '_blank');
  if (!win) { toast('Your browser blocked the document - allow pop-ups for this site', true); return; }
  // The document raises its own print dialog once it has laid out, so the
  // PDF is made from its @page rules rather than the tab's default.
  win.addEventListener('load', () => setTimeout(() => win.print(), 350), { once: true });
}

function openRenewalReport() {
  if (!currentCase) { toast('Open a case first', true); return; }
  window.open(`/cases/${currentCase.id}/renewal-report.html`, '_blank');
}

// The renewal ladder, written as the arithmetic it is. A RATIO carried
// forward, not absolute claims: the claims were earned against the
// pro-rata premium, so annualising them and dividing by the (larger)
// expiring premium mixes two bases and quietly improves the loss ratio.
// On NOMADA that read 73.0% against an actual 83.6%, and turned +18.3%
// into +1.9%.
function _rbLadderHtml(m) {
  if (m.trended_loss_ratio == null) return '';
  const p = v => `${(v * 100).toFixed(1)}%`;
  const rows = [
    ['Loss ratio', p(m.actual_loss_ratio), 'incurred &divide; earned'],
    [`+ Inflation (${p(m.assumptions_used.inflation_pct)})`, p(m.trended_loss_ratio), 'points, not a multiplier'],
    [`&divide; (1 &minus; ${p(m.assumptions_used.loading_pct)} loading)`,
      p(m.experience_share_of_expiring), 'of the expiring premium, on experience'],
  ];
  // The floor is a separate line, never folded into the one above it.
  // "Needs 9%" and "needs 2%, floored to 9%" are different conversations
  // and a single number cannot tell them apart.
  if (m.floor_applied) {
    rows.push([`House floor (${p(m.minimum_increase_pct)} minimum)`,
      p(m.required_share_of_expiring),
      `experience asked ${m.experience_increase_pct > 0 ? '+' : ''}${m.experience_increase_pct}%`]);
  }
  rows.push(
    ['Expiring premium', 'AED ' + Math.round(m.renewal_base_premium).toLocaleString(), 'annualised at current rates'],
    ['Required premium', 'AED ' + Math.round(m.required_premium).toLocaleString(),
      m.floor_applied ? 'at the house floor' : '', true],
  );
  return `<table class="rb-table" style="margin-top:4px;">${rows.map(
    ([l, v, note, strong]) => `<tr${strong ? ' class="total"' : ''}>
      <td>${strong ? '<strong>' + l + '</strong>' : l}</td>
      <td class="num">${strong ? '<strong>' + v + '</strong>' : v}</td>
      <td style="color:var(--muted); font-size:11px;">${note}</td></tr>`).join('')}</table>`;
}

function _renewalBookPanelHtml(r) {
  const f = r.from_book;
  if (!f) {
    const u = r.from_book_unavailable;
    if (!u || !u.reason) return '';
    const close = (u.closest_accounts_on_the_book || []);
    return `
      <div class="rb-card" style="margin-bottom:14px;">
        <div class="rb-card-title">Loss ratio &mdash; not read from the book</div>
        <div class="rb-card-sub">${escapeHtml(u.reason)}</div>
        ${close.length ? `<div class="rb-card-sub" style="margin-top:8px;">Closest accounts on the
          book: ${close.map(n => `<b>${escapeHtml(n)}</b>`).join(', ')}.</div>` : ''}
      </div>`;
  }
  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';
  // The case RECORD's premium against the book's. Both methods now price
  // off the book, so this is a housekeeping note rather than a warning
  // that the figures are wrong - which is why it says to correct the
  // record instead of telling the reader to distrust the card.
  const mismatch = r.premium_disagrees_with_book ? `
    <div class="rb-reconcile" style="margin-top:12px;">
      <div class="txt">The case record still carries
        <b>AED ${aed(r.case_current_annual_premium)}</b> as this account's expiring premium, where
        the book has its actual gross premium at <b>AED ${aed(f.gross_premium)}</b>. Every figure on
        this tab prices off the book; update the case record so the two agree.</div>
    </div>` : '';
  return `
    <div class="rb-card" style="margin-bottom:14px;">
      <div class="rb-card-title">Loss ratio &mdash; from the book</div>
      <div class="rb-card-sub">${escapeHtml(f.source)}, as of ${escapeHtml(String(f.as_of))}.
        Paid + Outstanding + IBNR over premium earned across ${f.days} days on risk, for
        ${f.member_count} lives. Identical to the Portfolio Loss Ratio screen by construction &mdash;
        the same function produces both, so they cannot disagree.</div>
      <div class="rb-kpi-strip">
        ${_rbKpi('Gross earned loss ratio', pct(f.gross_loss_ratio),
                 `AED ${aed(f.incurred_claims)} incurred &divide; AED ${aed(f.earned_premium)} earned`)}
        ${_rbKpi('Net earned loss ratio', pct(f.net_loss_ratio),
                 `&divide; AED ${aed(f.net_premium)} net of ${pct(f.loading_pct)} loading`)}
      </div>
      <div class="scroll"><table class="rb-table" style="margin-top:12px;">
        <tr><th>Paid</th><th>Outstanding</th><th>IBNR</th><th>Incurred</th>
            <th>Annual gross</th><th>Earned</th><th>Net</th></tr>
        <tr><td>${aed(f.paid)}</td><td>${aed(f.outstanding)}</td><td>${aed(f.ibnr)}</td>
            <td><strong>${aed(f.incurred_claims)}</strong></td>
            <td>${aed(f.gross_premium)}</td><td>${aed(f.earned_premium)}</td>
            <td>${aed(f.net_premium)}</td></tr>
      </table></div>
      ${mismatch}
    </div>`;
}

function _renewalBenchScorecardHtml(r) {
  // A bad input is reported as a bad input, not priced. The card used to
  // divide by a 13.5% claims share and print "+283%" beside a 44% loss
  // ratio, with nothing on the page connecting the two.
  if (r.pricing_blocked) {
    return _renewalBookPanelHtml(r) + `
      <div class="rb-card">
        <div class="rb-card-title">Renewal scorecard &mdash; not priced</div>
        <div class="rb-card-sub">The account's experience is above; the renewal price is withheld
          until the input below is resolved. Correct it on the case record and this card prices
          itself.</div>
        ${r.pricing_problems.map(p => `
          <div class="hint" style="background:#fdecea;border-left:3px solid #c0392b;
               padding:10px 13px;margin-top:10px;color:#922b21;">
            <strong>${escapeHtml(p.field.replace(/_/g, ' '))}</strong>
            ${p.value == null ? '' : ' = <strong>' + escapeHtml(String(p.value)) + '</strong>'}
            <div style="margin-top:4px;">${escapeHtml(p.message)}</div>
          </div>`).join('')}
      </div>`;
  }
  const b = r.method_b;
  const ibnr = r.ibnr_detail;
  const gapPositive = r.method_gap >= 0;
  const fromBook = r.rating_source === 'book';
  // The premium the increase is quoted against, and where it came from.
  // A renewal covers a full year, so it is priced off the annualised
  // expiring premium - not the book's gross, which is prorated for
  // mid-term joiners and leavers and would understate the ask.
  const expiringNote = (r.expiring_premium && r.expiring_premium.source)
    ? ` (${escapeHtml(r.expiring_premium.source)}, ${r.expiring_premium.member_count} members)` : '';
  const dropped = (r.excluded_months || []).length ? `
      <div class="rb-card-sub" style="margin-top:8px;">Excluded as part months:
        ${escapeHtml(r.excluded_months.join(', '))} &mdash; holding
        AED ${Math.round(r.excluded_paid).toLocaleString()} paid and
        AED ${Math.round(r.excluded_outstanding).toLocaleString()} outstanding that no figure below
        counts. Dropping a part month from an AVERAGE is right; dropping its claims from a total is
        not, which is why the book panel above is the one to price from.</div>` : '';
  return _renewalBookPanelHtml(r) + `
    <div class="rb-card">
      <div class="rb-card-title">Renewal scorecard &mdash; ${fromBook
        ? 'from the book' : 'from this case&rsquo;s claims ledger'}</div>
      ${dropped}
      <div class="rb-card-sub">Both methods reach an Incurred Claims figure (Paid + Outstanding +
        IBNR) from ${fromBook
          ? `this account's own experience on the book to ${escapeHtml(String(r.from_book.as_of))} -
             ${r.from_book.days} days on risk, annualised - against its own gross premium of
             AED ${Math.round(r.from_book.gross_premium).toLocaleString()}`
          : `this case's own trailing full months in the claims ledger`}, but compute IBNR
        differently. Months used: ${escapeHtml(r.months_used.join(', '))}.</div>
      <div class="rb-scorecard-methods">
        <div class="rb-method-card">
          <div class="rb-method-head">
            <span class="rb-method-name">Method A &middot; Gross Loss Ratio</span>
            <span class="rb-badge rb-badge-a" title="The house quotes Method A. It is the number on the renewal list, the Member Rates grid and the printed Renewal Review.">A &middot; QUOTED</span>
          </div>
          <div class="rb-card-sub" style="margin:0 0 10px;">IBNR here is dynamic: this case's own Paid claims run rate over the elapsed days so far, projected over a 30-day unreported tail - AED ${ibnr.total_paid.toLocaleString()} paid &divide; ${ibnr.elapsed_days} elapsed days &times; 30 = AED ${ibnr.ibnr.toLocaleString()} to date, which annualises &times;${ibnr.annualization_factor} to <b>AED ${ibnr.annualized_ibnr.toLocaleString()}</b> - and that is the figure the build-up below adds, so the column reconciles.</div>
          <div class="rb-kpi-strip" style="grid-template-columns:1fr;">
            ${_rbKpi('Actual loss ratio', `${(r.actual_loss_ratio * 100).toFixed(1)}%`, `incurred claims &divide; premium earned over the same days`)}
            ${_rbKpi('Required premium', `AED ${Math.round(r.required_premium).toLocaleString()}`, `${(r.required_share_of_expiring * 100).toFixed(1)}% of the annualised expiring premium`)}
            ${_rbKpi('Renewal increase', `${r.renewal_increase_pct > 0 ? '+' : ''}${r.renewal_increase_pct}%`,
                     r.floor_applied
                       ? `house floor &mdash; this account&rsquo;s own experience asks ${r.experience_increase_pct > 0 ? '+' : ''}${r.experience_increase_pct}%`
                       : `vs. AED ${Math.round(r.renewal_base_premium).toLocaleString()} annualised expiring${expiringNote}`)}
          </div>
          <div style="margin-top:12px;">
            ${_rbLadderHtml(r)}
          </div>
        </div>
        <div class="rb-method-card">
          <div class="rb-method-head">
            <span class="rb-method-name">Method B &middot; Burning Cost</span>
            <span class="rb-badge rb-badge-b" title="Not quoted, and not decoration: a flat IBNR load and a credibility weight are the more defensible technical treatment. Where B asks for materially more than A, A is the softer number and the gap is the argument.">B &middot; REFERENCE</span>
          </div>
          <div class="rb-card-sub" style="margin:0 0 10px;">IBNR here is a flat load on the same Paid+Outstanding base: AED ${b.annualized_paid_and_outstanding.toLocaleString()} &times; ${(b.ibnr_pct * 100).toFixed(0)}% = AED ${(b.annualized_incurred_claims - b.annualized_paid_and_outstanding).toLocaleString()}.</div>
          <div class="rb-kpi-strip" style="grid-template-columns:1fr;">
            ${_rbKpi('Actual loss ratio', `${(b.actual_loss_ratio * 100).toFixed(1)}%`, `AED ${b.annualized_incurred_claims.toLocaleString()} incurred claims &divide; earned-basis premium`)}
            ${_rbKpi('Required premium', `AED ${Math.round(b.required_premium).toLocaleString()}`, `after ${(b.assumptions_used.credibility_pct * 100).toFixed(0)}% credibility`)}
            ${_rbKpi('Renewal increase', `${b.renewal_increase_pct > 0 ? '+' : ''}${b.renewal_increase_pct}%`,
                     b.floor_applied ? `house floor &mdash; experience asks ${b.experience_increase_pct > 0 ? '+' : ''}${b.experience_increase_pct}%`
                       : `vs. AED ${Math.round(b.renewal_base_premium).toLocaleString()} annualised expiring`)}
          </div>
          <div style="margin-top:12px;">
            ${_rbLadderHtml(b)}
          </div>
        </div>
      </div>
      <div class="rb-card-sub" style="margin-top:10px;">Both methods gross up their own final claims figure by the same loading (TPA Fee + Commission + HC Fee + QIC Fee, ${(r.assumptions_used.loading_pct * 100).toFixed(1)}% total) to reach Required Premium - see the Scorecard tab for that fee split.</div>
      <div class="rb-reconcile">
        <div class="txt"><b>Method A is what the house quotes</b> - it is the figure on the renewal list, the Member Rates grid and the printed review. Method B is not decoration: a flat IBNR load with a credibility weight is the more defensible technical treatment, so where it asks for materially more, Method A is the softer number and this gap is the argument. Method B (Burning Cost) requires <b>AED ${Math.abs(r.method_gap).toLocaleString()}</b> ${gapPositive ? 'more' : 'less'} than Method A - the different IBNR convention and credibility weighting's combined effect once grossed up through the same loading.</div>
        <div class="delta">${r.method_gap_pct > 0 ? '+' : ''}${r.method_gap_pct}%</div>
      </div>
      <div class="rb-row" style="margin-top:14px;">
        <div class="rb-input"><label>IBNR % flat (Method B only)</label><input type="number" id="renewal-bench-ibnr-override" step="0.5" value="${(b.ibnr_pct * 100).toFixed(1)}"></div>
        <div class="rb-input"><label>Credibility % (Method B)</label><input type="number" id="renewal-bench-credibility-override" step="1" value="${(b.assumptions_used.credibility_pct * 100).toFixed(0)}"></div>
        <button class="rb-btn" onclick="recomputeRenewalBenchScorecard()">Recompute</button>
      </div>
    </div>
  `;
}

async function adoptComputedExistingPremium(computedTotal) {
  if (!currentCase) return;
  // Same guard as saveCaseDetails: a reply that arrives after the user has
  // moved to another case must not put the old one back on screen.
  const savingCaseId = currentCase.id;
  try {
    const saved = await api(`/cases/${savingCaseId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ current_annual_premium: computedTotal }),
    });
    if (!currentCase || currentCase.id !== savingCaseId) return;
    currentCase = saved;
    toast(`Current annual premium set to AED ${Math.round(computedTotal).toLocaleString()}`);
    // The premium drives the scorecard, drivers and NB comparison too, so
    // the whole tab is reloaded rather than just this one card.
    await loadRenewalBenchSummary();
    await loadRenewalScenarios();
    await loadRenewalOptions();
    await loadClaimsDevelopment();
    await loadRenewalBenchScorecard();
    await loadRenewalBenchNbComparison();
    await loadExecutiveSummary();
  } catch (err) {
    toast(err.message, true);
  }
}
