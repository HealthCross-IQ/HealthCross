// selected one survives a refilter, since filtering by account naturally
// removes every other option from the response.
function _lrFillPickers() {
  const clientSel = document.getElementById('lr-client');
  const yearSel = document.getElementById('lr-year');
  if (!clientSel || !yearSel || clientSel.dataset.filled) return;
  const clients = Array.from(new Set(lrState.rows.map(r => r.master_client))).sort();
  const years = Array.from(new Set(lrState.rows.map(r => (r.policy_start_date || '').slice(0, 4)).filter(Boolean))).sort();
  clientSel.insertAdjacentHTML('beforeend', clients.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join(''));
  yearSel.insertAdjacentHTML('beforeend', years.map(y => `<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join(''));
  clientSel.dataset.filled = '1';
}

// Which loss-ratio request is the current one. Changing the basis or the
// client filter twice in quick succession fires two fetches, and the
// slower one can land last - painting the table with figures that do not
// match the filters shown above them. An underwriter has no way to see
// that has happened; the numbers simply look wrong.
let _lrRequestToken = 0;

async function loadLossRatioBoard() {
  const bannerArea = document.getElementById('lr-banner-area');
  const tableArea = document.getElementById('lr-table-area');
  if (!tableArea) return;
  const token = ++_lrRequestToken;
  const asOfEl = document.getElementById('lr-as-of');
  const loadEl = document.getElementById('lr-loading');
  const clientEl = document.getElementById('lr-client');
  const yearEl = document.getElementById('lr-year');
  const params = new URLSearchParams();
  if (asOfEl && asOfEl.value) params.set('as_of', asOfEl.value);
  if (loadEl && loadEl.value) params.set('default_loading_pct', String(Number(loadEl.value) / 100));
  if (clientEl && clientEl.value) params.set('master_client', clientEl.value);
  if (yearEl && yearEl.value) params.set('policy_year', yearEl.value);
  const basisEl = document.getElementById('lr-basis');
  if (basisEl && basisEl.value) params.set('premium_basis', basisEl.value);
  lrState.basis = (basisEl && basisEl.value) || 'actual';
  const statusEl = document.getElementById('lr-status');
  if (statusEl && statusEl.value) params.set('status', statusEl.value);
  lrState.status = (statusEl && statusEl.value) || '';
  const groupByEl = document.getElementById('lr-group-by');
  if (groupByEl && groupByEl.value) params.set('group_by', groupByEl.value);
  lrState.groupBy = (groupByEl && groupByEl.value) || 'master_client';
  const productEls = Array.from(document.querySelectorAll('.lr-product-cb'));
  const checkedProducts = productEls.filter(el => el.checked).map(el => el.value);
  checkedProducts.forEach(p => params.append('products', p));
  lrState.products = checkedProducts;
  const ybEl = document.getElementById('lr-year-basis');
  if (ybEl && ybEl.value) params.set('year_basis', ybEl.value);
  lrState.yearBasis = (ybEl && ybEl.value) || 'underwriting';
  // Same control, different question depending on the basis - say which.
  const ylab = document.getElementById('lr-year-label');
  if (ylab) ylab.textContent = lrState.yearBasis === 'calendar' ? 'Calendar year' : 'Policy year';
  lrState.client = (clientEl && clientEl.value) || '';
  lrState.year = (yearEl && yearEl.value) || '';
  tableArea.innerHTML = '<div class="lr-card"><div class="lr-empty">Loading&hellip;</div></div>';
  try {
    const r = await api(`/portfolio-analysis/account-loss-ratio?${params.toString()}`);
    // A newer request has been fired since this one left. Its answer is
    // the one that matches what is on screen, so drop this reply rather
    // than painting the table with the previous filter's figures.
    if (token !== _lrRequestToken) return;
    lrState.rows = r.rows || [];
    lrState.totals = r.totals || null;
    if (asOfEl && !asOfEl.value && lrState.rows.length) {
      // Surface whichever report date the server actually used, so the
      // field never sits blank while the figures below already depend on one.
      asOfEl.value = r.as_of || '';
    }
    lrState.shed = r.shed_impact || null;
    lrState.shedCumulative = r.shed_cumulative || [];
    bannerArea.innerHTML = _lrBannerHtml(lrState.totals);
    tableArea.innerHTML = _lrTableHtml() + _lrShedHtml();
  } catch (err) {
    if (token !== _lrRequestToken) return;
    bannerArea.innerHTML = '';
    tableArea.innerHTML = `<div class="lr-card"><div class="lr-empty">${escapeHtml(err.message || 'Could not load the loss ratio board')}</div></div>`;
  }
}

/* "How much would the book improve if we didn't renew this account?"
   Ranked by the improvement actually on offer rather than by each
   account's own loss ratio - a 400% account with two lives on it moves
   nothing, and ranking by ratio puts it at the top. The premium given up
   sits beside every figure because shedding an account is permanent and
   the expense base does not shrink with it. */
function _lrShedHtml() {
  const s = lrState.shed;
  if (!s || !s.accounts || !s.accounts.length || s.book_net_loss_ratio == null) return '';
  const money = v => v == null ? '-' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
  const pts = v => v == null ? '-' : `${v > 0 ? '+' : ''}${(v * 100).toFixed(1)} pts`;

  const helping = s.accounts.filter(a => a.net_lr_change != null && a.net_lr_change < 0).slice(0, 10);
  if (!helping.length) {
    return `<div class="lr-card" style="margin-top:18px;">
      <div class="lr-card-title">Impact of shedding an account</div>
      <div class="lr-empty">No account is running worse than the book as a whole - there is nothing here to walk away from.</div>
    </div>`;
  }

  const rows = helping.map(a => {
    // Which of the two actions does more for the book. Re-pricing wins
    // whenever the rest of the book is itself above 100%: a book that is
    // losing money needs MORE correctly-priced premium in the pool, not
    // less of it. Shedding only wins once the remaining book is healthy.
    const better = a.repriced_lr_change != null && a.repriced_lr_change < a.net_lr_change ? 'reprice' : 'shed';
    return `
    <tr>
      <td>${escapeHtml(a.master_client)}${a.period_count > 1 ? `<div class="hint" style="margin:2px 0 0;">${a.period_count} policy periods</div>` : ''}</td>
      <td class="num">${a.member_count.toLocaleString()}</td>
      <td class="num">${money(a.earned_premium)}</td>
      <td class="num ${_lrBand(a.net_loss_ratio)}">${_lrPct(a.net_loss_ratio)}</td>
      <td class="num">${_lrPct(a.book_net_loss_ratio_without)}</td>
      <td class="num ${better === 'shed' ? 'lr-better' : ''}">${pts(a.net_lr_change)}</td>
      <td class="num">${a.required_increase_pct == null ? '-' : '+' + a.required_increase_pct.toFixed(0) + '%'}</td>
      <td class="num">${_lrPct(a.book_net_loss_ratio_repriced)}</td>
      <td class="num ${better === 'reprice' ? 'lr-better' : ''}">${pts(a.repriced_lr_change)}</td>
    </tr>`;
  }).join('');

  const cum = (lrState.shedCumulative || []).map(c => `
    <tr>
      <td class="num">${c.step}</td>
      <td>${escapeHtml(c.master_client)}</td>
      <td class="num">${_lrPct(c.own_net_loss_ratio)}</td>
      <td class="num">${money(c.cumulative_premium_given_up)}</td>
      <td class="num" style="font-weight:600;">${_lrPct(c.book_net_loss_ratio)}</td>
    </tr>`).join('');

  return `
    <div class="lr-card" style="margin-top:18px;">
      <div class="lr-card-title">Impact of shedding an account</div>
      <div class="lr-card-sub">The book currently runs at <strong>${_lrPct(s.book_net_loss_ratio)}</strong> net across ${s.account_count} accounts. Each row shows where the book would land if that one account were not renewed &mdash; ranked by the improvement actually on offer, not by the account's own ratio, because a terrible ratio on a handful of lives moves nothing.</div>
      <table class="lr-table" style="margin-top:12px;">
        <tr>
          <th rowspan="2">Account</th><th class="num" rowspan="2">Members</th><th class="num" rowspan="2">Earned premium</th><th class="num" rowspan="2">Its net LR</th>
          <th class="num" colspan="2" style="text-align:center;">If you lose it</th>
          <th class="num" colspan="3" style="text-align:center;">If you renew it at the right price</th>
        </tr>
        <tr>
          <th class="num">Book LR</th><th class="num">Gain</th>
          <th class="num">Increase needed</th><th class="num">Book LR</th><th class="num">Gain</th>
        </tr>
        ${rows}
      </table>
      <div class="lr-card-sub" style="margin-top:10px;">The better of the two is highlighted on each row. Re-pricing wins whenever the <em>rest</em> of the book is itself above 100%: a book that is losing money needs more correctly-priced premium in the pool, not less of it. Shedding only becomes the better move once the remaining book is healthy - or when the increase needed is one no client would accept.</div>
      ${s.unpriced_accounts && s.unpriced_accounts.length ? `
        <div class="lr-card-sub" style="margin-top:10px;"><strong>${s.unpriced_accounts.length} accounts carry ${money(s.unpriced_incurred)} of claims with no premium recorded</strong> and are excluded from the ranking above. Removing them would look like the best decision on the book because it costs nothing - but that is a data gap (a missing premium column, an unmapped subgroup, a client on the claims file that never reached the membership export), not a shedding opportunity.</div>` : ''}
      ${cum ? `
        <div class="lr-card-title" style="font-size:13px; margin-top:20px;">Shedding them in sequence</div>
        <div class="lr-card-sub">The single-account figures above each measure against today's book, so they do not add up. This walks the real path &mdash; remove, recompute, remove again &mdash; and shows the premium given up to get there.</div>
        <table class="lr-table" style="margin-top:10px;">
          <tr><th class="num">#</th><th>Account dropped</th><th class="num">Its net LR</th><th class="num">Cumulative premium given up</th><th class="num">Book LR after</th></tr>
          ${cum}
        </table>` : ''}
      <div class="lr-card-sub" style="margin-top:12px;">Shedding premium is permanent and the expense base does not shrink with it. Re-pricing an account to a sustainable level keeps the premium and the relationship; walking away is the option of last resort when the required increase is one no client will accept.</div>
    </div>
  `;
}

function lrDownloadCsv() {
  const cols = ['master_client','policy_start_date','days','expired','member_count','claim_count','paid','outstanding','ibnr','incurred_claims','loading_pct','gross_premium','earned_premium','net_premium','gross_loss_ratio','net_loss_ratio'];
  const esc = v => {
    const str = v == null ? '' : String(v);
    return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
  };
  const lines = [cols.join(',')].concat(_lrSortRows(lrState.rows).map(r => cols.map(c => esc(r[c])).join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `portfolio-loss-ratio-${lrState.asOf || 'export'}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}


function printLossRatioReport() {
  if (!lrState.rows.length) { toast('Nothing to print yet - load the loss ratio board first', true); return; }

  const asOf = (document.getElementById('lr-as-of') || {}).value || lrState.asOf || '';
  const calendar = lrState.yearBasis === 'calendar';
  const yearSel = (document.getElementById('lr-year') || {}).value || '';
  const acctSel = (document.getElementById('lr-client') || {}).value || '';

  const basisLabel = calendar ? 'Calendar year' : 'Underwriting year';
  const premLabel = lrState.basis === 'booked' ? 'Booked gross premium' : 'Actual gross premium';
  const period = yearSel ? (calendar ? `Calendar year ${yearSel}` : `Policy year ${yearSel}`) : 'All periods';

  // Distribution of accounts by net loss ratio - the shape of the book a
  // reinsurer reads first, before any individual account.
  const bands = [
    { label: 'Under 70%', test: r => r.net_loss_ratio != null && r.net_loss_ratio < 0.7 },
    { label: '70% - 100%', test: r => r.net_loss_ratio != null && r.net_loss_ratio >= 0.7 && r.net_loss_ratio <= 1 },
    { label: '100% - 150%', test: r => r.net_loss_ratio != null && r.net_loss_ratio > 1 && r.net_loss_ratio <= 1.5 },
    { label: 'Over 150%', test: r => r.net_loss_ratio != null && r.net_loss_ratio > 1.5 },
    // An account with no earned premium has no ratio to band, but it can
    // still carry real claims. Left implicit those claims would vanish
    // from this table while remaining in the portfolio total below it -
    // an external reader would find the two irreconcilable.
    { label: 'Not rated (no earned premium)', test: r => r.net_loss_ratio == null },
  ].map(b => {
    const sel = rows.filter(b.test);
    return {
      label: b.label,
      count: sel.length,
      earned: sel.reduce((a, r) => a + (r.earned_premium || 0), 0),
      incurred: sel.reduce((a, r) => a + (r.incurred_claims || 0), 0),
    };
  });
  const maxBand = Math.max(1, ...bands.map(b => b.earned));

  const bandRows = bands.filter(b => b.count).map(b => `

      <td class="num">${_lrMoney(r.earned_premium)}</td>
      <td class="num">${_lrMoney(r.net_premium)}</td>
      <td class="num ${_lrBand(r.gross_loss_ratio)}">${_lrPct(r.gross_loss_ratio)}</td>
      <td class="num b ${_lrBand(r.net_loss_ratio)}">${_lrPct(r.net_loss_ratio)}</td>

  const generated = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
  const ref = `HC-LR-${(asOf || '').replace(/-/g, '')}${yearSel ? '-' + yearSel : ''}`;

  const html = `<!doctype html>

let natState = { rows: [], meta: null };

function _natBar(credibility) {
  // Credibility is the whole point of this table - shown as a bar rather
  // than a bare percentage so a thin nationality is obvious at a glance.
  const pct = Math.round((credibility || 0) * 100);
  const color = pct >= 90 ? 'var(--lr-good)' : pct >= 50 ? 'var(--lr-warn)' : 'var(--lr-bad)';
  return `<div style="display:flex; align-items:center; gap:7px; justify-content:flex-end;">
      <div class="lr-bar" style="min-width:52px;"><span style="width:${pct}%; background:${color};"></span></div>
      <span style="font-family:var(--font-mono); font-size:11px; min-width:32px;">${pct}%</span>
    </div>`;
}

function _natFactorChip(f) {
  if (f == null) return '-';
  const band = f > 1.15 ? 'bad' : f < 0.9 ? 'good' : 'warn';
  return `<span class="lr-chip ${band}">${f.toFixed(2)}&times;</span>`;
}

function _natTableHtml() {
  const rows = natState.rows;
  if (!rows.length) {
    return '<div class="lr-card"><div class="lr-empty">No nationality data yet - upload the Membership and Claims exports on the Claims Explorer screen first.</div></div>';
  }
  const body = rows.map(r => `
    <tr style="${r.pricing_ready ? '' : 'opacity:0.62;'}">
      <td style="font-weight:600;">${escapeHtml(r.nationality)}${r.pricing_ready ? '' : '<span class="lr-exp" style="margin-left:6px;">building</span>'}<span class="yr" style="display:block; font-size:10.5px; color:var(--lr-muted); font-weight:500;">${escapeHtml((r.nationality_zone || '-').replace(/^zone_\d_/, '').replace(/_/g, ' '))} &middot; ${r.member_count.toLocaleString()} members</span></td>
      <td class="num">${r.earned_member_years.toLocaleString(undefined, {maximumFractionDigits: 1})}</td>
      <td class="num">${r.burning_cost != null ? Math.round(r.burning_cost).toLocaleString() : '-'}</td>
      <td class="num" style="color:var(--lr-muted);">${r.zone_burning_cost != null ? Math.round(r.zone_burning_cost).toLocaleString() : '-'}</td>
      <td class="num">${_natBar(r.credibility)}</td>
      <td class="num" style="font-weight:600;">${r.credible_burning_cost != null ? Math.round(r.credible_burning_cost).toLocaleString() : '-'}</td>
      <td class="num">${r.pricing_ready ? _natFactorChip(r.relativity) : `<span style="color:var(--lr-muted); font-family:var(--font-mono); font-size:11px;">${r.relativity != null ? r.relativity.toFixed(2) + '&times;' : '-'}</span>`}</td>
      <td class="num" style="color:var(--lr-muted);">${r.avg_age != null ? r.avg_age.toFixed(0) : '-'}</td>
      <td class="num" style="color:var(--lr-muted);">${r.female_pct != null ? r.female_pct.toFixed(0) + '%' : '-'}</td>
      <td class="num" style="color:var(--lr-muted);">${r.member_years_to_full_credibility > 0 ? '+' + r.member_years_to_full_credibility.toFixed(0) + ' yrs' : 'reached'}</td>
    </tr>
  `).join('');
  return `
    <div class="lr-card">
      <div class="lr-card-head">
        <div>
          <div class="lr-card-title">Burning cost by nationality</div>
          <div class="lr-card-note">Sorted by rating factor, most expensive first. Raw = the nationality's own experience; Credible = blended toward its zone by how much exposure stands behind it.</div>
        </div>
        <div class="lr-card-note">Full credibility at ${natState.meta ? natState.meta.full_credibility_member_years : 100} member-years</div>
      </div>
      <div class="lr-table-wrap">
        <table class="lr-table">
          <thead><tr>
            <th>Nationality</th>
            <th class="num">Exposure (yrs)</th>
            <th class="num">Raw BC</th>
            <th class="num">Zone BC</th>
            <th class="num">Credibility</th>
            <th class="num">Credible BC</th>
            <th class="num">Factor</th>
            <th class="num">Avg age</th>
            <th class="num">Female</th>
            <th class="num">To full cred.</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
  `;
}

async function loadNationalityRisk() {
  const tableArea = document.getElementById('nat-table-area');
  const summaryArea = document.getElementById('nat-summary-area');
  if (!tableArea) return;
  const params = new URLSearchParams();
  const full = document.getElementById('nat-full-cred');
  const lo = document.getElementById('nat-min-rel');
  const hi = document.getElementById('nat-max-rel');
  if (full && full.value) params.set('full_credibility_member_years', full.value);
  if (lo && lo.value) params.set('min_relativity', lo.value);
  if (hi && hi.value) params.set('max_relativity', hi.value);
  const pc = document.getElementById('nat-pricing-cred');
  if (pc && pc.value) params.set('pricing_credibility', pc.value);
  tableArea.innerHTML = '<div class="lr-card"><div class="lr-empty">Loading&hellip;</div></div>';
  try {
    const r = await api(`/portfolio-analysis/nationality-risk?${params.toString()}`);
    const readyOnly = document.getElementById('nat-ready-only');
    natState.rows = (readyOnly && readyOnly.checked)
      ? (r.rows || []).filter(x => x.pricing_ready)
      : (r.rows || []);
    natState.meta = r;
    summaryArea.innerHTML = `
      <div class="lr-banner">
        <div class="lr-banner-grid">
          <div class="lr-b-item hero"><div class="k">Ready to price on</div><div class="v">${r.pricing_ready_count}<small> / ${r.nationality_count}</small></div></div>
          <div class="lr-b-item hero"><div class="k">Fully credible</div><div class="v">${r.fully_credible_count}<small> / ${r.nationality_count}</small></div></div>
          <div class="lr-b-item"><div class="k">Still building</div><div class="v">${r.nationality_count - r.pricing_ready_count}</div></div>
        </div>
      </div>
    `;
    tableArea.innerHTML = _natTableHtml();
  } catch (err) {
    summaryArea.innerHTML = '';
    tableArea.innerHTML = `<div class="lr-card"><div class="lr-empty">${escapeHtml(err.message || 'Could not load nationality risk')}</div></div>`;
  }
}

function scorecardWeightsUsedHtml(sc) {
  const used = sc.details.weights_used;
  if (!used) return '';
  const noClaims = used.claims_experience === 0;
  return `
    <div class="hint" style="margin-top:10px;">
      Weights used: Demographic ${(used.demographic * 100).toFixed(1)}% &middot;
      Claims exp. ${(used.claims_experience * 100).toFixed(1)}% &middot;
      Benefit richness ${(used.benefit_richness * 100).toFixed(1)}% &middot;
      Industry ${(used.industry * 100).toFixed(1)}%
      ${noClaims ? '<span class="tier-pill dir-review" style="margin-left:6px;">No claims - reweighted</span>' : ''}
    </div>
  `;
}

function scorecardPortfolioReferenceHtml(sc) {
  const ref = sc.details.portfolio_reference;
  if (!ref) return '';

  const bc = ref.burning_cost;
  let burningCostHtml = '<div class="hint">No burning cost data available yet.</div>';
  if (bc && bc.basis === 'network') {
    burningCostHtml = bc.rows.map(r => `
      <div class="hint" style="margin:2px 0;">
        <strong>${escapeHtml(r.network)}</strong>: AED ${r.burning_cost.toLocaleString()} per member per year
        (${r.member_count.toLocaleString()} members, ${r.earned_member_years.toLocaleString()} earned member-years)
      </div>
    `).join('');
  } else if (bc && bc.basis === 'whole_book' && bc.burning_cost != null) {
    burningCostHtml = `
      <div class="hint">
        Whole-book average (no matching HealthCross quote network found): AED ${bc.burning_cost.toLocaleString()} per member per year
        (${bc.member_count.toLocaleString()} members, ${bc.earned_member_years.toLocaleString()} earned member-years)
      </div>
    `;
  }

  const mix = ref.population_mix;
  const mixHtml = mix ? `
    <div class="hint" style="margin-top:6px;">
      Book population: avg age ${mix.avg_age ?? '-'} &middot;
      ${Object.entries(mix.nationality_zone_mix).map(([z, pct]) => `${escapeHtml(z)} ${(pct * 100).toFixed(0)}%`).join(', ')} &middot;
      ${Object.entries(mix.gender_mix).map(([g, pct]) => `${escapeHtml(g)} ${(pct * 100).toFixed(0)}%`).join(', ')}
    </div>
  ` : '';

  return `
    <div class="card">
      <h3>Portfolio Analysis reference</h3>
      <div class="hint">HealthCross's own already-booked book, shown for context only - not used in the score above.</div>
      ${burningCostHtml}
      ${mixHtml}
    </div>
  `;
}

async function recordOutcome(event) {
  event.preventDefault();
  const form = new FormData(event.target);
  const payload = {
    bound: form.get('bound') === 'true',
    final_premium: form.get('final_premium') ? Number(form.get('final_premium')) : null,
    actual_loss_ratio: form.get('actual_loss_ratio') ? Number(form.get('actual_loss_ratio')) : null,
  };
  try {
    await api(`/cases/${currentCase.id}/outcome`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    toast('Outcome recorded');
  } catch (err) {
    toast(err.message, true);
  }
}

    nbRateCardOptions = await api('/new-business/rate-card-options');
  } catch (err) {
    nbRateCardOptions = null;
  }

  // Book's own real claims experience by Product/Network, if HealthCross's
  // Portfolio Analysis book (Members + Claims + rate card) has been
  // uploaded - a reference figure shown alongside the rate card's own
  // price, not something that changes the quote itself. Silently empty
  // (rather than an error) when that book hasn't been uploaded, since
  // it's optional context for this page, not a requirement of it.
  nbBurningCostByProductNetwork = {};
  try {
    const rows = await api('/portfolio-analysis/burning-cost-by-product-network');
    rows.forEach(r => { nbBurningCostByProductNetwork[`${r.product}|${r.network}`] = r; });
  } catch (err) { /* Portfolio Analysis book not uploaded - no reference figures */ }

  let censusCategories = { categories: [], uncategorized_member_count: 0 };
  try {
    censusCategories = await api(`/cases/${currentCase.id}/census-categories`);
  } catch (err) { /* no census yet */ }

  try {
    nbLastQuote = await api(`/cases/${currentCase.id}/new-business-quote`);
  } catch (err) {
    nbLastQuote = null;
  }
  try {
    nbQuoteByTier = nbLastQuote ? await api(`/cases/${currentCase.id}/new-business-quote/by-tier`) : null;
  } catch (err) {
    nbQuoteByTier = null;
  }
  try {
    nbBurningCostComparison = nbLastQuote ? await api(`/cases/${currentCase.id}/new-business-quote/burning-cost-comparison`) : null;
  } catch (err) {
    nbBurningCostComparison = null;
  }
  nbSelectedTierProduct = null;

  const priorByCategory = {};
  if (nbLastQuote) {
    (nbLastQuote.categories || []).forEach(c => { priorByCategory[_normalizeCategory(c.category)] = c; });
  }

  // Each category's own Product/Network/TPA pick lives on its Benefits tab
  // card (BenefitPlan.nb_product/nb_network/nb_tpa) - the source of truth
  // this pre-fills from, since a case's categories commonly price against
  // different networks rather than sharing one value.
  const benefitsByCategory = {};
  try {
    const plans = await api(`/cases/${currentCase.id}/benefit-plans`);
    plans.filter(p => p.role === 'existing' && p.category).forEach(p => { benefitsByCategory[_normalizeCategory(p.category)] = p; });
  } catch (err) { /* no benefits uploaded yet */ }

  nbSuggestedProduct = censusCategories.suggested_product || null;

  nbCategories = censusCategories.categories.map(c => {
    const prior = priorByCategory[_normalizeCategory(c.category)];
    const benefitPlan = benefitsByCategory[_normalizeCategory(c.category)];
    return {
      category: c.category,
      member_count: c.member_count,
      product: (benefitPlan && benefitPlan.nb_product) || (prior ? prior.product : ''),
      network: (benefitPlan && benefitPlan.nb_network) || (prior ? prior.network : ''),
      tpa: (benefitPlan && benefitPlan.nb_tpa) || (prior ? prior.tpa : ''),
      commission_pct: prior && prior.commission_pct != null ? prior.commission_pct * 100 : '',
      loading_pct: prior && prior.loading_pct != null ? prior.loading_pct * 100 : '',
      variant_selections: prior ? { ...(prior.variant_selections || {}) } : {},
      previewRegion: (nbRateCardOptions && nbRateCardOptions.regions[0]) || 'Dubai',
      variantOptions: null,
    };
  });

  nbCensusUncategorized = censusCategories.uncategorized_member_count;
  await Promise.all(nbCategories.map((cat, idx) => cat.network ? nbFetchVariantOptions(idx) : Promise.resolve()));
  await nbRenderArea();

  // Every category already has a Product/Network (prefilled above from the
  // Benefits tab's own nb_product/nb_network, or from the prior quote) -
  // generate the quote straight away rather than making the underwriter
  // click "Compute quote" on data that's already complete. Only on first
  // load without an existing quote - nbComputeQuote() itself is what keeps
  // it fresh after that (see nbSetNetwork/nbSetVariantSelection/
  // nbSetCommission below), so this isn't needed on every tab switch.
  if (!nbLastQuote && _nbReadyToAutoCompute()) {
    await nbComputeQuote();
  }
}

// True once every priced category (i.e. every category the census actually
// has members in) has both a Product and a Network picked - the only two
// fields nbComputeQuote() strictly requires - so a quote can be generated
// with zero clicks the moment there's nothing left unset.
function _nbReadyToAutoCompute() {
  return nbCategories.length > 0 && nbCategories.every(c => c.product && c.network);
}

let nbCensusUncategorized = 0;
let nbSuggestedProduct = null;
let nbBurningCostByProductNetwork = {};

      <div class="hint"><strong>Takes benefits, not prices.</strong> Drop the pricing tool's own
        <strong>Plan Details</strong> export here and every category is configured and priced
        against the HealthCross rate card - product, network, TPA, Emirates and every benefit
        selection, exactly as decided in the tool. The file itself carries no premiums; the price
        is computed here. Nothing to re-key, and nothing to disagree with the tool that produced
        it. Each category's own Emirates value sets its region &mdash; DXB Dubai, AUH Abu Dhabi,
        NE Northern Emirates.</div>
      <div class="dropzone" id="dropzone-hc-plan-details">

    </div>
    <div class="card">

      <div class="hint">Each category's own Product/Network/TPA is set on its Benefits tab category card - pre-filled here from there. Each category's benefit-variant choices apply to every member in it; HealthCross's own rate card resolves each member's own Region/age/gender automatically.</div>
      ${nbCensusUncategorized ? `<div class="hint">${nbCensusUncategorized} census member(s) have no Category set and won't be priced.</div>` : ''}

/* Four prices and the gaps between them - see
   app/scoring/rules/price_comparison.py. The last gap is the one nothing
   else in the portal has ever shown: a discount agreed in a meeting
   leaves the computed quote untouched and the issued document different,
   and the two are never reconciled until the account renews badly. */
async function loadNbPriceComparison() {
  const area = document.getElementById('nb-price-comparison-area');
  if (!area || !currentCase) return;
  try {
    const r = await api(`/cases/${currentCase.id}/price-comparison`);
    const p = r.prices, pm = r.per_member;
    if (p.card_price == null && p.issued_price == null) { area.innerHTML = ''; return; }

    const aed = v => v == null ? '—' : Math.round(v).toLocaleString();
    const pct = v => v == null ? '—' : (v * 100).toFixed(1) + '%';
    const signed = v => v == null ? '—' : (v > 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
    const lrPill = v => v == null ? '<span class="hint">—</span>'
      : `<span class="tier-pill ${v > 1 ? 'dir-review' : v > 0.9 ? '' : 'dir-improved'}">${pct(v)}</span>`;

    // The discount block only appears when there is an issued quote to
    // compare against - an absent one is not a 100% discount.
    const d = r.discount;
    const discountBlock = !d ? '' : `
      <div class="card">
        <h3>${d.direction === 'discount' ? 'Discount given' : d.direction === 'loaded' ? 'Issued above the card' : 'Price held'}
          <span class="tier-pill ${d.direction === 'discount' ? 'dir-review' : d.direction === 'loaded' ? 'dir-improved' : 'dir-same'}">${signed(d.pct)}</span>
        </h3>
        <div class="hint">A discount does not come off margin - it comes off the money that funds claims. At a
          ${pct(r.loading_pct)} loading, premium &times; ${(1 - r.loading_pct).toFixed(3)} pays claims, and the expected
          claims do not move. So a ${pct(Math.abs(d.pct))} move in price changes the loss ratio by more than
          ${pct(Math.abs(d.pct))}.</div>
        <div class="row" style="margin-top:14px; gap:28px; flex-wrap:wrap;">
          <div><div class="hint">Amount</div><div style="font-size:18px;font-weight:600;">AED ${aed(Math.abs(d.amount_aed))}</div></div>
          <div><div class="hint">Implied LR at the card price</div><div style="font-size:18px;font-weight:600;">${pct(d.implied_loss_ratio_before)}</div></div>
          <div><div class="hint">Implied LR as issued</div><div style="font-size:18px;font-weight:600;">${pct(d.implied_loss_ratio_after)}</div></div>
          <div><div class="hint">Movement</div><div style="font-size:18px;font-weight:600;">${signed(d.loss_ratio_movement)}</div></div>
        </div>
      </div>`;

    const unpriced = r.issued_quote.categories_without_a_premium;
    area.innerHTML = `
      <div class="card">
        <h3>What the price should have been, and what went out</h3>
        <div class="hint">Loss ratio is measured against the part of each premium that actually funds claims
          (premium &times; ${(1 - r.loading_pct).toFixed(3)} at this case's ${pct(r.loading_pct)} loading), never against
          gross premium - measuring against gross flatters every account by exactly the loading.</div>
        <div style="overflow-x:auto;">
        <table style="margin-top:12px;">
          <tr><th style="width:26%;">Price</th><th class="num">Total (AED)</th><th class="num">Per member</th><th class="num">Implied LR</th><th>What it answers</th></tr>
          <tr><th>Expected claims</th><td class="num">${aed(p.expected_claims)}</td><td class="num">${aed(pm.expected_claims)}</td><td class="num"><span class="hint">—</span></td><td class="hint">what these members should cost, from our own book</td></tr>
          <tr><th>Risk-based price</th><td class="num">${aed(p.risk_price)}</td><td class="num">${aed(pm.risk_price)}</td><td class="num">${lrPill(r.implied_loss_ratio.at_risk_price)}</td><td class="hint">expected claims, carried for trend and industry, grossed up</td></tr>
          <tr><th>Rate card quote</th><td class="num">${aed(p.card_price)}</td><td class="num">${aed(pm.card_price)}</td><td class="num">${lrPill(r.implied_loss_ratio.at_card_price)}</td><td class="hint">what the card charges for this plan design</td></tr>
          <tr><th><strong>Issued quote</strong></th><td class="num"><strong>${aed(p.issued_price)}</strong></td><td class="num">${aed(pm.issued_price)}</td><td class="num">${lrPill(r.implied_loss_ratio.at_issued_price)}</td><td class="hint">what the broker actually received</td></tr>
        </table>
        </div>
        <table style="margin-top:14px;">
          <tr><th style="width:26%;">Card vs risk price</th><td class="num" style="width:14%;">${signed(r.gaps.card_vs_risk_pct)}</td><td class="hint">is the card adequate for this population?</td></tr>
          <tr><th>Issued vs card</th><td class="num">${signed(r.gaps.issued_vs_card_pct)}</td><td class="hint">what was given away in the room</td></tr>
          <tr><th>Issued vs risk price</th><td class="num">${signed(r.gaps.issued_vs_risk_pct)}</td><td class="hint">does the deal actually done still clear the risk?</td></tr>
        </table>
        ${unpriced.length ? `<div class="hint" style="margin-top:10px;">No premium read for category
          ${unpriced.map(escapeHtml).join(', ')} on the issued document - the issued total is short by whatever
          those carry, so treat it as a floor rather than the figure.</div>` : ''}
      </div>
      ${discountBlock}
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

/* The conclusion the whole New Business tab exists to reach. See
   app/scoring/rules/opportunity_risk.py - the discipline is that a
   factor the burning-cost cube already prices is shown and contributes
   nothing, so the same risk is never charged twice. */
const VERDICT_STYLE = {
  go_aggressive:     {pill: 'dir-improved', label: 'Go aggressive'},
  priced_right:      {pill: 'dir-same',     label: 'Priced about right'},
  needs_loading:     {pill: 'dir-review',   label: 'Needs loading'},
  decline_or_reprice:{pill: 'dir-review',   label: 'Decline or reprice'},
  not_enough_to_say: {pill: '',             label: 'Not enough to say'},
};

const TREATMENT_STYLE = {
  already_in_price: {pill: 'dir-same',    label: 'already in the price'},
  load:             {pill: 'dir-review',  label: 'loads'},
  widen_margin:     {pill: 'dir-review',  label: 'widen the margin'},
  ask:              {pill: '',            label: 'ask'},
};

async function loadNbOpportunityAssessment() {
  const area = document.getElementById('nb-opportunity-area');
  if (!area || !currentCase) return;
  try {
    const r = await api(`/cases/${currentCase.id}/opportunity-assessment`);
    const v = VERDICT_STYLE[r.verdict.verdict] || VERDICT_STYLE.not_enough_to_say;
    const aed = n => n == null ? '-' : Math.round(n).toLocaleString();
    const pc = n => n == null ? '-' : (n * 100).toFixed(1) + '%';

    // Factors that move the number, and factors that explain it. Kept
    // visually apart because reading them as one list is exactly how an
    // underwriter ends up loading for something already charged for.
    const moving = r.factors.filter(f => f.treatment === 'load' || f.treatment === 'widen_margin');
    const explaining = r.factors.filter(f => f.treatment === 'already_in_price');

    const factorRow = f => {
      const t = TREATMENT_STYLE[f.treatment] || TREATMENT_STYLE.ask;
      return `<tr>
        <td><strong>${escapeHtml(f.label)}</strong></td>
        <td>${escapeHtml(f.finding)}</td>
        <td><span class="tier-pill ${t.pill}">${t.label}</span></td>
      </tr>`;
    };

    const contributions = r.required_margin_contributions.map(c => `
      <tr><th>${escapeHtml(c.key.replace(/_/g, ' '))}</th><td>+${pc(c.pct)}</td><td>${escapeHtml(c.why)}</td></tr>
    `).join('');

    const adjustments = r.aed_adjustments.map(a => `
      <tr><th>${escapeHtml(a.key.replace(/_/g, ' '))}</th><td>${a.aed < 0 ? '-' : '+'}AED ${aed(Math.abs(a.aed))}</td><td>${escapeHtml(a.why)}</td></tr>
    `).join('');

    area.innerHTML = `
      <div class="card">
        <h3>Opportunity assessment <span class="tier-pill ${v.pill}">${v.label}</span></h3>
        <div style="font-size:16px; font-weight:600; margin-top:6px;">${escapeHtml(r.verdict.headline)}</div>
        <div class="hint">${escapeHtml(r.verdict.detail)}</div>
        <div class="row" style="margin-top:14px; gap:24px; flex-wrap:wrap;">
          <div><div class="hint">Risk price</div><div style="font-size:18px;font-weight:600;">AED ${aed(r.risk_price_aed)}</div></div>
          <div><div class="hint">Adjusted for what the cube can't see</div><div style="font-size:18px;font-weight:600;">AED ${aed(r.adjusted_risk_price_aed)}</div></div>
          <div><div class="hint">Quoted</div><div style="font-size:18px;font-weight:600;">AED ${aed(r.quoted_price_aed)}</div></div>
          <div><div class="hint">Margin carried</div><div style="font-size:18px;font-weight:600;">${pc(r.actual_margin_pct)}</div></div>
          <div><div class="hint">Margin required</div><div style="font-size:18px;font-weight:600;">${pc(r.required_margin_pct)}</div></div>
        </div>
      </div>

      ${moving.length ? `<div class="card">
        <h3>What moves the price</h3>
        <div class="hint">Only risk the burning-cost cube cannot already see. Everything below is a property of the offer, of how well the book knows this population, or of members who are not on the census - never a demographic the cube has already costed.</div>
        <div style="overflow-x:auto;">
        <table style="margin-top:12px;">
          <tr><th style="width:22%;">Factor</th><th>Finding</th><th style="width:16%;">Treatment</th></tr>
          ${moving.map(factorRow).join('')}
        </table>
        </div>
        ${contributions ? `<table style="margin-top:14px;">
          <tr><th style="width:22%;">Required margin</th><th style="width:12%;">Adds</th><th>Because</th></tr>
          <tr><th>base</th><td>+${pc(r.assumptions.base_required_margin_pct)}</td><td>a straightforward account</td></tr>
          ${contributions}
          <tr><th><strong>total</strong></th><td><strong>${pc(r.required_margin_pct)}</strong></td><td></td></tr>
        </table>` : ''}
        ${adjustments ? `<table style="margin-top:14px;">
          <tr><th style="width:22%;">Risk price adjusted</th><th style="width:16%;">By</th><th>Because</th></tr>
          ${adjustments}
        </table>` : ''}
      </div>` : ''}

      ${explaining.length ? `<div class="card">
        <h3>Already in the risk price</h3>
        <div class="hint">Shown to explain the number, and deliberately contributing nothing to it. The cube costs every member through product, network, age band, gender, relation and nationality zone - an older or more dependant-heavy group already prices higher on its own, and loading again for it charges twice.</div>
        <div style="overflow-x:auto;">
        <table style="margin-top:12px;">
          <tr><th style="width:22%;">Factor</th><th>Finding</th><th style="width:16%;">Treatment</th></tr>
          ${explaining.map(factorRow).join('')}
        </table>
        </div>
      </div>` : ''}

      <div class="card">
        <h3>Still to ask</h3>
        <div class="hint">Nothing we hold answers these, and none of them is safely assumed benign.</div>
        <table style="margin-top:12px;">
          ${r.open_questions.map(q => `<tr><th style="width:22%;">${escapeHtml(q.label)}</th><td>${escapeHtml(q.finding)}</td></tr>`).join('')}
        </table>
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

/* The client's existing cover beside what HealthCross is proposing.
   Both sides in the same 12 fields, with the proposal's limit and copay
   variants recombined into the one line a table of benefits actually
   writes - a comparison only reads if both sides are phrased alike. */
async function loadNbExistingVsProposed() {
  const area = document.getElementById('nb-existing-vs-proposed-area');
  if (!area || !currentCase) return;
  try {
    const r = await api(`/cases/${currentCase.id}/existing-vs-proposed`);
    if (!r.categories.length) { area.innerHTML = ''; return; }

    const dirPill = d => {
      if (d === 'improved') return '<span class="tier-pill dir-improved">richer</span>';
      if (d === 'reduced') return '<span class="tier-pill dir-review">leaner</span>';
      if (d === 'same') return '<span class="tier-pill dir-same">same</span>';
      return '<span class="tier-pill">review</span>';
    };

    const blocks = r.categories.map(c => {
      const rows = c.rows.map(row => {
        const both = row.existing && row.proposed;
        const added = !row.existing && row.proposed;
        const dropped = row.existing && !row.proposed;
        return `
        <tr>
          <td><strong>${escapeHtml(row.label)}</strong></td>
          <td>${row.existing ? escapeHtml(row.existing) : '<span class="hint">not in the document</span>'}</td>
          <td>${row.proposed ? escapeHtml(row.proposed) : `<span class="hint">${row.priced_as_variant ? 'not selected' : 'not priced as a variant'}</span>`}</td>
          <td>${both ? dirPill(row.direction)
                : added ? '<span class="tier-pill dir-review">added</span>'
                : dropped ? '<span class="tier-pill dir-review">no proposal</span>'
                : '<span class="hint">-</span>'}</td>
        </tr>`;
      }).join('');

      return `
        <div class="card">
          <h3>Category ${escapeHtml(c.category)}
            <span style="color:var(--ink-muted); font-weight:400; font-size:14px;">
              ${c.product ? escapeHtml(c.product) : ''}${c.network ? ' / ' + escapeHtml(c.network) : ''}${c.tpa ? ' (' + escapeHtml(c.tpa) + ')' : ''}
            </span>
          </h3>
          ${c.existing_plan_name ? `<div class="hint">Existing cover read from: ${escapeHtml(c.existing_plan_name)}</div>` : '<div class="hint">No existing table of benefits on this category - only the proposal is shown.</div>'}
          <div style="overflow-x:auto;">
          <table style="margin-top:12px;">
            <tr><th style="width:22%;">Benefit</th><th style="width:32%;">Client's existing</th><th style="width:32%;">HealthCross proposed</th><th style="width:14%;">Comparison</th></tr>
            ${rows}
          </table>
          </div>
        </div>`;
    }).join('');

    area.innerHTML = `
      <div class="card">
        <h3>Existing vs proposed benefits</h3>
        <div class="hint">The client's current cover beside what HealthCross is offering, field for field. Dental, Optical and Pharmacy price as two variants each (limit and copay) and are recombined here into the single line a table of benefits writes.</div>
        <div class="hint"><strong>"Added"</strong> means the incumbent's document says nothing about that benefit while HealthCross is offering it - the case where a proposal is most likely to be adding cover nobody has priced for. <strong>"Review"</strong> means the two values are not comparable as numbers and need reading.</div>
      </div>
      ${blocks}
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}
async function nbUploadPlanDetails() {
  const input = document.getElementById('file-hc-plan-details');
  const statusEl = document.getElementById('status-hc-plan-details');
  const resultEl = document.getElementById('nb-plan-details-result');
  if (!input || !input.files.length) { statusEl.textContent = 'Choose a file first'; return; }

  statusEl.textContent = 'Reading and pricing...';
  resultEl.innerHTML = '';
  const form = new FormData();
  form.append('file', input.files[0]);
  try {
    const r = await api(`/cases/${currentCase.id}/hc-plan-details`, { method: 'POST', body: form });
    statusEl.textContent = '';

    const warned = r.unmatched_selections || [];
    const notOnCensus = r.categories_not_on_census || [];
    resultEl.innerHTML = `
      <div class="hint" style="margin-top:12px;">
        <span class="tier-pill dir-improved">Priced</span>
        Categories ${r.categories_applied.map(escapeHtml).join(', ')} configured and quoted from ${escapeHtml(r.source_filename)}.
      </div>
      ${notOnCensus.length ? `<div class="hint">${notOnCensus.map(escapeHtml).join(', ')} ${notOnCensus.length === 1 ? 'is' : 'are'} priced in the export but nobody on the census is in ${notOnCensus.length === 1 ? 'it' : 'them'} - usually the export and the census are from different points in the negotiation.</div>` : ''}
      ${warned.length ? `
        <div class="hint" style="margin-top:8px;"><strong>${warned.length} selection(s) the rate card cannot price.</strong>
        These do not fail - pricing falls back to the base option - so the quote below looks reasonable while being for a different plan than the export. Worth resolving before the quote goes out.</div>
        <table style="margin-top:8px;">
          <tr><th>Category</th><th>Benefit</th><th>Exported value</th><th>Why</th></tr>
          ${warned.map(w => `<tr><td>${escapeHtml(w.category)}</td><td>${escapeHtml(w.variant_name)}</td><td>${escapeHtml(w.option_value)}</td><td class="hint">${escapeHtml(w.reason)}</td></tr>`).join('')}
        </table>` : ''}
    `;
    nbLastQuote = r.quote;
    await loadNewBusinessRating();
  } catch (err) {
    statusEl.textContent = '';
    resultEl.innerHTML = `<div class="hint" style="margin-top:12px; color:var(--critical);">${escapeHtml(err.message)}</div>`;
  }
}

/* Why this case will not price, said out loud.
   Auto-quoting is silent by design - it must never turn a successful
   upload into a failed one - which leaves someone who uploaded a table of
   benefits and saw nothing change with no way to tell whether the portal
   is broken, still working, or waiting on them. This says which. */
async function loadNbQuoteReadiness() {
  const area = document.getElementById('nb-readiness-area');
  if (!area || !currentCase) return;
  try {
    const r = await api(`/cases/${currentCase.id}/quote-readiness`);
    if (r.can_price && !r.blockers.length) {
      area.innerHTML = `
        <div class="card">
          <h3>Ready to price <span class="tier-pill dir-improved">${r.ready_category_count} of ${r.category_count} categories</span></h3>
          <div class="hint">Every category has a Product, Network and TPA. Quotes re-compute automatically whenever the census, benefits or rate card change.</div>
        </div>`;
      return;
    }

    const blockers = r.blockers.map(b => `
      <tr>
        <td><span class="tier-pill ${b.severity === 'mistake' ? 'dir-review' : 'dir-same'}">${b.severity === 'mistake' ? 'Needs correcting' : 'Not set yet'}</span></td>
        <td><strong>${escapeHtml(b.issue)}</strong><div class="hint" style="margin:3px 0 0;">${escapeHtml(b.detail)}</div></td>
        <td>${escapeHtml(b.fix_at)}</td>
      </tr>`).join('');

    const cats = r.categories.map(c => `
      <tr>
        <td>${escapeHtml(c.category)}</td>
        <td class="num">${c.member_count}</td>
        <td>${c.product ? escapeHtml(c.product) : '<span class="hint">not set</span>'}</td>
        <td>${c.network ? escapeHtml(c.network) : '<span class="hint">not set</span>'}</td>
        <td>${c.tpa ? escapeHtml(c.tpa) : '<span class="hint">not set</span>'}</td>
        <td>${c.ready ? '<span class="tier-pill dir-improved">ready</span>' : `<span class="tier-pill dir-review">missing ${c.missing.join(', ')}</span>`}</td>
        <td class="hint">${Object.values(c.sources || {}).length ? [...new Set(Object.values(c.sources))].join(', ') : '-'}</td>
      </tr>`).join('');

    area.innerHTML = `
      <div class="card">
        <h3>This case is not pricing yet</h3>
        <div class="hint">Auto-quoting stays silent when it cannot resolve every category - it must never turn a successful upload into a failed one. Here is what it found instead of nothing.</div>
        <div class="hint"><strong>Pricing is all-or-nothing:</strong> one unresolved category and no category prices, so ${r.ready_category_count} of ${r.category_count} ready is not partial progress.</div>
        <table style="margin-top:14px;">
          <tr><th>Status</th><th>What is standing in the way</th><th>Where to fix it</th></tr>
          ${blockers}
        </table>
        ${cats ? `
          <h4 style="margin-top:18px;">Category by category</h4>
          <table>
            <tr><th>Category</th><th class="num">Members</th><th>Product</th><th>Network</th><th>TPA</th><th>Status</th><th>Set from</th></tr>
            ${cats}
          </table>
          <div class="hint" style="margin-top:8px;">"Set from" says where each value came from: <strong>benefits</strong> (the Benefits tab), <strong>prior quote</strong> (inherited from your last quote, which may be stale), or <strong>offer</strong> (set deliberately on this case).</div>` : ''}
        ${r.uncategorised_member_count ? `<div class="hint" style="margin-top:10px;">${r.uncategorised_member_count} of ${r.census_member_count} census members have no Category value and will not be priced under any category.</div>` : ''}
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

/* The price the book says this enquiry costs, from the census and the
   table of benefits alone - no category configuration, no clicking
   Compute. The rate card price sits beside it: the card is what
   HealthCross charges today, this is what this particular population
   costs, and the gap is the underwriting decision. */
let riskPriceInputs = { trend: 10, nationality: true };

async function loadNbRiskBasedPrice() {
  const area = document.getElementById('nb-risk-price-area');
  if (!area || !currentCase) return;
  try {
    const p = new URLSearchParams({
      trend_pct: (riskPriceInputs.trend / 100).toString(),
      apply_nationality: riskPriceInputs.nationality ? 'true' : 'false',
    });
    const r = await api(`/cases/${currentCase.id}/risk-based-price?${p}`);
    const money = v => v == null ? '-' : `AED ${Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;

    const rows = r.categories.map(c => `
      <tr>
        <td>${escapeHtml(c.category)}</td>
        <td>${escapeHtml(c.product || '-')} / ${escapeHtml(c.network || '-')}</td>
        <td class="num">${c.member_count}</td>
        <td class="num">${money(c.expected_claims)}</td>
        <td class="num">${(c.loading_pct * 100).toFixed(1)}%</td>
        <td class="num" style="font-weight:600;">${money(c.suggested_premium)}</td>
        <td class="num">${c.fallback_member_count ? `${c.fallback_member_count} fallback` : 'all matched'}</td>
      </tr>`).join('');

    const gap = r.gap_pct;
    area.innerHTML = `
      <div class="card">
        <h3>Risk-based price suggestion</h3>
        <div class="hint">Built from your census and table of benefits alone. Every member is costed against HealthCross's own book for their own demographic cell, refined for this scheme's nationality mix, loaded for industry and trend, then grossed up for expenses.</div>
        <div class="kpi-grid" style="margin-top:14px;">
          <div class="kpi"><span class="label">Suggested premium</span><div class="value">${money(r.suggested_premium)}</div>
            <span class="label" style="margin:4px 0 0;">${r.member_count} members</span></div>
          <div class="kpi"><span class="label">Per member</span><div class="value">${money(r.suggested_per_member)}</div></div>
          <div class="kpi"><span class="label">Rate card price</span><div class="value">${money(r.rate_card_premium)}</div>
            <span class="label" style="margin:4px 0 0;">${r.rate_card_premium ? 'from the quote below' : 'compute a quote to compare'}</span></div>
          <div class="kpi"><span class="label">Gap</span><div class="value">${gap == null ? '-' : (gap > 0 ? '+' : '') + gap + '%'}</div>
            <span class="label" style="margin:4px 0 0;">${gap == null ? '' : gap > 0 ? 'the card is charging less than the risk' : 'the card is charging more than the risk'}</span></div>
        </div>
        <div class="row" style="align-items:flex-end; margin-top:14px; gap:12px; flex-wrap:wrap;">
          <div><label>Trend %</label><input type="number" step="0.5" value="${riskPriceInputs.trend}" style="width:90px;"
            onchange="riskPriceInputs.trend = parseFloat(this.value) || 0; loadNbRiskBasedPrice();"></div>
          <label style="display:flex; align-items:center; gap:6px; font-weight:normal; margin:0;">
            <input type="checkbox" style="width:auto;" ${riskPriceInputs.nationality ? 'checked' : ''}
              onchange="riskPriceInputs.nationality = this.checked; loadNbRiskBasedPrice();">
            Apply nationality refinement (${r.nationality_factor.toFixed(2)}&times;)
          </label>
        </div>
        <div class="hint">The nationality refinement is measured <strong>within zone</strong>, not against the book: the demographic cell already prices by zone, so applying the book-relative factor would charge the zone effect twice.</div>
        <table style="margin-top:14px;">
          <tr><th>Category</th><th>Plan</th><th class="num">Members</th><th class="num">Expected claims</th>
            <th class="num">Loading</th><th class="num">Suggested</th><th class="num">Cell match</th></tr>
          ${rows}
        </table>
        <div class="hint" style="margin-top:10px;">
          ${(r.weighted_credibility * 100).toFixed(0)}% of this price rests on the book's own experience for these members' own cells${r.fallback_member_count ? `; ${r.fallback_member_count} of ${r.member_count} members were priced from a broader cell` : ' with no fallbacks needed'}.
          Industry loading: ${escapeHtml(r.industry || 'not set')}.
        </div>
      </div>
    `;
  } catch (err) {
    // A case without benefits picks, or a book with no experience yet,
    // simply has no suggestion to make - not an error worth showing.
    area.innerHTML = '';
  }
}

/* What this enquiry's nationality mix is worth on the price.
   A scheme that is mostly a nationality running at 0.75x on the book is
   genuinely cheaper to insure than the card assumes and can be chased;
   one that is mostly a 1.4x nationality is not, and quoting it at card
   rates is how a book ends up underwater. The adjusted price sits beside
   the card price rather than replacing it - this is a competitive
   judgement, not a correction. */
async function loadNbNationalityMix() {
  const area = document.getElementById('nb-nationality-mix-area');
  if (!area || !currentCase) return;
  try {
    const r = await api(`/cases/${currentCase.id}/nationality-mix-pricing`);
    if (r.factor == null) { area.innerHTML = ''; return; }
    const money = v => v == null ? '-' : `AED ${Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
    const dirClass = r.direction === 'favourable' ? 'dir-improved' : r.direction === 'adverse' ? 'dir-review' : 'dir-same';

    const rows = r.contributions.map(c => `
      <tr>
        <td>${escapeHtml(c.nationality)}</td>
        <td>${escapeHtml(c.nationality_zone || '-')}</td>
        <td class="num">${c.member_count}</td>
        <td class="num">${(c.share_of_census * 100).toFixed(0)}%</td>
        <td class="num"><span class="tier-pill ${c.relativity < 0.98 ? 'dir-improved' : c.relativity > 1.02 ? 'dir-review' : 'dir-same'}">${c.relativity.toFixed(2)}&times;</span></td>
        <td class="num">${c.credibility == null ? '-' : (c.credibility * 100).toFixed(0) + '%'}</td>
        <td class="num">${c.book_exposure_member_years == null ? '-' : Number(c.book_exposure_member_years).toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
      </tr>`).join('');

    const q = r.quote;
    area.innerHTML = `
      <div class="card">
        <h3>Nationality mix <span class="tier-pill ${dirClass}">${escapeHtml(r.direction)}</span></h3>
        <div class="hint">What this census's own nationality mix has cost on HealthCross's own book, relative to a book-average member. Each nationality's factor is credibility-blended toward its zone, so a thin one cannot swing on a single claim.</div>
        <div class="kpi-grid" style="margin-top:14px;">
          <div class="kpi"><span class="label">Mix factor</span><div class="value">${r.factor.toFixed(2)}&times;</div>
            <span class="label" style="margin:4px 0 0;">${r.capped ? `capped from ${r.raw_factor.toFixed(2)}&times;` : 'within normal bounds'}</span></div>
          <div class="kpi"><span class="label">Measurable</span><div class="value">${(r.measurable_share * 100).toFixed(0)}%</div>
            <span class="label" style="margin:4px 0 0;">${r.measured_member_count} of ${r.member_count} members</span></div>
          ${q ? `
            <div class="kpi"><span class="label">Card price</span><div class="value">${money(q.card_premium)}</div></div>
            <div class="kpi"><span class="label">Mix-adjusted</span><div class="value">${money(q.mix_adjusted_premium)}</div>
              <span class="label" style="margin:4px 0 0;">${q.difference_pct > 0 ? '+' : ''}${q.difference_pct}% (${money(q.difference)})</span></div>` : ''}
        </div>
        ${q ? `<div class="hint" style="margin-top:10px;"><strong>${q.applied ? 'Applied' : 'Not applied'}:</strong> ${escapeHtml(q.reason)}. The card price stands on its own - this is what the mix justifies chasing, not a correction to the quote.</div>` : ''}
        <table style="margin-top:14px;">
          <tr><th>Nationality</th><th>Zone</th><th class="num">Members</th><th class="num">Share</th>
            <th class="num">Factor</th><th class="num">Credibility</th><th class="num">Book exposure</th></tr>
          ${rows}
        </table>
        ${r.unmeasured && r.unmeasured.length ? `<div class="hint" style="margin-top:10px;">${r.unmeasured.reduce((a, u) => a + u.member_count, 0)} member(s) have a nationality with too little book experience to price on (${r.unmeasured.slice(0, 5).map(u => escapeHtml(u.nationality)).join(', ')}${r.unmeasured.length > 5 ? '&hellip;' : ''}). They are left out of the factor rather than averaged in at neutral, which would drag it toward 1.00 and hide the real signal.</div>` : ''}
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

function nbCategoryCardHtml(cat, idx) {
  const products = nbRateCardOptions.products;
  const networksForProduct = cat.product ? (nbRateCardOptions.product_networks[cat.product] || []) : [];
  const variantSelects = cat.variantOptions ? Object.keys(cat.variantOptions).sort().map(variantName => {
    const options = cat.variantOptions[variantName];
    const selected = cat.variant_selections[variantName] || '';
    return `
      <div>
        <label>${escapeHtml(variantName)}</label>
        <select onchange="nbSetVariantSelection(${idx}, '${escapeHtml(variantName).replace(/'/g, "\\'")}', this.value)">
          <option value="">Base (included)</option>
          ${options.map(o => `<option value="${escapeHtml(o.option_value)}" ${selected === o.option_value ? 'selected' : ''}>${escapeHtml(o.option_value)}${o.direction !== 'Base' ? ` (${o.direction} ${o.impact_type === 'Percent' ? (o.direction === 'Upgrade' ? '+' : '-') + o.impact_value + '%' : 'AED ' + o.impact_value})` : ''}</option>`).join('')}
        </select>
      </div>
    `;
  }).join('') : '';

  return `
    <div class="card">
      <h3>Category ${escapeHtml(cat.category)} <span style="color:var(--ink-muted); font-weight:400;">(${cat.member_count} members)</span></h3>
      ${nbSuggestedProduct ? `<div class="hint">Suggested starting Product based on the case's existing insurer: <strong>${escapeHtml(nbSuggestedProduct)}</strong> - the tier ladder below also shows one tier above and below whatever's picked.</div>` : ''}
      <div class="row" style="align-items:flex-end;">
        <div>
          <label>Product</label>
          <select onchange="nbSetProduct(${idx}, this.value)">
            <option value="">Select product</option>
            ${products.map(p => `<option value="${escapeHtml(p)}" ${cat.product === p ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Network</label>
          <select onchange="nbSetNetwork(${idx}, this.value)" ${!cat.product ? 'disabled' : ''}>
            <option value="">Select network</option>
            ${networksForProduct.map(n => `<option value="${escapeHtml(n.network)}|${escapeHtml(n.tpa)}" ${cat.network === n.network ? 'selected' : ''}>${escapeHtml(n.network)} (${escapeHtml(n.tpa)})</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Commission % (optional, default 10%)</label>
          <input type="number" step="0.1" value="${cat.commission_pct}" onchange="nbSetCommission(${idx}, this.value)">

        <div>
          <label>Actual loading % (optional)</label>
          <input type="number" step="0.1" value="${cat.loading_pct}"
                 placeholder="${_nbDefaultLoadingPct(cat.product)}"
                 onchange="nbSetLoading(${idx}, this.value)">
        </div>
        <div>
          <label>Preview variant options for region</label>
          <select onchange="nbSetPreviewRegion(${idx}, this.value)">
            ${(nbRateCardOptions.regions || []).map(r => `<option value="${escapeHtml(r)}" ${cat.previewRegion === r ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${variantSelects ? `<div class="row" style="flex-wrap:wrap; margin-top:8px;">${variantSelects}</div>` : (cat.network ? '<div class="hint">No priced variants found for this Region/TPA/Network combination.</div>' : '')}
      ${nbBurningCostReferenceHtml(cat)}
    </div>
  `;
}

function nbBurningCostReferenceHtml(cat) {
  if (!cat.product || !cat.network) return '';
  const ref = nbBurningCostByProductNetwork[`${cat.product}|${cat.network}`];
  if (!ref || ref.burning_cost == null) return '';
  return `
    <div class="hint" style="margin-top:8px;">
      <span class="tier-pill dir-review" style="margin-right:6px;">Book reference</span>
      HealthCross's own already-booked members on ${escapeHtml(cat.product)} / ${escapeHtml(cat.network)}
      run an actual burning cost of <strong>AED ${ref.burning_cost.toLocaleString()}</strong> per member per year
      (${ref.member_count.toLocaleString()} members, ${ref.earned_member_years.toLocaleString()} earned member-years) -
      from Portfolio Analysis, for comparison against this quote's rated price, not a substitute for it.
    </div>
  `;
}

function nbSetProduct(idx, product) {
  nbCategories[idx].product = product;
  nbCategories[idx].network = '';
  nbCategories[idx].tpa = '';
  nbCategories[idx].variantOptions = null;
  // variant_selections deliberately kept, not reset - a selection that no
  // longer has a matching priced option under the new Product/Network
  // simply isn't applied (see price_member's own fallback-to-base
  // behavior, which already warns rather than erroring), so there's no
  // correctness risk in preserving picks that do still carry over.
  nbRenderArea();
}

async function nbSetNetwork(idx, value) {
  if (!value) { nbCategories[idx].network = ''; nbCategories[idx].tpa = ''; nbCategories[idx].variantOptions = null; nbRenderArea(); return; }
  const [network, tpa] = value.split('|');
  nbCategories[idx].network = network;
  nbCategories[idx].tpa = tpa;
  await nbFetchVariantOptions(idx);
  await nbRenderArea();
  // The Network picker is normally the last thing an underwriter sets per
  // category (Product comes first) - so this is usually the exact moment
  // every category becomes ready, and the quote should appear without a
  // separate "Compute quote" click.
  if (_nbReadyToAutoCompute()) await nbComputeQuote();
}

async function nbSetPreviewRegion(idx, region) {
  nbCategories[idx].previewRegion = region;
  await nbFetchVariantOptions(idx);
  nbRenderArea();
}

async function nbFetchVariantOptions(idx) {
  const cat = nbCategories[idx];
  if (!cat.network) return;
  try {
    cat.variantOptions = await api(`/new-business/variant-options?region=${encodeURIComponent(cat.previewRegion)}&tpa=${encodeURIComponent(cat.tpa)}&network=${encodeURIComponent(cat.network)}`);
  } catch (err) {
    cat.variantOptions = {};
  }
}

async function nbSetVariantSelection(idx, variantName, value) {
  if (value) {
    nbCategories[idx].variant_selections[variantName] = value;
  } else {
    delete nbCategories[idx].variant_selections[variantName];
  }
  if (_nbReadyToAutoCompute()) await nbComputeQuote();
}

async function nbSetCommission(idx, value) {
  nbCategories[idx].commission_pct = value;
  if (_nbReadyToAutoCompute()) await nbComputeQuote();
}

// The house default total loading by product tier - shown as the
// placeholder so the field says what it will use if left empty, rather
// than looking like a required entry. Mirrors
// new_business_rating.DEFAULT_LOADING_BY_PRODUCT.
function _nbDefaultLoadingPct(product) {
  const tier = (product || '').trim().toLowerCase();
  if (tier === 'silver' || tier === 'bronze') return '28';
  return '30';
}

async function nbSetLoading(idx, value) {
  nbCategories[idx].loading_pct = value;
  if (_nbReadyToAutoCompute()) await nbComputeQuote();
}

async function nbUploadFile(kind) {
  const input = document.getElementById(kind === 'pricing' ? 'nb-file-pricing' : 'nb-file-variants');
  const statusEl = document.getElementById(kind === 'pricing' ? 'nb-status-pricing' : 'nb-status-variants');
  if (!input.files.length) { toast('Choose a file first', true); return; }
  const form = new FormData();
  form.append('file', input.files[0]);
  const path = kind === 'pricing' ? '/admin/rate-cards/upload' : '/admin/benefit-variant-rates/upload';
  try {
    const result = await api(path, { method: 'POST', body: form });
    statusEl.textContent = `${result.rows_ingested} rows`;
    toast('Rate card uploaded');
    await loadNewBusinessRating();
  } catch (err) {
    toast(err.message, true);
  }
}

async function nbComputeQuote() {
  const categories = nbCategories.filter(c => c.product && c.network).map(c => ({
    category: c.category,
    product: c.product,
    network: c.network,
    tpa: c.tpa,
    commission_pct: c.commission_pct !== '' && c.commission_pct != null ? Number(c.commission_pct) / 100 : null,
    loading_pct: c.loading_pct !== '' && c.loading_pct != null ? Number(c.loading_pct) / 100 : null,
    variant_selections: c.variant_selections,
  }));
  if (!categories.length) { toast('Pick a Product and Network for at least one category', true); return; }

  try {
    const quote = await api(`/cases/${currentCase.id}/new-business-quote`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ categories }),
    });
    nbLastQuote = quote;
    nbSelectedTierProduct = null; // reset to this fresh quote's own picks, not a stale what-if selection
    try {
      nbQuoteByTier = await api(`/cases/${currentCase.id}/new-business-quote/by-tier`);
    } catch (err) {
      nbQuoteByTier = null;
    }
    try {
      nbBurningCostComparison = await api(`/cases/${currentCase.id}/new-business-quote/burning-cost-comparison`);
    } catch (err) {
      nbBurningCostComparison = null;
    }
    document.getElementById('nb-result-area').innerHTML = nbResultHtml(quote);
    toast('Quote computed');
  } catch (err) {
    toast(err.message, true);
  }
}

let nbQuoteByTier = null;
let nbSelectedTierProduct = null;
let nbBurningCostComparison = null;

function _nbCategoryTableHtml(categories) {
  const warnings = [];
  categories.forEach(c => (c.warnings || []).forEach(w => warnings.push(`Category ${c.category}: ${w}`)));
  const totalMembers = categories.reduce((sum, c) => sum + c.member_count, 0);
  const totalNet = categories.reduce((sum, c) => sum + c.net_annual_premium, 0);
  const totalGross = categories.reduce((sum, c) => sum + c.gross_annual_premium, 0);
  const avgGrossPerMember = totalMembers ? totalGross / totalMembers : null;
  return `
    <table>
      <tr><th>Category</th><th>Product</th><th>Network</th><th>Members</th><th>Net premium</th><th>Loading %</th><th>Gross premium</th><th>Gross / member</th></tr>
      ${categories.map(c => `
        <tr>
          <td>${escapeHtml(c.category)}</td>
          <td>${escapeHtml(c.product)}</td>
          <td>${escapeHtml(c.network)}</td>
          <td>${c.member_count}</td>

function _nbBurningCostComparisonHtml(quote, comparison) {
  if (!comparison || !comparison.categories || !comparison.categories.length) return '';
  const warnings = [];
  comparison.categories.forEach(c => (c.warnings || []).forEach(w => warnings.push(`Category ${c.category}: ${w}`)));
  const rows = comparison.categories.map(c => {
    const variance = c.rate_card_gross_annual_premium
      ? (c.gross_annual_premium - c.rate_card_gross_annual_premium) / c.rate_card_gross_annual_premium * 100
      : null;
    return `
      <tr>
        <td>${escapeHtml(c.category)}</td>
        <td>${escapeHtml(c.product)}</td>
        <td>${escapeHtml(c.network)}</td>
        <td>${c.priced_member_count} / ${c.member_count}</td>
        <td>${c.rate_card_gross_annual_premium != null ? c.rate_card_gross_annual_premium.toLocaleString() : '-'}</td>
        <td>${c.gross_annual_premium.toLocaleString()}</td>
        <td>${variance != null ? (variance > 0 ? '+' : '') + variance.toFixed(1) + '%' : '-'}</td>
      </tr>
    `;
  }).join('');
  const caseVariance = quote.case_gross_annual_premium
    ? (comparison.case_gross_annual_premium - quote.case_gross_annual_premium) / quote.case_gross_annual_premium * 100
    : null;
  return `
    <div class="card">
      <h3>Rate card vs. booked-book burning cost</h3>
      <div class="hint">What HealthCross's own already-booked members on the same Product/Network/age band/gender actually cost in real claims, loaded with the same New Business loading - a reference for whether the rate card is running rich or thin against real experience, not something that overrides the quote itself. "Members priced" only counts members whose exact (Product, Network, age band, gender) slice has booked-book data - a low count means the book is thin for that slice.</div>
      <table>
        <tr><th>Category</th><th>Product</th><th>Network</th><th>Members priced</th><th>Rate-card gross</th><th>Burning-cost gross</th><th>Variance</th></tr>
        ${rows}
        <tr style="font-weight:600; border-top:2px solid var(--border);">
          <th>Case total</th><th></th><th></th><th></th>
          <th>${quote.case_gross_annual_premium.toLocaleString()}</th>
          <th>${comparison.case_gross_annual_premium.toLocaleString()}</th>
          <th>${caseVariance != null ? (caseVariance > 0 ? '+' : '') + caseVariance.toFixed(1) + '%' : '-'}</th>
        </tr>
      </table>
      ${warnings.length ? `<div class="hint" style="margin-top:10px;">${warnings.map(escapeHtml).join('<br>')}</div>` : ''}
    </div>
  `;
}

function nbResultHtml(quote) {

/* ---------------- reinsurance report ----------------

   Whole-book claims experience assembled for a reinsurer, not a new
   calculation of its own: every section below calls the same endpoint
   the rest of the app already reads that figure from (Loss Ratio's own
   /summary, /nationality-risk, /group-size-bands, /utilization,
   /burning-cost-by-product-network, /large-claims, /account-loss-ratio's
   own shed_impact) - a second implementation of a number this app
   already computes is exactly how NOMADA came to read two different loss
   ratios on two different screens (see account_loss_ratio_rows_for_book's
   own docstring). This screen is purely an assembly/presentation layer
   over those, so accuracy rides on the same already-tested code paths. */
let rrState = {
  drillProduct: null,
  // Group is HealthCross's non-SME product line, unchecked by default so
  // the report reads as SME business unless asked to include it - same
  // convention as the Loss Ratio screen's own product filter.
  products: ['Platinum', 'Gold', 'Silver', 'Bronze'],
  // Benefit-wise/Maternity/Top-claimants scan every claim LINE on the
  // whole book and are the slowest of the 8 concurrent loads - false
  // until loadReinsuranceReport()'s Promise.all fully resolves, so Print
  // can refuse a click that lands after the fast sections (Nationality,
  // Group size, Burning cost) are already visible but these three are
  // still mid-flight, which would otherwise print "No data" for real,
  // present claims and pass a reinsurer a report that understates them.
  loaded: false,
};

// Every section's own last-fetched rows, kept so Print/Save as PDF builds
// from what's already on screen instead of re-running all these heavy
// analytical calls a second time - see printReinsuranceReport.
let rrData = {};

function _rrKpi(label, value) {
  return `<div class="kpi"><span class="label">${escapeHtml(label)}</span><span class="value">${value}</span></div>`;
}

// Every section-loading function appends its own products=... query
// params on top of whatever base params it already builds, via this.
function _rrProductParams(base) {
  const params = base ? new URLSearchParams(base) : new URLSearchParams();
  (rrState.products || []).forEach(p => params.append('products', p));
  return params;
}

function _rrReadProductCheckboxes() {
  const boxes = Array.from(document.querySelectorAll('.rr-product-cb'));
  rrState.products = boxes.filter(b => b.checked).map(b => b.value);
  loadReinsuranceReport();
}

function _rrProductCheckboxesHtml() {
  const all = ['Platinum', 'Gold', 'Silver', 'Bronze', 'Group'];
  return all.map(p => `
    <label style="font-weight:400; display:flex; gap:4px; align-items:center; white-space:nowrap;">
      <input type="checkbox" class="rr-product-cb" value="${p}" ${rrState.products.includes(p) ? 'checked' : ''} onchange="_rrReadProductCheckboxes()"> ${p}
    </label>`).join('');
}

  currentCase = null;
  document.getElementById('main').innerHTML = `
    <div class="lr-scope">

async function loadReinsuranceReport() {
  rrState.drillProduct = null;
  rrState.loaded = false;
  // Product loads first and is awaited on its own - Benefit-wise claims'
  // average-member-spend needs the SAME products-filtered exposure total
  // Product LR just computed (see _rrBenefitHtml), and Promise.all gives
  // no ordering guarantee among the rest, so this one has to land first.
  await _rrLoadProductLR();
  await Promise.all([
    _rrLoadEnrollmentType(),
    _rrLoadNationality(),
    _rrLoadGroupSize(),
    _rrLoadBenefit(),
    _rrLoadMaternity(),
    _rrLoadBurningCostPN(),
    _rrLoadTopClaimants(),
    _rrLoadShedImpact(),
  ]);
  rrState.loaded = true;
}

function _rrLoadingCard() {
  // 7 heavy analytical calls fire together (see loadReinsuranceReport);
  // a real book's size means the browser's own per-origin connection
  // limit can queue the later ones behind the earlier ones for several
  // seconds. Every section starts on this placeholder rather than blank
  // so a still-queued section reads as "coming" rather than "broken".
  return '<div class="lr-card"><div class="lr-empty">Loading&hellip;</div></div>';
}

function _rrEmptyCard(title, message) {
  return `<div class="lr-card"><div class="lr-card-title">${escapeHtml(title)}</div><div class="lr-empty">${escapeHtml(message)}</div></div>`;
}

//: All 4 shown together on a click, not one dimension at a time - the
//: point of drilling into a product is to see EVERY risky segment inside
//: it in one look, for a New Business pricing review.
const RR_DRILL_DIMENSIONS = [['relation', 'Relation'], ['gender', 'Gender'], ['age_band', 'Age band'], ['network', 'Network']];

async function _rrDrillProduct(product) {
  rrState.drillProduct = product;
  const drillArea = document.getElementById('rr-drill-area');
  if (!drillArea) return;
  drillArea.innerHTML = '<div class="lr-empty">Loading&hellip;</div>';
  try {
    const results = await Promise.all(RR_DRILL_DIMENSIONS.map(([dim]) => {
      const params = _rrProductParams({ group_by: dim, product });
      return api(`/portfolio-analysis/summary?${params.toString()}`);
    }));
    rrData.drill = { product, byDimension: Object.fromEntries(RR_DRILL_DIMENSIONS.map(([dim], i) => [dim, results[i].rows || []])) };
    drillArea.innerHTML = _rrDrillHtml(rrData.drill);
  } catch (err) {
    drillArea.innerHTML = `<div class="lr-empty">${escapeHtml(err.message)}</div>`;
  }
}

function _rrDrillDimensionTableHtml(dim, label, rows) {
  const sorted = [...rows].sort((a, b) => (b.member_count || 0) - (a.member_count || 0));
  const body = sorted.map(r => `
    <tr>
      <td>${escapeHtml(String(r[dim] ?? 'Unmapped'))}</td>
      <td class="num">${r.member_count.toLocaleString()}</td>
      <td class="num">${_lrMoney(r.actual_premium)}</td>
      <td class="num">${_lrMoney((r.actual_claims || 0) + (r.ibnr || 0))}</td>
      <td class="num ${_lrBand(r.loss_ratio_incl_ibnr)}">${_lrPct(r.loss_ratio_incl_ibnr)}</td>
      <td class="num ${_lrBand(r.net_loss_ratio)}">${_lrPct(r.net_loss_ratio)}</td>
    </tr>`).join('');
  return `
    <div>
      <div class="lr-card-note" style="margin:0 0 4px; font-weight:600; color:var(--lr-ink,#0f1c2e);">By ${escapeHtml(label)}</div>
      <div class="lr-table-wrap">
        <table class="lr-table">
          <thead><tr><th>${escapeHtml(label)}</th><th class="num">Members</th><th class="num">Premium</th><th class="num">Incurred</th><th class="num">Gross LR</th><th class="num">Net LR</th></tr></thead>

        </table>
      </div>
    </div>
  `;
}

function _rrDrillHtml(drill) {

async function _rrLoadNationality() {
  const area = document.getElementById('rr-nationality-area');
  try {

    const r = await api(`/portfolio-analysis/nationality-risk?${params.toString()}`);
