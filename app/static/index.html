<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HealthCross Underwriting Intelligence</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f0efec;
    --border: rgba(11,11,11,0.10);
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --good: #0ca30c;
    --good-bg: #0ca30c1a;
    --warning: #fab219;
    --warning-bg: #fab2191a;
    --serious: #ec835a;
    --serious-bg: #ec835a1a;
    --critical: #d03b3b;
    --critical-bg: #d03b3b1a;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-1-wash: #2a78d61a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232320;
      --border: rgba(255,255,255,0.10);
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --grid: #2c2c2a;
      --accent: #3987e5;
      --accent-ink: #0d0d0d;
      --good-bg: #0ca30c26;
      --warning-bg: #fab21926;
      --serious-bg: #ec835a26;
      --critical-bg: #d03b3b26;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-1-wash: #3987e526;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header span { color: var(--ink-muted); font-size: 12.5px; }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: calc(100vh - 50px);
  }
  @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }

  aside {
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin: 4px 0 0;
    font-weight: 600;
  }
  .case-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .case-item {
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    transition: background 0.1s ease;
  }
  .case-item:hover { background: var(--surface-2); }
  .case-item.active { background: var(--surface-2); border-color: var(--border); }
  .case-item .company { font-weight: 600; display: block; }
  .case-item .meta { color: var(--ink-muted); font-size: 11.5px; }

  button, .btn {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    padding: 8px 14px;
    font-size: 13.5px;
    transition: background 0.1s ease, filter 0.1s ease;
  }
  button:hover { background: var(--surface-2); }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  main { padding: 22px 26px 60px; max-width: 980px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 700; }
  .card h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); font-weight: 600; }
  .card .hint { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 14px; }
  .hint-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 10px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  .dropzone {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px dashed var(--border);
    border-radius: 9px;
    margin-bottom: 8px;
    background: var(--surface);
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .dropzone.dragover { border-color: var(--accent); background: var(--series-1-wash); }
  .dropzone .kind-label { width: 100px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .dropzone input[type=file] { flex: 1; font-size: 12px; min-width: 0; }
  .status-ok { color: var(--good); font-size: 12.5px; white-space: nowrap; }
  .status-err { color: var(--critical); font-size: 12.5px; white-space: nowrap; }
  .status-pending { color: var(--ink-muted); font-size: 12.5px; white-space: nowrap; }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .kpi {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .label { font-size: 11px; color: var(--ink-muted); display: block; margin-bottom: 2px; }
  .kpi .value { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .tier-pill {
    display: inline-flex;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .tier-Preferred { background: var(--good-bg); color: var(--good); }
  .tier-Standard { background: var(--surface-2); color: var(--ink-2); }
  .tier-Substandard { background: var(--serious-bg); color: var(--serious); }
  .tier-DeclineRefer { background: var(--critical-bg); color: var(--critical); }
  .dir-improved { background: var(--good-bg); color: var(--good); }
  .dir-reduced { background: var(--critical-bg); color: var(--critical); }
  .dir-same { background: var(--surface-2); color: var(--ink-2); }
  .dir-review { background: var(--warning-bg); color: var(--ink-2); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table th, table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table th { color: var(--ink-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; font-variant-numeric: normal; }
  td.cmp-cell-yes { background: rgba(46, 160, 67, 0.12); }
  td.cmp-cell-no { background: rgba(218, 54, 51, 0.10); color: var(--ink-muted); }

  /* Tabs */
  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; border-radius: 0;
    padding: 9px 14px; font-size: 13.5px; font-weight: 600;
    color: var(--ink-muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { background: none; color: var(--ink); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Charts */
  .chart-wrap { margin: 4px 0 18px; }
  .chart-svg { display: block; overflow: visible; }
  .chart-label { font-size: 11.5px; fill: var(--ink-2); text-anchor: end; dominant-baseline: middle; }
  .chart-value { font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; dominant-baseline: middle; }
  .chart-axis-label { font-size: 10.5px; fill: var(--ink-muted); }
  .chart-grid { stroke: var(--grid); stroke-width: 1; }
  .chart-row { cursor: default; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; }
  .chart-legend .swatch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  #chart-tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 50;
    background: var(--ink); color: var(--bg); font-size: 12px;
    padding: 5px 9px; border-radius: 6px; max-width: 260px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  .empty-state { color: var(--ink-muted); font-size: 13px; padding: 20px 0; text-align: center; }
  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>HealthCross</h1>
  <span>Underwriting Intelligence</span>
</header>

<div class="layout">
  <aside>
    <button class="primary" onclick="showNewCaseForm()">+ New Case</button>
    <button onclick="showInternationalComparison()">International comparison</button>
    <h2>Cases</h2>
    <div class="case-list" id="caseList"></div>
  </aside>

  <main id="main"></main>
</div>

<div id="toast"></div>
<div id="chart-tooltip"></div>

<script>
const API = '';
let currentCase = null;
const ZONE_LABELS = {
  zone_1_asia: 'Asia',
  zone_2_middle_east: 'Middle East',
  zone_3_europe_americas: 'Europe & Americas',
};
const SERIES = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)'];

function toast(message, isError) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.borderColor = isError ? 'var(--critical)' : 'var(--border)';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

async function api(path, options) {
  const res = await fetch(API + path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || (`Request failed (${res.status})`));
  }
  return res.json();
}

function escapeHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- chart helpers (hand-rolled SVG, no external library) ---------------- */

function bindChartTooltips(container) {
  const tooltip = document.getElementById('chart-tooltip');
  container.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      tooltip.textContent = el.getAttribute('data-tooltip');
      tooltip.style.display = 'block';
    });
    el.addEventListener('mousemove', (e) => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

// Horizontal bar chart - a single-hue magnitude ranking (e.g. age bands, burning cost by category).
function svgBarChart(items, opts) {
  opts = opts || {};
  const color = opts.color || 'var(--series-1)';
  const formatValue = opts.formatValue || (v => v.toLocaleString());
  const barH = 20, gapY = 12, labelW = opts.labelWidth || 150, plotW = opts.plotWidth || 380, valueW = 90;
  const maxVal = Math.max(...items.map(i => i.value), 1);
  const totalW = labelW + plotW + valueW;
  const totalH = items.length * (barH + gapY);
  const rows = items.map((item, i) => {
    const w = Math.max(2, (item.value / maxVal) * plotW);
    const y = i * (barH + gapY);
    const valueText = formatValue(item.value);
    return `
      <g class="chart-row" data-tooltip="${escapeHtml(item.label)}: ${escapeHtml(valueText)}">
        <text x="${labelW - 10}" y="${y + barH / 2}" class="chart-label">${escapeHtml(item.label)}</text>
        <rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${color}"/>
        <text x="${labelW + w + 10}" y="${y + barH / 2}" class="chart-value">${escapeHtml(valueText)}</text>
      </g>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} ${totalH}" class="chart-svg" style="width:100%; height:${totalH}px;">${rows}</svg>`;
}

// Single stacked proportion bar - identity/part-of-whole (e.g. nationality zone mix).
function svgProportionBar(items, opts) {
  opts = opts || {};
  const totalW = 600, barH = 26, segGap = 2;
  let x = 0;
  const segments = items.map((item, i) => {
    const w = Math.max(0, item.pct * totalW - segGap);
    const seg = `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${barH}" rx="4" fill="${SERIES[i % SERIES.length]}" class="chart-row" data-tooltip="${escapeHtml(item.label)}: ${item.count} (${(item.pct * 100).toFixed(1)}%)"/>`;
    x += w + segGap;
    return seg;
  }).join('');
  const legend = items.map((item, i) => `
    <span class="swatch"><span class="dot" style="background:${SERIES[i % SERIES.length]};"></span>${escapeHtml(item.label)} &middot; ${(item.pct * 100).toFixed(1)}%</span>
  `).join('');
  return `
    <svg viewBox="0 0 ${totalW} ${barH}" class="chart-svg" style="width:100%; height:${barH}px;">${segments}</svg>
    <div class="chart-legend">${legend}</div>
  `;
}

// Line chart with hover dots - magnitude over time (e.g. monthly claims trend).
function svgLineChart(points, opts) {
  opts = opts || {};
  const formatValue = opts.formatValue || (v => v.toLocaleString());
  const w = 720, h = 200, padL = 64, padB = 26, padT = 14, padR = 16;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const maxVal = Math.max(...points.map(p => p.value), 1);
  const stepX = points.length > 1 ? plotW / (points.length - 1) : 0;
  const coords = points.map((p, i) => ({
    x: padL + i * stepX,
    y: padT + plotH - (p.value / maxVal) * plotH,
    label: p.label,
    value: p.value,
  }));
  const path = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
  const areaPath = `${path} L ${coords[coords.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`;
  const gridlines = [0, 0.5, 1].map(f => {
    const y = padT + plotH * (1 - f);
    return `
      <line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" class="chart-grid"/>
      <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" class="chart-axis-label" text-anchor="end">${Math.round(maxVal * f).toLocaleString()}</text>
    `;
  }).join('');
  const showEvery = Math.max(1, Math.ceil(coords.length / 7));
  const xLabels = coords.map((c, i) => (i % showEvery === 0 || i === coords.length - 1)
    ? `<text x="${c.x.toFixed(1)}" y="${h - 6}" class="chart-axis-label" text-anchor="middle">${escapeHtml(c.label)}</text>`
    : '').join('');
  const dots = coords.map(c => `
    <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" class="chart-row" data-tooltip="${escapeHtml(c.label)}: ${escapeHtml(formatValue(c.value))}"/>
  `).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg" style="width:100%; height:${h}px;">
      ${gridlines}
      <path d="${areaPath}" fill="var(--series-1)" opacity="0.1"/>
      <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

// Horizontal meter - a single score against fixed tier thresholds.
function svgScoreMeter(score, tier) {
  const w = 600, h = 26;
  const tierColor = { Preferred: 'var(--good)', Standard: 'var(--accent)', Substandard: 'var(--serious)', 'Decline/Refer': 'var(--critical)' }[tier] || 'var(--accent)';
  const pct = Math.max(0, Math.min(100, score)) / 100;
  const markers = [40, 60, 80].map(t => `<line x1="${(t / 100 * w).toFixed(1)}" y1="0" x2="${(t / 100 * w).toFixed(1)}" y2="${h}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg" style="width:100%; height:${h}px;">
      <rect x="0" y="0" width="${w}" height="${h}" rx="6" fill="var(--surface-2)"/>
      <rect x="0" y="0" width="${Math.max(4, pct * w).toFixed(1)}" height="${h}" rx="6" fill="${tierColor}"/>
      ${markers}
    </svg>
  `;
}

/* ---------------- cases sidebar ---------------- */

async function loadCases() {
  const cases = await api('/cases');
  const list = document.getElementById('caseList');
  if (cases.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:8px 0;">No cases yet</div>';
    return;
  }
  list.innerHTML = cases.map(c => `
    <button class="case-item ${currentCase && currentCase.id === c.id ? 'active' : ''}" onclick="selectCase(${c.id})">
      <span class="company">${escapeHtml(c.company_name)}</span>
      <span class="meta">${escapeHtml(c.broker_name)} &middot; ${c.status}</span>
    </button>
  `).join('');
}

function showNewCaseForm() {
  currentCase = null;
  document.getElementById('main').innerHTML = `
    <div class="card">
      <h3>New case</h3>
      <div class="hint">Create a case, then attach the census, table of benefits, and (optionally) claims.</div>
      <form onsubmit="createCase(event)">
        <div class="row">
          <div><label>Broker name</label><input type="text" name="broker_name" required></div>
          <div><label>Company name</label><input type="text" name="company_name" required></div>
        </div>
        <div class="row">
          <div><label>Industry</label><input type="text" name="industry" required placeholder="e.g. trading, manufacturing"></div>
          <div><label>Region</label><input type="text" name="region" placeholder="e.g. Dubai"></div>
          <div><label>Declared employee count</label><input type="number" name="employee_count_declared"></div>
        </div>
        <div class="row">
          <div>
            <label>Business type</label>
            <select name="business_type">
              <option value="new">New business</option>
              <option value="existing">Existing business (renewal)</option>
            </select>
          </div>
          <div><label>Current annual premium (renewals only)</label><input type="number" name="current_annual_premium" placeholder="e.g. 3000000"></div>
        </div>
        <div style="margin-top:16px;"><button class="primary" type="submit">Create case</button></div>
      </form>
    </div>
  `;
  loadCases();
}

async function createCase(event) {
  event.preventDefault();
  const form = new FormData(event.target);
  const payload = {
    broker_name: form.get('broker_name'),
    company_name: form.get('company_name'),
    industry: form.get('industry'),
    region: form.get('region') || null,
    employee_count_declared: form.get('employee_count_declared') ? Number(form.get('employee_count_declared')) : null,
    business_type: form.get('business_type') || null,
    current_annual_premium: form.get('current_annual_premium') ? Number(form.get('current_annual_premium')) : null,
  };
  try {
    const created = await api('/cases', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    toast(`Case #${created.id} created`);
    await loadCases();
    selectCase(created.id);
  } catch (err) {
    toast(err.message, true);
  }
}

async function selectCase(id) {
  currentCase = await api(`/cases/${id}`);
  await loadCases();
  renderCaseWorkspace();
}

/* ---------------- international comparison (reference library) ---------------- */

let refPlans = [];
let comparisonColumnCount = 2;

function comparisonPanelHtml() {
  return `
    <div class="card">
      <h3>International insurer comparison</h3>
      <div class="hint">Upload each insurer's table of benefits once into this shared library, tagged with an insurer name and plan/tier label. A Bupa-style file with multiple tiers creates one library entry per tier automatically.</div>
      <div class="row" style="align-items:flex-end;">
        <div><label>Insurer name</label><input type="text" id="ref-insurer-name" placeholder="e.g. Cigna Global Care, Bupa, Allianz, MSH, Max Health"></div>
        <div><label>Plan / tier label</label><input type="text" id="ref-plan-label" placeholder="optional for Bupa/Maxmed-style files"></div>
      </div>
      <div class="dropzone" id="dropzone-ref-plan" style="margin-top:8px;">
        <span class="kind-label">TOB file</span>
        <input type="file" id="file-ref-plan" accept=".pdf">
        <button onclick="uploadReferencePlan()">Upload</button>
        <span id="status-ref-plan" class="status-pending"></span>
      </div>
    </div>
    <div class="card">
      <h3>Reference library</h3>
      <div id="ref-plan-list"></div>
    </div>
    <div class="card">
      <h3>Compare</h3>
      <div class="hint">Pick any combination of uploaded plans to view side by side - dynamic, so nothing is hardcoded to one insurer's tier.</div>
      <div id="ref-compare-columns" class="row"></div>

async function loadReferencePlans() {

  area.innerHTML = refPlans.length ? `

async function uploadReferencePlan() {
  const insurerName = document.getElementById('ref-insurer-name').value.trim();
  const planLabel = document.getElementById('ref-plan-label').value.trim();
  const input = document.getElementById('file-ref-plan');
  const statusEl = document.getElementById('status-ref-plan');
  if (!insurerName) { toast('Enter an insurer name first', true); return; }
  if (!input.files.length) { toast('Choose a file first', true); return; }

  const form = new FormData();
  form.append('file', input.files[0]);
  statusEl.textContent = 'Uploading (Cigna-style scrambled-text PDFs can take ~1 minute via OCR)...';
  statusEl.className = 'status-pending';
  try {
    const params = new URLSearchParams({ insurer_name: insurerName });
    if (planLabel) params.set('plan_label', planLabel);
    const result = await api(`/reference-plans?${params.toString()}`, { method: 'POST', body: form });
    statusEl.textContent = `${result.length} plan(s) added`;
    statusEl.className = 'status-ok';
    toast(`Added ${result.map(p => p.plan_label).join(', ')}`);
    await loadReferencePlans();
    renderComparisonColumnPickers();
  } catch (err) {
    statusEl.textContent = 'Failed';
    statusEl.className = 'status-err';
    toast(err.message, true);
  }
}

async function deleteReferencePlan(id) {
  await api(`/reference-plans/${id}`, { method: 'DELETE' });
  toast('Removed');
  await loadReferencePlans();
  renderComparisonColumnPickers();
}

function renderComparisonColumnPickers() {
  const area = document.getElementById('ref-compare-columns');
  if (!area) return;
  const options = refPlans.map(p => `<option value="${p.id}">${escapeHtml(p.insurer_name)} - ${escapeHtml(p.plan_label)}</option>`).join('');
  const existing = Array.from(area.querySelectorAll('select')).map(s => s.value);
  area.innerHTML = Array.from({ length: comparisonColumnCount }).map((_, i) => `
    <div>
      <label>Column ${i + 1}</label>
      <select id="ref-compare-col-${i}"><option value="">-</option>${options}</select>
    </div>
  `).join('');
  existing.forEach((val, i) => {
    const sel = document.getElementById(`ref-compare-col-${i}`);
    if (sel && val) sel.value = val;
  });
}

function addComparisonColumn() {
  if (comparisonColumnCount >= 6) { toast('Maximum 6 columns', true); return; }
  comparisonColumnCount += 1;
  renderComparisonColumnPickers();
}

let lastComparisonResult = null;

function comparisonCellHtml(value) {
  const has = value !== null && value !== undefined && value !== '';
  const cls = has ? 'cmp-cell-yes' : 'cmp-cell-no';
  return `<td class="${cls}">${escapeHtml(has ? value : '—')}</td>`;
}

async function runReferenceComparison() {
  const ids = Array.from({ length: comparisonColumnCount })
    .map((_, i) => document.getElementById(`ref-compare-col-${i}`).value)
    .filter(v => v);
  if (ids.length < 1) { toast('Pick at least one plan to compare', true); return; }

  const area = document.getElementById('ref-comparison-area');
  try {
    const result = await api(`/reference-plans/compare?ids=${ids.join(',')}`);
    lastComparisonResult = result;

    area.innerHTML = `
      <div class="card">
        <h3>Detailed comparison</h3>
        <div class="hint">Every plan's own wording is mapped onto this fixed 36-benefit list, so a "—" means the plan genuinely has no matching benefit - not that its wording didn't match. Green = covered, red = "—".</div>
        <div style="margin-bottom:12px;">
          <button onclick="exportComparisonPrintView()">Print / Save as PDF</button>
          <button onclick="exportComparisonCsv()">Export Excel (CSV)</button>
        </div>
        ${result.sections.map(section => `
          <h4>${escapeHtml(section.section || 'General')}</h4>
          <table>
            <tr><th>Benefit</th>${result.plans.map(p => `<th>${escapeHtml(p.insurer_name)}<br>${escapeHtml(p.plan_label)}</th>`).join('')}</tr>
            ${section.rows.map(row => `
              <tr>
                <td>${escapeHtml(row.label)}</td>
                ${result.plans.map(p => comparisonCellHtml(row.values[p.id])).join('')}
              </tr>
            `).join('')}
          </table>
        `).join('')}
      </div>
    `;
  } catch (err) {
    toast(err.message, true);
  }
}

function _comparisonRowsFlat(result) {
  const rows = [];
  result.sections.forEach(section => {
    section.rows.forEach(row => rows.push({ section: section.section || 'General', label: row.label, values: row.values }));
  });
  return rows;
}

function exportComparisonPrintView() {
  const result = lastComparisonResult;
  if (!result) { toast('Run a comparison first', true); return; }
  const rows = _comparisonRowsFlat(result);
  const planNames = result.plans.map(p => `${escapeHtml(p.insurer_name)}<br>${escapeHtml(p.plan_label)}`);

  let bySection = {};
  let sectionOrder = [];
  rows.forEach(r => {
    if (!bySection[r.section]) { bySection[r.section] = []; sectionOrder.push(r.section); }
    bySection[r.section].push(r);
  });

  const html = `<!doctype html>
<html><head><meta charset="utf-8"><title>Benefits Comparison</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 20px; font-weight: 700; }
  h2 { font-size: 14px; color: #4B2E5A; text-transform: uppercase; margin-top: 24px; font-weight: 700; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 12px; text-align: left; }
  th { background: #4B2E5A; color: #fff; font-weight: 700; }
  .yes { background: #d9f2d9; }
  .no { background: #f8d7d7; color: #a33; }
  @media print { body { margin: 8px; } }
</style></head><body>
  <h1>Detailed Benefits Comparison</h1>
  ${sectionOrder.map(section => `
    <h2>${escapeHtml(section)}</h2>
    <table>
      <tr><th>Benefit</th>${planNames.map(n => `<th>${n}</th>`).join('')}</tr>
      ${bySection[section].map(r => `
        <tr>
          <td>${escapeHtml(r.label)}</td>
          ${result.plans.map(p => {
            const v = r.values[p.id];
            const has = v !== null && v !== undefined && v !== '';
            return `<td class="${has ? 'yes' : 'no'}">${escapeHtml(has ? v : '—')}</td>`;
          }).join('')}
        </tr>
      `).join('')}
    </table>
  `).join('')}
  <script>window.onload = () => window.print();<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

function exportComparisonCsv() {
  const result = lastComparisonResult;
  if (!result) { toast('Run a comparison first', true); return; }
  const rows = _comparisonRowsFlat(result);
  const header = ['Section', 'Benefit', ...result.plans.map(p => `${p.insurer_name} - ${p.plan_label}`)];
  const csvEscape = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r => {
    const line = [r.section, r.label, ...result.plans.map(p => r.values[p.id] ?? '—')];
    lines.push(line.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'benefits_comparison.csv';
  a.click();
  URL.revokeObjectURL(url);
}

      }),
    });

  }

async function uploadFile(kind) {
  const input = document.getElementById(`file-${kind}`);
  const statusEl = document.getElementById(`status-${kind}`);
  if (!input.files.length) { toast('Choose a file first', true); return; }
  const isPdf = input.files[0].name.toLowerCase().endsWith('.pdf');

  const form = new FormData();
  form.append('file', input.files[0]);
  statusEl.textContent = 'Uploading...';
  statusEl.className = 'status-pending';
  try {
    const appendCheckbox = document.getElementById(`file-${kind}-append`);
    const mergeDatesCheckbox = document.getElementById(`file-${kind}-merge-dates`);
    let query = '';
    if (kind === 'benefits' && appendCheckbox && appendCheckbox.checked) query = '?mode=append';
    if (kind === 'census' && mergeDatesCheckbox && mergeDatesCheckbox.checked) query = '?mode=merge-dates';
    const result = await api(`/cases/${currentCase.id}/${kind}${query}`, { method: 'POST', body: form });
    if (Array.isArray(result)) {
      if (query === '?mode=merge-dates') {
        const withDates = result.filter(r => r.member_end_date).length;
        statusEl.textContent = `${withDates} of ${result.length} census rows now have member dates`;
        toast(`Dates merged into census (${withDates} of ${result.length} rows matched)`);
      } else {
        const unit = kind === 'quote' ? 'categories' : 'rows';
        statusEl.textContent = `${result.length} ${unit} parsed`;
        toast(`${kind} uploaded (${result.length} ${unit})`);
      }
    } else {
      statusEl.textContent = 'Report parsed';
      toast(`${kind} report parsed`);
    }
    statusEl.className = 'status-ok';
    if (kind === 'census') await loadCensusSummary();
    if (kind === 'benefits') { await loadBenefitsSummary(); await loadBenefitsComparison(); }
    if (kind === 'quote') { await loadPremiumByCategory(); await loadBenefitsComparison(); }
    if (kind === 'claims' && isPdf) { await loadClaimsProjection(); await loadClaimsReportBreakdown(); await loadDiagnosisExposure(); }
    if (kind === 'claims-ledger') { await loadClaimsLedgerAnalysis(); await loadRenewalRating(); }
    // Auto-run the scorecard whenever a data source that feeds it changes,
    // so it's always current without a manual "Compute scorecard" click -
    // only re-runs on a new upload, never just from viewing the case.
    if (['census', 'benefits', 'claims', 'claims-ledger'].includes(kind)) await autoComputeScore();
  } catch (err) {
    statusEl.textContent = 'Failed';
    statusEl.className = 'status-err';
    toast(err.message, true);
  }
}

async function autoComputeScore() {
  if (!currentCase) return;
  const premiumInput = document.getElementById('estimated-premium');
  const payload = { estimated_annual_premium: premiumInput && premiumInput.value ? Number(premiumInput.value) : null };
  try {
    await api(`/cases/${currentCase.id}/score`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    await loadLatestScorecard();
    toast('Scorecard auto-updated');
  } catch (err) {
    // Expected until both a census and a table of benefits are uploaded -
    // stay quiet rather than nagging after every single-file upload. Any
    // other failure is unexpected and still worth surfacing.
    if (!/no census|no table of benefits/i.test(err.message || '')) {
      toast(`Scorecard auto-update failed: ${err.message}`, true);
    }
  }
}

document.addEventListener('dragover', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (zone) { e.preventDefault(); zone.classList.add('dragover'); }
});
document.addEventListener('dragleave', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (zone) zone.classList.remove('dragover');
});
document.addEventListener('drop', (e) => {
  const zone = e.target.closest && e.target.closest('.dropzone');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove('dragover');
  const input = zone.querySelector('input[type=file]');
  if (input && e.dataTransfer.files.length) {
    input.files = e.dataTransfer.files;
  }
});

function _directionChip(direction, pctChange) {

async function recomputeClaimsProjection() {
  const input = document.getElementById('credibility-override');
  const pct = Number(input.value);
  if (Number.isNaN(pct) || pct < 0 || pct > 100) { toast('Enter a credibility % between 0 and 100', true); return; }
  await loadClaimsProjection(pct / 100);
}

        <div class="row" style="margin-top:12px; align-items:flex-end;">
          <div><label>Inflation %</label><input type="number" id="renewal-inflation-override" step="0.1" value="${(r.assumptions_used.inflation_pct*100).toFixed(1)}"></div>
          <div><label>Loading %</label><input type="number" id="renewal-loading-override" step="0.1" value="${(r.assumptions_used.loading_pct*100).toFixed(1)}"></div>
          <button onclick="recomputeRenewalRating()">Recompute</button>
        </div>
      </div>
    `;
  } catch (err) {
    area.innerHTML = '';
  }
}

async function recomputeRenewalRating() {
  const inflation = Number(document.getElementById('renewal-inflation-override').value) / 100;
  const loading = Number(document.getElementById('renewal-loading-override').value) / 100;
  await loadRenewalRating(inflation, loading);
}

/* ---------------- scorecard ---------------- */

async function computeScore() {
  const premiumInput = document.getElementById('estimated-premium').value;
  try {
    const payload = { estimated_annual_premium: premiumInput ? Number(premiumInput) : null };
    await api(`/cases/${currentCase.id}/score`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    toast('Scorecard computed');
    await loadLatestScorecard();
  } catch (err) {
    toast(err.message, true);
  }
}

async function loadLatestScorecard() {
  const area = document.getElementById('scorecard-area');
  try {
    const sc = await api(`/cases/${currentCase.id}/scorecard`);
    const tierClass = 'tier-' + sc.risk_tier.replace(/[^A-Za-z]/g, '');
    const componentItems = [
      { label: 'Demographic', value: sc.demographic_risk },
      { label: 'Claims exp.', value: sc.claims_experience_risk },
      { label: 'Benefit richness', value: sc.benefit_richness_risk },
      { label: 'Industry', value: sc.industry_risk },
    ];
    area.innerHTML = `
      <div class="card">
        <h3>Risk scorecard <span class="tier-pill ${tierClass}">${sc.risk_tier}</span></h3>
        <div class="chart-wrap" style="margin-top:12px;">
          ${svgScoreMeter(sc.composite_score, sc.risk_tier)}
          <div class="hint" style="margin-top:6px; margin-bottom:0;">Composite score ${sc.composite_score} / 100 &middot; tier thresholds at 40 / 60 / 80</div>
        </div>
        <div class="kpi-grid">
          <div class="kpi"><span class="label">Composite score</span><span class="value">${sc.composite_score}</span></div>
          <div class="kpi"><span class="label">Suggested loading</span><span class="value">${sc.suggested_loading_pct}%</span></div>
          <div class="kpi"><span class="label">Demographic</span><span class="value">${sc.demographic_risk}&times;</span></div>
          <div class="kpi"><span class="label">Claims exp.</span><span class="value">${sc.claims_experience_risk}&times;</span></div>
          <div class="kpi"><span class="label">Benefit richness</span><span class="value">${sc.benefit_richness_risk}&times;</span></div>
          <div class="kpi"><span class="label">Industry</span><span class="value">${sc.industry_risk}&times;</span></div>
        </div>
        <h4>Component risk multipliers</h4>
        <div class="chart-wrap">${svgBarChart(componentItems, { labelWidth: 110, formatValue: v => v.toFixed(2) + '×' })}</div>
        <table>
          <tr><th>Avg age</th><td>${sc.details.demographic.avg_age ?? '-'}</td></tr>
          <tr><th>Male ratio (employees)</th><td>${(sc.details.demographic.male_ratio_employees*100).toFixed(1)}%</td></tr>
          <tr><th>Maternity risk count</th><td>${sc.details.demographic.maternity_risk_count}</td></tr>
          <tr><th>Female spouse count</th><td>${sc.details.demographic.female_spouse_count}</td></tr>
          <tr><th>Infant count</th><td>${sc.details.demographic.infant_count}</td></tr>
          <tr><th>Group size (employees)</th><td>${sc.details.demographic.group_size}</td></tr>
          <tr><th>Group favorability discount</th><td>${(sc.details.demographic.group_favorability_discount*100).toFixed(1)}%</td></tr>
          <tr><th>Small-group loading (&lt;50 employees)</th><td>${(sc.details.demographic.small_group_loading*100).toFixed(1)}%</td></tr>
          <tr><th>Network tier score</th><td>${sc.details.network_tier_score ?? 'n/a'} <span style="color:var(--ink-muted);">(0=cheapest network, 1=Platinum-tier)</span></td></tr>
          <tr><th>Claims loss ratio</th><td>${sc.details.claims_experience.loss_ratio ?? 'n/a'}</td></tr>
        </table>
      </div>
    `;
    bindChartTooltips(area);
  } catch (err) {
    area.innerHTML = '';
  }
}

async function recordOutcome(event) {
  event.preventDefault();
  const form = new FormData(event.target);
  const payload = {
    bound: form.get('bound') === 'true',
    final_premium: form.get('final_premium') ? Number(form.get('final_premium')) : null,
    actual_loss_ratio: form.get('actual_loss_ratio') ? Number(form.get('actual_loss_ratio')) : null,
  };
  try {
    await api(`/cases/${currentCase.id}/outcome`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    toast('Outcome recorded');
  } catch (err) {
    toast(err.message, true);
  }
}

showNewCaseForm();
</script>
</body>
</html>
