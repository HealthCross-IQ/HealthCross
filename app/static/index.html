    area.innerHTML = _rrEmptyCard('Nationality loss ratio &amp; burning cost', 'Needs Membership and Claims uploaded first.');
  }
}

function _rrNationalityByZone(rows) {
  const buckets = {};
  for (const r of rows) {
    const zone = r.nationality_zone || 'Unmapped';
    const b = buckets[zone] || (buckets[zone] = { zone, member_count: 0, actual_premium: 0, incurred_claims: 0 });
    b.member_count += r.member_count || 0;
    b.actual_premium += r.actual_premium || 0;
    b.incurred_claims += r.incurred_claims || 0;
  }
  return Object.values(buckets)
    .map(b => ({ ...b, loss_ratio: b.actual_premium ? b.incurred_claims / b.actual_premium : null }))
    .sort((a, b) => b.member_count - a.member_count);
}

function _rrNationalityHtml(rows) {
  const zones = _rrNationalityByZone(rows);
  const zoneBody = zones.map(z => `
    <tr>
      <td>${escapeHtml(ZONE_LABELS[z.zone] || z.zone)}</td>
      <td class="num">${z.member_count.toLocaleString()}</td>
      <td class="num">${_lrMoney(z.actual_premium)}</td>
      <td class="num">${_lrMoney(z.incurred_claims)}</td>
      <td class="num ${_lrBand(z.loss_ratio)}" style="font-weight:600;">${_lrPct(z.loss_ratio)}</td>
    </tr>`).join('');

  const byLives = [...rows].sort((a, b) => (b.member_count || 0) - (a.member_count || 0));
  const top10 = byLives.slice(0, 10);
  const omitted = byLives.length - top10.length;
  const body = top10.map(r => `
    <tr>
      <td>${escapeHtml(r.nationality)}</td>
      <td>${escapeHtml(ZONE_LABELS[r.nationality_zone] || r.nationality_zone || '-')}</td>
      <td class="num">${r.member_count.toLocaleString()}</td>
      <td class="num">${_lrMoney(r.actual_premium)}</td>
      <td class="num">${_lrMoney(r.incurred_claims)}</td>
      <td class="num ${_lrBand(r.loss_ratio)}">${_lrPct(r.loss_ratio)}</td>
      <td class="num">${_lrMoney(r.burning_cost)}</td>
      <td class="num">${(r.credibility * 100).toFixed(0)}%</td>
    </tr>`).join('');
  return `
    <div class="lr-card">
      <div class="lr-card-head">
        <div>
          <div class="lr-card-title">Nationality loss ratio, burning cost &amp; exposed risk population</div>
          <div class="lr-card-note">Members = exposed risk population (ERP) headcount. Loss ratio = incurred (paid + outstanding + IBNR) &divide; each nationality's own actual premium. Burning cost = AED per earned member-year - see Nationality Risk for the credibility blend behind the rating factor.</div>
        </div>
      </div>
      <div class="lr-card-note" style="margin:0 0 4px; font-weight:600; color:var(--lr-ink,#0f1c2e);">By zone</div>
      <div class="lr-table-wrap" style="margin-bottom:14px;">
        <table class="lr-table">
          <thead><tr><th>Zone</th><th class="num">Members (ERP)</th><th class="num">Premium</th><th class="num">Incurred</th><th class="num">Loss ratio</th></tr></thead>
          <tbody>${zoneBody || '<tr><td colspan="5" class="lr-empty">No data yet.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="lr-card-note" style="margin:0 0 4px; font-weight:600; color:var(--lr-ink,#0f1c2e);">Top 10 nationalities by lives${omitted > 0 ? ` (${omitted} more not shown)` : ''}</div>
      <div class="lr-table-wrap">
        <table class="lr-table">
          <thead><tr>
            <th>Nationality</th><th>Zone</th><th class="num">Members (ERP)</th><th class="num">Premium</th>
            <th class="num">Incurred</th><th class="num">Loss ratio</th><th class="num">Burning cost</th><th class="num">Credibility</th>
          </tr></thead>
          <tbody>${body || '<tr><td colspan="8" class="lr-empty">No data yet.</td></tr>'}</tbody>

async function _rrRunCrossTab() {
  const filterDim = (document.getElementById('rr-xtab-filter-dim') || {}).value;
  const filterValue = ((document.getElementById('rr-xtab-filter-value') || {}).value || '').trim();
  const resultArea = document.getElementById('rr-crosstab-result');
  if (!filterValue) { toast('Enter a value to filter by first', true); return; }
  const otherDims = RR_XTAB_DIMENSIONS.filter(([dim]) => dim !== filterDim);
  resultArea.innerHTML = '<div class="lr-empty">Loading&hellip;</div>';
  try {
    const results = await Promise.all(otherDims.map(([dim]) => {
      const params = _rrProductParams({ group_by: dim, [filterDim]: filterValue });
      return api(`/portfolio-analysis/summary?${params.toString()}`);
    }));
    rrData.crossTab = {
      filterDim, filterValue,
      byDimension: Object.fromEntries(otherDims.map(([dim], i) => [dim, results[i].rows || []])),
    };
    resultArea.innerHTML = _rrCrossTabResultHtml(rrData.crossTab, otherDims);
  } catch (err) {
    resultArea.innerHTML = `<div class="lr-empty">${escapeHtml(err.message)}</div>`;
  }
}

function _rrPrintMoney(v) {
  return v == null ? '-' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
}
function _rrPrintPct(v) {
  return v == null ? '-' : (v * 100).toFixed(1) + '%';
}
function _rrPrintBand(v) {
  if (v == null) return '';
  if (v > 1) return 'bad';
  if (v >= 0.7) return 'warn';
  return 'good';
}

function printReinsuranceReport() {
  if (!rrData.product) { toast('Load the report first', true); return; }
  // Benefit-wise/Maternity/Top-claimants scan every claim line on the
  // whole book and are the slowest of the report's 8 concurrent loads -
  // printing while they're still in flight has shipped a reinsurer a
  // report reading "No data" for claims that are actually on file.
  if (!rrState.loaded) { toast('Still loading the report - wait a moment and try again', true); return; }

  const generated = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
  const asOf = rrData.asOf || '';
  const ref = `HC-RI-${(asOf || '').replace(/-/g, '')}`;
  const t = rrData.bookTotals || {};
  const productScope = (rrState.products || []).join(', ') || 'none selected';

  const productRows = (rrData.product || []).map(r => `
    <tr>

      <td class="num">${r.member_count.toLocaleString()}</td>
      <td class="num">${_rrPrintMoney(r.actual_premium)}</td>

    </tr>`).join('');

  const enrollOrder = ['Initial', 'Addition', 'Unmapped'];
  const enrollRows = [...(rrData.enrollmentType || [])]
    .sort((a, b) => enrollOrder.indexOf(a.enrollment_type) - enrollOrder.indexOf(b.enrollment_type))
    .map(r => `
    <tr>
      <td>${escapeHtml(r.enrollment_type)}</td>
      <td class="num">${r.member_count.toLocaleString()}</td>
      <td class="num">${_rrPrintMoney(r.actual_premium)}</td>
      <td class="num">${_rrPrintMoney((r.actual_claims || 0) + (r.ibnr || 0))}</td>
      <td class="num"><span class="badge ${_rrPrintBand(r.loss_ratio_incl_ibnr)}">${_rrPrintPct(r.loss_ratio_incl_ibnr)}</span></td>

  const natZones = _rrNationalityByZone(rrData.nationality || []);
  const natZoneRows = natZones.map(z => `
    <tr>
      <td>${escapeHtml(ZONE_LABELS[z.zone] || z.zone)}</td>

      <td class="num"><span class="badge ${_rrPrintBand(z.loss_ratio)}">${_rrPrintPct(z.loss_ratio)}</span></td>
    </tr>`).join('');

  // Top 10 by lives - the whole nationality table can run to 100+ rows on
  // a real book, most carrying negligible exposure.
  const natByLives = [...(rrData.nationality || [])].sort((a, b) => (b.member_count || 0) - (a.member_count || 0));
  const natRows = natByLives.slice(0, 10).map(r => `
    <tr>
      <td>${escapeHtml(r.nationality)}</td>
      <td>${escapeHtml(ZONE_LABELS[r.nationality_zone] || r.nationality_zone || '-')}</td>
      <td class="num">${r.member_count.toLocaleString()}</td>

async function showPortfolioAnalysis() {
  currentCase = null;

  await paLoadFilterOptions();

  if (paLastDemographic) bindChartTooltips(document.getElementById('pa-demographic-area'));

async function paLoadExecutiveSummary() {
  const area = document.getElementById('pa-executive-summary-area');
  if (!area) return;
  try {
    const s = await api('/portfolio-analysis/executive-summary');
    area.innerHTML = `
      <h3>Level 1 &middot; Executive Portfolio</h3>
      <div class="kpi-grid">
        <div class="kpi"><span class="label">Total groups</span><span class="value">${s.total_groups.toLocaleString()}</span></div>
        <div class="kpi"><span class="label">Total members</span><span class="value">${s.total_members.toLocaleString()}</span></div>
        <div class="kpi"><span class="label">Written premium</span><span class="value">AED ${s.written_premium.toLocaleString()}</span></div>
        <div class="kpi"><span class="label">Earned premium</span><span class="value">AED ${s.earned_premium.toLocaleString()}</span></div>
        <div class="kpi"><span class="label">Incurred claims</span><span class="value">AED ${s.incurred_claims.toLocaleString()}</span></div>
        <div class="kpi"><span class="label">Loss ratio</span><span class="value">${s.loss_ratio != null ? (s.loss_ratio * 100).toFixed(1) + '%' : '-'}</span></div>
        <div class="kpi"><span class="label">Combined ratio</span><span class="value">${s.combined_ratio != null ? (s.combined_ratio * 100).toFixed(1) + '%' : '-'}</span></div>
        <div class="kpi"><span class="label">Avg. premium / member</span><span class="value">${s.average_premium_per_member != null ? 'AED ' + s.average_premium_per_member.toLocaleString() : '-'}</span></div>
        <div class="kpi"><span class="label">Claim frequency</span><span class="value">${s.claim_frequency != null ? s.claim_frequency.toFixed(2) : '-'}</span></div>
        <div class="kpi"><span class="label">Claim severity</span><span class="value">${s.claim_severity != null ? 'AED ' + s.claim_severity.toLocaleString() : '-'}</span></div>
      </div>
      <div class="hint" style="margin:0;">Combined ratio = Loss ratio + expense ratio (commission + TPA + admin + HC/management fees) - a healthy-looking loss ratio can still mean an unprofitable book once acquisition/administration cost is added. Expense ratio here (${(s.expense_ratio_pct * 100).toFixed(1)}%) uses each client's own real OPEX/Loading % from the uploaded Client Master sheet where it's on file, falling back to a flat 33% assumption otherwise - it's a blend across the whole book, not a flat number, once any client has a real figure uploaded. Incurred claims = Paid + Outstanding + IBNR. Claim frequency = claims per earned member-year; Claim severity = average AED cost per claim - a poor loss ratio can be read as "too many claims" vs. "a few expensive ones" before drilling into any one segment.</div>
    `;
    area.style.display = '';
  } catch (err) {
    area.innerHTML = '';
    area.style.display = 'none';
  }
}

async function paLoadDataAsOf() {
  try {
    const result = await api('/portfolio-analysis/data-as-of');
    paDataAsOf = result.data_as_of_date;
    const input = document.getElementById('pa-data-as-of');
    const status = document.getElementById('pa-status-as-of');
    if (input) input.value = paDataAsOf || '';
    if (status) status.textContent = paDataAsOf ? `Currently: ${paDataAsOf}` : 'Not set - defaults to today';
  } catch (err) { /* non-fatal */ }
}

async function paSetDataAsOf() {
  const value = document.getElementById('pa-data-as-of').value;
  if (!value) { toast('Choose a date first', true); return; }
  try {
    await api('/portfolio-analysis/data-as-of', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ data_as_of_date: value }),
    });
    paDataAsOf = value;
    document.getElementById('pa-status-as-of').textContent = `Currently: ${value}`;
    toast('Data-as-of date saved');
  } catch (err) {
    toast(err.message, true);
  }
}

async function paUploadFile(kind) {
  const inputId = {
    'members': 'pa-file-members', 'claims': 'pa-file-claims',
    'group-product-mapping': 'pa-file-mapping', 'subgroup-mapping': 'pa-file-subgroup-mapping',
    'client-master': 'pa-file-client-master',
  }[kind];
  const statusId = {
    'members': 'pa-status-members', 'claims': 'pa-status-claims',
    'group-product-mapping': 'pa-status-mapping', 'subgroup-mapping': 'pa-status-subgroup-mapping',
    'client-master': 'pa-status-client-master',
  }[kind];
  const input = document.getElementById(inputId);
  const statusEl = document.getElementById(statusId);
  if (!input.files.length) { toast('Choose a file first', true); return; }
  const form = new FormData();
  form.append('file', input.files[0]);
  if (kind === 'members' || kind === 'claims') {
    const asOfValue = document.getElementById('pa-data-as-of').value;
    if (asOfValue) form.append('data_as_of', asOfValue);
  }
  try {
    const result = await api(`/portfolio-analysis/${kind}/upload`, { method: 'POST', body: form });
    statusEl.textContent = `${result.rows_ingested} rows`;
    toast(`${kind} uploaded (${result.rows_ingested} rows)`);
    paLoadDataAsOf();
    paRefreshFilterOptionsUI();
  } catch (err) {
    toast(err.message, true);
  }
}

function paSetGroupBy(value) {
  paGroupBy = value;

let paLastPolicyYearBreakdown = null;

async function paRunAnalysis() {
  paReadFilterInputs();
  try {
    const params = paBuildFilterParams({ group_by: paGroupBy });
    paLastSummary = await api(`/portfolio-analysis/summary?${params.toString()}`);
    paSearchTerm = '';

    // A client/master filter combines every policy year present into one
    // number by default - if one's picked and Group by isn't already
    // "Policy year", automatically show the per-year split too, so a
    // client with 2 years of data isn't silently blended without you
    // having to remember to switch Group by yourself.
    paLastPolicyYearBreakdown = null;
    if (paFilters.master_client && paGroupBy !== 'policy_year' && !paPolicyYear) {
      try {

/* The annual-limit dropdown, answered instead of guessed. See
   app/scoring/rules/annual_limit_exposure.py - the counts are of
   members, not claim lines, because an annual limit is breached by a
   person over a year rather than by an invoice. */
let paLastAnnualLimit = null;

/* Maintaining each client's own OPEX by hand. Two things this screen has
   to make legible rather than hide: that one client legitimately holds
   several dated windows, and that a hand-edited record stops tracking
   the uploaded sheet - see routes_portfolio_analysis.upsert_client_loading. */
let paLastClientLoading = null;
//: Closed windows the user has explicitly reopened to fix a wrong entry.
//: Held for the session only - reloading the screen locks them again, so
//: an unlock is a deliberate act each time rather than a mode the screen
//: quietly stays in.
let paUnlockedLoadingRows = new Set();

async function paLoadClientLoading() {
  try {
    paLastClientLoading = await api('/portfolio-analysis/client-loading');
    paUnlockedLoadingRows = new Set();
    paRenderClientLoading();
  } catch (err) {
    toast(err.message, true);
  }
}

/* 0.265, 26.5 and "26.5%" are all how underwriting writes the same
   figure - the Client Master sheet parser accepts all three, so refusing
   two of them here would just move the error into the spreadsheet. */
function paParseOpex(raw) {
  const text = String(raw == null ? '' : raw).trim().replace('%', '');
  if (!text) return null;
  const n = Number(text);
  if (!Number.isFinite(n) || n < 0) return null;
  return n > 1 ? n / 100 : n;
}

function paRenderClientLoading() {
  const d = paLastClientLoading;
  const area = document.getElementById('pa-client-loading-area');
  if (!d || !area) return;
  const today = new Date().toISOString().slice(0, 10);
  const pct = v => v == null ? '-' : (v * 100).toFixed(1) + '%';

  // Newest window first per client; earlier ones sit indented beneath so
  // a figure that looks wrong can be traced to the renewal that changed it.
  const byClient = {};
  d.records.forEach(r => (byClient[r.master_client_name] = byClient[r.master_client_name] || []).push(r));
  const ordered = Object.keys(byClient).sort().flatMap(name =>
    byClient[name].sort((a, b) => String(b.start_date || '').localeCompare(String(a.start_date || ''))));

  const seen = new Set();
  const rows = ordered.map(r => {
    const first = !seen.has(r.master_client_name);
    seen.add(r.master_client_name);
    const inForce = first && (!r.end_date || r.end_date >= today);
    // A closed window is fixed: the combined ratios reported for that
    // period were measured against the loading in it. Rendered locked so
    // nobody types into a field whose save would be refused.
    const locked = r.window_has_closed && !paUnlockedLoadingRows.has(r.id);
    const dis = locked ? ' disabled' : '';
    const name = escapeHtml(r.master_client_name).replace(/'/g, "\\'");
    return `
      <tr data-id="${r.id}">
        <td>${first
          ? `<strong>${escapeHtml(r.master_client_name)}</strong>${r.manually_edited
              ? ' <span class="tier-pill dir-review" title="Kept through Client Master uploads - and no longer tracking the sheet">edited by hand</span>' : ''}`
          : '<span class="hint" style="padding-left:18px;">&#8627; earlier window</span>'}</td>
        <td>${r.product ? escapeHtml(r.product) : '<span class="hint">-</span>'}</td>
        <td class="num"><input type="text" inputmode="decimal" style="width:80px;text-align:right;"
              value="${r.opex_pct == null ? '' : (r.opex_pct * 100).toFixed(1)}" data-field="opex"${dis}></td>
        <td><input type="date" value="${r.start_date || ''}" data-field="start"${dis}></td>
        <td><input type="date" value="${r.end_date || ''}" data-field="end"${dis}></td>
        <td>${inForce ? '<span class="tier-pill dir-improved">In force</span>'
              : r.window_has_closed ? '<span class="tier-pill dir-same" title="This window has closed - the figures reported for it were measured against this loading">Closed</span>'
              : '<span class="tier-pill dir-same">Superseded</span>'}</td>
        <td>
          ${locked
            ? `<button class="small" onclick="paUnlockClientLoading(${r.id})" title="Only for a figure entered wrongly">Correct an error</button>`
            : `<button class="small" onclick="paSaveClientLoading(${r.id})">Save</button>
               <button class="small" onclick="paDeleteClientLoading(${r.id}, '${name}')">Remove</button>`}
        </td>
      </tr>`;
  }).join('');

  const gaps = d.without_a_record.map(g => `
    <tr>
      <td>${escapeHtml(g.master_client_name)}</td>
      <td class="num">${g.lives.toLocaleString()}</td>
      <td class="num">${Math.round(g.gross_premium).toLocaleString()}</td>
      <td class="num"><span class="tier-pill dir-review">${pct(d.default_opex_pct)} assumed</span></td>
      <td><button class="small" onclick="paAddClientLoading('${escapeHtml(g.master_client_name).replace(/'/g, "\\'")}')">Add a figure</button></td>
    </tr>`).join('');

  area.innerHTML = `
    <div class="row" style="margin-top:12px; gap:12px; align-items:flex-end; flex-wrap:wrap;">
      <div><div class="hint">Clients on file</div><div style="font-size:18px;font-weight:600;">${Object.keys(byClient).length}</div></div>
      <div><div class="hint">Book default</div><div style="font-size:18px;font-weight:600;">${pct(d.default_opex_pct)}</div></div>
      <div><div class="hint">In the book, no figure</div><div style="font-size:18px;font-weight:600;">${d.without_a_record.length}</div></div>
      <button class="primary" style="margin-left:auto;" onclick="paAddClientLoading('')">Add client</button>
    </div>
    <div class="hint" style="margin-top:10px;">Loading accepts <strong>0.265</strong>, <strong>26.5</strong> or <strong>26.5%</strong> - all three store as the same fraction. Product comes from the membership export's own PRODUCTNAME column and is shown for reference only. Saving a row marks it <strong>edited by hand</strong>: it then survives the next Client Master upload, and stops tracking that sheet until it is removed.</div>
    <div style="overflow-x:auto;">
    <table style="margin-top:12px;">
      <tr><th style="min-width:240px;">Master client</th><th>Product</th><th class="num">Loading</th><th>From</th><th>To</th><th>Status</th><th></th></tr>
      ${rows || '<tr><td colspan="7" class="hint">No loading records yet - upload a Client Master sheet or add one here.</td></tr>'}
    </table>
    </div>
    ${d.without_a_record.length ? `
      <h4 style="margin-top:22px;">In the book with no loading on file</h4>
      <div class="hint">These accounts carry premium and members but no OPEX record, so their combined ratio is measured against the ${pct(d.default_opex_pct)} book default. That is an assumption standing in for a measurement, and nothing on any other screen says so.</div>
      <div style="overflow-x:auto;">
      <table style="margin-top:10px;">
        <tr><th style="min-width:240px;">Master client</th><th class="num">Lives</th><th class="num">Gross premium</th><th class="num">Assumed loading</th><th></th></tr>
        ${gaps}
      </table>
      </div>` : ''}
  `;
}

function _paRowValues(id) {
  const row = document.querySelector(`#pa-client-loading-area tr[data-id="${id}"]`);
  if (!row) return null;
  const get = f => row.querySelector(`[data-field="${f}"]`).value;
  return {opex: paParseOpex(get('opex')), start: get('start') || null, end: get('end') || null};
}

async function paSaveClientLoading(id) {
  const record = paLastClientLoading.records.find(r => r.id === id);
  const values = _paRowValues(id);
  if (!record || !values) return;
  if (values.opex == null) { toast('Enter a loading, e.g. 26.5', true); return; }
  try {
    await api('/portfolio-analysis/client-loading', {
      method: 'POST',
      body: JSON.stringify({
        id, master_client_name: record.master_client_name,
        opex_pct: values.opex, start_date: values.start, end_date: values.end,
        correcting_an_error: paUnlockedLoadingRows.has(id),
      }),
    });
    toast('Loading saved');
    await paLoadClientLoading();
  } catch (err) { toast(err.message, true); }
}

async function paAddClientLoading(prefillName) {
  const name = (prompt('Master client name', prefillName || '') || '').trim();
  if (!name) return;
  const raw = prompt(`Loading for ${name} - 0.265, 26.5 or 26.5%`, '26.5');
  const opex = paParseOpex(raw);
  if (opex == null) { toast('That is not a loading I can read', true); return; }
  const start = (prompt('Window starts (YYYY-MM-DD, blank for none)', new Date().toISOString().slice(0, 10)) || '').trim();
  const end = (prompt('Window ends (YYYY-MM-DD, blank for none)', '') || '').trim();
  try {
    await api('/portfolio-analysis/client-loading', {
      method: 'POST',
      body: JSON.stringify({master_client_name: name, opex_pct: opex, start_date: start || null, end_date: end || null}),
    });
    toast('Loading added');
    await paLoadClientLoading();
  } catch (err) { toast(err.message, true); }
}

/* Removing a window is for a figure entered wrongly. A loading that
   genuinely changed at renewal wants a NEW window instead - the old one
   is what keeps that year's combined ratio reproducible. */
async function paDeleteClientLoading(id, name) {
  if (!confirm(`Remove this loading window for ${name}?\n\nUse this for a figure entered wrongly. If the loading changed at renewal, add a new window instead - removing the old one changes any combined ratio already reported for that period.`)) return;
  try {
    await api(`/portfolio-analysis/client-loading/${id}`, {method: 'DELETE'});
    toast('Window removed');
    await paLoadClientLoading();
  } catch (err) { toast(err.message, true); }
}

async function printPortfolioManagementReport() {
  // window.open() must happen synchronously, in direct response to the
  // click - opening it only after the awaited fetches below finish is no
  // longer "tied" to the click as far as the browser's own pop-up blocker
  // is concerned, so it gets silently killed with no error and no visible
  // failure at all. Opening a blank tab up front and writing into it once
  // the data arrives keeps it inside that one trusted user gesture.
  const win = window.open('', '_blank');
  if (!win) {
    toast('Your browser blocked the report pop-up - allow pop-ups for this site and try again', true);
    return;
  }

  paReadFilterInputs();
  const isClientLevel = !!paFilters.master_client;
  let execSummary, productSummary, networkSummary, largeClaims, policyYearBreakdown, utilization, groupSizeBands, newVsRenewal;
  try {
    [execSummary, productSummary, networkSummary] = await Promise.all([
      api(`/portfolio-analysis/executive-summary?${paBuildFilterParams().toString()}`),
      api(`/portfolio-analysis/summary?${paBuildFilterParams({ group_by: 'product' }).toString()}`),
      api(`/portfolio-analysis/summary?${paBuildFilterParams({ group_by: 'network' }).toString()}`),
    ]);
  } catch (err) {
    win.close();
    toast(err.message, true);
    return;
  }
  // Client-level report: scope Large Claims/Utilization to this one
  // master client's own claims too, instead of the whole book - neither
  // endpoint takes the full filter set (they have no Product/Network of
  // their own to filter by), just master_client.
  const claimsScopeParam = isClientLevel ? `?master_client=${encodeURIComponent(paFilters.master_client)}` : '';
  try {
    largeClaims = await api(`/portfolio-analysis/large-claims${claimsScopeParam}`);
  } catch (err) { largeClaims = null; /* no claims uploaded (or none for this client) - section omitted */ }
  try {
    utilization = await api(`/portfolio-analysis/utilization${claimsScopeParam}`);
  } catch (err) { utilization = null; /* no claims uploaded (or none for this client) - section omitted */ }

  // Group Size Distribution and New vs. Renewal describe the WHOLE
  // BOOK's own shape (how many groups of each size, how many have
  // renewed) - not meaningful scoped down to a single already-known
  // client, so these are whole-book-only sections, omitted entirely from
  // a client-level report.
  if (!isClientLevel) {
    try {
      const bandsData = await api(`/portfolio-analysis/group-size-bands?${paBuildFilterParams().toString()}`);
      groupSizeBands = bandsData.rows;
    } catch (err) { groupSizeBands = null; }
    try {
      const nvrParams = paBuildFilterParams();
      const newVsRenewalData = await api(`/portfolio-analysis/new-vs-renewal?${nvrParams.toString()}`);
      newVsRenewal = newVsRenewalData.rows;
    } catch (err) { newVsRenewal = null; }
  }

  // A client-level report on a client that's already renewed can blend
  // last year's and this year's members into one set of figures unless
  // asked otherwise - break each policy year out separately instead of
  // silently averaging them together, same as the on-screen "Client
  // (Master)" filter already does for the summary table.
  if (isClientLevel && !paPolicyYear) {
    try {
      policyYearBreakdown = await api(`/portfolio-analysis/summary?${paBuildFilterParams({ group_by: 'policy_year' }).toString()}`);
    } catch (err) { policyYearBreakdown = null; }
  }

  const activeFilters = Object.entries(paFilters).filter(([, v]) => v);
  const filterLabels = { product: 'Product', network: 'Network', region: 'Region', nationality_zone: 'Nationality zone', gender: 'Gender', relation: 'Relation', master_client: 'Client (Master)' };
  const filterSummary = activeFilters.length
    ? activeFilters.map(([k, v]) => `${filterLabels[k] || k}: ${escapeHtml(v)}`).join(' &middot; ')
    : 'Whole book - no filters applied';
  const scopeLine = `${filterSummary}${paPolicyYear ? ' &middot; Policy year: ' + escapeHtml(paPolicyYear) : ''}`;

  const policyYearRows = (policyYearBreakdown && policyYearBreakdown.rows.length > 1) ? policyYearBreakdown.rows : null;
  const policyYearHtml = policyYearRows ? `
    <section class="rcs-section">
      <h3>By Policy Year</h3>
      <p class="rcs-desc">This client has more than one policy year on file (some members already renewed) - each year's own experience is shown separately here rather than blended into one figure.</p>
      <table class="rcs-data">
        <tr><th>Policy Year</th><th class="rcs-num">Members</th><th class="rcs-num">Earned Premium</th><th class="rcs-num">Incurred Claims</th><th class="rcs-num">LR (incl. IBNR)</th></tr>
        ${policyYearRows.map(r => `
          <tr>
            <td>${escapeHtml(String(r.policy_year ?? '-'))}</td>
            <td class="rcs-num">${r.member_count.toLocaleString()}</td>
            <td class="rcs-num">${r.actual_premium.toLocaleString()}</td>
            <td class="rcs-num">${(r.actual_claims + (r.ibnr || 0)).toLocaleString()}</td>
            <td class="rcs-num"><b>${r.loss_ratio_incl_ibnr != null ? (r.loss_ratio_incl_ibnr * 100).toFixed(1) + '%' : '-'}</b></td>
          </tr>`).join('')}
      </table>

function paFilterRows() {
  paSearchTerm = document.getElementById('pa-search').value.trim().toLowerCase();
  paRerenderSummaryTable();
}

function paVisibleRows() {
  if (!paLastSummary) return [];
  if (!paSearchTerm) return paLastSummary.rows;
  return paLastSummary.rows.filter(r => String(r[paLastSummary.group_by]).toLowerCase().includes(paSearchTerm));
}

function paComputeTotals(rows) {
  const totals = rows.reduce((acc, r) => {
    acc.member_count += r.member_count;
    acc.priced_member_count += r.priced_member_count;
    acc.standard_premium += r.standard_premium;
    acc.actual_premium += r.actual_premium;
    acc.actual_claims += r.actual_claims;
    acc.actual_claims_paid += r.actual_claims_paid || 0;
    acc.actual_claims_outstanding += r.actual_claims_outstanding || 0;
    acc.ibnr += r.ibnr || 0;
    acc.claim_count += r.claim_count || 0;
    acc.earned_member_years += r.earned_member_years;
    return acc;
  }, { member_count: 0, priced_member_count: 0, standard_premium: 0, actual_premium: 0, actual_claims: 0, actual_claims_paid: 0, actual_claims_outstanding: 0, ibnr: 0, claim_count: 0, earned_member_years: 0 });
  totals.loss_ratio_vs_standard = totals.standard_premium ? totals.actual_claims / totals.standard_premium : null;
  totals.loss_ratio_vs_actual = totals.actual_premium ? totals.actual_claims / totals.actual_premium : null;
  totals.loss_ratio_incl_ibnr = totals.actual_premium ? (totals.actual_claims + totals.ibnr) / totals.actual_premium : null;
  totals.actual_vs_standard_pct = totals.standard_premium ? (totals.actual_premium - totals.standard_premium) / totals.standard_premium * 100 : null;
  totals.burning_cost = totals.earned_member_years ? totals.actual_claims / totals.earned_member_years : null;
  totals.claim_frequency = totals.earned_member_years ? totals.claim_count / totals.earned_member_years : null;
  totals.claim_severity = totals.claim_count ? totals.actual_claims / totals.claim_count : null;
  return totals;
}

function paRerenderSummaryTable() {
  const area = document.getElementById('pa-result-area');
  if (area && paLastSummary) area.innerHTML = paSummaryHtml(paLastSummary);
}

  return `

        <div>

      </div>
    </div>
    <div id="pi-content"></div>

function piOnClientChange(value) {
  piSelectedMasterClient = value;
  piLoadAndRender();
}

async function piLoadAndRender() {
  const content = document.getElementById('pi-content');
  content.innerHTML = `<div class="card"><div class="hint">Computing...</div></div>`;
  try {
    // A single combined endpoint - computing every breakdown from ONE
    // pass over the book instead of 7 separate requests each redoing the
    // full member/claims analysis from scratch, which is what made this
    // dashboard slow on a real ~3,700-member book.
    const params = new URLSearchParams();
    if (piSelectedMasterClient) params.set('master_client', piSelectedMasterClient);
    const insights = await api(`/portfolio-analysis/insights?${params.toString()}`);
    const { by_product: byProduct, by_network: byNetwork, by_nationality_zone: byNationality,
      by_relation: byRelation, by_gender: byGender, by_policy_year: byPolicyYear,
      by_category: byCategory, by_subgroup: bySubgroup, by_age_gender: ageGender } = insights;
    content.innerHTML = piContentHtml({ byProduct, byNetwork, byNationality, byRelation, byGender, byPolicyYear, byCategory, bySubgroup, ageGender });
    content.querySelectorAll('.chart-svg').forEach(svg => bindChartTooltips(svg.parentElement));
  } catch (err) {
    content.innerHTML = `<div class="card"><div class="hint">${escapeHtml(err.message)}</div></div>`;
  }
}

function piProportionItems(rows, groupByField) {
  const total = rows.reduce((sum, r) => sum + r.member_count, 0) || 1;
  return rows.map(r => ({ label: String(r[groupByField]), count: r.member_count, pct: r.member_count / total }));
}

      <h3>Loss ratio (incl. IBNR) by Network</h3>
      ${lossRatioInclIbnrByNetworkItems.length ? svgBarChart(lossRatioInclIbnrByNetworkItems, { formatValue: v => v.toFixed(1) + '%', color: 'var(--series-3)' }) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Loss ratio (actual) by Category</h3>
      <div class="hint">The member's own benefit category (e.g. Category A/B/C) - a separate dimension from Product/Network, useful when one scheme prices several tiers differently.</div>
      ${categoryLossRatioItems.length ? svgBarChart(categoryLossRatioItems, { formatValue: v => v.toFixed(1) + '%', color: 'var(--series-4)' }) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Burning cost by Network</h3>
      ${burningCostItems.length ? svgBarChart(burningCostItems, { color: 'var(--series-2)' }) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Nationality zone mix</h3>
      ${byNationality.rows.length ? svgProportionBar(piProportionItems(byNationality.rows, 'nationality_zone')) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Relation mix (employee / spouse / child)</h3>
      ${byRelation.rows.length ? svgProportionBar(piProportionItems(byRelation.rows, 'relation')) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Gender mix</h3>
      ${byGender.rows.length ? svgProportionBar(piProportionItems(byGender.rows, 'gender')) : '<div class="hint">No data.</div>'}
    </div>

    <div class="card">
      <h3>Membership by age band</h3>
      <div class="hint">Bucketed into the same age bands the standard pricing rate card itself uses.</div>
      <div class="row" style="align-items:flex-start; flex-wrap:wrap;">
        <div style="flex:1; min-width:280px;">
          <div class="hint">Male</div>
          ${maleAgeItems.length ? svgBarChart(maleAgeItems) : '<div class="hint">No data.</div>'}
        </div>
        <div style="flex:1; min-width:280px;">
          <div class="hint">Female</div>
          ${femaleAgeItems.length ? svgBarChart(femaleAgeItems) : '<div class="hint">No data.</div>'}
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Burning cost by age band</h3>
      <div class="row" style="align-items:flex-start; flex-wrap:wrap;">
        <div style="flex:1; min-width:280px;">
          <div class="hint">Male</div>
          ${maleBurningItems.length ? svgBarChart(maleBurningItems, { color: 'var(--series-3)' }) : '<div class="hint">No data.</div>'}
        </div>
        <div style="flex:1; min-width:280px;">
          <div class="hint">Female</div>
          ${femaleBurningItems.length ? svgBarChart(femaleBurningItems, { color: 'var(--series-3)' }) : '<div class="hint">No data.</div>'}
        </div>
      </div>
    </div>
  `;
}

/* ---------------- Chat assistant (free-text Q&A over portfolio + case data) ---------------- */

let chatHistory = []; // [{role: 'user'|'assistant', text}]

function showChatAssistant() {
  currentCase = null;
  loadCases();
  document.getElementById('main').innerHTML = chatPanelHtml();
  chatRenderMessages();
  document.getElementById('chat-input').focus();
}

function chatPanelHtml() {
  return `
    <div class="card">
      <h3>Ask a question</h3>
      <div class="hint">Ask anything about the booked portfolio or the case pipeline - e.g. "which product has the worst loss ratio", "how many renewals are due this quarter", "why does zone 2 look expensive". Answered from a snapshot of the current data, not a live database query - for a fine-grained drill-down (one specific member, one specific case's full history), use Portfolio Insights or the case itself instead.</div>
      <div id="chat-messages" style="display:flex; flex-direction:column; gap:12px; max-height:55vh; overflow-y:auto; padding:4px 2px;"></div>
      <div class="row" style="margin-top:14px; align-items:flex-end;">
        <div style="flex:1;">
          <textarea id="chat-input" rows="2" placeholder="Ask a question... (Enter to send, Shift+Enter for a new line)" style="width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px; resize:vertical;" onkeydown="chatHandleKeydown(event)"></textarea>
        </div>
        <button class="primary" id="chat-send-btn" onclick="chatSend()">Ask</button>
      </div>
    </div>
  `;
}

function chatHandleKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    chatSend();
  }
}

// A markdown table row: "| a | b |" (an optional leading/trailing pipe,
// at least one interior pipe). A separator row is the same shape but every
// cell is just dashes (with optional leading/trailing colons for alignment,
// e.g. "|---|:---:|---|") - never real content, so it's recognized
// separately and consumed rather than rendered as a header/data row itself.
const _CHAT_TABLE_ROW_RE = /^\s*\|?(.+\|.+)\|?\s*$/;
const _CHAT_TABLE_SEPARATOR_RE = /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/;

function _chatTableCells(line) {
  let trimmed = line.trim();
  if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
  if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
  return trimmed.split('|').map(c => c.trim());
}

// Renders the markdown Claude's own answers actually use - bold, bullet
// lines, and (most importantly for data-heavy answers) tables - as real
// HTML rather than showing the raw "| a | b |" / "**bold**" syntax
// verbatim. Each cell/line is escaped individually before being placed in
// the output, so nothing from the model's own text is ever raw HTML.
function chatFormatText(text) {
  const lines = text.split('\n');
  const blocks = [];
  let i = 0;
  while (i < lines.length) {
    if (_CHAT_TABLE_ROW_RE.test(lines[i]) && lines[i + 1] && _CHAT_TABLE_SEPARATOR_RE.test(lines[i + 1])) {
      const header = _chatTableCells(lines[i]);
      let j = i + 2;
      const rows = [];
      while (j < lines.length && _CHAT_TABLE_ROW_RE.test(lines[j]) && !_CHAT_TABLE_SEPARATOR_RE.test(lines[j])) {
        rows.push(_chatTableCells(lines[j]));
        j++;
      }
      const headerRow = `<tr>${header.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>`;
      const dataRows = rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('');
      blocks.push(`<div style="overflow-x:auto; margin:6px 0;"><table>${headerRow}${dataRows}</table></div>`);
      i = j;
    } else {
      let line = escapeHtml(lines[i]);
      line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      line = line.replace(/^- (.+)$/, '&bull; $1');
      blocks.push(line);
      i++;
    }
  }
  return blocks.join('\n');
}

function chatMessageHtml(msg) {
  const isUser = msg.role === 'user';
  return `
    <div style="align-self:${isUser ? 'flex-end' : 'flex-start'}; max-width:${isUser ? '80%' : '95%'};">
      <div class="hint" style="margin-bottom:2px; ${isUser ? 'text-align:right;' : ''}">${isUser ? 'You' : 'Assistant'}</div>
      <div style="padding:10px 14px; border-radius:10px; background:${isUser ? 'var(--accent)' : 'var(--surface-2)'}; color:${isUser ? 'var(--accent-ink)' : 'var(--ink)'}; white-space:pre-wrap; font-size:13.5px; line-height:1.5;">${chatFormatText(msg.text)}</div>
    </div>
  `;
}

function chatRenderMessages() {
  const area = document.getElementById('chat-messages');
  if (!area) return;
  area.innerHTML = chatHistory.length
    ? chatHistory.map(chatMessageHtml).join('')
    : '<div class="empty-state">No questions asked yet.</div>';
  area.scrollTop = area.scrollHeight;
}

async function chatSend() {
  const input = document.getElementById('chat-input');
  const question = input.value.trim();
  if (!question) return;

  chatHistory.push({ role: 'user', text: question });
  chatHistory.push({ role: 'assistant', text: 'Thinking...' });
  input.value = '';
  chatRenderMessages();

  const sendBtn = document.getElementById('chat-send-btn');
  sendBtn.disabled = true;
  try {
    const result = await api('/chat/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    chatHistory[chatHistory.length - 1] = { role: 'assistant', text: result.answer };
  } catch (err) {
    chatHistory[chatHistory.length - 1] = { role: 'assistant', text: `Couldn't get an answer: ${err.message}` };
  } finally {
    sendBtn.disabled = false;
    chatRenderMessages();
    document.getElementById('chat-input').focus();
  }
}

showNewCaseForm();
</script>
</body>
</html>
