/* Is the rate card charging what the book actually costs?
   Every cell of the card against the cube's expected cost for the same
   cell, before anyone quotes rather than as a footnote after. A cell at
   140% implied loss ratio is not an opinion - it has lost money on every
   case it ever priced, and will keep doing so until the number changes. */
let calibrationState = { target: 95, loading: null, minYears: 5, filter: 'all', pivotProduct: '', pivotNetwork: '', pivotRegion: '' };

function _calibrationPivotHtml(cells, product, network, region) {
  const money = v => v == null ? '-' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
  const relevant = cells.filter(c => c.product === product && c.network === network && (!region || c.region === region) && (c.gender === 'male' || c.gender === 'female'));
  const byBand = {};
  relevant.forEach(c => {
    const b = byBand[c.age_band] || (byBand[c.age_band] = { from_age: c.from_age });
    b[c.gender] = c;
  });
  const bands = Object.keys(byBand).sort((a, b) => byBand[a].from_age - byBand[b].from_age);

  let stdWeighted = 0, sugWeighted = 0, totalYears = 0;
  const rows = bands.map(band => {
    const m = byBand[band].male, f = byBand[band].female;
    const present = [m, f].filter(Boolean);
    const stdAvg = present.length ? present.reduce((s, c) => s + c.card_price, 0) / present.length : null;
    const sugAvg = present.length ? present.reduce((s, c) => s + c.suggested_price, 0) / present.length : null;
    const years = present.reduce((s, c) => s + (c.exposure_member_years || 0), 0);
    stdWeighted += (stdAvg || 0) * years;
    sugWeighted += (sugAvg || 0) * years;
    totalYears += years;
    return `<tr>
      <td>${escapeHtml(band)}</td>
      <td class="num">${money(m ? m.card_price : null)}</td>
      <td class="num">${money(f ? f.card_price : null)}</td>
      <td class="num">${money(m ? m.suggested_price : null)}</td>
      <td class="num">${money(f ? f.suggested_price : null)}</td>
      <td class="num" style="font-weight:600;">${money(stdAvg)}</td>
      <td class="num" style="font-weight:600;">${money(sugAvg)}</td>
    </tr>`;
  }).join('');

  const totalStd = totalYears ? stdWeighted / totalYears : null;
  const totalSug = totalYears ? sugWeighted / totalYears : null;

  return `
    <table>
      <tr>
        <th rowspan="2">Age Band</th>
        <th colspan="2">Standard Card Rate</th>
        <th colspan="2">Suggested Loading</th>
        <th rowspan="2" class="num">Total Standard</th>
        <th rowspan="2" class="num">Total Loading</th>
      </tr>
      <tr><th class="num">Male</th><th class="num">Female</th><th class="num">Male</th><th class="num">Female</th></tr>
      ${rows || `<tr><td colspan="7">No cells for ${escapeHtml(product)} / ${escapeHtml(network)}.</td></tr>`}
      <tr style="font-weight:700; border-top:2px solid var(--border-strong);">
        <td>Total</td><td></td><td></td><td></td><td></td>
        <td class="num">${money(totalStd)}</td>
        <td class="num">${money(totalSug)}</td>
      </tr>
    </table>
  `;
}

async function hcRailRateCardCalibration() {
  _hcRailSetActive('hc-rail-card-calibration');
  currentCase = null;
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card"><h3>Rate Card Calibration</h3><div class="hint">Comparing every card cell against the book&hellip;</div></div>';
  try {
    const p = new URLSearchParams({
      target_loss_ratio: (calibrationState.target / 100).toString(),
      min_exposure_member_years: calibrationState.minYears.toString(),
    });
    if (calibrationState.loading != null) p.set('loading_pct', (calibrationState.loading / 100).toString());
    const r = await api(`/new-business/rate-card-calibration?${p}`);
    const money = v => v == null ? '-' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const pct = v => v == null ? '-' : (v * 100).toFixed(0) + '%';

    const shown = r.cells.filter(c => {
      if (calibrationState.filter === 'underpriced') return c.verdict === 'underpriced' && !c.thin;
      if (calibrationState.filter === 'overpriced') return c.verdict === 'overpriced' && !c.thin;
      if (calibrationState.filter === 'measurable') return !c.thin;
      return true;
    });

    const rows = shown.map(c => `
      <tr${c.thin ? ' style="opacity:.55;"' : ''}>
        <td>${escapeHtml(c.product || '-')}</td>
        <td>${escapeHtml(c.network || '-')}</td>
        <td>${escapeHtml(c.age_band)}</td>
        <td>${escapeHtml(c.gender.replace(/_/g, ' '))}</td>
        <td class="num">${money(c.card_price)}</td>
        <td class="num">${money(c.expected_cost)}</td>
        <td class="num"><span class="tier-pill ${c.implied_loss_ratio == null ? '' : c.implied_loss_ratio > 1 ? 'dir-review' : c.implied_loss_ratio < 0.5 ? 'dir-improved' : 'dir-same'}">${pct(c.implied_loss_ratio)}</span></td>
        <td class="num">${money(c.suggested_price)}</td>
        <td class="num" style="font-weight:600;">${c.price_change_pct == null ? '-' : (c.price_change_pct > 0 ? '+' : '') + c.price_change_pct.toFixed(0) + '%'}</td>
        <td class="num">${c.exposure_member_years.toLocaleString(undefined, { maximumFractionDigits: 0 })}${c.thin ? ' <span class="tier-pill">thin</span>' : ''}${c.fell_back && !c.thin ? ' <span class="tier-pill dir-review">fallback</span>' : ''}</td>
      </tr>`).join('');

    const productRows = (r.by_product || []).map(p => `
      <tr>
        <td>${escapeHtml(p.product)}</td>
        <td class="num">${p.measurable_cells}</td>
        <td class="num">${pct(p.average_implied_loss_ratio)}</td>
        <td class="num">${p.underpriced_cells}</td>
        <td class="num">${pct(p.underpriced_share)}</td>
      </tr>`).join('');

    const productOptions = [...new Set(r.cells.map(c => c.product).filter(Boolean))].sort();
    if (!calibrationState.pivotProduct && productOptions.length) calibrationState.pivotProduct = productOptions[0];
    const networkOptions = [...new Set(r.cells.filter(c => c.product === calibrationState.pivotProduct).map(c => c.network).filter(Boolean))].sort();
    if (!networkOptions.includes(calibrationState.pivotNetwork)) calibrationState.pivotNetwork = networkOptions[0] || '';
    const regionOptions = [...new Set(r.cells.filter(c => c.product === calibrationState.pivotProduct && c.network === calibrationState.pivotNetwork).map(c => c.region).filter(Boolean))].sort();
    if (!regionOptions.includes(calibrationState.pivotRegion)) calibrationState.pivotRegion = regionOptions[0] || '';

    main.innerHTML = `
      <div class="card">
        <h3>Standard Card Rate vs. Suggested Loading</h3>
        <div class="row" style="align-items:flex-end; margin-bottom:12px; gap:10px; flex-wrap:wrap;">
          <div><label>Product</label><select style="width:140px;" onchange="calibrationState.pivotProduct = this.value; calibrationState.pivotNetwork = ''; hcRailRateCardCalibration();">
            ${productOptions.map(p => `<option value="${escapeHtml(p)}" ${p === calibrationState.pivotProduct ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}
          </select></div>
          <div><label>Network</label><select style="width:180px;" onchange="calibrationState.pivotNetwork = this.value; calibrationState.pivotRegion = ''; hcRailRateCardCalibration();">
            ${networkOptions.map(n => `<option value="${escapeHtml(n)}" ${n === calibrationState.pivotNetwork ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}
          </select></div>
          ${regionOptions.length > 1 ? `<div><label>Region</label><select style="width:140px;" onchange="calibrationState.pivotRegion = this.value; hcRailRateCardCalibration();">
            ${regionOptions.map(n => `<option value="${escapeHtml(n)}" ${n === calibrationState.pivotRegion ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}
          </select></div>` : ''}
        </div>
        ${_calibrationPivotHtml(r.cells, calibrationState.pivotProduct, calibrationState.pivotNetwork, calibrationState.pivotRegion)}
      </div>
      <div class="card">
        <h3>Rate Card Calibration - every cell</h3>
        <div class="hint">What the card charges for each cell, against what that cell actually costs on HealthCross's own book. <strong>Implied loss ratio</strong> is the cell's expected claims over the part of its price that is available to pay them - price &times; (1 &minus; loading), not the price itself, which would flatter every cell by the whole expense load.</div>
        <div class="hint">The suggested price sits beside the current one rather than replacing it: a rate card is a commercial document too, and a cell may be knowingly held below cost to win a segment. Cells marked <strong>thin</strong> lack the exposure to be a finding; <strong>fallback</strong> means the book had no experience for that exact cell and the cost came from a broader one.</div>
        <div class="row" style="align-items:flex-end; margin:14px 0; gap:10px; flex-wrap:wrap;">
          <div><label>Target LR %</label><input type="number" step="1" value="${calibrationState.target}" style="width:90px;"
            onchange="calibrationState.target = parseFloat(this.value) || 95; hcRailRateCardCalibration();"></div>
          <div><label>Loading %</label><input type="number" step="0.5" value="${r.loading_pct == null ? '' : (r.loading_pct * 100).toFixed(1)}" placeholder="per product" style="width:90px;"
            onchange="calibrationState.loading = parseFloat(this.value); hcRailRateCardCalibration();"></div>
          <div><label>Min member-years</label><input type="number" value="${calibrationState.minYears}" style="width:110px;"
            onchange="calibrationState.minYears = parseFloat(this.value) || 0; hcRailRateCardCalibration();"></div>
          <div><label>Show</label><select style="width:170px;" onchange="calibrationState.filter = this.value; hcRailRateCardCalibration();">
            <option value="all" ${calibrationState.filter === 'all' ? 'selected' : ''}>Every cell</option>
            <option value="measurable" ${calibrationState.filter === 'measurable' ? 'selected' : ''}>Measurable only</option>
            <option value="underpriced" ${calibrationState.filter === 'underpriced' ? 'selected' : ''}>Underpriced only</option>
            <option value="overpriced" ${calibrationState.filter === 'overpriced' ? 'selected' : ''}>Overpriced only</option>
          </select></div>
        </div>
        <div class="kpi-grid">
          <div class="kpi"><span class="label">Underpriced cells</span><div class="value">${r.underpriced_count}</div>
            <span class="label" style="margin:4px 0 0;">of ${r.measurable_cell_count} measurable</span></div>
          <div class="kpi"><span class="label">Worst implied LR</span><div class="value">${pct(r.worst_implied_loss_ratio)}</div>
            <span class="label" style="margin:4px 0 0;">on a cell with real exposure</span></div>
          <div class="kpi"><span class="label">Overpriced cells</span><div class="value">${r.overpriced_count}</div>
            <span class="label" style="margin:4px 0 0;">business left on the table</span></div>
          <div class="kpi"><span class="label">Too thin to judge</span><div class="value">${r.thin_cell_count}</div>
            <span class="label" style="margin:4px 0 0;">of ${r.cell_count} cells on the card</span></div>
        </div>
        ${productRows ? `
          <h4 style="margin-top:18px;">By product</h4>
          <table><tr><th>Product</th><th class="num">Measurable cells</th><th class="num">Average implied LR</th><th class="num">Underpriced</th><th class="num">Share</th></tr>${productRows}</table>` : ''}
        <h4 style="margin-top:18px;">Cell by cell</h4>
        <div style="overflow-x:auto;">
        <table>
          <tr><th>Product</th><th>Network</th><th>Age band</th><th>Gender</th>
            <th class="num">Card price</th><th class="num">Expected cost</th><th class="num">Implied LR</th>
            <th class="num">Suggested</th><th class="num">Change</th><th class="num">Exposure</th></tr>
          ${rows || `<tr><td colspan="10">No cells match this filter.</td></tr>`}
        </table>
        </div>
      </div>
    `;
  } catch (err) {
    main.innerHTML = `<div class="card"><h3>Rate Card Calibration</h3><div class="hint">${escapeHtml(err.message)}</div>
      <button onclick="hcRailClaimsExplorer()">Go to Portfolio Analysis</button></div>`;
  }

/* Where this book's loss ratio is actually losing money.

let tipsAssumptions = { case_management_reduction: 10, chronic_programme_reduction: 15, pharmacy_generic_reduction: 12, provider_steering_reduction: 8 };

/* The cube, as an inspectable table. `own_rate` is what a cell literally
   cost; `expected_cost` is that rate after blending toward its parent.
   Showing both side by side is the point - where they diverge is exactly
   where the data is too thin to price on directly, and an underwriter
   should be able to see that rather than take a single number on faith. */
let cubeState = { level: 2, minYears: 5 };

async function hcRailBurningCostCube() {
  _hcRailSetActive('hc-rail-burning-cost');
  currentCase = null;
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card"><h3>Burning Cost Cube</h3><div class="hint">Building the cube from the whole book...</div></div>';
  try {
    const r = await api(`/portfolio-analysis/burning-cost-cube?level=${cubeState.level}&min_member_years=${cubeState.minYears}`);
    const money = v => v == null ? '-' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const dims = r.dimensions.slice(0, cubeState.level);

    const rows = r.cells
      .slice().sort((a, b) => (b.expected_cost || 0) - (a.expected_cost || 0))
      .map(c => `
        <tr>
          ${dims.map(d => `<td>${escapeHtml(c.key[d] || '-')}</td>`).join('')}
          <td class="num">${c.member_count.toLocaleString()}</td>
          <td class="num">${c.earned_member_years.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
          <td class="num">${money(c.own_rate)}</td>
          <td class="num">${(c.credibility * 100).toFixed(0)}%</td>
          <td class="num" style="font-weight:600;">${money(c.expected_cost)}</td>
          <td class="num">${c.relativity == null ? '-' : c.relativity.toFixed(2) + '&times;'}</td>
        </tr>`).join('');

    const levelOptions = r.dimensions.map((d, i) =>
      `<option value="${i + 1}" ${cubeState.level === i + 1 ? 'selected' : ''}>${i + 1} - ${r.dimensions.slice(0, i + 1).join(' / ')}</option>`).join('');

    main.innerHTML = `
      <div class="card">
        <h3>Burning Cost Cube</h3>
        <div class="hint">What a member in each cell actually costs the book, and what they should therefore be priced at. Every cell is credibility-blended toward its parent, so a thin cell leans on the nearest broader cell that has real exposure instead of pricing off its own noise.</div>
        <div class="hint"><strong>Own rate</strong> is what the cell literally cost. <strong>Expected cost</strong> is that rate after blending. They diverge exactly where the data is thin - which is where a raw burning-cost table would mislead you.</div>
        <div class="row" style="align-items:flex-end; margin-bottom:14px; gap:10px;">
          <div><label>Depth</label><select style="width:340px;" onchange="cubeState.level = parseInt(this.value); hcRailBurningCostCube();">${levelOptions}</select></div>
          <div><label>Min member-years</label><input type="number" value="${cubeState.minYears}" style="width:110px;"
            onchange="cubeState.minYears = parseFloat(this.value) || 0; hcRailBurningCostCube();"></div>
        </div>
        <div class="kpi-grid">
          <div class="kpi"><span class="label">Book burning cost</span><div class="value">AED ${money(r.book.burning_cost)}</div>
            <span class="label" style="margin:4px 0 0;">per member-year</span></div>
          <div class="kpi"><span class="label">Exposure</span><div class="value">${money(r.book.earned_member_years)}</div>
            <span class="label" style="margin:4px 0 0;">member-years</span></div>
          <div class="kpi"><span class="label">Cells shown</span><div class="value">${r.returned_cell_count.toLocaleString()}</div>
            <span class="label" style="margin:4px 0 0;">of ${r.cells.length ? r.levels.reduce((a, l) => a + l.cell_count, 0).toLocaleString() : 0} in the cube</span></div>
          <div class="kpi"><span class="label">Full credibility at</span><div class="value">${r.full_credibility_member_years}</div>
            <span class="label" style="margin:4px 0 0;">member-years</span></div>
        </div>
        <div style="overflow-x:auto;">
        <table style="margin-top:8px;">
          <tr>${dims.map(d => `<th>${escapeHtml(d.replace(/_/g, ' '))}</th>`).join('')}
            <th class="num">Members</th><th class="num">Member-years</th><th class="num">Own rate</th>
            <th class="num">Credibility</th><th class="num">Expected cost</th><th class="num">vs book</th></tr>
          ${rows || `<tr><td colspan="${dims.length + 6}">No cells at this depth with at least ${cubeState.minYears} member-years.</td></tr>`}
        </table>
        </div>
      </div>
    `;
  } catch (err) {
    main.innerHTML = `<div class="card"><h3>Burning Cost Cube</h3><div class="hint">${escapeHtml(err.message)}</div>
      <button onclick="hcRailClaimsExplorer()">Go to Portfolio Analysis</button></div>`;
  }
}

/* The due list used to be a calendar: name, headcount, policy end date,
   days to go. An account running at 248% looked exactly like one running
   at 60%, so the only way to find the three that would hurt was to open
   all twenty. These render the risk reading the endpoint now carries -
   the same loss ratio the Loss Ratio screen shows and the same alerts
   the account dashboard shows, not a third opinion. */
function _rdlLossRatio(d) {
  if (d.loss_ratio == null) return '<span class="hint" style="margin:0;">&mdash;</span>';
  const cls = d.loss_ratio > 1.6 ? 'critical' : d.loss_ratio > 0.95 ? 'high' : 'clear';
  return `<span class="rdl-pill ${cls}">${(d.loss_ratio * 100).toFixed(1)}%</span>`;
}

function _rdlStatus(d) {
  if (d.blocked) return '<span class="rdl-pill watch">blocked</span>';
  const c = d.alert_counts || {};
  if (c.critical) return `<span class="rdl-pill critical">${c.critical} critical</span>`;
  if (c.high) return `<span class="rdl-pill high">${c.high} high</span>`;
  if (c.watch) return `<span class="rdl-pill watch">${c.watch} watch</span>`;
  if (d.severity === 'unknown') return '<span class="rdl-pill none">not on the book</span>';
  return '<span class="rdl-pill clear">clear</span>';
}

  // Loss ratio and the increase each case needs come from the server so
  // the LIST itself says which renewals need attention - the point being
  // that an underwriter should not have to open six cases to find the
  // one that is losing money.
  let summary = null;
  try {
    summary = await api('/cases/renewal-summary');
  } catch (err) {
    summary = null;
  }
  const byId = {};
  (summary ? summary.cases : []).forEach(s => { byId[s.id] = s; });

  const cases = _hcRenewalCasesSorted();
  const money = v => v == null ? '-' : `AED ${Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
  const rows = cases.map(c => {
    const s = byId[c.id] || {};
    const lr = s.net_loss_ratio;
    const inc = s.suggested_increase_pct;
    // A net ratio needs this account's own loading, and a dash gives the
    // reader no way to tell "no claims yet" from "nobody has entered the
    // fee split". The gross ratio is still real either way, so it is
    // shown instead of a blank.
    const waiting = s.loading_missing ? 'Needs fee split' : null;
    const grossLr = s.gross_loss_ratio;
    return `
    <tr style="cursor:pointer;" onclick="selectCaseAndOpenRenewalBench(${c.id})">
      <td>${escapeHtml(c.company_name)}</td>
      <td>${escapeHtml(c.broker_name)}</td>
      <td>${c.renewal_date || '-'}</td>
      <td>${c.status}</td>
      <td style="text-align:right;">${money(c.current_annual_premium)}</td>
      <td style="text-align:right;">${s.incurred_claims ? money(s.incurred_claims) : '-'}</td>
      <td style="text-align:right;">${waiting
        ? `<span class="tier-pill dir-review" title="Enter this account's TPA, commission, HealthCross and carrier fees on the case record - a renewal is not priced on an assumed loading.">${grossLr == null ? '' : (grossLr * 100).toFixed(0) + '% gross &middot; '}${waiting}</span>`
        : `<span class="tier-pill ${lr == null ? '' : lr > 1 ? 'dir-review' : lr >= 0.7 ? 'dir-same' : 'dir-improved'}">${lr == null ? '-' : (lr * 100).toFixed(0) + '%'}</span>`}</td>
      <td style="text-align:right; font-weight:600;">${inc == null ? '-' : (inc > 0 ? '+' : '') + inc.toFixed(0) + '%'}</td>
    </tr>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="card">
      <h3>Renewal Bench</h3>
      <div class="hint">Pick a renewal case below to open its Renewal Bench tab directly - the Method A/B scorecard, renewal-vs-new-business comparison, large claims insights, and census movement.</div>
      <div class="hint"><strong>Net LR</strong> is each case's own claims against its own premium after <strong>that account's own entered loading</strong> - never an assumed one, so an account whose fee split has not been entered shows its gross ratio and "Needs fee split" instead. <strong>Suggested increase</strong> is what would bring it back to break-even after ${summary ? (summary.inflation_pts * 100).toFixed(0) : 10}% trend - the opening position for the renewal conversation, not the final answer. A case with no claims ledger yet shows "-" rather than a misleading zero.</div>
      ${cases.length ? `<table>
        <tr><th>Company</th><th>Broker</th><th>Renewal date</th><th>Status</th>
          <th style="text-align:right;">Current premium</th><th style="text-align:right;">Incurred claims</th>
          <th style="text-align:right;">Net LR</th><th style="text-align:right;">Suggested increase</th></tr>
        ${rows}</table>` : '<div class="hint">No renewal cases yet.</div>'}

  `;
}

let lastComparisonResult = null;

// A lower co-insurance/deductible/copay is the better benefit (less cost to
// the member) - the opposite of every other numeric category here, where a
// higher limit is the better benefit.
const _LOWER_IS_BETTER_LABELS = new Set([
  'Outpatient Co-insurance/Deductible', 'Dental Co-insurance', 'Optical Co-insurance',
]);

function _firstComparableNumber(value) {
  if (!value) return null;
  // "NIL" is this domain's own way of writing a zero co-insurance/deductible
  // (e.g. "NIL Copay") - it carries no digits of its own, so without this it
  // would fail to parse as a number at all and the row would fall back to
  // unranked "neutral" even though 0% is a perfectly real, comparable value.
  if (/^nil\b/i.test(value.trim())) return 0;
  // Prefer the AED figure unify_currency_to_aed appended in parentheses, so
  // an originally-USD limit and an originally-AED limit compare on the same
  // scale rather than by coincidence of which currency was written first.
  const aedMatch = value.match(/AED\s*([\d,]+(?:\.\d+)?)/i);
  if (aedMatch) return parseFloat(aedMatch[1].replace(/,/g, ''));
  const numMatch = value.match(/[\d,]+(?:\.\d+)?/);
  return numMatch ? parseFloat(numMatch[0].replace(/,/g, '')) : null;
}

// Returns {planId: 'better'|'worse'|'neutral'|'missing'} for one comparison
// row - so highlighting reflects which plan's benefit actually wins, not
// merely which plans happen to have a matching row at all (two plans both
// offering optical cover shouldn't both show green if one's limit is
// clearly higher than the other's).
function rankRowCells(label, planIds, values) {
  const result = {};
  const hasValue = (id) => values[id] !== null && values[id] !== undefined && values[id] !== '';

  if (planIds.length < 2) {
    // Nothing to compare against - fall back to plain presence.
    planIds.forEach(id => { result[id] = hasValue(id) ? 'better' : 'missing'; });
    return result;
  }

  planIds.forEach(id => { result[id] = 'missing'; });
  const present = planIds.filter(hasValue);
  if (present.length === 0) return result;
  if (present.length === 1) {
    // Every other plan in the row is already 'missing' (red) - the one
    // plan that does offer this benefit is better than not having it at
    // all, consistent with "red = worse or missing" everywhere else.
    result[present[0]] = 'better';
    return result;
  }

  const numbers = {};
  const allNumeric = present.every(id => {
    const n = _firstComparableNumber(values[id]);
    numbers[id] = n;
    return n !== null;
  });
  if (!allNumeric) {
    // Can't safely rank text like "Worldwide" vs "Private room" against
    // each other - leave present values unhighlighted, missing stays red.
    present.forEach(id => { result[id] = 'neutral'; });
    return result;
  }

  const lowerIsBetter = _LOWER_IS_BETTER_LABELS.has(label);
  const vals = present.map(id => numbers[id]);
  const best = lowerIsBetter ? Math.min(...vals) : Math.max(...vals);
  const worst = lowerIsBetter ? Math.max(...vals) : Math.min(...vals);
  present.forEach(id => {
    if (best === worst) { result[id] = 'neutral'; return; } // tie - equal benefit
    if (numbers[id] === best) result[id] = 'better';
    else if (numbers[id] === worst) result[id] = 'worse';
    else result[id] = 'neutral';
  });
  return result;
}

function comparisonCellHtml(value, rank) {
  const has = value !== null && value !== undefined && value !== '';
  const cls = (rank === 'better') ? 'cmp-cell-yes' : (rank === 'neutral') ? 'cmp-cell-neutral' : 'cmp-cell-no';
  return `<td class="${cls}">${escapeHtml(has ? value : '—')}</td>`;
}

// Prints whatever's currently rendered in a tab (tables, KPI grids, SVG
// charts) as-is, rather than rebuilding each card's content from scratch
// per tab - a broker gets a PDF of exactly what they're already looking
// at. The tab must already have data loaded (this doesn't fetch anything
// itself); interactive controls (buttons/inputs/selects) are hidden since
// they aren't meaningful in a printed report. The chart colors are
// hand-copied from the page's own light-theme :root variables, since a
// popup window doesn't inherit the parent document's CSS custom
// properties on its own.
function printTabAsPdf(tabId, title) {
  const panel = document.querySelector(`.tab-panel[data-tab="${tabId}"]`);
  if (!panel || !panel.textContent.trim()) { toast("Nothing to print yet - load this tab's data first", true); return; }

  // input/select carry their CURRENT value only as a live DOM property, not
  // as a serializable HTML attribute - a plain innerHTML clone would print
  // either blank (nothing ever set the value attribute) or a stale default
  // (the user edited it after the page rendered). Replace each one with a
  // plain text span showing what's actually on screen right now, so a
  // printed IBNR%/credibility%/underwriter-adjustment field always matches
  // what the underwriter had entered - not hidden, not stale.
  const clone = panel.cloneNode(true);
  const liveFields = panel.querySelectorAll('input, select');
  const cloneFields = clone.querySelectorAll('input, select');
  liveFields.forEach((live, i) => {
    const target = cloneFields[i];
    if (!target) return;
    const value = live.tagName === 'SELECT' ? (live.options[live.selectedIndex] ? live.options[live.selectedIndex].text : '') : live.value;
    const span = document.createElement('span');
    span.className = 'print-value';
    span.textContent = value || '-';
    target.replaceWith(span);
  });

  // Reuse the LIVE app's own stylesheet rather than a hand-maintained
  // separate copy - a second copy drifts out of sync every time a tab
  // gains new classes (exactly what happened to Renewal Bench's .rb-card/
  // .rb-kpi-strip/.rb-donut/.rb-driver-block, none of which this print
  // view ever had rules for, so it rendered as unstyled plain text).
  const liveStyles = Array.from(document.querySelectorAll('head > style')).map(s => s.innerHTML).join('\n');

  const html = `<!doctype html>
<html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${liveStyles}</style>
<style>
  /* Print-only overrides layered on top of the live app's own stylesheet
     above - undo the fixed app-shell layout (sidebar/header aren't part
     of this printout) and hide anything interactive-only. */
  body { margin: 24px auto !important; max-width: 900px !important; background: #fff !important; overflow: visible !important; height: auto !important; }
  h1 { font-size: 19px; margin: 0 0 16px; }
  .card, .rb-card { page-break-inside: avoid; }
  button, #chart-tooltip { display: none !important; }
  .print-value { font-weight: 600; }
  @media print { body { margin: 8px auto !important; } }
</style></head><body>
  <h1>${escapeHtml(title)}${currentCase ? ' - ' + escapeHtml(currentCase.company_name) : ''}</h1>
  ${clone.innerHTML}
  <script>window.onload = () => window.print();<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

/* The two documents a new-business case actually produces.

   "internal" is the underwriting file: what the members should cost,
   what the card charges, what went out, and the risk factors behind the
   decision. "broker" is the offer - plan design, categories, premium -
   and deliberately carries NONE of the risk price, expected claims or
   implied loss ratio. Those are HealthCross's own view of the account
   and putting them in a broker's hands is how a negotiation is lost
   before it starts. The variant is not a styling choice; it decides
   which numbers exist in the document at all. */
// The internal document is a URL now, so opening it is one synchronous
// call inside the click. Nothing is awaited first, which is what made
// the old button fail: by the time six fetches had returned, the browser
// no longer treated the new tab as something the user had asked for and
// killed it without a word. The server renders the same figures the
// screen shows - see app/reports/underwriting_report.py.
function openUnderwritingDashboard() {
  if (!currentCase) { toast('Open a case first', true); return; }
  window.open(`${API}/cases/${currentCase.id}/underwriting-report.html`, '_blank');
}

async function printNewBusinessSummary(variant) {
  if (!currentCase) return;
  const internal = variant === 'internal';

  // window.open() must happen synchronously, in direct response to the
  // click - see printPortfolioManagementReport, which hit exactly this.
  // Opening it only after the awaited fetches below finish is no longer
  // "tied" to the click as far as the browser's pop-up blocker is
  // concerned, so it is silently killed: no error, no tab, a button that
  // appears to do nothing. Opening a blank tab up front and writing into
  // it once the data arrives keeps it inside that one trusted gesture.
  const win = window.open('', '_blank');
  if (!win) {
    toast('Your browser blocked the document pop-up - allow pop-ups for this site and try again', true);
    return;
  }
  win.document.write('<!doctype html><title>Preparing...</title><body style="font:14px system-ui;padding:40px;color:#46586e">Preparing the document...</body>');


  const get = async path => { try { return await api(path); } catch (err) { return null; } };
  const id = currentCase.id;
  const [census, byCategory, comparison, prices, opportunity, experience] = await Promise.all([
    get(`/cases/${id}/census-summary`),
    get(`/cases/${id}/premium-by-category`),
    get(`/cases/${id}/existing-vs-proposed`),
    internal ? get(`/cases/${id}/price-comparison`) : Promise.resolve(null),
    internal ? get(`/cases/${id}/opportunity-assessment`) : Promise.resolve(null),
    internal ? get(`/cases/${id}/experience-price`) : Promise.resolve(null),
  ]);

  if (!byCategory && !comparison) {
    win.close();
    toast('Nothing to print yet - compute the quote first', true);
    return;
  }

  const aed = v => v == null ? '&mdash;' : Math.round(v).toLocaleString();
  const pct = v => v == null ? '&mdash;' : (v * 100).toFixed(1) + '%';
  const esc = escapeHtml;
  const today = new Date().toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'});

  const section = (title, body) => body ? `<section><h2>${esc(title)}</h2>${body}</section>` : '';

  // --- the offer, on both documents ------------------------------------
  const categoryTable = !byCategory || !byCategory.categories.length ? null : `

  const benefitTables = !comparison || !comparison.categories.length ? null :
    comparison.categories.map(c => `

      <table>

  // census-summary returns relation_counts as an OBJECT keyed by relation
  // - {"Employee": 67, "Spouse": 15, "Child": 26} - not an array of rows,
  // and the average is avg_age rather than average_age. See
  // app/scoring/rules/census_summary.py's own return. Reading it as an
  // array called .map on undefined, and because the whole document is
  // built as one expression that throw took the entire print with it:
  // the button did nothing at all.
  const censusTable = !census || !census.relation_counts ? null : (function () {
    const rows = Object.entries(census.relation_counts);
    const total = rows.reduce(function (sum, entry) { return sum + entry[1]; }, 0);

  // --- internal only ----------------------------------------------------
  // The report has to say what it thinks before it shows its working.
  // A document that opens with a table of prices leaves the reader to
  // work out the answer; one that opens with the answer and then proves

  const decision = !internal || !experience || !experience.expected_claims ? null : (() => {

  })();

  const priceTable = !internal || !prices ? null : `

      <tr><th style="width:34%;">Price</th><th class="num">Total (AED)</th><th class="num">Per member</th><th class="num">Implied loss ratio</th></tr>

      <tr><td>Rate card quote</td><td class="num">${aed(prices.prices.card_price)}</td><td class="num">${aed(prices.per_member.card_price)}</td><td class="num">${pct(prices.implied_loss_ratio.at_card_price)}</td></tr>
      <tr class="total"><th>Issued quote</th><td class="num"><strong>${aed(prices.prices.issued_price)}</strong></td><td class="num">${aed(prices.per_member.issued_price)}</td><td class="num"><strong>${pct(prices.implied_loss_ratio.at_issued_price)}</strong></td></tr>
    </table>
    <p class="muted">Loss ratio is measured against the part of each premium that funds claims

    ${prices.discount ? `<p><strong>${prices.discount.direction === 'discount' ? 'Discount given' : prices.discount.direction === 'loaded' ? 'Issued above the card' : 'Price held'}:</strong>
      ${pct(Math.abs(prices.discount.pct))} (AED ${aed(Math.abs(prices.discount.amount_aed))}) &mdash;
      implied loss ratio ${pct(prices.discount.implied_loss_ratio_before)} &rarr; ${pct(prices.discount.implied_loss_ratio_after)}.</p>` : ''}`;

  const verdictBlock = !internal || !opportunity ? null : `
    <p class="verdict"><strong>${esc(opportunity.verdict.headline)}</strong><br>${esc(opportunity.verdict.detail)}</p>
    <table>

  const title = internal ? 'New Business Summary' : 'Quotation';

function _comparisonRowsFlat(result) {
  const rows = [];
  result.sections.forEach(section => {
    section.rows.forEach(row => rows.push({ section: section.section || 'General', label: row.label, values: row.values }));
  });
  return rows;
}

function exportComparisonPrintView() {
  const result = lastComparisonResult;
  if (!result) { toast('Run a comparison first', true); return; }
  const rows = _comparisonRowsFlat(result);
  const planNames = result.plans.map(p => `${escapeHtml(p.insurer_name)}<br>${escapeHtml(p.plan_label)}`);

  let bySection = {};
  let sectionOrder = [];
  rows.forEach(r => {
    if (!bySection[r.section]) { bySection[r.section] = []; sectionOrder.push(r.section); }
    bySection[r.section].push(r);
  });

  const html = `<!doctype html>
<html><head><meta charset="utf-8"><title>Benefits Comparison</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 20px; font-weight: 700; }
  h2 { font-size: 14px; color: #4B2E5A; text-transform: uppercase; margin-top: 24px; font-weight: 700; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 12px; text-align: left; }
  th { background: #4B2E5A; color: #fff; font-weight: 700; }
  .yes { background: #d9f2d9; }
  .no { background: #f8d7d7; color: #a33; }
  .neutral { background: transparent; }
  @media print { body { margin: 8px; } }
</style></head><body>
  <h1>Detailed Benefits Comparison</h1>
  ${sectionOrder.map(section => `
    <h2>${escapeHtml(section)}</h2>
    <table>
      <tr><th>Benefit</th>${planNames.map(n => `<th>${n}</th>`).join('')}</tr>
      ${bySection[section].map(r => {
        const planIds = result.plans.map(p => p.id);
        const ranks = rankRowCells(r.label, planIds, r.values);
        return `
        <tr>
          <td>${escapeHtml(r.label)}</td>
          ${result.plans.map(p => {
            const v = r.values[p.id];
            const has = v !== null && v !== undefined && v !== '';
            const rank = ranks[p.id];
            const cls = (rank === 'better') ? 'yes' : (rank === 'neutral') ? 'neutral' : 'no';
            return `<td class="${cls}">${escapeHtml(has ? v : '—')}</td>`;
          }).join('')}
        </tr>
      `;
      }).join('')}
    </table>
  `).join('')}
  <script>window.onload = () => window.print();<\/script>
</body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

function exportComparisonCsv() {
  const result = lastComparisonResult;
  if (!result) { toast('Run a comparison first', true); return; }
  const rows = _comparisonRowsFlat(result);
  const header = ['Section', 'Benefit', ...result.plans.map(p => `${p.insurer_name} - ${p.plan_label}`)];
  const csvEscape = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r => {
    const line = [r.section, r.label, ...result.plans.map(p => r.values[p.id] ?? '—')];
    lines.push(line.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'benefits_comparison.csv';
  a.click();
  URL.revokeObjectURL(url);
}
