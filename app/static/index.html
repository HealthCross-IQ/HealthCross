<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HealthCross Underwriting Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    /* ---- HealthCross design system -------------------------------
       Brand: Light Blue #5CD9FF (accent) and Dark Blue #1C2A48
       (authority). Every neutral below is tinted toward that navy, so
       the shell, the nav rail and every scoped screen share one ground
       rather than the three different temperatures they used to carry.
       Scoped systems (.hc-rail / .rb-scope / .lr-scope) alias these
       tokens - they must not redefine raw hex of their own. -------- */
    --bg: #f4f7fa;
    --surface: #ffffff;
    --surface-2: #eaf0f6;
    --surface-3: #dde6ef;
    --border: rgba(15,28,46,0.11);
    --border-strong: rgba(15,28,46,0.22);
    --ink: #0f1c2e;
    --ink-2: #46586e;
    --ink-muted: #8496a8;
    --grid: #dde6ef;
    --accent: #5CD9FF;
    --accent-ink: #06121c;
    --deep: #1c2a48;
    --deep-ink: #eaf6ff;
    --good: #16855c;
    --good-bg: rgba(22,133,92,0.12);
    --warning: #b07d12;
    --warning-bg: rgba(176,125,18,0.14);
    --serious: #d4783f;
    --serious-bg: rgba(212,120,63,0.14);
    --critical: #c0392b;
    --critical-bg: rgba(192,57,43,0.12);
    --series-1: #5CD9FF;
    --series-2: #eb6834;
    --series-3: #16855c;
    --series-4: #eda100;
    --series-1-wash: rgba(92,217,255,0.20);
    --shadow: 0 1px 2px rgba(15,28,46,0.05), 0 10px 30px -18px rgba(15,28,46,0.30);
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: 'Fraunces', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Fixed navy sidebar chrome using the official Dark Blue #1C2A48,
       held constant across both themes (the rail is app "chrome", not a
       themed content surface, so it does not flip with color-scheme). */
    --rail-bg: #1C2A48;
    --rail-bg-2: #1C2A48;
    --rail-text: #C9D6E4;
    --rail-text-dim: #7C8FA6;
    --rail-active-bg: #2A3D63;
    --rail-border: rgba(255,255,255,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --surface: #121c2c;
      --surface-2: #1a2537;
      --surface-3: #223044;
      --border: rgba(234,241,248,0.11);
      --border-strong: rgba(234,241,248,0.22);
      --ink: #eaf1f8;
      --ink-2: #b3c2d3;
      --ink-muted: #7b8ca0;
      --grid: #223044;
      --accent: #3FC3C9;
      --accent-ink: #06121c;
      --deep: #3FC3C9;
      --deep-ink: #06121c;
      --good: #3fcf94;
      --good-bg: rgba(63,207,148,0.14);
      --warning: #e0b24f;
      --warning-bg: rgba(224,178,79,0.16);
      --serious: #e59a6a;
      --serious-bg: rgba(229,154,106,0.16);
      --critical: #ef6f60;
      --critical-bg: rgba(239,111,96,0.16);
      --series-1: #3FC3C9;
      --series-2: #e07a4a;
      --series-3: #3fcf94;
      --series-4: #e0b24f;
      --series-1-wash: rgba(63,195,201,0.18);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 30px -18px rgba(0,0,0,0.60);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 0 22px;
    height: 54px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 11px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 5;
  }
  header::before {
    content: "";
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--deep)));
  }
  header h1 { font-family: var(--font-display); font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.015em; }
  header span { color: var(--ink-muted); font-size: 12px; letter-spacing: 0.01em; }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: calc(100vh - 50px);
  }
  @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }

  aside {
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  /* ---------- Portal rail nav (3 pillars: New Business / Renewal /
     Claims Analysis) - its own scoped palette/type, matching the
     approved Renewal Bench mockup, layered above the existing case
     list/filters rather than replacing them. ---------- */
  .hc-rail {
    /* Fixed dark-navy chrome (see --rail-* tokens at :root) - deliberately
       does NOT alias the page's light/dark surface tokens: this is the
       app's primary navigation, styled per the approved Portfolio
       Dashboard mockup, and stays constant across both themes. */
    --hcr-ink: #ffffff; --hcr-ink-2: var(--rail-text); --hcr-muted: var(--rail-text-dim);
    --hcr-border: var(--rail-border);
    --hcr-accent: var(--accent); --hcr-accent-soft: var(--rail-active-bg);
    --hcr-secondary: #E3B23C; --hcr-secondary-soft: rgba(227,178,60,0.16);
    --hcr-surface-3: rgba(255,255,255,0.07);
    font-family: var(--font-body);
    background: linear-gradient(180deg, var(--rail-bg-2), var(--rail-bg));
    color: var(--rail-text);
    margin: -16px -16px 12px;
    padding: 18px 14px 16px;
    border-radius: 0 0 14px 14px;
  }
  .hc-rail-brand { display: flex; align-items: center; gap: 9px; padding-bottom: 12px; border-bottom: 1px solid var(--hcr-border); margin-bottom: 4px; }
  .hc-rail-brand .mark {
    width: 27px; height: 27px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--hcr-accent), #1C2A48);
    display: flex; align-items: center; justify-content: center;
    color: #ffffff; font-family: 'Fraunces', serif; font-weight: 700; font-size: 13px;
  }
  .hc-rail-brand .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; color: #ffffff; line-height: 1.2; }
  .hc-rail-brand .sub { font-size: 10px; color: var(--hcr-muted); }
  .hc-rail-group { display: flex; flex-direction: column; gap: 1px; }
  .hc-rail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; color: var(--hcr-muted); margin: 6px 2px 3px; }
  .hc-rail-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    font-size: 12.5px; font-weight: 500; color: var(--hcr-ink-2);
    background: none; border: none; border-left: 2.5px solid transparent; border-radius: 8px; padding: 7px 9px; cursor: pointer;
  }
  .hc-rail-item:hover { background: var(--hcr-surface-3); color: var(--hcr-ink); }
  .hc-rail-item.active { background: var(--hcr-accent-soft); color: #ffffff; font-weight: 600; border-left-color: var(--hcr-accent); }
  .hc-rail-tag {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    padding: 1px 6px; border-radius: 5px; margin-left: auto; flex-shrink: 0;
  }
  .hc-rail-tag.nb { background: var(--hcr-secondary-soft); color: var(--hcr-secondary); }
  .hc-rail-tag.rn { background: var(--hcr-accent-soft); color: var(--hcr-accent); }
  .hc-rail-tag.cl { background: var(--hcr-surface-3); color: var(--hcr-ink-2); }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin: 4px 0 0;
    font-weight: 600;
  }
  .case-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .case-group-heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    margin: 10px 0 2px;
  }
  .case-group-heading:first-child { margin-top: 2px; }
  .case-item {
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 2px;
    transition: background 0.1s ease;
  }
  .case-item:hover { background: var(--surface-2); }
  .case-item.active { background: var(--surface-2); border-color: var(--border); }
  .case-item-main {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    padding: 7px 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
  }
  .case-item-main .company { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-item-main .meta { color: var(--ink-muted); font-size: 11.5px; }
  .case-item-delete {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1;
    padding: 4px 7px;
    cursor: pointer;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .case-item:hover .case-item-delete { opacity: 1; }
  .case-item-delete:hover { color: var(--critical); background: var(--surface); }

  .case-filters { display: flex; flex-direction: column; gap: 5px; }
  .case-filters input, .case-filters select {
    font-size: 12px;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    width: 100%;
  }
  .case-filters .case-filter-dates { display: flex; gap: 5px; }
  .case-filters .case-filter-dates input { min-width: 0; }
  .case-filters-clear {
    align-self: flex-start;
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }

  button, .btn {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    padding: 8px 14px;
    font-size: 13.5px;
    transition: background 0.1s ease, filter 0.1s ease;
  }
  button:hover { background: var(--surface-2); border-color: var(--border-strong); }
  button:focus-visible, .tab-btn:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  main { padding: 22px 26px 60px; max-width: 980px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h3 { font-family: var(--font-display); margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .card h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); font-weight: 700; }
  .card .hint { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 14px; }
  .hint-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  label { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-2); margin: 10px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }

  .dropzone {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px dashed var(--border);
    border-radius: 9px;
    margin-bottom: 8px;
    background: var(--surface);
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .dropzone.dragover { border-color: var(--accent); background: var(--series-1-wash); }
  .dropzone .kind-label { width: 100px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .dropzone .upload-req-pill { flex-shrink: 0; font-size: 10px !important; padding: 2px 7px !important; }
  .dropzone input[type=file] { flex: 1; font-size: 12px; min-width: 0; }
  .status-ok { color: var(--good); font-size: 12.5px; white-space: nowrap; }
  .status-err { color: var(--critical); font-size: 12.5px; white-space: nowrap; }
  .status-pending { color: var(--ink-muted); font-size: 12.5px; white-space: nowrap; }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .kpi {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .label { font-size: 11px; color: var(--ink-muted); display: block; margin-bottom: 2px; }
  .kpi .value { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .tier-pill {
    display: inline-flex;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .tier-Preferred { background: var(--good-bg); color: var(--good); }
  .tier-Standard { background: var(--surface-2); color: var(--ink-2); }
  .tier-Substandard { background: var(--serious-bg); color: var(--serious); }
  .tier-DeclineRefer { background: var(--critical-bg); color: var(--critical); }
  .dir-improved { background: var(--good-bg); color: var(--good); }
  .dir-reduced { background: var(--critical-bg); color: var(--critical); }
  .dir-same { background: var(--surface-2); color: var(--ink-2); }
  .dir-review { background: var(--warning-bg); color: var(--ink-2); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table th, table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table th { background: var(--surface-2); color: var(--ink-2); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.055em; font-variant-numeric: normal; border-bottom: 1.5px solid var(--border-strong); }
  table tbody tr:hover td { background: var(--surface-2); }
  td.cmp-cell-yes { background: rgba(46, 160, 67, 0.12); }
  td.cmp-cell-no { background: rgba(218, 54, 51, 0.10); color: var(--ink-muted); }
  td.cmp-cell-neutral { color: inherit; }

  /* Tabs */
  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; border-radius: 0;
    padding: 9px 14px; font-size: 13.5px; font-weight: 600;
    color: var(--ink-muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { background: none; color: var(--ink); }
  .tab-btn.active { color: var(--deep); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Charts */
  .chart-wrap { margin: 4px 0 18px; }
  .chart-svg { display: block; overflow: visible; }
  .chart-label { font-size: 11.5px; fill: var(--ink-2); text-anchor: end; dominant-baseline: middle; }
  .chart-value { font-size: 11.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; dominant-baseline: middle; }
  .chart-axis-label { font-size: 10.5px; fill: var(--ink-muted); }
  .chart-grid { stroke: var(--grid); stroke-width: 1; }
  .chart-row { cursor: default; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; }
  .chart-legend .swatch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  #chart-tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 50;
    background: var(--ink); color: var(--bg); font-size: 12px;
    padding: 5px 9px; border-radius: 6px; max-width: 260px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  .empty-state { color: var(--ink-muted); font-size: 13px; padding: 20px 0; text-align: center; }
  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    display: none;
  }

  /* Document cards - two choices, each saying what it is and who reads
     it, rather than a row of buttons named after file formats. */
  .doc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:12px}
  .doc-card{display:flex;flex-direction:column;justify-content:space-between;
    border:1px solid var(--border);border-radius:10px;padding:16px 18px;background:var(--surface)}
  .doc-card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .doc-card-title{font-size:15px;font-weight:700;margin-bottom:3px}
  .doc-card-lede{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:7px}
  .doc-card-desc{font-size:12px;color:var(--ink-muted);line-height:1.55}
  .doc-card-actions{display:flex;gap:8px;margin-top:14px}
  .doc-card-actions button{flex:1}

  /* Portfolio Analysis tab - scoped restyle only (KPI tiles, upload
     widgets, tables). Everything here is namespaced under .pa-panel so it
     doesn't touch any other tab's look. */
  .pa-panel .card {
    box-shadow: 0 1px 3px rgba(11,11,11,0.05);
    transition: box-shadow 0.15s ease;
  }
  .pa-panel .card h3 {
    padding-bottom: 11px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pa-panel .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .pa-panel .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 10px;
    padding: 13px 15px;
    box-shadow: 0 1px 2px rgba(11,11,11,0.03);
    min-width: 0;
  }
  .pa-panel .kpi .label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-muted); margin-bottom: 6px; display: block;
  }
  .pa-panel .kpi .value {
    font-size: 18px; font-weight: 700; line-height: 1.3;
    display: block; word-break: break-word; overflow-wrap: break-word;
  }

  .pa-upload-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }
  .pa-upload-slot {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .pa-upload-slot label { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .pa-upload-slot input[type=file] {
    font-size: 11.5px;
    color: var(--ink-2);
    max-width: 100%;
  }
  .pa-upload-slot input[type=date] {
    padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); font: inherit; font-size: 13px;
  }
  .pa-upload-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .pa-upload-actions button { padding: 6px 12px; font-size: 12.5px; }

  .pa-panel table { font-size: 12.5px; }
  .pa-panel table th {
    background: var(--surface-2);
    padding: 8px 10px;
  }
  .pa-panel table td { padding: 8px 10px; }
  .pa-panel table tbody tr:hover td { background: var(--surface-2); }

  /* ---------- Renewal Bench (scoped - its own palette/type, doesn't
     affect the rest of the app) ---------- */
  .rb-scope {
    /* Aliases the root design tokens - see .hc-rail above. */
    --rb-bg: var(--bg); --rb-surface: var(--surface); --rb-surface-2: var(--surface-2); --rb-surface-3: var(--surface-3);
    --rb-ink: var(--ink); --rb-ink-2: var(--ink-2); --rb-muted: var(--ink-muted);
    --rb-border: var(--border); --rb-border-strong: var(--border-strong);
    --rb-accent: var(--accent); --rb-accent-ink: var(--accent-ink);
    --rb-accent-soft: var(--series-1-wash); --rb-accent-soft-2: rgba(92,217,255,0.30);
    --rb-secondary: var(--serious); --rb-secondary-soft: var(--serious-bg);
    --rb-good: var(--good); --rb-good-soft: var(--good-bg);

  .lr-field input, .lr-field select { font: inherit; font-size: 12.5px; font-weight: 500; text-transform: none; letter-spacing: normal; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--lr-border); background: var(--lr-surface); color: var(--lr-ink); }
  .lr-btn { font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; border-radius: 8px; border: 1px solid transparent; background: var(--lr-accent); color: var(--accent-ink); padding: 9px 16px; }

  .rb-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }

  /* ---------------- renewal step bar ----------------
     Five stages, each coloured by a state derived from real facts. The
     one distinction that earns the bar its space is blocked vs not
     started: they look identical on an ordinary progress indicator and
     mean completely different things. */
  .rb-steps { display: flex; background: var(--rb-surface); border: 1px solid var(--rb-border);
              border-radius: 12px; overflow: hidden; margin-bottom: 16px; box-shadow: var(--rb-shadow); }
  .rb-step { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px;
             border-right: 1px solid var(--rb-border); position: relative; cursor: pointer;
             background: none; font: inherit; text-align: left; color: inherit; }
  .rb-step:last-child { border-right: 0; }
  .rb-step:hover { background: var(--rb-accent-soft); }
  .rb-step .n { width: 25px; height: 25px; border-radius: 50%; flex: none; display: grid; place-items: center;
                font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700;
                background: var(--rb-surface-2); color: var(--rb-muted); }
  .rb-step .x { min-width: 0; }
  .rb-step .k { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.1em;
                text-transform: uppercase; color: var(--rb-muted); }
  .rb-step .v { font-weight: 700; font-size: 13px; line-height: 1.2; }
  /* Two lines rather than one ellipsised one: "4,680,440 incurred - the
     uploaded book" cut to "4,680,440 incurred ..." loses the half that
     says where the figure came from. */
  .rb-step .d { font-size: 10.5px; color: var(--rb-muted); line-height: 1.35; margin-top: 2px;
                overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical;
                -webkit-line-clamp: 2; }
  .rb-step.done .n { background: var(--rb-good); color: #fff; }
  .rb-step.blocked .n { background: var(--rb-critical); color: #fff; }
  .rb-step.blocked { background: color-mix(in srgb, var(--rb-critical) 8%, transparent); }
  .rb-step.blocked .v { color: var(--rb-critical); }
  .rb-step.todo .v, .rb-step.todo .d { color: var(--rb-muted); }
  .rb-step.current::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
                            background: var(--rb-accent); }
  .rb-step.current.blocked::after { background: var(--rb-critical); }
  /* An author rule with display:grid outranks the browser's own
     [hidden]{display:none}, so .rb-grid-2 panels stayed on screen while
     el.hidden was perfectly true. Stated explicitly rather than relying
     on the UA sheet. */
  .rb-scope [data-rb-step][hidden] { display: none !important; }
  .rb-step.filtered { background: var(--rb-accent-soft); }
  .rb-step.filtered .v { color: var(--rb-accent); }
  /* Always on screen while a filter is on, with the count of what is
     hidden and a way back - nobody should be able to lose a panel and
     not know where it went. */
  .rb-filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
                   padding: 9px 14px; border-radius: 9px; background: var(--rb-accent-soft);
                   font-size: 12.5px; color: var(--rb-ink-2); }
  .rb-filter-bar b { color: var(--rb-ink); text-transform: capitalize; }
  .rb-filter-bar a { margin-left: auto; color: var(--rb-accent); font-weight: 600; cursor: pointer;
                     border-bottom: 1px solid currentColor; }
  .rb-blocker { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; padding: 12px 15px;
                border-radius: 10px; border-left: 3px solid var(--rb-critical);
                background: color-mix(in srgb, var(--rb-critical) 9%, transparent); font-size: 12.5px;
                line-height: 1.55; }
  .rb-blocker b { color: var(--rb-critical); }

  /* ---------------- scenarios ---------------- */
  .rb-adj { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .rb-adj-card { border: 1px solid var(--rb-border); border-radius: 10px; padding: 11px 13px; background: var(--rb-surface-2); }
  .rb-adj-card.off { opacity: 0.62; }
  .rb-adj-card .t { font-weight: 700; font-size: 12.5px; display: flex; align-items: baseline; gap: 8px; }
  .rb-adj-card .t b { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                      color: var(--rb-critical); white-space: nowrap; }
  .rb-adj-card.off .t b { color: var(--rb-muted); }
  .rb-adj-card .n { font-size: 10.5px; color: var(--rb-muted); margin-top: 4px; line-height: 1.45; }
  .rb-scenario-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .rb-scenario-table th { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.08em;
                          text-transform: uppercase; color: var(--rb-muted); font-weight: 700; text-align: left;
                          padding: 0 12px 8px 0; border-bottom: 1px solid var(--rb-border); white-space: nowrap; }
  .rb-scenario-table td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--rb-border); vertical-align: top; }
  .rb-scenario-table th:last-child, .rb-scenario-table td:last-child { padding-right: 0; }
  .rb-scenario-table th.num, .rb-scenario-table td.num { text-align: right; }
  .rb-scenario-table td.num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rb-scenario-table tr.base td { font-weight: 700; }
  /* The note under a row explains the row; it is not part of the figure,
     so it does not inherit the base row's weight. */
  .rb-scenario-table tr.base td .sub { font-weight: 400; }
  /* A lever with nothing behind it still gets a row - the reader has to
     see the lever and why it is doing nothing - but it should not read
     with the same weight as one that moved the price. */
  .rb-scenario-table tr.inert td { color: var(--rb-muted); }
  .rb-scenario-table tr.inert td.num { color: var(--rb-muted); }
  .rb-scenario-table tr.override td { background: var(--rb-accent-soft); }
  .rb-scenario-table tr:last-child td { border-bottom: 0; }
  .rb-scenario-table .sub { display: block; font-size: 10.5px; color: var(--rb-muted); margin-top: 3px; line-height: 1.4; }
  .rb-floor-tag { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.08em;
                  text-transform: uppercase; font-weight: 700; padding: 1px 5px; border-radius: 3px;
                  background: var(--rb-accent-soft); color: var(--rb-accent); margin-left: 6px; }

  /* ---------------- account dashboard ----------------
     The landing screen for one account: what it is, what its numbers
     mean, and what to do about them. Severity is carried in FORM as
     well as colour - a stripe, a tag, an ordering - so the thing that
     needs attention reads at a glance rather than only to a reader who
     already knows which number is the bad one. */
  .ad-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .ad-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 5px; }
  .ad-head .meta { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); }
  .ad-head .meta b { color: var(--ink-2); font-weight: 600; }
  .ad-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .ad-pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px;
             font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px;
             border-radius: 999px; border: 1px solid var(--border-strong); color: var(--ink-2); }
  .ad-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ad-pill.good { color: var(--good); background: var(--good-bg); border-color: transparent; }
  .ad-pill.watch { color: var(--warning); background: var(--warning-bg); border-color: transparent; }
  .ad-pill.high { color: var(--serious); background: var(--serious-bg); border-color: transparent; }
  .ad-pill.critical { color: var(--critical); background: var(--critical-bg); border-color: transparent; }

  /* Six cards, so the minimum is set to fit all six on one row of a
     normal screen rather than wrapping four and two. */
  .ad-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .ad-kpi { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 14px 11px 17px; overflow: hidden; }
  .ad-kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border-strong); }
  .ad-kpi.critical::before { background: var(--critical); }
  .ad-kpi.high::before { background: var(--serious); }
  .ad-kpi.good::before { background: var(--good); }
  .ad-kpi .k { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.09em;
               text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
  .ad-kpi .v { display: block; font-family: var(--font-mono); font-size: 22px; font-weight: 600;
               letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ad-kpi.critical .v { color: var(--critical); }
  .ad-kpi .f { display: block; font-size: 11px; color: var(--ink-muted); margin-top: 5px; line-height: 1.45; }
  .ad-kpi .f code { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); }

  .ad-grid { display: grid; gap: 14px; align-items: start; margin-bottom: 14px; }
  .ad-grid.two { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .ad-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .ad-grid.two, .ad-grid.three { grid-template-columns: 1fr; } }
  /* Each side of the dashboard is its own stack. The alerts panel is
     usually much taller than the chart, and a flat grid would leave a
     void beside it; stacking each column lets the shorter cards fill
     the space the taller one creates. */
  .ad-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .ad-col > .card { margin-bottom: 0; }

  .ad-alert { display: grid; grid-template-columns: auto 1fr; gap: 11px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .ad-alert:last-child { border-bottom: 0; padding-bottom: 0; }
  .ad-alert:first-child { padding-top: 0; }
  .ad-alert .sev { width: 4px; border-radius: 3px; background: var(--warning); }
  .ad-alert.critical .sev { background: var(--critical); }
  .ad-alert.high .sev { background: var(--serious); }
  .ad-alert .t { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ad-alert .t .tag { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.09em; text-transform: uppercase;
                      font-weight: 700; padding: 2px 6px; border-radius: 3px; background: var(--warning-bg); color: var(--warning); }
  .ad-alert.critical .t .tag { background: var(--critical-bg); color: var(--critical); }
  .ad-alert.high .t .tag { background: var(--serious-bg); color: var(--serious); }
  .ad-alert .m { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }
  .ad-alert .m b { font-family: var(--font-mono); color: var(--ink); font-weight: 600; }
  .ad-alert .rule { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); margin-top: 5px; }
  .ad-alert .act { margin-top: 7px; font-size: 12.5px; color: var(--ink); background: var(--surface-2);
                   border-left: 2px solid var(--accent); padding: 6px 10px; border-radius: 0 6px 6px 0; line-height: 1.5; }
  .ad-alert .act b { font-weight: 700; }
  .ad-quiet { color: var(--ink-muted); font-size: 12.5px; padding: 6px 0; }

  .ad-stat { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
             border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .ad-stat:last-child { border-bottom: 0; }
  .ad-stat b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  .ad-note { font-size: 11.5px; color: var(--ink-muted); line-height: 1.6; margin: 12px 0 0;
             border-left: 2px solid var(--border-strong); padding-left: 11px; }
  .ad-note b { color: var(--ink-2); }

  .ad-picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .ad-picker select, .ad-picker input { font: inherit; font-size: 13px; padding: 8px 10px;
             border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
  .ad-picker select { min-width: 280px; }
  .ad-sub { display: block; font-size: 10.5px; color: var(--ink-muted); font-family: var(--font-mono); margin-top: 2px; }
  .ad-move { font-family: var(--font-mono); font-weight: 600; }
  .ad-move.up { color: var(--critical); }
  .ad-move.down { color: var(--good); }
  .ad-flat { color: var(--ink-muted); }
  .ad-lr-critical { color: var(--critical); font-weight: 700; }
  .ad-lr-high { color: var(--serious); font-weight: 700; }
  .ad-lr-good { color: var(--good); font-weight: 600; }
  .ad-partyear { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.07em;
                 text-transform: uppercase; font-weight: 700; padding: 1px 5px; border-radius: 3px;
                 background: var(--surface-2); color: var(--ink-muted); margin-left: 6px; }

  /* ---------------- case uploads ----------------
     Roughly 400px of drop zone and accordion opened every case, on every
     visit, forever - right on day one and wrong on every day after, when
     the files are in and the work is reading the numbers. Collapsed once
     nothing required is missing; opened by itself when something is. */
  .case-uploads { margin-bottom: 16px; }
  .case-uploads > summary { list-style: none; cursor: pointer; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap; padding: 10px 15px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
  .case-uploads > summary::-webkit-details-marker { display: none; }
  .case-uploads > summary::after { content: "Open"; margin-left: auto; font-weight: 600;
    color: var(--deep); border-bottom: 1px solid var(--accent); }
  .case-uploads[open] > summary { margin-bottom: 12px; }
  .case-uploads[open] > summary::after { content: "Hide"; }
  .case-uploads .u-ok { font-family: var(--font-mono); font-size: 11.5px; color: var(--good); }
  .case-uploads .u-missing { font-family: var(--font-mono); font-size: 11.5px; color: var(--warning); }
  .case-uploads .u-chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); }

  /* A three-up row is narrow, and a table inside one must scroll on its
     own rather than push the page sideways or clip its last column. */
  .ad-scroll { overflow-x: auto; }
  .ad-scroll table { min-width: 100%; }
  .ad-assumed { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.07em; text-transform: uppercase;
                font-weight: 700; padding: 1px 5px; border-radius: 3px; background: var(--warning-bg); color: var(--warning); }

  /* ---------------- renewal due list ----------------
     Severity carried in form as well as colour - a rail down the left of
     the row - so the account that needs attention reads at a glance
     rather than only to someone already scanning the loss ratio column. */
  .rdl-sev { display: inline-block; width: 4px; height: 30px; border-radius: 2px; margin-right: 10px;
             vertical-align: middle; background: var(--border-strong); }
  .rdl-sev.critical { background: var(--critical); }
  .rdl-sev.high { background: var(--serious); }
  .rdl-sev.blocked { background: var(--warning); }
  .rdl-sev.watch { background: var(--warning); opacity: 0.6; }
  .rdl-sev.clear { background: var(--good); }
  .rdl-sev.unknown { background: var(--border-strong); }
  .rdl-name { font-weight: 600; color: var(--deep); cursor: pointer; border-bottom: 1px solid var(--accent); }
  .rdl-name:hover { color: var(--accent); }
  .rdl-alert { display: block; font-size: 11.5px; color: var(--ink-muted); margin: 3px 0 0 14px; line-height: 1.45; }
  .rdl-alert.critical { color: var(--critical); }
  .rdl-alert.high { color: var(--serious); }
  /* Two lines is enough to say what is wrong; the full text is on the
     account's own dashboard, and a nine-line blocker in a table row
     pushes every other account off the screen. */
  .rdl-alert { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  /* dir-review is amber - right for "look at this", wrong for a loss
     ratio at 207%. Severity gets its own three. */
  .rdl-pill { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px;
              font-weight: 600; white-space: nowrap; }
  .rdl-pill.critical { background: var(--critical-bg); color: var(--critical); }
  .rdl-pill.high { background: var(--serious-bg); color: var(--serious); }
  .rdl-pill.watch { background: var(--warning-bg); color: var(--warning); }
  .rdl-pill.clear { background: var(--good-bg); color: var(--good); }
  .rdl-pill.none { background: var(--surface-2); color: var(--ink-2); }
</style>
</head>
<body>

<div id="toast"></div>

<script>
const API = '';
let currentCase = null;
let _benefitsSummaryPlans = [];
const ZONE_LABELS = {
  zone_1_asia: 'Asia',
  zone_2_middle_east: 'Middle East',
  zone_3_europe_americas: 'Europe & Americas',
};
const SERIES = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)'];

function toast(message, isError) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.borderColor = isError ? 'var(--critical)' : 'var(--border)';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

async function api(path, options) {
  const res = await fetch(API + path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || (`Request failed (${res.status})`));
  }
  if (res.status === 204) return null;
  return res.json();
}

function escapeHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Comma-grouped number entry for premium fields - plain <input type="number">
// can't display commas at all (browsers reject them outright), so these use
// type="text" instead: formatted on blur/load for readability, and parsed
// back to a plain numeric string (via _parseThousands) before being read.
function _formatThousands(value) {
  const digits = (value ?? '').toString().replace(/,/g, '').trim();
  if (!digits || isNaN(Number(digits))) return digits;
  const [whole, frac] = digits.split('.');
  const withCommas = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return frac !== undefined ? `${withCommas}.${frac}` : withCommas;
}

function _parseThousands(value) {
  return (value ?? '').toString().replace(/,/g, '').trim();
}

// Mirrors the backend's own category normalization (app/api/
// routes_new_business_rating.py's _normalize_category) - a Benefits tab
// category letter typed as "a" or "A " must still match a census-derived
// category of "A", or its Product/Network pick silently fails to pre-fill.
function _normalizeCategory(value) {
  return (value ?? '').toString().trim().toUpperCase() || null;
}

// Every category letter is picked from this fixed A-Z list rather than
// typed freehand - free text is exactly how "A", "A " and "a" ended up as
// three different categories on a real case. `current` is included as an
// extra option even if outside A-Z so an unusual pre-existing value is
// never silently discarded, just surfaced for the underwriter to fix.
const CATEGORY_LETTERS = Array.from({length: 26}, (_, i) => String.fromCharCode(65 + i));
function _categoryOptionsHtml(current, blankLabel) {
  const value = _normalizeCategory(current) || '';
  const letters = (value && !CATEGORY_LETTERS.includes(value)) ? [value, ...CATEGORY_LETTERS] : CATEGORY_LETTERS;
  const blank = `<option value="">${escapeHtml(blankLabel || '-')}</option>`;
  return blank + letters.map(l => `<option value="${escapeHtml(l)}" ${l === value ? 'selected' : ''}>${escapeHtml(l)}</option>`).join('');
}

/* ---------------- chart helpers (hand-rolled SVG, no external library) ---------------- */

function bindChartTooltips(container) {
  const tooltip = document.getElementById('chart-tooltip');
  container.querySelectorAll('[data-tooltip]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      tooltip.textContent = el.getAttribute('data-tooltip');
      tooltip.style.display = 'block';
    });
    el.addEventListener('mousemove', (e) => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

// Horizontal bar chart - a single-hue magnitude ranking (e.g. age bands, burning cost by category).
function svgBarChart(items, opts) {
  opts = opts || {};
  const color = opts.color || 'var(--series-1)';
  const formatValue = opts.formatValue || (v => v.toLocaleString());
  const barH = 20, gapY = 12, labelW = opts.labelWidth || 150, plotW = opts.plotWidth || 380, valueW = 90;
  const maxVal = Math.max(...items.map(i => i.value), 1);
  const totalW = labelW + plotW + valueW;
  const totalH = items.length * (barH + gapY);
  const rows = items.map((item, i) => {
    const w = Math.max(2, (item.value / maxVal) * plotW);
    const y = i * (barH + gapY);
    const valueText = formatValue(item.value);
    return `
      <g class="chart-row" data-tooltip="${escapeHtml(item.label)}: ${escapeHtml(valueText)}">
        <text x="${labelW - 10}" y="${y + barH / 2}" class="chart-label">${escapeHtml(item.label)}</text>
        <rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${color}"/>
        <text x="${labelW + w + 10}" y="${y + barH / 2}" class="chart-value">${escapeHtml(valueText)}</text>
      </g>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${totalW} ${totalH}" class="chart-svg" style="width:100%; height:${totalH}px;">${rows}</svg>`;
}

// Single stacked proportion bar - identity/part-of-whole (e.g. nationality zone mix).
function svgProportionBar(items, opts) {
  opts = opts || {};
  const totalW = 600, barH = 26, segGap = 2;
  let x = 0;
  const segments = items.map((item, i) => {
    const w = Math.max(0, item.pct * totalW - segGap);
    const seg = `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${barH}" rx="4" fill="${SERIES[i % SERIES.length]}" class="chart-row" data-tooltip="${escapeHtml(item.label)}: ${item.count} (${(item.pct * 100).toFixed(1)}%)"/>`;
    x += w + segGap;
    return seg;
  }).join('');
  const legend = items.map((item, i) => `
    <span class="swatch"><span class="dot" style="background:${SERIES[i % SERIES.length]};"></span>${escapeHtml(item.label)} &middot; ${(item.pct * 100).toFixed(1)}%</span>
  `).join('');
  return `
    <svg viewBox="0 0 ${totalW} ${barH}" class="chart-svg" style="width:100%; height:${barH}px;">${segments}</svg>
    <div class="chart-legend">${legend}</div>
  `;
}

// Line chart with hover dots - magnitude over time (e.g. monthly claims trend).
function svgLineChart(points, opts) {
  opts = opts || {};
  const formatValue = opts.formatValue || (v => v.toLocaleString());
  const w = 720, h = 200, padL = 64, padB = 26, padT = 14, padR = 16;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const maxVal = Math.max(...points.map(p => p.value), 1);
  const stepX = points.length > 1 ? plotW / (points.length - 1) : 0;
  const coords = points.map((p, i) => ({
    x: padL + i * stepX,
    y: padT + plotH - (p.value / maxVal) * plotH,
    label: p.label,
    value: p.value,
  }));
  const path = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
  const areaPath = `${path} L ${coords[coords.length - 1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`;
  const gridlines = [0, 0.5, 1].map(f => {
    const y = padT + plotH * (1 - f);
    return `
      <line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" class="chart-grid"/>
      <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" class="chart-axis-label" text-anchor="end">${Math.round(maxVal * f).toLocaleString()}</text>
    `;
  }).join('');
  const showEvery = Math.max(1, Math.ceil(coords.length / 7));
  const xLabels = coords.map((c, i) => (i % showEvery === 0 || i === coords.length - 1)
    ? `<text x="${c.x.toFixed(1)}" y="${h - 6}" class="chart-axis-label" text-anchor="middle">${escapeHtml(c.label)}</text>`
    : '').join('');
  const dots = coords.map(c => `
    <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" class="chart-row" data-tooltip="${escapeHtml(c.label)}: ${escapeHtml(formatValue(c.value))}"/>
  `).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg" style="width:100%; height:${h}px;">
      ${gridlines}
      <path d="${areaPath}" fill="var(--series-1)" opacity="0.1"/>
      <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

/* Stacked columns over time - a monthly total that is made of two parts
   worth telling apart.

   Claims per month are the case it exists for. A single-colour column
   says an account's recent months got worse; split paid from
   outstanding and the same columns often say the TPA has not settled
   them yet, which is a completely different thing to tell a client. The
   segments are ordered settled-first from the baseline so the growing
   unsettled part reads as the part sitting on top.

   `reference` draws a dashed horizontal line (monthly earned premium,
   in practice), so a column above the line loses money that month
   without the reader doing any arithmetic. */
function svgStackedColumnChart(items, opts) {
  opts = opts || {};
  const series = opts.series || [
    { key: 'paid', label: 'Paid', color: 'var(--series-1)' },
    { key: 'outstanding', label: 'Outstanding', color: 'var(--series-2)' },
  ];
  const formatValue = opts.formatValue || (v => Math.round(v).toLocaleString());
  const w = 720, h = 210, padL = 64, padB = 26, padT = 16, padR = 12;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const totals = items.map(i => series.reduce((sum, s) => sum + (i[s.key] || 0), 0));
  const maxVal = Math.max(...totals, opts.reference || 0, 1);
  const y = v => padT + plotH - (v / maxVal) * plotH;
  const slot = items.length ? plotW / items.length : plotW;
  const barW = Math.max(6, Math.min(46, slot * 0.55));

  const gridlines = [0, 0.5, 1].map(f => `
    <line x1="${padL}" y1="${y(maxVal * f).toFixed(1)}" x2="${w - padR}" y2="${y(maxVal * f).toFixed(1)}" class="chart-grid"/>
    <text x="${padL - 8}" y="${(y(maxVal * f) + 4).toFixed(1)}" class="chart-axis-label" text-anchor="end">${Math.round(maxVal * f).toLocaleString()}</text>
  `).join('');

  const reference = opts.reference
    ? `<line x1="${padL}" y1="${y(opts.reference).toFixed(1)}" x2="${w - padR}" y2="${y(opts.reference).toFixed(1)}"
             stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/>`
    : '';

  const columns = items.map((item, i) => {
    const cx = padL + slot * i + slot / 2;
    let base = 0;
    const segments = series.map(s => {
      const value = item[s.key] || 0;
      if (value <= 0) { return ''; }
      const top = y(base + value), bottom = y(base);
      base += value;
      return `<rect x="${(cx - barW / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}"
                    height="${Math.max(1, bottom - top).toFixed(1)}" fill="${s.color}" class="chart-row"
                    data-tooltip="${escapeHtml(item.label)} &middot; ${escapeHtml(s.label)}: ${escapeHtml(formatValue(value))}"/>`;
    }).join('');
    const total = totals[i];
    const cap = total > 0
      ? `<text x="${cx.toFixed(1)}" y="${(y(total) - 6).toFixed(1)}" class="chart-axis-label" text-anchor="middle">${escapeHtml(formatValue(total))}</text>`
      : '';
    return `${segments}${cap}
      <text x="${cx.toFixed(1)}" y="${h - 6}" class="chart-axis-label" text-anchor="middle">${escapeHtml(item.label)}</text>`;
  }).join('');

  const legend = series.map(s => `
    <span class="swatch"><span class="dot" style="background:${s.color};"></span>${escapeHtml(s.label)}</span>
  `).join('') + (opts.referenceLabel
    ? `<span class="swatch"><span class="dot" style="background:var(--ink-muted);opacity:.6;"></span>${escapeHtml(opts.referenceLabel)}</span>`
    : '');

  return `
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg" style="width:100%; height:${h}px;">
      ${gridlines}${reference}${columns}
    </svg>
    <div class="chart-legend">${legend}</div>
  `;
}

// Horizontal meter - a single score against fixed tier thresholds.
/* The price, shown as the build-up that produced it.
   A scorecard's headline used to be a 0-100 composite and a "suggested
   loading" that was just that score minus 50 - a number with no units,
   which no underwriter can defend to a broker. Where the book has enough
   experience to price from, the headline is now the price itself and
   every step that got there, so a broker arguing with one line (the
   trend, the industry factor) can be answered on that line instead of
   the whole figure being taken on trust. */
function priceBuildUpHtml(sc) {
  const ec = sc.details && sc.details.expected_cost;
  if (!ec || ec.gross_premium == null) return '';
  const money = v => v == null ? '-' : `AED ${Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;

  const rows = ec.build_up.map((s, i) => `
    <tr>
      <td>${escapeHtml(s.label)}${s.note ? `<div class="hint" style="margin:2px 0 0;">${escapeHtml(s.note)}</div>` : ''}</td>
      <td class="num">${s.factor != null ? '&times;' + s.factor.toFixed(3) : ''}</td>
      <td class="num" style="font-weight:${i === ec.build_up.length - 1 ? 700 : 400};">${money(s.amount)}</td>
    </tr>`).join('');

  const rel = ec.book_relativity;
  const relLabel = rel == null ? '-'
    : rel >= 1 ? `${((rel - 1) * 100).toFixed(0)}% above book`
    : `${((1 - rel) * 100).toFixed(0)}% below book`;

  return `
    <div class="card">
      <h3>Price build-up</h3>
      <div class="hint">What this census is expected to cost according to HealthCross's own book, member by member, and the premium that funds it. Every step is a number you can argue with separately.</div>
      <div class="kpi-grid" style="margin-top:14px;">
        <div class="kpi"><span class="label">Gross premium</span><div class="value">${money(ec.gross_premium)}</div>
          <span class="label" style="margin:4px 0 0;">${ec.member_count} members</span></div>
        <div class="kpi"><span class="label">Per member</span><div class="value">${money(ec.premium_per_member)}</div>
          <span class="label" style="margin:4px 0 0;">annual</span></div>
        <div class="kpi"><span class="label">Expected claims</span><div class="value">${money(ec.expected_claims)}</div>
          <span class="label" style="margin:4px 0 0;">before trend and loading</span></div>
        <div class="kpi"><span class="label">Versus the book</span><div class="value">${relLabel}</div>
          <span class="label" style="margin:4px 0 0;">this mix vs a book-average member</span></div>
      </div>
      <table style="margin-top:14px;">
        <tr><th>Step</th><th class="num">Factor</th><th class="num">Running total</th></tr>
        ${rows}
      </table>
      <div class="hint" style="margin-top:12px;">
        ${(ec.weighted_credibility * 100).toFixed(0)}% of this price rests on the book's own experience for these members' own segments${ec.fallback_member_count ? `; ${ec.fallback_member_count} of ${ec.member_count} members fell back to a broader cell` : ' with no fallbacks needed'}.
        ${sc.details.loading_basis === 'expected_cost' ? '' : ' The suggested loading below still comes from the composite score - the book has no experience to price these members against.'}
      </div>
    </div>
  `;
}

function svgScoreMeter(score, tier) {
  const w = 600, h = 26;
  const tierColor = { Preferred: 'var(--good)', Standard: 'var(--accent)', Substandard: 'var(--serious)', 'Decline/Refer': 'var(--critical)' }[tier] || 'var(--accent)';
  const pct = Math.max(0, Math.min(100, score)) / 100;
  const markers = [40, 60, 80].map(t => `<line x1="${(t / 100 * w).toFixed(1)}" y1="0" x2="${(t / 100 * w).toFixed(1)}" y2="${h}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg" style="width:100%; height:${h}px;">
      <rect x="0" y="0" width="${w}" height="${h}" rx="6" fill="var(--surface-2)"/>
      <rect x="0" y="0" width="${Math.max(4, pct * w).toFixed(1)}" height="${h}" rx="6" fill="${tierColor}"/>
      ${markers}
    </svg>
  `;
}

function _caseItemHtml(c) {

    </div>

async function deleteCase(id, companyName) {
  if (!confirm(`Delete case "${companyName}"? This removes all its census, benefits, claims, and scorecard data - this cannot be undone.`)) return;
  try {
    await api(`/cases/${id}`, { method: 'DELETE' });
    if (currentCase && currentCase.id === id) {
      currentCase = null;
      document.getElementById('main').innerHTML = '';
    }
    await loadCases();
    toast('Case deleted');
  } catch (err) {
    toast(err.message, true);
  }
}

let allCases = [];

async function loadCases() {
  allCases = await api('/cases');
  renderCaseList();
}

function clearCaseFilters() {
  document.getElementById('caseFilterSearch').value = '';
  document.getElementById('caseFilterStatus').value = '';
  document.getElementById('caseFilterBusinessType').value = '';
  document.getElementById('caseFilterRenewalFrom').value = '';
  document.getElementById('caseFilterRenewalTo').value = '';
  renderCaseList();
}

function renderCaseList() {
  const list = document.getElementById('caseList');
  if (allCases.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:8px 0;">No cases yet</div>';
    return;
  }

  const search = (document.getElementById('caseFilterSearch').value || '').trim().toLowerCase();
  const status = document.getElementById('caseFilterStatus').value;
  const businessType = document.getElementById('caseFilterBusinessType').value;
  const renewalFrom = document.getElementById('caseFilterRenewalFrom').value;
  const renewalTo = document.getElementById('caseFilterRenewalTo').value;

  const cases = allCases.filter(c => {
    if (search && !`${c.company_name} ${c.broker_name}`.toLowerCase().includes(search)) return false;
    if (status && c.status !== status) return false;
    if (businessType && (c.business_type || 'new') !== businessType) return false;
    if (renewalFrom && (!c.renewal_date || c.renewal_date < renewalFrom)) return false;
    if (renewalTo && (!c.renewal_date || c.renewal_date > renewalTo)) return false;
    return true;
  });

  if (cases.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:8px 0;">No cases match these filters</div>';
    return;
  }

  const renewals = cases.filter(c => c.business_type === 'existing');
  const newBusiness = cases.filter(c => c.business_type !== 'existing');
  list.innerHTML = `
    ${newBusiness.length ? `<h3 class="case-group-heading">New Business</h3>${newBusiness.map(_caseItemHtml).join('')}` : ''}
    ${renewals.length ? `<h3 class="case-group-heading">Renewal</h3>${renewals.map(_caseItemHtml).join('')}` : ''}
  `;
}

/* ---------------- account dashboard ----------------

   One account, on one screen: what it is, what its numbers mean, and
   what to do about them before pricing.

   Every figure here comes from /portfolio-analysis/account-overview,
   which assembles them from the loss ratio row, the encounter split and
   the claimant ranking the other screens already render. Nothing on
   this screen is computed in the browser - a dashboard that does its
   own arithmetic is a second implementation of every number on it, and
   the reader has no way to know which screen to believe.

   The one thing worth reading twice is the loss ratio card. It divides
   by EARNED premium, and the card says so on its face. Against annual
   premium a 130-day account reads comfortable while it is running at
   two and a half times its premium. */
let _adState = { masterClient: null, requestToken: 0 };

const _adMoney = v => v == null ? '&mdash;' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
const _adPct = (v, dp) => v == null ? '&mdash;' : (v * 100).toFixed(dp == null ? 1 : dp) + '%';

function _adSeverityClass(alerts) {
  if (!alerts || !alerts.length) return 'good';
  return alerts[0].severity;
}

async function hcRailAccountDashboard() {
  _hcRailSetActive('hc-rail-account-dashboard');
  currentCase = null;
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card"><h3>Account Dashboard</h3><div class="hint">Loading accounts&hellip;</div></div>';
  try {
    const accounts = await api('/portfolio-analysis/master-clients');
    if (!accounts.length) {
      main.innerHTML = '<div class="card"><h3>Account Dashboard</h3><div class="hint">No portfolio members uploaded yet. Upload the membership export in Claims Explorer first.</div></div>';
      return;
    }
    const options = accounts.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
    main.innerHTML = `
      <div class="ad-picker">
        <label style="font-size:12.5px;color:var(--ink-muted);">Account</label>
        <select id="adAccount" onchange="openAccountDashboard(this.value)">
          <option value="">Choose an account&hellip;</option>
          ${options}
        </select>
        <span class="hint" style="margin:0;">${accounts.length} accounts on the book</span>
      </div>
      <div id="adBody"></div>`;
    if (_adState.masterClient && accounts.includes(_adState.masterClient)) {
      document.getElementById('adAccount').value = _adState.masterClient;
      openAccountDashboard(_adState.masterClient);
    }
  } catch (e) {
    main.innerHTML = `<div class="card"><h3>Account Dashboard</h3><div class="status-err">${escapeHtml(e.message)}</div></div>`;
  }
}

/* Opened from the rail's own picker and from any board that lists
   accounts, so the entry point takes the name and does the rest. */
async function openAccountDashboard(masterClient) {
  if (!masterClient) { return; }
  _adState.masterClient = masterClient;
  // Two clicks in quick succession would otherwise race, and the slower
  // response would win - painting one account's figures under another
  // account's name.
  const token = ++_adState.requestToken;
  let body = document.getElementById('adBody');
  if (!body) {
    await hcRailAccountDashboard();
    body = document.getElementById('adBody');
    if (!body) return;
  }
  body.innerHTML = '<div class="card"><div class="hint">Reading the book&hellip;</div></div>';
  try {
    const data = await api(`/portfolio-analysis/account-overview/${encodeURIComponent(masterClient)}`);
    if (token !== _adState.requestToken) return;
    body.innerHTML = renderAccountDashboard(data);
    bindChartTooltips(body);
  } catch (e) {
    if (token !== _adState.requestToken) return;
    body.innerHTML = `<div class="card"><div class="status-err">${escapeHtml(e.message)}</div></div>`;
  }
}

function _adKpis(data) {
  const k = data.kpis;
  if (!k) {
    return '<div class="card"><div class="hint">No premium or claims on the book for this account&rsquo;s current policy period.</div></div>';
  }
  const lrSeverity = k.gross_loss_ratio == null ? ''
    : k.gross_loss_ratio > 1.6 ? 'critical'
    : k.gross_loss_ratio > 0.95 ? 'high' : 'good';
  return `
    <div class="ad-kpis">
      <div class="ad-kpi">
        <span class="k">Lives</span>
        <span class="v">${_adMoney(k.member_count)}</span>
        <span class="f">${data.policy.days_elapsed == null ? '' : `${data.policy.days_elapsed} of 365 days run`}</span>
      </div>
      <div class="ad-kpi">
        <span class="k">Annual premium</span>
        <span class="v">${_adMoney(k.gross_premium)}</span>
        <span class="f">Earned to date <code>${_adMoney(k.earned_premium)}</code></span>
      </div>
      <div class="ad-kpi">
        <span class="k">Incurred claims</span>
        <span class="v">${_adMoney(k.incurred_claims)}</span>
        <span class="f">Paid ${_adMoney(k.paid)} &middot; O/S ${_adMoney(k.outstanding)} &middot; IBNR ${_adMoney(k.ibnr)}</span>
      </div>
      <div class="ad-kpi ${lrSeverity}">
        <span class="k">Loss ratio (earned)</span>
        <span class="v">${_adPct(k.gross_loss_ratio)}</span>
        <span class="f"><code>${_adMoney(k.incurred_claims)} &divide; ${_adMoney(k.earned_premium)}</code>
          &middot; net of ${_adPct(k.loading_pct, 1)} loading <code>${_adPct(k.net_loss_ratio)}</code>
          ${k.loading_is_default ? ' <span class="ad-assumed" title="Nobody supplied this account&rsquo;s loading - the house average is standing in, so the net loss ratio beside it is partly assumed. Upload the Client Master sheet, or enter the fee split on the case.">assumed</span>' : ''}</span>
      </div>
      ${_adOutstandingKpi(data)}
      ${_adConcentrationKpi(data)}
    </div>`;
}

/* The two figures the alerts actually fire on. They were readable only
   inside the alert that explained them, which is backwards: the number
   should be on the strip and the alert should be the reading of it. */
function _adOutstandingKpi(data) {
  const k = data.kpis || {};
  const share = k.incurred_claims ? k.outstanding / k.incurred_claims : null;
  const book = (data.book_position || {}).book_median_outstanding_share;
  const severity = share == null ? '' : share > 0.35 ? 'high' : 'good';
  return `
    <div class="ad-kpi ${severity}">
      <span class="k">Outstanding share</span>
      <span class="v">${_adPct(share)}</span>
      <span class="f">${_adMoney(k.outstanding)} not yet settled${book != null ? ` &middot; book median <code>${_adPct(book)}</code>` : ''}</span>
    </div>`;
}

function _adConcentrationKpi(data) {
  const top = (data.top_claimants || [])[0];
  const share = data.top_claimant_share;
  const severity = share == null ? '' : share > 0.35 ? 'critical' : share > 0.20 ? 'high' : 'good';
  return `
    <div class="ad-kpi ${severity}">
      <span class="k">Top claimant</span>
      <span class="v">${_adPct(share)}</span>
      <span class="f">${top ? `${escapeHtml(top.beneficiary_id || '-')} &middot; ${_adMoney(top.incurred)}` : 'No claims on this term'}</span>
    </div>`;
}

function _adAlerts(alerts) {
  if (!alerts.length) {
    return '<div class="ad-quiet">Nothing above threshold. The account is priced and running within tolerance.</div>';
  }
  return alerts.map(a => `
    <div class="ad-alert ${escapeHtml(a.severity)}">
      <div class="sev"></div>
      <div>
        <div class="t">${escapeHtml(a.title)} <span class="tag">${escapeHtml(a.severity)}</span></div>
        <div class="m">${escapeHtml(a.message)}</div>
        <div class="rule">rule: ${escapeHtml(a.rule)}</div>
        <div class="act"><b>Action</b> &mdash; ${escapeHtml(a.action)}</div>
      </div>
    </div>`).join('');
}

function _adClaimants(data) {
  if (!data.top_claimants.length) {
    return '<div class="ad-quiet">No claims on this account&rsquo;s current term.</div>';
  }
  const incurred = (data.kpis || {}).incurred_claims;
  const rows = data.top_claimants.map(c => `
    <tr>
      <td>${escapeHtml(c.beneficiary_id || '-')}</td>
      <td>${escapeHtml([c.age, c.gender].filter(v => v != null && v !== '').join(' '))}</td>
      <td>${escapeHtml(c.top_diagnosis || '-')}</td>
      <td class="num">${_adMoney(c.incurred)}</td>

    </tr>`).join('');
  return `
    <div class="ad-scroll"><table>
      <thead><tr><th>Member</th><th>Age/sex</th><th>Top diagnosis</th><th class="num">Incurred</th><th class="num">Share</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="ad-note">Share is against the account&rsquo;s incurred, so it reconciles with the figure above.
      Incurred includes IBNR, which has no claimant, so each share is marginally conservative.</p>`;
}

function _adBookPosition(position) {
  if (!position) { return '<div class="ad-quiet">No book to compare against.</div>'; }
  const worse = position.loss_ratio != null && position.book_median_loss_ratio != null
    && position.loss_ratio > position.book_median_loss_ratio;
  return `
    <div class="ad-stat"><span>Loss ratio percentile</span><b>${position.loss_ratio_percentile == null ? '&mdash;' : position.loss_ratio_percentile + 'th'}</b></div>
    <div class="ad-stat"><span>Book median loss ratio</span><b>${_adPct(position.book_median_loss_ratio)}</b></div>
    <div class="ad-stat"><span>Outstanding share</span><b>${_adPct(position.outstanding_share)} vs ${_adPct(position.book_median_outstanding_share)}</b></div>
    <div class="ad-stat"><span>Premium per life</span><b>${_adMoney(position.premium_per_life)}</b></div>
    <div class="ad-stat"><span>Book median per life</span><b>${_adMoney(position.book_median_premium_per_life)}</b></div>
    <div class="ad-stat"><span>Claims per life</span><b>${_adMoney(position.claims_per_life)}</b></div>
    <p class="ad-note">Measured against all ${position.accounts} accounts on the book, this one included &mdash;
      ${worse ? 'it sits above the median.' : 'it sits at or below the median.'}</p>`;
}

/* An account that has renewed has a year per policy period on the book,
   and the strip above shows only the one running. A group that went from
   68% to 241% looked exactly like one that has always run at 241% - the
   first is a year that went wrong and may be one event, the second is an
   account that is structurally underpriced. */
function _adPeriodsCard(data) {
  const periods = data.policy_periods || [];
  // One period on the book, but claims dated before it: the earlier year
  // is in the claims file and not in the membership export. Said out
  // loud, because "where is last year?" answered with a missing card is
  // the worst way to report a fact about an upload.
  if (periods.length < 2) {
    const earlier = data.earlier_claims;
    if (!earlier) return '';
    const whose = earlier.member_count
      ? ` across ${earlier.member_count} member${earlier.member_count === 1 ? '' : 's'}` : '';
    return `
      <div class="card">
        <h3>Only one policy year on the book</h3>
        <div class="hint">This account has <b>${_adMoney(earlier.incurred)}</b> of claims across
          ${earlier.claim_count} lines${whose}, dated <b>${escapeHtml(earlier.from)}</b> to
          <b>${escapeHtml(earlier.to)}</b> &mdash; before the policy period above started. The
          claims file reaches back into an earlier year; the membership export does not, so there
          is no premium to measure those claims against and no loss ratio can be struck for them.
          Re-upload the Membership export including the prior policy year and the year-by-year
          comparison appears here.</div>
      </div>`;
  }
  const rows = periods.map(p => {
    const severity = p.loss_ratio == null ? '' : p.loss_ratio > 1.6 ? 'critical'
      : p.loss_ratio > 0.95 ? 'high' : 'good';
    const move = p.change_pts == null ? '<span class="ad-flat">&mdash;</span>'
      : `<span class="ad-move ${p.change_pts > 0 ? 'up' : p.change_pts < 0 ? 'down' : ''}">${
          p.change_pts > 0 ? '&uarr; +' : p.change_pts < 0 ? '&darr; ' : ''}${p.change_pts.toFixed(1)} pts</span>`;
    return `
      <tr>
        <td>${escapeHtml(p.policy_start_date || '-')}
          ${p.part_year ? '<span class="ad-partyear">running</span>' : ''}
          <span class="ad-sub">${p.member_count == null ? '' : p.member_count + ' lives'}${
            p.expired ? ' &middot; full term' : (p.days ? ' &middot; ' + p.days + ' of 365 days' : '')}</span></td>
        <td class="num">${_adMoney(p.incurred_claims)}</td>
        <td class="num">${_adMoney(p.earned_premium)}</td>
        <td class="num ${severity ? 'ad-lr-' + severity : ''}">${_adPct(p.loss_ratio)}</td>
        <td class="num">${move}</td>
      </tr>`;
  }).join('');
  return `
    <div class="card">
      <h3>Loss ratio by policy year</h3>
      <div class="hint">${periods.length} years on the book. The move is in points of loss ratio,
        not a percentage of a percentage &mdash; &ldquo;up 173 points&rdquo; is a fact about the
        account, &ldquo;up 254%&rdquo; is a fact about the arithmetic.</div>
      <div class="ad-scroll"><table>
        <thead><tr><th>Policy year</th><th class="num">Incurred</th><th class="num">Earned</th>
          <th class="num">Loss ratio</th><th class="num">Move</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${periods.some(p => p.part_year) ? `<p class="ad-note">A year still running has months of
        claims against months of premium &mdash; a real ratio, but one admission moves it in a way
        it cannot move a closed year.</p>` : ''}
    </div>`;
}

/* Claims per member per month over the EXPOSED RISK POPULATION - each
   member counted for the fraction of the month they were actually
   covered. Dividing by the closing headcount flatters the early months
   and understates the later ones, which is exactly the shape that makes
   a deteriorating account look steady. */
function _adBurningCostCard(data) {
  const rows = (data.monthly_burning_cost || []).filter(r => r.burning_cost != null);
  if (rows.length < 2) return '';
  const points = rows.map(r => ({ label: r.month.slice(2).replace('-', '/'), value: r.burning_cost }));
  const total = rows.reduce((s, r) => s + r.incurred, 0);
  const erpMonths = rows.reduce((s, r) => s + r.erp, 0);
  const average = erpMonths ? total / erpMonths : null;
  return `
    <div class="card">
      <h3>Burning cost per member per month</h3>
      <div class="hint">Each month&rsquo;s claims over that month&rsquo;s exposed risk population &mdash;
        every member counted for the fraction of the month they were actually covered, not a flat
        headcount. Average <code>${_adMoney(average)}</code> per member per month across
        ${erpMonths.toFixed(0)} member-months.</div>
      ${svgLineChart(points, { formatValue: v => Math.round(v).toLocaleString() })}
      <div class="ad-scroll"><table>
        <thead><tr><th>Month</th><th class="num">ERP</th><th class="num">Incurred</th>
          <th class="num">Per member</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr><td>${escapeHtml(r.month)}</td>
            <td class="num">${r.erp.toFixed(1)}</td>
            <td class="num">${_adMoney(r.incurred)}</td>
            <td class="num">${_adMoney(r.burning_cost)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

        ${data.alerts.length ? `<span class="ad-pill ${escapeHtml(severity)}">${data.alerts.length} alert${data.alerts.length === 1 ? '' : 's'}</span>` : ''}
