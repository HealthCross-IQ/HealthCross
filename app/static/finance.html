<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HealthCross Finance Status</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f0efec;
    --border: rgba(11,11,11,0.10);
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --good: #0ca30c;
    --good-bg: #0ca30c1a;
    --warning: #fab219;
    --warning-bg: #fab2191a;
    --serious: #ec835a;
    --serious-bg: #ec835a1a;
    --critical: #d03b3b;
    --critical-bg: #d03b3b1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232320;
      --border: rgba(255,255,255,0.10);
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --accent: #3987e5;
      --accent-ink: #0d0d0d;
      --good-bg: #0ca30c26;
      --warning-bg: #fab21926;
      --serious-bg: #ec835a26;
      --critical-bg: #d03b3b26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header span { color: var(--ink-muted); font-size: 12.5px; }
  header a { margin-left: auto; color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 600; }
  header a:hover { text-decoration: underline; }

  main { padding: 22px 26px 60px; max-width: 1040px; margin: 0 auto; }

  button, .btn {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    padding: 8px 14px;
    font-size: 13.5px;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.small { padding: 5px 10px; font-size: 12.5px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
  .card .hint { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 14px; }

  label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=date], input[type=month], select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row > div { flex: 1; min-width: 160px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .kpi { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .label { font-size: 11px; color: var(--ink-muted); display: block; margin-bottom: 2px; }
  .kpi .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table th, table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table th { color: var(--ink-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; font-variant-numeric: normal; }
  .table-wrap { overflow-x: auto; }

  .pill { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .pill-good { background: var(--good-bg); color: var(--good); }
  .pill-warn { background: var(--warning-bg); color: var(--ink-2); }
  .pill-bad { background: var(--critical-bg); color: var(--critical); }
  .pill-neutral { background: var(--surface-2); color: var(--ink-2); }

  .client-row { cursor: pointer; }
  .client-row:hover td { background: var(--surface-2); }
  .client-row .chevron { display: inline-block; width: 12px; margin-right: 6px; color: var(--ink-muted); transition: transform 0.15s; }
  .client-row.expanded .chevron { transform: rotate(90deg); }
  .detail-row td { background: var(--bg); padding: 0; border-bottom: 1px solid var(--border); }
  .detail-row .detail-wrap { padding: 10px 10px 14px 30px; }
  .detail-row table { margin-top: 0; font-size: 12.5px; }
  .detail-row table th, .detail-row table td { padding: 5px 8px; }

  .tab-bar { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab-btn {
    background: none; border: none; border-radius: 0;
    padding: 9px 14px; font-size: 13.5px; font-weight: 600;
    color: var(--ink-muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { background: none; color: var(--ink); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .upload-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .upload-row input[type=file] { flex: 1; min-width: 180px; font-size: 12.5px; }
  .status-ok { color: var(--good); font-size: 12.5px; }
  .status-err { color: var(--critical); font-size: 12.5px; }

  .empty-state { color: var(--ink-muted); font-size: 13px; padding: 16px 0; text-align: center; }
  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    display: none; max-width: 420px;
  }

  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea h2 { font-size: 16px; margin: 0 0 2px; }
    #printArea .hint { color: #555; font-size: 12px; margin-bottom: 14px; }
    #printArea table { width: 100%; border-collapse: collapse; }
    #printArea th, #printArea td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ccc; font-size: 12.5px; }
    #printArea tfoot td { font-weight: 700; border-top: 2px solid #000; }
  }
</style>
</head>
<body>

<header>
  <h1>HealthCross</h1>
  <span>Finance Status</span>
  <a href="/">&larr; Underwriting</a>
</header>

<main>
  <div class="tab-bar" id="tabBar"></div>
  <div id="panels"></div>
</main>

<div id="toast"></div>
<div id="printArea"></div>

<script>
const money = (v, ccy) => (v === null || v === undefined) ? '—' : `${(ccy || 'AED')} ${Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function toast(message, isError) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.borderColor = isError ? 'var(--critical)' : 'var(--border)';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || (`Request failed (${res.status})`));
  }
  if (res.status === 204) return null;
  return res.json();
}

const TABS = [
  { id: 'summary', label: 'Summary' },
  { id: 'tracker', label: 'Payment Tracker' },
  { id: 'analysis', label: 'Analysis' },
  { id: 'reconciliation', label: 'Reconciliation' },
  { id: 'people', label: 'Employees & Expenses' },
  { id: 'cashflow', label: 'Cash Flow & Forecast' },
];

function renderTabs() {
  document.getElementById('tabBar').innerHTML = TABS.map(t =>
    `<button class="tab-btn" id="tabbtn-${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
  document.getElementById('panels').innerHTML = TABS.map(t =>
    `<div class="tab-panel" id="panel-${t.id}"></div>`
  ).join('');
}

function switchTab(id) {
  TABS.forEach(t => {
    document.getElementById(`tabbtn-${t.id}`).classList.toggle('active', t.id === id);
    document.getElementById(`panel-${t.id}`).classList.toggle('active', t.id === id);
  });
  const loaders = { summary: loadSummary, tracker: loadTracker, analysis: loadAnalysisPanel, reconciliation: loadReconciliationPanel, people: loadPeoplePanel, cashflow: loadCashflowPanel };
  loaders[id] && loaders[id]();
}

/* ---------------- Summary ---------------- */

async function loadSummary() {
  const panel = document.getElementById('panel-summary');
  panel.innerHTML = `<div class="empty-state">Loading&hellip;</div>`;
  try {
    const s = await api('/finance/summary');
    panel.innerHTML = `
      <div class="card">
        <h3>At a glance</h3>
        <div class="hint">As of ${new Date(s.as_of).toLocaleString()}</div>
        <div class="kpi-grid">
          <div class="kpi"><span class="label">HC Fees Invoiced</span><span class="value">${money(s.total_hc_fees_invoiced)}</span></div>
          <div class="kpi"><span class="label">HC Fees Received</span><span class="value">${money(s.total_hc_fees_received)}</span></div>
          <div class="kpi"><span class="label">Outstanding</span><span class="value">${money(s.total_outstanding)}</span></div>
          <div class="kpi"><span class="label">YTD Expenses</span><span class="value">${money(s.ytd_expenses)}</span></div>
          <div class="kpi"><span class="label">YTD Net</span><span class="value">${money(s.ytd_net)}</span></div>
        </div>
        <button onclick="loadSummary()">Refresh</button>
      </div>
    `;
  } catch (e) {
    panel.innerHTML = `<div class="card"><div class="status-err">${esc(e.message)}</div></div>`;
  }
}

/* ---------------- Payment Tracker ---------------- */

async function loadTracker() {
  const panel = document.getElementById('panel-tracker');
  panel.innerHTML = `
    <div class="card">
      <h3>Upload Payment Tracker</h3>
      <div class="hint">Upload the working tracker spreadsheet (any of its "Payment Tracker" / "Ledgers" / "Eman" sheets).</div>
      <div class="row">
        <div><label>File</label><input type="file" id="trackerFile" /></div>
        <div><label>Sheet name</label><input type="text" id="trackerSheet" value="Payment Tracker" /></div>
        <div><label>Mode</label>
          <select id="trackerMode">
            <option value="append">Append (add to existing)</option>
            <option value="replace">Replace (wipe existing first)</option>
          </select>
        </div>
        <div><button class="primary" onclick="uploadTracker()">Upload</button></div>
      </div>
      <div id="trackerUploadStatus"></div>
    </div>
    <div class="card">
      <h3>Client-wise outstanding</h3>
      <div class="hint">Per client: how much is still outstanding on the client-payment side (they haven't paid QIC yet), and how much HC fee is still outstanding (QIC hasn't paid HC yet) - sorted by HC outstanding fee, highest first. Click a client row to see every outstanding invoice (invoice no., policy no., due date, aging, flags).</div>
      <div class="row">
        <div><label>Search client</label><input type="text" id="clientOutstandingSearch" placeholder="Type a client name&hellip;" oninput="renderClientWiseOutstanding()" /></div>
        <div><label>Min. Client Outstanding Amount</label><input type="number" id="clientOutstandingMinClient" placeholder="0" oninput="renderClientWiseOutstanding()" /></div>
        <div><label>Min. HC Outstanding Fee</label><input type="number" id="clientOutstandingMinHc" placeholder="0" oninput="renderClientWiseOutstanding()" /></div>
        <div><button onclick="loadClientWiseOutstanding()">Refresh</button></div>
      </div>
      <div class="row" style="margin-top:4px;">
        <div><button class="small" onclick="downloadClientOutstandingCsv('client')">&#8595; Download client outstanding (CSV)</button></div>
        <div><button class="small" onclick="downloadClientOutstandingCsv('hc')">&#8595; Download HC fee outstanding (CSV)</button></div>
      </div>
      <div class="table-wrap" id="clientOutstandingTable"><div class="empty-state">Loading&hellip;</div></div>
    </div>
    <div class="card">
      <h3>Tracker entries</h3>
      <div class="row">
        <div><label>Search (doc no. or client)</label><input type="text" id="trackerSearch" placeholder="Type to search&hellip;" oninput="renderTrackerTable()" /></div>
        <div><label>Filter: HC Payment Status</label>
          <select id="trackerFilterStatus" onchange="loadTrackerTable()">
            <option value="">All</option>
            <option value="Received">Received</option>
            <option value="Outstanding">Outstanding</option>
          </select>
        </div>
        <div><button onclick="loadTrackerTable()">Refresh</button></div>
      </div>
      <div class="hint">Click a column header to sort.</div>
      <div class="table-wrap" id="trackerTable"><div class="empty-state">Loading&hellip;</div></div>
    </div>
  `;
  loadClientWiseOutstanding();
  loadTrackerTable();
}

let clientOutstandingRows = [];
let clientOutstandingExpanded = new Set();

async function loadClientWiseOutstanding() {
  const el = document.getElementById('clientOutstandingTable');
  el.innerHTML = `<div class="empty-state">Loading&hellip;</div>`;
  try {
    clientOutstandingRows = await api('/finance/payment-tracker');
    renderClientWiseOutstanding();
  } catch (e) {
    el.innerHTML = `<div class="status-err">${esc(e.message)}</div>`;
  }
}

function daysBetween(a, b) { return Math.round((a - b) / 86400000); }

function agingBadge(dueDate) {
  if (!dueDate) return `<span class="pill pill-neutral">No due date</span>`;
  const daysOverdue = daysBetween(new Date(), new Date(dueDate));
  if (daysOverdue > 60) return `<span class="pill pill-bad">Overdue ${daysOverdue}d</span>`;
  if (daysOverdue > 0) return `<span class="pill pill-warn">Overdue ${daysOverdue}d</span>`;
  if (daysOverdue > -14) return `<span class="pill pill-warn">Due in ${-daysOverdue}d</span>`;
  return `<span class="pill pill-good">Due in ${-daysOverdue}d</span>`;
}

// Groups the raw tracker rows by client, tracking both the outstanding
// counts/amounts and the underlying rows so the UI can drill into invoice
// level detail and CSV export can reuse the exact same filtering.
function buildClientOutstandingGroups() {
  const byClient = {};
  for (const r of clientOutstandingRows) {
    const name = r.main_policy_holder || '(unknown)';
    if (!byClient[name]) byClient[name] = { clientCount: 0, clientAmount: 0, hcCount: 0, hcAmount: 0, rows: [] };
    const bucket = byClient[name];
    const clientOutstanding = (r.client_payment_status || '') !== 'Settled';
    const hcOutstanding = !(r.hc_payment_status || '').toLowerCase().startsWith('received');
    if (clientOutstanding) { bucket.clientCount += 1; bucket.clientAmount += r.invoice_amount || 0; }
    if (hcOutstanding) { bucket.hcCount += 1; bucket.hcAmount += r.total_value || 0; }
    if (clientOutstanding || hcOutstanding) bucket.rows.push({ ...r, clientOutstanding, hcOutstanding });
  }
  return byClient;
}

function filteredClientOutstandingEntries() {
  const search = (document.getElementById('clientOutstandingSearch').value || '').trim().toLowerCase();
  const minClient = parseFloat(document.getElementById('clientOutstandingMinClient').value) || 0;
  const minHc = parseFloat(document.getElementById('clientOutstandingMinHc').value) || 0;
  const byClient = buildClientOutstandingGroups();
  return Object.entries(byClient)
    .filter(([, b]) => b.clientCount > 0 || b.hcCount > 0)
    .filter(([name]) => !search || name.toLowerCase().includes(search))
    .filter(([, b]) => b.clientAmount >= minClient && b.hcAmount >= minHc);
}

function toggleClientOutstandingDetail(name) {
  if (clientOutstandingExpanded.has(name)) clientOutstandingExpanded.delete(name);
  else clientOutstandingExpanded.add(name);
  renderClientWiseOutstanding();
}

function clientOutstandingDetailRowHtml(r) {
  const clientBadge = r.clientOutstanding
    ? `<span class="pill pill-warn">${esc(r.client_payment_status || 'Outstanding')}</span>`
    : `<span class="pill pill-good">${esc(r.client_payment_status || 'Settled')}</span>`;
  const hcBadge = r.hcOutstanding
    ? `<span class="pill pill-warn">${esc(r.hc_payment_status || 'Outstanding')}</span>`
    : `<span class="pill pill-good">${esc(r.hc_payment_status || 'Received')}</span>`;
  let flag = '';
  if (!r.clientOutstanding && r.hcOutstanding) {
    flag = `<span class="pill pill-bad">Client paid - HC fee not yet collected</span>`;
  } else if (r.clientOutstanding && r.due_date && daysBetween(new Date(), new Date(r.due_date)) > 60) {
    flag = `<span class="pill pill-bad">Long overdue</span>`;
  }
  return `
    <tr>
      <td>${esc(r.doc_no || r.doc_no_raw || '—')}</td>
      <td>${esc(r.policy_no || '—')}</td>
      <td>${esc(r.product || '—')}</td>
      <td>${esc(r.due_date || '—')}</td>
      <td>${agingBadge(r.due_date)}</td>
      <td>${clientBadge}</td>
      <td>${money(r.invoice_amount)}</td>
      <td>${hcBadge}</td>
      <td>${money(r.total_value)}</td>
      <td>${flag}</td>
    </tr>
  `;
}

function renderClientWiseOutstanding() {
  const el = document.getElementById('clientOutstandingTable');
  if (!clientOutstandingRows.length) { el.innerHTML = `<div class="empty-state">No payment tracker rows yet.</div>`; return; }

  const clients = filteredClientOutstandingEntries()
    .sort((a, b) => b[1].hcAmount - a[1].hcAmount);

  if (!clients.length) { el.innerHTML = `<div class="empty-state">No clients match the current search/filter.</div>`; return; }

  const totalClientAmount = clients.reduce((s, [, b]) => s + b.clientAmount, 0);
  const totalHcAmount = clients.reduce((s, [, b]) => s + b.hcAmount, 0);
  const search = (document.getElementById('clientOutstandingSearch').value || '').trim();
  const minClient = parseFloat(document.getElementById('clientOutstandingMinClient').value) || 0;
  const minHc = parseFloat(document.getElementById('clientOutstandingMinHc').value) || 0;
  const isFiltered = !!search || minClient > 0 || minHc > 0;

  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Client</th><th>Outstanding Invoices (Client)</th><th>Client Outstanding Amount</th>
        <th>Outstanding Invoices (HC)</th><th>HC Outstanding Fee</th>
      </tr></thead>
      <tbody>
        ${clients.map(([name, b]) => {
          const expanded = clientOutstandingExpanded.has(name);
          const detailRows = b.rows.slice().sort((x, y) => {
            const dx = x.due_date ? new Date(x.due_date).getTime() : Infinity;
            const dy = y.due_date ? new Date(y.due_date).getTime() : Infinity;
            return dx - dy;
          });
          return `
            <tr class="client-row${expanded ? ' expanded' : ''}" data-name="${esc(name)}" onclick="toggleClientOutstandingDetail(this.dataset.name)">
              <td><span class="chevron">&#9656;</span>${esc(name)}</td>
              <td>${b.clientCount}</td>
              <td>${money(b.clientAmount)}</td>
              <td>${b.hcCount}</td>
              <td>${money(b.hcAmount)}</td>
            </tr>
            <tr class="detail-row" style="display:${expanded ? 'table-row' : 'none'};">
              <td colspan="5"><div class="detail-wrap"><table>
                <thead><tr>
                  <th>Doc No.</th><th>Policy No.</th><th>Product</th><th>Due Date</th><th>Aging</th>
                  <th>Client Status</th><th>Client Amount</th><th>HC Status</th><th>HC Fee</th><th>Flag</th>
                </tr></thead>
                <tbody>${detailRows.map(clientOutstandingDetailRowHtml).join('')}</tbody>
              </table></div></td>
            </tr>
          `;
        }).join('')}
      </tbody>
      <tfoot>
        <tr style="font-weight:700;">
          <td>TOTAL${isFiltered ? ' (filtered)' : ''}</td><td></td><td>${money(totalClientAmount)}</td><td></td><td>${money(totalHcAmount)}</td>
        </tr>
      </tfoot>
    </table>
  `;
}

function csvCell(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadClientOutstandingCsv(kind) {
  if (!clientOutstandingRows.length) { toast('Nothing to export yet', true); return; }
  const clients = filteredClientOutstandingEntries();
  const headers = kind === 'client'
    ? ['Client', 'Doc No.', 'Policy No.', 'Product', 'Due Date', 'Client Payment Status', 'Client Outstanding Amount']
    : ['Client', 'Doc No.', 'Policy No.', 'Product', 'Due Date', 'HC Payment Status', 'HC Outstanding Fee'];

  const lines = [headers.join(',')];
  for (const [name, b] of clients) {
    for (const r of b.rows) {
      if (kind === 'client' && !r.clientOutstanding) continue;
      if (kind === 'hc' && !r.hcOutstanding) continue;
      const amount = kind === 'client' ? (r.invoice_amount || 0) : (r.total_value || 0);
      const status = kind === 'client' ? (r.client_payment_status || '') : (r.hc_payment_status || '');
      const cells = [name, r.doc_no || r.doc_no_raw || '', r.policy_no || '', r.product || '', r.due_date || '', status, amount];
      lines.push(cells.map(csvCell).join(','));
    }
  }
  if (lines.length === 1) { toast('Nothing to export for the current search/filter', true); return; }

  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const suffix = kind === 'client' ? 'client_outstanding' : 'hc_fee_outstanding';
  a.href = url;
  a.download = `${suffix}_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function uploadTracker() {
  const fileInput = document.getElementById('trackerFile');
  const statusEl = document.getElementById('trackerUploadStatus');
  if (!fileInput.files.length) { toast('Choose a file first', true); return; }
  const sheet = document.getElementById('trackerSheet').value.trim();

let trackerTableRows = [];
let trackerSort = { key: null, dir: 1 };

const TRACKER_COLUMNS = [
  { key: 'doc_no', label: 'Doc No' },
  { key: 'main_policy_holder', label: 'Client' },
  { key: 'channel', label: 'Channel' },
  { key: 'product', label: 'Product' },
  { key: 'total_value', label: 'Total Value' },
  { key: 'client_payment_status', label: 'Client Status' },
  { key: 'hc_payment_status', label: 'HC Status' },
  { key: 'payment_receive_date', label: 'Received' },
];

async function loadTrackerTable() {
  const el = document.getElementById('trackerTable');
  const status = document.getElementById('trackerFilterStatus').value;
  el.innerHTML = `<div class="empty-state">Loading&hellip;</div>`;
  try {
    let url = '/finance/payment-tracker';
    if (status) url += `?hc_payment_status=${encodeURIComponent(status)}`;
    trackerTableRows = await api(url);
    renderTrackerTable();
  } catch (e) {
    el.innerHTML = `<div class="status-err">${esc(e.message)}</div>`;
  }
}

function sortTrackerTable(key) {
  if (trackerSort.key === key) trackerSort.dir *= -1;
  else trackerSort = { key, dir: 1 };
  renderTrackerTable();
}

function renderTrackerTable() {
  const el = document.getElementById('trackerTable');
  if (!trackerTableRows.length) { el.innerHTML = `<div class="empty-state">No payment tracker rows yet - upload a file above.</div>`; return; }

  const search = (document.getElementById('trackerSearch').value || '').trim().toLowerCase();
  let rows = trackerTableRows;
  if (search) {
    rows = rows.filter(r =>
      (r.doc_no || '').toLowerCase().includes(search) ||
      (r.main_policy_holder || '').toLowerCase().includes(search)
    );
  }

  if (trackerSort.key) {
    const key = trackerSort.key;
    const dir = trackerSort.dir;
    rows = rows.slice().sort((a, b) => {
      let av = a[key], bv = b[key];
      if (typeof av === 'string' || typeof bv === 'string') {
        av = (av || '').toString().toLowerCase();
        bv = (bv || '').toString().toLowerCase();
        return av < bv ? -dir : av > bv ? dir : 0;
      }
      av = av ?? -Infinity; bv = bv ?? -Infinity;
      return (av - bv) * dir;
    });
  }

  if (!rows.length) { el.innerHTML = `<div class="empty-state">No rows match your search.</div>`; return; }

  const shown = rows.slice(0, 100);
  const arrow = key => trackerSort.key === key ? (trackerSort.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
  el.innerHTML = `
    <table>
      <thead><tr>
        ${TRACKER_COLUMNS.map(c => `<th style="cursor:pointer;" onclick="sortTrackerTable('${c.key}')">${c.label}${arrow(c.key)}</th>`).join('')}
        <th></th>
      </tr></thead>
      <tbody>
        ${shown.map(r => `
          <tr>
            <td>${esc(r.doc_no)}</td>
            <td>${esc(r.main_policy_holder)}</td>
            <td>${esc(r.channel)}</td>
            <td>${esc(r.product)}</td>
            <td>${money(r.total_value)}</td>
            <td>${statusPill(r.client_payment_status)}</td>
            <td>${statusPill(r.hc_payment_status)}</td>
            <td>${esc(r.payment_receive_date || r.payment_receive_note || '—')}</td>
            <td>${(r.hc_payment_status || '').toLowerCase().startsWith('received') ? '' :
              `<button class="small" onclick="markReceived(${r.id})">Mark Received</button>`}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    ${rows.length > 100 ? `<div class="hint">Showing first 100 of ${rows.length} matching rows.</div>` : ''}
  `;
}

function statusPill(status) {
  if (!status) return `<span class="pill pill-neutral">&mdash;</span>`;
  const s = status.toLowerCase();
  if (s.startsWith('received') || s === 'settled') return `<span class="pill pill-good">${esc(status)}</span>`;
  if (s.includes('outstanding') || s.includes('due')) return `<span class="pill pill-warn">${esc(status)}</span>`;
  return `<span class="pill pill-neutral">${esc(status)}</span>`;
}

async function markReceived(id) {
  const today = new Date().toISOString().slice(0, 10);
  try {
    await api(`/finance/payment-tracker/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hc_payment_status: 'Received', payment_receive_date: today }),
    });
    toast('Marked as received');
    loadTrackerTable();
    loadClientWiseOutstanding();
  } catch (e) {
    toast(e.message, true);
  }
}

// Shared controller for the two policy-level reconciliation reports (Tracker
// vs Client SOA, Tracker vs HealthCross Fee Statement) - same shape (KPI
// grid, search/status filter, table, CSV export), just pointed at a
// different endpoint/amount-field/status set per instance.
function createPolicyReconciliation(config) {
  let data = null;

  function statusPill(status) {
    const meta = config.statusMeta[status] || { label: status, pill: 'pill-neutral' };
    return `<span class="pill ${meta.pill}">${esc(meta.label)}</span>`;
  }

  function filteredRows() {
    if (!data) return [];
    const search = (document.getElementById(config.searchInputId)?.value || '').trim().toLowerCase();
    const statusFilter = document.getElementById(config.statusSelectId)?.value || '';
    let rows = statusFilter ? data.rows.filter(r => r.status === statusFilter) : data.rows.filter(r => r.status !== 'matched');
    if (search) {
      rows = rows.filter(r =>
        r.policy_no.toLowerCase().includes(search) ||
        (r.client_name || '').toLowerCase().includes(search)
      );
    }
    return rows;
  }

  function renderTable() {
    const el = document.getElementById(config.resultsTableId);
    const rows = filteredRows();
    if (!rows.length) { el.innerHTML = `<div class="empty-state">No rows match.</div>`; return; }
    const shown = rows.slice(0, 300);
    el.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Policy No.</th><th>Client</th>
            <th>Tracker Outstanding</th><th>${esc(config.amountColumnLabel)}</th><th>Variance</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${shown.map(row => `
              <tr>
                <td>${esc(row.policy_no)}</td>
                <td>${esc(row.client_name || '—')}</td>
                <td>${row.tracker_outstanding_amount !== null ? `${money(row.tracker_outstanding_amount)} <span class="hint" style="margin:0;">(${row.tracker_outstanding_count})</span>` : '—'}</td>
                <td>${row[config.amountField] !== null ? `${money(row[config.amountField])} <span class="hint" style="margin:0;">(${row[config.countField]})</span>` : '—'}</td>
                <td>${row.variance !== null && row.variance !== undefined ? money(row.variance) : '—'}</td>
                <td>${statusPill(row.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${rows.length > 300 ? `<div class="hint">Showing first 300 of ${rows.length} matching rows.</div>` : ''}
      </div>
    `;
  }

  async function run() {
    const el = document.getElementById(config.containerId);
    const period = (document.getElementById(config.periodInputId).value || '').trim();
    el.innerHTML = `<div class="empty-state">Running&hellip;</div>`;
    try {
      let url = config.endpoint;
      if (period) url += `?statement_period=${encodeURIComponent(period)}`;
      data = await api(url);
    } catch (e) {
      el.innerHTML = `<div class="status-err">${esc(e.message)}</div>`;
      return;
    }
    // KPI grid + filter controls are built once per Run - only the table
    // placeholder below is rebuilt per keystroke, so the search input never
    // loses focus while typing.
    el.innerHTML = `
      <div class="kpi-grid">
        ${config.kpis.map(k => `<div class="kpi"><span class="label">${esc(k.label)}</span><span class="value">${data[k.key]}</span></div>`).join('')}
      </div>
      <div class="row" style="margin-top:10px;">
        <div><label>Search (policy no., client name)</label><input type="text" id="${config.searchInputId}" placeholder="Type to search&hellip;" oninput="${config.varName}.renderTable()" /></div>
        <div><label>Status</label>
          <select id="${config.statusSelectId}" onchange="${config.varName}.renderTable()">
            <option value="">All except Matched</option>
            ${Object.entries(config.statusMeta).filter(([k]) => k !== 'matched').map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('')}
            <option value="matched">Matched</option>
          </select>
        </div>
        <div><button class="small" onclick="${config.varName}.downloadCsv()">&#8595; Download CSV</button></div>
      </div>
      <div id="${config.resultsTableId}"></div>
    `;
    renderTable();
  }

  function downloadCsv() {
    const rows = filteredRows();
    if (!rows.length) { toast('Nothing to export for the current search/filter', true); return; }
    const headers = [
      'Policy No', 'Client', 'Tracker Outstanding Amount', 'Tracker Outstanding Count',
      `${config.amountColumnLabel} Amount`, `${config.amountColumnLabel} Count`, 'Variance', 'Status',
    ];
    const lines = [headers.join(',')];
    for (const row of rows) {
      const cells = [
        row.policy_no, row.client_name || '',
        row.tracker_outstanding_amount ?? '', row.tracker_outstanding_count,
        row[config.amountField] ?? '', row[config.countField],
        row.variance ?? '', config.statusMeta[row.status]?.label || row.status,
      ];
      lines.push(cells.map(csvCell).join(','));
    }
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${config.csvPrefix}_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  return { run, renderTable, downloadCsv };
}

function reconTable(rows, columns) {
  if (!rows.length) return `<div class="empty-state">No differences to show.</div>`;
  const shown = rows.slice(0, 200);
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>${columns.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('')}</tr></thead>
        <tbody>
          ${shown.map(row => `<tr>${columns.map(c => `<td>${esc(row[c])}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
      ${rows.length > 200 ? `<div class="hint">Showing first 200 of ${rows.length}.</div>` : ''}
    </div>
  `;
}

async function addEmployee() {
  const full_name = document.getElementById('empName').value.trim();

function downloadSalaryReleaseCsv() {
  const rows = activeSalaryRows();
  if (!rows.length) { toast('No active employees to export', true); return; }
  const period = (document.getElementById('salaryReleasePeriod').value || '').trim();
  const lines = [['Employee', 'Role', 'Currency', 'Monthly Salary'].map(csvCell).join(',')];
  for (const r of rows) {
    lines.push([r.full_name, r.role_title || '', r.currency || 'AED', r.monthly_salary].map(csvCell).join(','));
  }
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const suffix = period ? period.replace(/\s+/g, '_').toLowerCase() : new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `salary_release_${suffix}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

        <thead><tr><th>Period</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th>Source</th><th></th></tr></thead>
        <tbody>${rows.map(r => `
          <tr><td>${esc(r.period)}</td><td>${esc(r.description)}</td><td>${esc(r.category)}</td>
          <td>${esc(r.expense_type)}</td><td>${money(r.amount, r.currency)}</td><td>${esc(r.source)}</td>
          <td><button class="small" onclick="deleteExpenseEntry(${r.id})">Delete</button></td></tr>
        `).join('')}</tbody>
      </table>
    `;
  } catch (e) { el.innerHTML = `<div class="status-err">${esc(e.message)}</div>`; }
}

async function deleteExpenseEntry(id) {
  if (!confirm('Delete this expense entry?')) return;
  try {
    await api(`/finance/expenses/${id}`, { method: 'DELETE' });
    toast('Expense entry deleted');
    loadExpenseTable();
  } catch (e) { toast(e.message, true); }
}

/* ---------------- Cash Flow & Forecast ---------------- */

function loadCashflowPanel() {
  const panel = document.getElementById('panel-cashflow');
  const thisYear = new Date().getFullYear();
  panel.innerHTML = `
    <div class="card">
      <h3>Monthly cash flow</h3>
      <div class="row">
        <div><label>Year</label><input type="number" id="cfYear" value="${thisYear}" /></div>
        <div><button class="primary" onclick="runCashFlow()">Run</button></div>
      </div>
      <div id="cashflowResult"></div>
    </div>
    <div class="card">
      <h3>Expense forecast</h3>
      <div class="hint">A month with real recorded expenses shows its actual; a month with none is projected from your active payroll/recurring-expense run-rate plus a trailing average of recent variable spend.</div>
      <div class="row">
        <div><label>Year</label><input type="number" id="fcYear" value="${thisYear}" /></div>
        <div><button class="primary" onclick="runForecast()">Run</button></div>
      </div>
      <div id="forecastResult"></div>
    </div>
  `;
}

async function runCashFlow() {
  const el = document.getElementById('cashflowResult');
  const year = document.getElementById('cfYear').value;
  el.innerHTML = `<div class="empty-state">Loading&hellip;</div>`;
  try {
    const r = await api(`/finance/cash-flow?year=${year}`);
    el.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi"><span class="label">Total Inflow</span><span class="value">${money(r.total_inflow)}</span></div>
        <div class="kpi"><span class="label">Total Outflow</span><span class="value">${money(r.total_outflow)}</span></div>
        <div class="kpi"><span class="label">Net</span><span class="value">${money(r.total_net)}</span></div>
      </div>
      <table>
        <thead><tr><th>Month</th><th>Inflow</th><th>Outflow</th><th>Net</th><th>Cumulative</th></tr></thead>
        <tbody>${r.months.map(m => `
          <tr><td>${esc(m.period)}</td><td>${money(m.inflow)}</td><td>${money(m.outflow)}</td><td>${money(m.net)}</td><td>${money(m.cumulative)}</td></tr>
        `).join('')}</tbody>
      </table>
    `;
  } catch (e) { el.innerHTML = `<div class="status-err">${esc(e.message)}</div>`; }
}

async function runForecast() {
  const el = document.getElementById('forecastResult');
  const year = document.getElementById('fcYear').value;
  el.innerHTML = `<div class="empty-state">Loading&hellip;</div>`;
  try {
    const r = await api(`/finance/expense-forecast?year=${year}`);
    el.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi"><span class="label">Actual (recorded months)</span><span class="value">${money(r.total_actual)}</span></div>
        <div class="kpi"><span class="label">Forecast (remaining months)</span><span class="value">${money(r.total_forecast)}</span></div>
      </div>
      <div class="hint">Fixed run-rate: ${money(r.assumptions.fixed_monthly_run_rate)}/mo &middot; trailing variable avg: ${money(r.assumptions.trailing_variable_monthly_avg)}/mo (from ${r.assumptions.trailing_months_used} recent month(s))</div>
      <table>
        <thead><tr><th>Month</th><th>Fixed</th><th>Variable</th><th>Total</th><th>Basis</th></tr></thead>
        <tbody>${r.months.map(m => `
          <tr><td>${esc(m.period)}</td><td>${money(m.fixed)}</td><td>${money(m.variable)}</td><td>${money(m.total)}</td>
          <td>${m.is_actual ? '<span class="pill pill-good">Actual</span>' : '<span class="pill pill-neutral">Forecast</span>'}</td></tr>
        `).join('')}</tbody>
      </table>
    `;
  } catch (e) { el.innerHTML = `<div class="status-err">${esc(e.message)}</div>`; }
}

/* ---------------- Init ---------------- */

renderTabs();
switchTab('summary');
</script>
</body>
</html>
